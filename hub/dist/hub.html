  function weekCard(monday) {
    const rows = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(d.getDate() + i);
      rows.push(dayRow(d));
    }
    return UI.h("div", { class: "card" }, UI.h("div", { class: "daylist" }, rows));
  }

  function weekBtnRow(monday) {
    const week = Plan.week(monday);
    const targetKeys = [DAY_KEYS[0], DAY_KEYS[1], DAY_KEYS[3], DAY_KEYS[5], DAY_KEYS[6]];
    const full = targetKeys.every(function (k) { return !!week[k]; });

    const planBtn = UI.h(
      "button",
      {
        class: "btn btn-primary",
        type: "button",
        on: {
          click: function () {
            if (!full) { Plan.fillWeek(monday); return; }
            UI.confirm("Replace this week's plan with fresh suggestions?").then(function (ok) {
              if (!ok) return;
              targetKeys.forEach(function (k) {
                const d = new Date(monday);
                d.setDate(d.getDate() + DAY_KEYS.indexOf(k));
                Plan.clearSlot(d);
              });
              Plan.fillWeek(monday);
            });
          },
        },
      },
      full ? "Re-plan the week" : "Plan the week"
    );

    const groceryBtn = UI.h(
      "button",
      {
        class: "btn",
        type: "button",
        on: {
          click: function () {
            Grocery.buildFromWeek(monday);
            UI.state.mealsTab = "grocery";
            Router.refresh();
          },
        },
      },
      "Build the grocery list"
    );

    return UI.h("div", { class: "btn-row" }, planBtn, groceryBtn);
  }

  /* ---------- screen: Grocery list ---------- */

  function checkRow(it) {
    const pressed = !!it.done;
    return UI.h(
      "button",
      {
        class: "check",
        type: "button",
        "aria-pressed": pressed ? "true" : "false",
        on: { click: function () { Store.patch("grocery", it.id, { done: !it.done }); } },
      },
      UI.h("span", { class: "box" }, UI.icon("check")),
      UI.h("span", { class: "check-main" }, UI.h("span", { class: "check-text", text: it.name })),
      it.qty ? UI.h("span", { class: "check-min", text: it.qty }) : null
    );
  }

  function openItemSheet(it) {
    const qty = UI.h("input", { class: "input", type: "text", value: it.qty || "", placeholder: "How much" });
    const store = UI.h(
      "select",
      { class: "select" },
      UI.h("option", { value: "", text: "Cheapest store (" + storeFor(Object.assign({}, it, { pref: "" })) + ")" }),
      UI.h("option", { value: "Meijer", text: "Always Meijer", selected: normStore(it.pref) === "Meijer" ? true : null }),
      UI.h("option", { value: "Aldi", text: "Always ALDI", selected: normStore(it.pref) === "Aldi" ? true : null })
    );
    const prefText = UI.h("input", { class: "input", type: "text", value: it.prefText || "", placeholder: "Brand or kind we like (optional)" });
    const s = UI.sheet({
      title: it.name,
      body: UI.h("div", { class: "stack" }, UI.h("div", { class: "field" }, UI.h("label", { text: "Amount" }), qty), UI.h("div", { class: "field" }, UI.h("label", { text: "Store" }), store), UI.h("div", { class: "field" }, UI.h("label", { text: "What to get" }), prefText)),
      actions: [
        UI.h("button", { class: "btn btn-danger", type: "button", on: { click: function () { Store.remove("grocery", it.id); s.close(); } } }, "Remove"),
        UI.h("button", { class: "btn btn-primary", type: "button", on: { click: function () { Store.patch("grocery", it.id, { qty: qty.value.trim(), pref: store.value, prefText: prefText.value.trim() }); s.close(); } } }, "Save"),
      ],
    });
  }

  function groceryRow(it) {
    const p = Prices.forItem(it.name);
    const st = storeFor(it);
    const sub = [];
    if (p && (typeof p.meijer === "number" || typeof p.aldi === "number")) {
      const parts = [];
      if (typeof p.meijer === "number") parts.push(UI.h("span", { class: "g-price" }, st === "Meijer" ? UI.h("b", { text: "Meijer " + money(p.meijer) }) : "Meijer " + money(p.meijer)));
      if (typeof p.aldi === "number") parts.push(UI.h("span", { class: "g-price" }, st === "Aldi" ? UI.h("b", { text: "ALDI " + money(p.aldi) }) : "ALDI " + money(p.aldi)));
      sub.push(parts);
      if (p.deal) sub.push(UI.h("span", { class: "g-deal", text: String(p.deal) }));
    } else if (UI.state.groceryBy !== "store") {
      sub.push(UI.h("span", { text: st }));
    }
    if (it.src && it.src !== "added") sub.push(UI.h("span", { text: it.src }));

    /* Name and amount share the first line, so a phone-width row never has
       to squeeze four things across; the prices sit underneath. */
    const main = UI.h(
      "div",
      { class: "g-main", on: { click: function () { openItemSheet(it); } } },
      UI.h(
        "div",
        { class: "g-line" },
        UI.h("span", { class: "g-name", text: it.name }),
        it.qty ? UI.h("span", { class: "g-qty", text: it.qty }) : null
      ),
      sub.length ? UI.h("div", { class: "g-sub" }, sub) : null
    );
    return UI.h(
      "div",
      { class: "g-row", "data-done": it.done ? "true" : "false", "data-skip": it.skip ? "true" : "false" },
      UI.h("button", { class: "box", type: "button", "aria-label": it.done ? "Not in the cart" : "In the cart", on: { click: function () { Store.patch("grocery", it.id, { done: !it.done }); } } }, UI.icon("check")),
      main,
      UI.h("button", { class: "g-have", type: "button", title: "I have this — take it off the list", on: { click: function () { Store.remove("grocery", it.id); UI.toast("Took " + it.name + " off the list"); } } }, "have it")
    );
  }

  function sortItems(list) {
    return list.slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      if (!!a.skip !== !!b.skip) return a.skip ? 1 : -1;
      const ca = CAT_ORDER.indexOf(a.cat), cb = CAT_ORDER.indexOf(b.cat);
      if (ca !== cb) return (ca < 0 ? 99 : ca) - (cb < 0 ? 99 : cb);
      return (a.name || "").localeCompare(b.name || "");
    });
  }

  function groupTotal(list) {
    let total = 0, priced = 0;
    list.forEach(function (it) {
      if (it.done || it.skip) return;
      const p = Prices.forItem(it.name);
      const st = storeFor(it);
      const v = p ? (st === "Aldi" ? p.aldi : p.meijer) : null;
      if (typeof v === "number") { total += v; priced++; }
    });
    return { total: total, priced: priced };
  }

  function groceryGroups(items) {
    const byStore = UI.state.groceryBy === "store";
    const buckets = {};
    items.forEach(function (it) {
      const k = byStore ? storeFor(it) : (it.cat && CAT_ORDER.indexOf(it.cat) >= 0 ? it.cat : "Other");
      (buckets[k] = buckets[k] || []).push(it);
    });
    const order = byStore ? ["Meijer", "Aldi"] : CAT_ORDER;
    return order.filter(function (k) { return buckets[k] && buckets[k].length; }).map(function (k) {
      const list = sortItems(buckets[k]);
      const t = byStore && Prices.any() ? groupTotal(list) : null;
      return UI.h(
        "div",
        { class: "grocery-group" },
        UI.h("div", { class: "g-head", text: k === "Aldi" ? "ALDI" : k }),
        list.map(groceryRow),
        t && t.priced ? UI.h("div", { class: "g-total" }, UI.h("span", { text: "About " + t.priced + " priced item" + (t.priced === 1 ? "" : "s") }), UI.h("b", { text: "~" + money(t.total) })) : null
      );
    });
  }

  function openClearSheet() {
    const items = Store.list("grocery");
    const doneItems = items.filter(function (i) { return i.done; });
    const s = UI.sheet({
      title: "Clear the list",
      body: UI.h("p", {
        class: "muted",
        text: doneItems.length
          ? "Clear just what's checked off, or start the whole list over?"
          : "Nothing is checked off yet. Clear the whole list instead?",
      }),
      actions: [
        UI.h("button", { class: "btn", type: "button", on: { click: function () { s.close(); } } }, "Never mind"),
        doneItems.length
          ? UI.h(
              "button",
              {
                class: "btn btn-danger",
                type: "button",
                on: {
                  click: function () {
                    doneItems.forEach(function (i) { Store.remove("grocery", i.id); });
                    s.close();
                    UI.toast("Cleared " + doneItems.length + " checked item" + (doneItems.length === 1 ? "" : "s") + ".");
                  },
                },
              },
              "Clear checked (" + doneItems.length + ")"
            )
          : null,
        UI.h(
          "button",
          {
            class: "btn btn-danger",
            type: "button",
            on: {
              click: function () {
                items.forEach(function (i) { Store.remove("grocery", i.id); });
                s.close();
                UI.toast("Cleared the list.");
              },
            },
          },
          "Clear everything"
        ),
      ],
    });
  }

  /* The always-buy list. Edited here, stored in config, added to the
     grocery list every time it's built. */
  function openStaplesSheet() {
    let working = Staples.list().map(function (s) {
      return { item: s.item || "", qty: s.qty || "", store: normStore(s.store) || "Meijer" };
    });
    let sheet;

    function row(s, idx) {
      const item = UI.h("input", { class: "input", type: "text", value: s.item, placeholder: "Item" });
      const qty = UI.h("input", { class: "input staple-qty", type: "text", value: s.qty, placeholder: "How much" });
      const store = UI.h(
        "select",
        { class: "select staple-store" },
        UI.h("option", { value: "Meijer", text: "Meijer", selected: s.store === "Meijer" ? true : null }),
        UI.h("option", { value: "Aldi", text: "ALDI", selected: s.store === "Aldi" ? true : null })
      );
      function sync() {
        s.item = item.value.trim();
        s.qty = qty.value.trim();
        s.store = store.value;
      }
      [item, qty, store].forEach(function (el) {
        el.addEventListener("input", sync);
        el.addEventListener("change", sync);
      });
      const del = UI.h(
        "button",
        { class: "ibtn", type: "button", "aria-label": "Remove " + (s.item || "staple") },
        UI.icon("trash")
      );
      del.addEventListener("click", function () {
        working.splice(idx, 1);
        render();
      });
      return UI.h(
        "div",
        { class: "staple-row" },
        UI.h("div", { class: "staple-line" }, item, del),
        UI.h("div", { class: "staple-line" }, qty, store)
      );
    }

    function render() {
      const rows = working.map(row);
      const add = UI.h("button", { class: "btn btn-block", type: "button" }, UI.icon("plus"), "Add a staple");
      add.addEventListener("click", function () {
        working.push({ item: "", qty: "", store: "Meijer" });
        render();
      });
      const body = UI.h(
        "div",
        { class: "stack" },
        UI.h("p", { class: "tiny muted", text: "The things you always need. These get added every time you build the grocery list." }),
        rows.length ? UI.h("div", { class: "stack" }, rows) : UI.h("p", { class: "muted", text: "Nothing yet. Add what you always buy." }),
        add
      );
      if (sheet) sheet.setBody(body);
      return body;
    }

    sheet = UI.sheet({
      title: "Weekly staples",
      body: render(),
      actions: [
        UI.h("button", { class: "btn", type: "button", on: { click: function () { sheet.close(); } } }, "Cancel"),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                const cleaned = working
                  .map(function (s) {
                    return { item: (s.item || "").trim(), qty: (s.qty || "").trim(), store: s.store || "Meijer" };
                  })
                  .filter(function (s) { return s.item; });
                Staples.save(cleaned);
                const n = putStaplesOnList();
                sheet.close();
                UI.toast(n ? "Saved — added " + n + " to your list" : "Saved your weekly staples");
              },
            },
          },
          "Save"
        ),
      ],
    });
  }

  /* The already-have list: spices and staples she keeps, kept off the
     shopping list. Chips you can tap to remove, plus a box to add more. */
  function openPantrySheet() {
    let working = Pantry.list().slice();
    let sheet;

    function render() {
      const chips = UI.h("div", { class: "chip-row pantry-chips" });
      working.forEach(function (name, i) {
        const chip = UI.h(
          "button",
          { class: "pantry-chip", type: "button", "aria-label": "Remove " + name },
          UI.h("span", { text: name }),
          UI.icon("x")
        );
        chip.addEventListener("click", function () {
          working.splice(i, 1);
          render();
        });
        chips.appendChild(chip);
      });

      const addInput = UI.h("input", {
        class: "input",
        type: "text",
        placeholder: "Add something you keep on hand",
        data: { keep: "pantry-add" },
      });
      function add() {
        const v = addInput.value.trim();
        if (!v) return;
        if (!working.some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) working.push(v);
        addInput.value = "";
        render();
        const el = sheet.el.querySelector('[data-keep="pantry-add"]');
        if (el) el.focus();
      }
      addInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); add(); }
      });

      const body = UI.h(
        "div",
        { class: "stack" },
        UI.h("p", { class: "tiny muted", text: "Spices and staples you already keep. These stay OFF the grocery list. Run out of one? Just add it to the list by hand that week." }),
        working.length ? chips : UI.h("p", { class: "muted", text: "Nothing yet." }),
        UI.h("div", { class: "quickadd" }, addInput, UI.h("button", { class: "ibtn", type: "button", "aria-label": "Add", on: { click: add } }, UI.icon("plus")))
      );
      if (sheet) sheet.setBody(body);
      return body;
    }

    sheet = UI.sheet({
      title: "Already have",
      body: render(),
      actions: [
        UI.h("button", { class: "btn", type: "button", on: { click: function () { sheet.close(); } } }, "Cancel"),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                Pantry.save(working.map(function (s) { return s.trim(); }).filter(Boolean));
                sheet.close();
                UI.toast("Saved what you keep on hand");
              },
            },
          },
          "Save"
        ),
      ],
    });
  }

  function renderGroceryTab() {
    const wrap = UI.h("div", { class: "stack" });

    const addInput = UI.h("input", {
      class: "input",
      type: "text",
      placeholder: "Add an item",
      data: { keep: "grocery-add" },
    });
    function submitAdd() {
      const v = addInput.value.trim();
      if (!v) return;
      Grocery.addItem(v, { src: "added" });
      addInput.value = "";
    }
    addInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submitAdd(); }
    });
    wrap.appendChild(
      UI.h(
        "div",
        { class: "quickadd" },
        addInput,
        UI.h("button", { class: "ibtn", type: "button", "aria-label": "Add item", on: { click: submitAdd } }, UI.icon("plus"))
      )
    );

    /* Shown in both states, so the always-buy list is reachable whether the
       grocery list is empty or full. */
    wrap.appendChild(
      UI.h(
        "div",
        { class: "inline staples-bar" },
        UI.h(
          "button",
          { class: "btn btn-sm", type: "button", on: { click: openStaplesSheet } },
          UI.icon("star"),
          "Weekly staples"
        ),
        UI.h(
          "button",
          { class: "btn btn-sm", type: "button", on: { click: openPantrySheet } },
          UI.icon("check"),
          "Already have"
        )
      )
    );

    const items = Store.list("grocery");
    if (!items.length) {
      wrap.appendChild(
        UI.empty(
          "cart",
          "The list is empty. Build it from this week's dinners.",
          UI.h(
            "button",
            { class: "btn btn-primary", type: "button", on: { click: function () { Grocery.buildFromWeek(new Date()); } } },
            "Build the grocery list"
          )
        )
      );
      return wrap;
    }

    Prices.load();
    if (!UI.state.groceryBy) UI.state.groceryBy = "store";

    const status = cartStatusCard();
    if (status) wrap.appendChild(status);

    const seg = UI.h(
      "div",
      { class: "segmented" },
      UI.h("button", { type: "button", "aria-pressed": UI.state.groceryBy === "store" ? "true" : "false", on: { click: function () { UI.state.groceryBy = "store"; Router.refresh(); } } }, "By store"),
      UI.h("button", { type: "button", "aria-pressed": UI.state.groceryBy !== "store" ? "true" : "false", on: { click: function () { UI.state.groceryBy = "aisle"; Router.refresh(); } } }, "By aisle")
    );
    wrap.appendChild(seg);

    wrap.appendChild(UI.h("div", { class: "card" }, groceryGroups(items)));

    const doneN = items.filter(function (i) { return i.done; }).length;
    const toOrder = cartItems().length;
    wrap.appendChild(
      UI.h(
        "div",
        { class: "spread" },
        UI.h("span", { class: "tiny muted", text: items.length + " item" + (items.length === 1 ? "" : "s") + " · " + doneN + " in the cart" }),
        UI.h("button", { class: "btn btn-danger btn-sm", type: "button", on: { click: openClearSheet } }, "Clear the list")
      )
    );

    const c = Store.get("cart") || {};
    if (Store.mode === "server" && toOrder && (!c.status || c.status === "done" || c.status === "error")) {
      wrap.appendChild(
        UI.h(
          "button",
          { class: "btn btn-primary btn-block", type: "button", on: { click: function () { Cart.request(); } } },
          UI.icon("cart"),
          "Build my carts (" + toOrder + " item" + (toOrder === 1 ? "" : "s") + ")"
        )
      );
    }

    wrap.appendChild(
      UI.h(
        "div",
        { class: "deal-links" },
        DEAL_LINKS.map(function (d) {
          return UI.h("a", { href: d.url, target: "_blank", rel: "noopener noreferrer" }, UI.icon("external"), d.name);
        })
      )
    );

    return wrap;
  }

  /* ---------- the route ---------- */

  Router.on("meals", function renderMeals(root) {
    if (!UI.state.mealsTab) UI.state.mealsTab = "week";
    if (typeof UI.state.weekOffset !== "number") UI.state.weekOffset = 0;

    const offset = UI.state.weekOffset;
    const base = new Date();
    base.setDate(base.getDate() + offset * 7);
    const monday = Fmt.weekStart(base);

    root.appendChild(
      UI.h(
        "div",
        { class: "page-head" },
        UI.h("div", { class: "title display", text: "Meals" }),
        UI.h("div", { class: "sub", text: weekRangeLabel(monday) })
      )
    );

    root.appendChild(
      UI.h(
        "div",
        { class: "segmented" },
        UI.h(
          "button",
          {
            type: "button",
            "aria-pressed": UI.state.mealsTab === "week" ? "true" : "false",
            on: { click: function () { UI.state.mealsTab = "week"; Router.refresh(); } },
          },
          "This week"
        ),
        UI.h(
          "button",
          {
            type: "button",
            "aria-pressed": UI.state.mealsTab === "grocery" ? "true" : "false",
            on: { click: function () { UI.state.mealsTab = "grocery"; Router.refresh(); } },
          },
          "Grocery list"
        )
      )
    );

    if (UI.state.mealsTab === "grocery") {
      root.appendChild(renderGroceryTab());
    } else {
      root.appendChild(weekNav(monday, offset));
      root.appendChild(weekCard(monday));
      root.appendChild(weekBtnRow(monday));
    }
  });

  /* Plan and Grocery must be true globals — every other view module calls
     them directly (see CONTRACT.md) — but nothing else in this file should
     leak, so only these two are attached to the global scope. */
  window.Plan = Plan;
  window.Grocery = Grocery;
})();


/* ==== js/30-recipes.js ========================================================= */
/* ============================================================
   Recipes — the box, the recipe sheet, and the three-door add
   flow that replaces Kenzie's Pinterest board.

   Public surface (see CONTRACT.md): Router.on("recipes", …) and
   `const Recipes`. Everything else here is private to this file.
   ============================================================ */

const Recipes = (function () {
  const TAG_VOCAB = [
    "weeknight", "quick", "kid-friendly", "one-pan", "slow-cooker", "grill",
    "soup", "pasta", "vegetarian", "spring", "summer", "fall", "winter",
    "comfort", "make-ahead",
  ];

  const h = UI.h;

  /* ---------- data helpers ---------- */

  function byId(id) {
    if (!id) return null;
    if (typeof Store.item === "function") return Store.item("recipes", id);
    const found = Store.list("recipes").filter(function (r) { return r.id === id; })[0];
    return found || null;
  }

  function all() {
    return Store.list("recipes").slice().sort(function (a, b) {
      return String(a.name || "").localeCompare(String(b.name || ""));
    });
  }

  /* Monday of the ISO week named by a "YYYY-Www" key, so we can turn the
     plan doc's date-keyed slots into real dates for "least recently
     planned" without depending on the Meals module. */
  function weekKeyToMonday(wk) {
    const m = /^(\d{4})-W(\d{2})$/.exec(String(wk || ""));
    if (!m) return null;
    const year = Number(m[1]);
    const week = Number(m[2]);
    const jan4 = new Date(year, 0, 4);
    const jan4Day = (jan4.getDay() + 6) % 7;
    const week1Monday = new Date(year, 0, 4 - jan4Day);
    return new Date(week1Monday.getFullYear(), week1Monday.getMonth(), week1Monday.getDate() + (week - 1) * 7);
  }

  function lastPlannedMap() {
    const plan = Store.get("plan") || {};
    const map = {};
    Object.keys(plan).forEach(function (wk) {
      const monday = weekKeyToMonday(wk);
      if (!monday) return;
      const days = plan[wk] || {};
      DAY_KEYS.forEach(function (dk, i) {
        const slot = days[dk];
        if (!slot || slot.kind !== "recipe" || !slot.recipeId) return;
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const t = d.getTime();
        if (map[slot.recipeId] === undefined || t > map[slot.recipeId]) map[slot.recipeId] = t;
      });
    });
    return map;
  }

  function suggest(date, n) {
    date = date || new Date();
    n = n || 3;
    let season = null;
    try {
      season = Almanac && Almanac.season ? Almanac.season(date) : null;
    } catch (e) {
      season = null;
    }
    const lastPlanned = lastPlannedMap();
    const scored = all().map(function (r) {
      const last = lastPlanned[r.id];
      return {
        r: r,
        seasonal: season && (r.tags || []).indexOf(season) >= 0 ? 1 : 0,
        fav: r.fav ? 1 : 0,
        last: last === undefined ? -Infinity : last,
      };
    });
    scored.sort(function (a, b) {
      if (a.seasonal !== b.seasonal) return b.seasonal - a.seasonal;
      if (a.fav !== b.fav) return b.fav - a.fav;
      if (a.last !== b.last) return a.last - b.last;
      return a.r.name.localeCompare(b.r.name);
    });
    return scored.slice(0, n).map(function (s) { return s.r; });
  }

  /* ---------- small shared bits ---------- */

  function countLabel(n, singular, plural) {
    return n + " " + (n === 1 ? singular : plural);
  }

  function field(label, inputEl) {
    return h("div", { class: "field" }, h("label", { text: label }), inputEl);
  }

  function splitLines(text) {
    return String(text || "")
      .split("\n")
      .map(function (l) { return l.trim(); })
      .filter(Boolean);
  }

  /* "1 lb chicken thighs" -> {qty:"1 lb", item:"chicken thighs"}.
     A line with no leading quantity keeps the whole line as the item. */
  function parseIngredientLine(line) {
    const m = /^((?:\d+\s*\/\s*\d+|\d+(?:\.\d+)?)(?:\s+\d+\s*\/\s*\d+)?)\s*([a-zA-Z]+\.?)?\s+(.+)$/.exec(line);
    if (m) {
      const qty = (m[1].trim() + (m[2] ? " " + m[2] : "")).trim();
      return { item: m[3].trim(), qty: qty };
    }
    return { item: line, qty: "" };
  }

  function ingredientsToLines(ings) {
    return (ings || [])
      .map(function (ing) {
        const qty = String((ing && ing.qty) || "").trim();
        const item = String((ing && ing.item) || "").trim();
        return qty ? qty + " " + item : item;
      })
      .join("\n");
  }

  /* ---------- Recipes screen ---------- */

  function renderRecipes(root) {
    const recipes = all();
    const favCount = recipes.filter(function (r) { return r.fav; }).length;

    root.appendChild(
      h(
        "div",
        { class: "page-head" },
        h("div", { class: "title", text: "Recipes" }),
        h("div", {
          class: "sub",
          text: countLabel(recipes.length, "recipe", "recipes") + ", " + countLabel(favCount, "favourite", "favourites"),
        })
      )
    );

    const searchInput = h("input", {
      class: "input",
      type: "search",
      placeholder: "Search recipes, tags, ingredients…",
      data: { keep: "recipe-search" },
    });
    searchInput.value = UI.state.recipeSearch || "";
    searchInput.addEventListener("input", function () {
      UI.state.recipeSearch = searchInput.value;
      Router.refresh();
    });
    root.appendChild(h("div", { class: "field" }, searchInput));

    const tagCounts = {};
    recipes.forEach(function (r) {
      (r.tags || []).forEach(function (t) {
        tagCounts[t] = (tagCounts[t] || 0) + 1;
      });
    });
    const tagsSorted = Object.keys(tagCounts).sort(function (a, b) {
      return tagCounts[b] - tagCounts[a] || a.localeCompare(b);
    });

    if (!UI.state.recipeTags) UI.state.recipeTags = [];
    const activeTags = UI.state.recipeTags;

    const chipDefs = [{ key: "__fav__", label: "Favourites" }].concat(
      tagsSorted.map(function (t) { return { key: t, label: t }; })
    );
    const scroller = h("div", { class: "scroller" });
    chipDefs.forEach(function (def) {
      const active = activeTags.indexOf(def.key) >= 0;
      const chipBtn = h(
        "button",
        { class: "fchip", type: "button", "aria-pressed": active ? "true" : "false" },
        def.label
      );
      chipBtn.addEventListener("click", function () {
        const i = activeTags.indexOf(def.key);
        if (i >= 0) activeTags.splice(i, 1);
        else activeTags.push(def.key);
        Router.refresh();
      });
      scroller.appendChild(chipBtn);
    });
    root.appendChild(scroller);

    const addBtn = h(
      "button",
      { class: "btn btn-primary btn-block", type: "button" },
      UI.icon("plus"),
      "Add a recipe"
    );
    addBtn.addEventListener("click", function () { openAdd(); });
    root.appendChild(addBtn);

    const search = (UI.state.recipeSearch || "").trim().toLowerCase();
    const filtered = recipes.filter(function (r) {
      if (activeTags.indexOf("__fav__") >= 0 && !r.fav) return false;
      for (let i = 0; i < activeTags.length; i++) {
        const t = activeTags[i];
        if (t === "__fav__") continue;
        if ((r.tags || []).indexOf(t) < 0) return false;
      }
      if (!search) return true;
      if (String(r.name || "").toLowerCase().indexOf(search) >= 0) return true;
      if (String(r.source || "").toLowerCase().indexOf(search) >= 0) return true;
      if ((r.tags || []).some(function (t) { return t.toLowerCase().indexOf(search) >= 0; })) return true;
      if ((r.ingredients || []).some(function (ing) {
        return String((ing && ing.item) || "").toLowerCase().indexOf(search) >= 0;
      })) return true;
      return false;
    });

    if (!filtered.length) {
      const clearBtn = h("button", { class: "btn", type: "button" }, "Clear filters");
      clearBtn.addEventListener("click", function () {

  /* ---------- the recipe form (door 2, door 3, edit, and the paste review) ---------- */

  function buildRecipeForm(initial, level) {
    initial = initial || {};

    const nameInput = h("input", { class: "input", type: "text", placeholder: "What's it called?", value: initial.name || "" });

    const emojiInput = h("input", { class: "input", type: "text", placeholder: "🍽️", maxlength: "8", value: initial.emoji || "" });

    const imageInput = h("input", { class: "input", type: "url", placeholder: "Photo link (optional)", value: initial.image || "" });
    const rows = [field("Name", nameInput), field("Link", urlInput), field("Emoji", emojiInput)];
    if (level === "full") rows.push(field("Photo", imageInput));

    let sourceInput, timeInput, servingsInput, ingredientsArea, stepsArea;
    const selectedTags = (initial.tags || []).slice();

    if (full) {
      sourceInput = h("input", {
        class: "input",
        type: "text",
        placeholder: "Who's it from? (Ina Garten, Kenzie, Pinterest…)",
        value: initial.source || "",
      });
      timeInput = h("input", { class: "input", type: "text", placeholder: "30 min", value: initial.time || "" });
      servingsInput = h("input", { class: "input", type: "text", placeholder: "4", value: initial.servings || "" });
      ingredientsArea = h("textarea", {
        class: "textarea",
        placeholder: "One per line — “1 lb chicken thighs”",
        text: ingredientsToLines(initial.ingredients),
      });
      stepsArea = h("textarea", {
        class: "textarea",
        placeholder: "One step per line",
        text: (initial.steps || []).join("\n"),
      });

      const tagWrap = h("div", { class: "chip-row" });
      TAG_VOCAB.forEach(function (t) {
        const active = selectedTags.indexOf(t) >= 0;
        const tagBtn = h("button", { class: "fchip", type: "button", "aria-pressed": active ? "true" : "false" }, t);
        tagBtn.addEventListener("click", function () {
          const i = selectedTags.indexOf(t);
          if (i >= 0) {
            selectedTags.splice(i, 1);
            tagBtn.setAttribute("aria-pressed", "false");
          } else {
            selectedTags.push(t);
            tagBtn.setAttribute("aria-pressed", "true");
          }
        });
        tagWrap.appendChild(tagBtn);
      });

      rows.push(field("Who's it from", sourceInput));
      rows.push(field("Time", timeInput));
      rows.push(field("Servings", servingsInput));
      rows.push(field("Tags", tagWrap));
      rows.push(field("Ingredients", ingredientsArea));
      rows.push(field("How to make it", stepsArea));
    }

    const el = h("div", { class: "stack" }, rows);

    function collect() {
      const name = nameInput.value.trim();
      if (!name) return { error: "Give the recipe a name first." };
      return {
        value: {
          name: name,
          emoji: (emojiInput.value || "").trim() || "🍽️",
          image: full ? (imageInput.value || "").trim() : (initial.image || ""),
          source: full ? (sourceInput.value || "").trim() : "",
          sourceUrl: (urlInput.value || "").trim(),
          time: full ? (timeInput.value || "").trim() : "",
          servings: full ? (servingsInput.value || "").trim() : "",
          tags: full ? selectedTags.slice() : [],
          ingredients: full ? splitLines(ingredientsArea.value).map(parseIngredientLine) : [],
          steps: full ? splitLines(stepsArea.value) : [],
        },
      };
    }

    return { el: el, collect: collect };
  }

  /* The edit form works in plain text, one ingredient per line, so it cannot
     carry the pantry and store flags. Those flags decide what lands on the
     grocery list and which shop it lands under, so carry them across from the
     version being edited by matching on the ingredient name. */
  function keepIngredientFlags(nextIngredients, previousIngredients) {
    const before = {};
    (previousIngredients || []).forEach(function (ing) {
      if (ing && ing.item) before[String(ing.item).trim().toLowerCase()] = ing;
    });
    return (nextIngredients || []).map(function (ing) {
      const was = before[String(ing.item || "").trim().toLowerCase()];
      if (!was) return ing;
      const out = Object.assign({}, ing);
      if (was.pantry) out.pantry = true;
      if (was.store) out.store = was.store;
      return out;
    });
  }

  function saveRecipe(fields, editingRecipe) {
    if (editingRecipe) {
      const merged = Object.assign({}, editingRecipe, fields);
      merged.ingredients = keepIngredientFlags(fields.ingredients, editingRecipe.ingredients);
      delete merged.id;
      Store.put("recipes", editingRecipe.id, merged);
      UI.toast("Recipe updated.");
    } else {
      const body = Object.assign({ fav: false, notes: "", at: new Date().toISOString() }, fields);
      Store.put("recipes", null, body);
      UI.toast("Added to the box");
    }
  }

  /* ---------- Add a recipe: the three doors ---------- */

  function openAdd() {
    const cfg = Store.get("config") || {};
    let sheetApi;

    function showDoors() {
      const introChildren = [];
      if (cfg.pinterestUrl) {
        const pinRow = h(
          "a",

      const doors = h("div", { class: "doors" });

        doors.appendChild(
          doorBtn(

      }
      doors.appendChild(
        doorBtn(
          "link",

        doorBtn("type", "Type it in", "Write it out yourself.", function () { showManualForm("full"); })
      );

      sheetApi.setBody(h("div", { class: "stack" }, introChildren, doors));
    }

    function doorBtn(iconName, title, sub, onClick) {
      const btn = h(
        "button",
        { class: "door", type: "button" },
        h("div", { class: "door-mark" }, UI.icon(iconName)),
        h(
          "div",
          { class: "door-main" },
          h("div", { class: "door-title", text: title }),
          h("div", { class: "door-sub", text: sub })
        )
      );
      btn.addEventListener("click", onClick);
      return btn;
    }

    /* The Pinterest path. She opens the pin, taps the link (or copies the
       pin's own URL), pastes it here. The server reads the recipe block the
       blog publishes for Google and hands back the clean recipe. */
    function showLinkForm(prefillUrl) {
      const urlInput = h("input", {
        class: "input",
        type: "url",
        placeholder: "https://…",
        value: prefillUrl || "",
        data: { keep: "import-url" },
      });
      const canImport = Store.mode === "server";
      const goBtn = h("button", { class: "btn btn-primary btn-block", type: "button" }, canImport ? "Bring it over" : "Save the link");
      goBtn.addEventListener("click", function () {
        const u = (urlInput.value || "").trim();
        if (!u) {
          UI.toast("Paste the link first.");
          return;
        }
        if (!canImport) {
          const form = buildRecipeForm({ sourceUrl: u }, "minimal");
          showFormWithSave(form);
          return;
        }
        handleImport(u);
      });
      urlInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          goBtn.click();
        }
      });
      sheetApi.setBody(
        h(
          "div",
          { class: "stack" },
          field("The link", urlInput),
          h("p", {
            class: "tiny muted",
            text: canImport
              ? "Works with the blog the pin points to, and usually with the pin itself."
              : "",
          }),
          goBtn
        )
      );
      sheetApi.scrollTop();
      if (window.matchMedia("(min-width: 900px)").matches) urlInput.focus();
    }

    async function handleImport(url) {
      sheetApi.setBody(
        h("div", { class: "thinking" }, h("div", { class: "spinner" }), h("span", { text: "Reading the recipe…" }))
      );
      let out = null;
      try {
        const res = await fetch("/api/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url }),
        });
        out = await res.json();
      } catch (e) {
        out = null;
      }
      if (!out || !out.ok || !out.recipe) {
        UI.toast("Couldn't reach that page. Saved the link; fill the rest in when you can.");
        showFormWithSave(buildRecipeForm({ sourceUrl: url }, "minimal"));
        return;
      }
      const r = out.recipe;
      const ings = (r.ingredients || []).map(parseIngredientLine);
      const parsed = {
        name: r.name || "",
        emoji: guessEmoji(r.name || "", r.keywords || ""),
        image: r.image || "",
        source: r.source || "",
        sourceUrl: r.sourceUrl || url,
        time: r.time || "",
        servings: r.servings || "",
        tags: guessTags(r),
        ingredients: ings,
        steps: r.steps || [],
      };
      if (!r.found) UI.toast("That page didn't publish a recipe block. Fill in what's missing.");
      showReviewForm(parsed);
    }

    function showFormWithSave(form) {
      const saveBtn = h("button", { class: "btn btn-primary btn-block", type: "button" }, "Save to the box");
      saveBtn.addEventListener("click", function () {
        const res = form.collect();
        if (res.error) {
          UI.toast(res.error);
          return;
        }
        saveRecipe(res.value, null);
        sheetApi.close();
      });
      sheetApi.setBody(h("div", { class: "stack" }, form.el, saveBtn));
      sheetApi.scrollTop();
    }

    function showManualForm(level) {
      const form = buildRecipeForm(null, level);
      const saveBtn = h("button", { class: "btn btn-primary btn-block", type: "button" }, "Save to the box");
      saveBtn.addEventListener("click", function () {
        const res = form.collect();
        if (res.error) {
          UI.toast(res.error);
          return;
        }
        saveRecipe(res.value, null);
        sheetApi.close();
      });
      sheetApi.setBody(h("div", { class: "stack" }, form.el, saveBtn));
      sheetApi.scrollTop();
    }

    function showPasteForm(prefillText, prefillUrl) {
      const pasteArea = h("textarea", {
        class: "textarea",
        placeholder: "Paste the whole recipe here — ingredients, steps, all of it",
        data: { keep: "paste-recipe" },
        text: prefillText || "",
      });
      pasteArea.style.minHeight = "220px";
      const urlInput = h("input", { class: "input", type: "url", placeholder: "https://…", value: prefillUrl || "" });
      const submitBtn = h("button", { class: "btn btn-primary btn-block", type: "button" }, "Sort it out");
      submitBtn.addEventListener("click", function () {
        handlePasteSubmit(pasteArea.value, urlInput.value);
      });
      sheetApi.setBody(
        h(
          "div",
          { class: "stack" },
          field("The recipe", pasteArea),
          field("Where did it come from? (optional)", urlInput),
          submitBtn
        )
      );
      sheetApi.scrollTop();
    }

    function showThinking() {
      sheetApi.setBody(
        h("div", { class: "thinking" }, h("div", { class: "spinner" }), h("span", { text: "Claude is reading the recipe…" }))
      );
    }

    async function handlePasteSubmit(text, url) {
      const trimmed = (text || "").trim();
      if (!trimmed) {
        UI.toast("Paste the recipe text first.");
        return;
      }
      const cleanUrl = (url || "").trim();
      showThinking();

      let data;
      try {
        data = await Ask.json(buildPastePrompt(trimmed, cleanUrl), { modelTier: "quick" });
      } catch (err) {
        const msg = Ask.message(err);
        if (msg) UI.toast(msg);
        showPasteForm(trimmed, cleanUrl);
        return;
      }

      const normalized = normalizeParsed(data, cleanUrl);
      if (!normalized) {
        UI.toast("Claude's answer didn't look like a recipe. Try again, or type it in yourself.");
        showPasteForm(trimmed, cleanUrl);
        return;
      }
      showReviewForm(normalized);
    }

    function showReviewForm(parsed) {
      const form = buildRecipeForm(parsed, "full");
      const saveBtn = h("button", { class: "btn btn-primary btn-block", type: "button" }, "Save to the box");
      saveBtn.addEventListener("click", function () {
        const res = form.collect();
        if (res.error) {
          UI.toast(res.error);
          return;
        }
        saveRecipe(res.value, null);
        sheetApi.close();
      });
      sheetApi.setBody(
        h(
          "div",
          { class: "stack" },
          h("p", { class: "muted tiny", text: "Check it over before saving — fix anything that came across wrong." }),
          form.el,
          saveBtn
        )
      );
      sheetApi.scrollTop();
    }

    sheetApi = UI.sheet({ title: "Add a recipe", body: h("div", { class: "stack" }) });
    showDoors();
  }

  /* Reused by the recipe sheet's overflow menu — opens the add sheet
     straight into the full form, pre-filled, in edit mode. */
  function openEdit(recipe) {
    let sheetApi;
    const form = buildRecipeForm(recipe, "full");
    const saveBtn = h("button", { class: "btn btn-primary btn-block", type: "button" }, "Save changes");
    saveBtn.addEventListener("click", function () {
      const res = form.collect();
      if (res.error) {
        UI.toast(res.error);
        return;
      }
      saveRecipe(res.value, recipe);
      sheetApi.close();
    });
    sheetApi = UI.sheet({
      title: "Edit " + (recipe.name || "recipe"),
      body: h("div", { class: "stack" }, form.el, saveBtn),
    });
  }

  function buildPastePrompt(text, url) {
    const vocab = TAG_VOCAB.join(", ");
    let p = "A home cook pasted the text of a recipe copied from a blog or a Pinterest pin. ";
    p += "Read it and reply with ONLY a single JSON object — no other text, no markdown fence — matching exactly this shape:\n";
    p += '{"name": string, "emoji": string (one food emoji), "source": string, "time": string (e.g. "30 min"), ';
    p += '"servings": string (e.g. "4"), "tags": string[], "ingredients": [{"item": string, "qty": string, "pantry": boolean}], "steps": string[]}\n\n';
    p += "Rules:\n";
    p += '- "tags" may ONLY use values from this list, and only ones that truly fit: ' + vocab + ".\n";
    p += '- "source" should name the cook or site the text credits (e.g. "Ina Garten", "Smitten Kitchen") when the text identifies one; otherwise use an empty string.\n';
    p += '- "steps" must be REWRITTEN concisely in plain, original wording — never copied sentences from the pasted text. Use 4 to 8 short imperative sentences (e.g. "Sear the chicken until golden.").\n';
    p += '- "ingredients" should separate each ingredient\'s quantity from its name; set "pantry": true only for common staples (salt, oil, flour, sugar, spices).\n';
    p += '- Leave a field blank ("" or []) rather than guessing when the text does not say.\n\n';
    if (url) p += "The person also gave this source link: " + url + "\n\n";
    p += 'The pasted recipe text:\n"""\n' + text.slice(0, 6000) + '\n"""\n';
    return p;
  }

  /* A cheap emoji for an imported recipe, from its name. Editable anyway. */
  const EMOJI_GUESSES = [
    [/pizza/i, "🍕"], [/taco|burrito|quesadilla|enchilada/i, "🌮"], [/burger/i, "🍔"],
    [/pasta|spaghetti|penne|ziti|lasagna|linguine|gnocchi|mac and cheese|macaroni/i, "🍝"],
    [/soup|chili|stew|chowder/i, "🍲"], [/salad/i, "🥗"], [/shrimp|prawn/i, "🍤"],
    [/salmon|fish|cod|tilapia|tuna/i, "🐟"], [/chicken|turkey/i, "🍗"], [/steak|beef|roast|brisket/i, "🥩"],
    [/pork|ribs|bacon|ham/i, "🥓"], [/rice|risotto|fried rice/i, "🍚"], [/ramen|noodle|pho|stir[- ]?fry/i, "🍜"],
    [/curry/i, "🍛"], [/egg|frittata|omelet|quiche/i, "🍳"], [/pancake|waffle|french toast/i, "🥞"],
    [/bread|roll|bun|biscuit/i, "🍞"], [/cookie|brownie|cake|pie|muffin|dessert|bar/i, "🍪"],
    [/sandwich|panini|grilled cheese/i, "🥪"], [/potato/i, "🥔"], [/corn/i, "🌽"], [/broccoli|veggie|vegetable/i, "🥦"],
  ];
  function guessEmoji(name, keywords) {
    const hay = name + " " + keywords;
    for (let i = 0; i < EMOJI_GUESSES.length; i++) if (EMOJI_GUESSES[i][0].test(hay)) return EMOJI_GUESSES[i][1];
    return "🍽️";
  }

  function guessTags(r) {
    const hay = ((r.name || "") + " " + (r.keywords || "") + " " + (r.steps || []).join(" ")).toLowerCase();
    const tags = [];
    const mins = parseInt((r.time || "").replace(/\D+/g, ""), 10);
    if (/slow cooker|crock ?pot/.test(hay)) tags.push("slow-cooker");
    if (/sheet pan|one pan|one-pan|skillet/.test(hay)) tags.push("one-pan");
    if (/grill/.test(hay)) tags.push("grill");
    if (/soup|chili|stew/.test(hay)) tags.push("soup");
    if (/pasta|spaghetti|penne|noodle|lasagna/.test(hay)) tags.push("pasta");
    if (/vegetarian|meatless|vegan/.test(hay)) tags.push("vegetarian");
    if (r.time && /min/.test(r.time) && !/hr/.test(r.time) && mins && mins <= 25) tags.push("quick");
    if (r.time && !/hr/.test(r.time) && mins && mins <= 45) tags.push("weeknight");
    return tags.filter(function (t, i, a) { return TAG_VOCAB.indexOf(t) >= 0 && a.indexOf(t) === i; }).slice(0, 5);
  }

  function normalizeParsed(data, url) {
    if (!data || typeof data !== "object" || Array.isArray(data)) return null;
    const name = typeof data.name === "string" ? data.name.trim() : "";
    if (!name) return null;

    const emoji = typeof data.emoji === "string" && data.emoji.trim() ? data.emoji.trim() : "🍽️";
    const source = typeof data.source === "string" ? data.source.trim() : "";
    const time = typeof data.time === "string" ? data.time.trim() : "";
    const servings =
      typeof data.servings === "string" ? data.servings.trim() : typeof data.servings === "number" ? String(data.servings) : "";

    const tags = Array.isArray(data.tags)
      ? data.tags.filter(function (t) { return typeof t === "string" && TAG_VOCAB.indexOf(t) >= 0; })
      : [];

    const ingredients = Array.isArray(data.ingredients)
      ? data.ingredients
          .map(function (ing) {
            if (!ing || typeof ing !== "object") return null;
            const item = typeof ing.item === "string" ? ing.item.trim() : "";
            if (!item) return null;
            return { item: item, qty: typeof ing.qty === "string" ? ing.qty.trim() : "", pantry: !!ing.pantry };
          })
          .filter(Boolean)
      : [];

    const steps = Array.isArray(data.steps)
      ? data.steps.filter(function (s) { return typeof s === "string" && s.trim(); }).map(function (s) { return s.trim(); })
      : [];

    return {
      name: name,
      emoji: emoji,
      source: source,
      sourceUrl: url || "",
      time: time,
      servings: servings,
      tags: tags,
      ingredients: ingredients,
      steps: steps,
    };
  }

  Router.on("recipes", renderRecipes);

  return {
    byId: byId,
    all: all,
    suggest: suggest,
    openSheet: openSheet,
    openAdd: openAdd,
  };
})();


/* ==== js/40-house.js ========================================================= */
/* ============================================================
   House — Cleaning / Jobs / Projects.
   Everything the Today screen needs from this module goes
   through the House object below; everything else here is
   private to this file, wrapped in the IIFE.
   ============================================================ */

const House = (function () {
  /* ---------- zone naming ---------- */

  const ZONES = [
    { name: "Laundry & bedrooms", words: ["laundry", "bed"] },
    { name: "The kitchen", words: ["sink", "counter", "dish"] },
    { name: "Bathrooms", words: ["tub", "toilet", "mirror"] },
    { name: "Floors & living spaces", words: ["vacuum", "mop", "floor"] },
    { name: "Outside", words: ["yard", "garage", "car"] },
    { name: "Reset & plan the week", words: ["plan", "reset"] },
  ];

  function zoneName(dayIdx) {
    const idx = ((dayIdx % 7) + 7) % 7;
    const dayKey = DAY_KEYS[idx];
    const routine = Store.get("routine") || {};
    if (routine.names && routine.names[dayKey]) return routine.names[dayKey];

    const tasks = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
    if (!tasks.length) return Fmt.dayName(idx) + " list";

    const counts = ZONES.map(function () {
      return 0;
    });
    tasks.forEach(function (t) {
      const text = String((t && t.text) || "").toLowerCase();
      ZONES.forEach(function (zone, i) {
        if (
          zone.words.some(function (w) {
            return text.indexOf(w) >= 0;
          })
        ) {
          counts[i] += 1;
        }
      });
    });

    let bestIdx = -1;
    let bestCount = 0;
    counts.forEach(function (c, i) {
      if (c > bestCount) {
        bestCount = c;
        bestIdx = i;
      }
    });
    if (bestIdx < 0) return Fmt.dayName(idx) + " list";
    return ZONES[bestIdx].name;
  }

  /* ---------- cadence ----------
     A task runs on its weekday every week by default. It can instead run
     every other week or once a month. "This weekday, but only some weeks."
       weekly   — every [weekday]           (default; absent means this)
       biweekly — every other [weekday]
       monthly  — the first [weekday] of the month
     Biweekly parity is anchored to a fixed Monday so it is the same on every
     device and never drifts. */
  const CADENCE_EPOCH = Date.UTC(2026, 0, 5); // a Monday
  const CADENCE_LABEL = { weekly: "", biweekly: "every 2 weeks", monthly: "monthly" };

  function weeksSinceEpoch(date) {
    const mon = Fmt.weekStart(date);
    const midday = Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate());
    return Math.round((midday - CADENCE_EPOCH) / (7 * 86400000));
  }

  function taskDueOn(task, date) {
    const cad = task && task.cadence;
    if (cad === "biweekly") return weeksSinceEpoch(date) % 2 === 0;
    if (cad === "monthly") return date.getDate() <= 7; // first occurrence of this weekday
    return true; // weekly / unset
  }

  /* ---------- Today-screen API ---------- */

  function todayTasks(date) {
    date = date || new Date();
    const idx = Fmt.dayIdx(date);
    const dayKey = DAY_KEYS[idx];
    const routine = Store.get("routine") || {};
    const tasks = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
    const dateKey = Fmt.dayKey(date);
    const checksDoc = Store.get("checks") || {};
    const dayChecks = checksDoc[dateKey] || {};
    return tasks
      .filter(function (t) {
        return taskDueOn(t, date);
      })
      .map(function (t) {
        return { id: t.id, text: t.text, min: t.min, done: !!dayChecks[t.id] };
      });
  }

  function toggleTask(date, taskId) {
    date = date || new Date();
    const dateKey = Fmt.dayKey(date);
    const checksDoc = Store.get("checks") || {};
    const dayChecks = checksDoc[dateKey] || {};
    const next = !dayChecks[taskId];
    const patch = {};
    patch[dateKey] = {};
    patch[dateKey][taskId] = next;
    Store.mergeDoc("checks", patch);
  }

  function openJobs() {
    UI.state.houseTab = "jobs";
    Router.go("house");
  }

  function attention(date) {
    date = date || new Date();
    const todayKey = Fmt.dayKey(date);
    const now = Fmt.fromDayKey(todayKey);

    const urgentJobs = [];
    const soonJobs = [];
    Store.list("jobs").forEach(function (j) {
      if (j.done) return;
      const due = j.due || "";
      const overdue = due && due < todayKey;
      if (j.priority === "urgent" || overdue) {
        urgentJobs.push(j);
        return;
      }
      if (due) {
        const then = Fmt.fromDayKey(due);
        const days = Math.round((then - now) / 86400000);
        if (days >= 0 && days <= 7) soonJobs.push(j);
      }
    });

    function byDueThenAge(a, b) {
      const ad = a.due || "9999-99-99";
      const bd = b.due || "9999-99-99";
      if (ad !== bd) return ad < bd ? -1 : 1;
      const aa = a.at || "";
      const ba = b.at || "";
      return aa < ba ? -1 : aa > ba ? 1 : 0;
    }
    urgentJobs.sort(byDueThenAge);
    soonJobs.sort(byDueThenAge);

    const goingProjects = Store.list("projects")
      .filter(function (p) {
        return p.status === "in progress";
      })
      .sort(function (a, b) {
        return (a.order || 0) - (b.order || 0);
      });

    const out = [];
    urgentJobs.forEach(function (j) {
      out.push({
        kind: "job",
        id: j.id,
        title: j.title,
        sub: [j.area, Fmt.relDay(j.due)].filter(Boolean).join(" · "),
        tone: "urgent",
      });
    });
    soonJobs.forEach(function (j) {
      out.push({
        kind: "job",
        id: j.id,
        title: j.title,
        sub: [j.area, Fmt.relDay(j.due)].filter(Boolean).join(" · "),
        tone: "soon",
      });
    });
    goingProjects.forEach(function (p) {
      out.push({
        kind: "project",
        id: p.id,
        title: p.title,
        sub: p.next || "",
        tone: "someday",
      });
    });

    return out.slice(0, 6);
  }

  /* ---------- shared little helpers ---------- */

  function field(label, control) {
    return UI.h("div", { class: "field" }, UI.h("label", { text: label }), control);
  }

  function buildSelect(options, value) {
    const select = UI.h("select", { class: "select" });
    options.forEach(function (opt) {
      select.appendChild(
        UI.h("option", { value: opt.value, selected: opt.value === value }, opt.label)
      );
    });
    return select;
  }

  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }

  /* ---------- Cleaning tab ---------- */

  function nextRoutineWithDay(dayKey, list) {
    const routine = Store.get("routine") || {};
    const next = Object.assign({}, routine);
    next[dayKey] = list;
    return next;
  }

  function addTask(dayKey, text) {
    const routine = Store.get("routine") || {};
    const list = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
    const nextList = list.concat([{ id: uid("task"), text: text, min: 10 }]);
    Store.setDoc("routine", nextRoutineWithDay(dayKey, nextList));
  }

  function saveTaskEdit(dayKey, taskId, text, min, cadence) {
    const routine = Store.get("routine") || {};
    const list = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
    const nextList = list.map(function (t) {
      if (t.id !== taskId) return t;
      const next = Object.assign({}, t, { text: text, min: min });
      /* Weekly is the default, so store it as the absence of the field —
         keeps the doc small and old tasks keep behaving as before. */
      if (cadence && cadence !== "weekly") next.cadence = cadence;
      else delete next.cadence;
      return next;
    });
    Store.setDoc("routine", nextRoutineWithDay(dayKey, nextList));
  }

  function deleteTask(dayKey, task) {
    UI.confirm('Delete "' + task.text + '"?', { danger: true, confirmText: "Delete it" }).then(
      function (ok) {
        if (!ok) return;
        const routine = Store.get("routine") || {};
        const list = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
        const nextList = list.filter(function (t) {
          return t.id !== task.id;
        });
        Store.setDoc("routine", nextRoutineWithDay(dayKey, nextList));
      }
    );
  }

  function moveTask(dayKey, idx, dir) {
    const routine = Store.get("routine") || {};
    const list = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
    const j = idx + dir;
    if (j < 0 || j >= list.length) return;
    const nextList = list.slice();
    const tmp = nextList[idx];
    nextList[idx] = nextList[j];
    nextList[j] = tmp;
    Store.setDoc("routine", nextRoutineWithDay(dayKey, nextList));
  }

  function openEditTaskSheet(dayKey, task) {
    const textInput = UI.h("input", { class: "input", type: "text", value: task.text });
    const minInput = UI.h("input", {
      class: "input",
      type: "number",
      min: "1",
      value: String(task.min || 10),
    });
    const cad = task.cadence || "weekly";
    const dayName = Fmt.dayName(DAY_KEYS.indexOf(dayKey));
    const cadSelect = UI.h(
      "select",
      { class: "select" },
      UI.h("option", { value: "weekly", text: "Every " + dayName, selected: cad === "weekly" ? true : null }),
      UI.h("option", { value: "biweekly", text: "Every other " + dayName, selected: cad === "biweekly" ? true : null }),
      UI.h("option", { value: "monthly", text: "First " + dayName + " of the month", selected: cad === "monthly" ? true : null })
    );

    const s = UI.sheet({
      title: "Edit task",
      body: UI.h(
        "div",
        { class: "stack" },
        field("Task", textInput),
        field("Minutes", minInput),
        field("How often", cadSelect)
      ),
      actions: [
        UI.h(
          "button",
          { class: "btn", type: "button", on: { click: function () { s.close(); } } },
          "Cancel"
        ),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                const newText = textInput.value.trim();
                if (!newText) {
                  UI.toast("Give the task some words first.");
                  return;
                }
                const newMin = Math.max(1, Number(minInput.value) || 10);
                saveTaskEdit(dayKey, task.id, newText, newMin, cadSelect.value);
                s.close();
              },
            },
          },
          "Save"
        ),
      ],
    });
  }

  function buildEditRow(dayKey, tasks, task, idx) {
    const row = UI.h("div", { class: "edit-row" });
    const label = CADENCE_LABEL[task.cadence || "weekly"];
    row.appendChild(
      UI.h(
        "span",
        { class: "e-text" },
        task.text,
        label ? UI.h("span", { class: "chip chip-amber e-cad", text: label }) : null
      )
    );
    row.appendChild(UI.h("span", { class: "e-min", text: Fmt.minutes(task.min) }));
    row.appendChild(
      UI.h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Move earlier",
          disabled: idx === 0,
          on: { click: function () { moveTask(dayKey, idx, -1); } },
        },
        UI.icon("up")
      )
    );
    row.appendChild(
      UI.h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Move later",
          disabled: idx === tasks.length - 1,
          on: { click: function () { moveTask(dayKey, idx, 1); } },
        },
        UI.icon("down")
      )
    );
    row.appendChild(
      UI.h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Edit task",
          on: { click: function () { openEditTaskSheet(dayKey, task); } },
        },
        UI.icon("pencil")
      )
    );
    row.appendChild(
      UI.h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Delete task",
          on: { click: function () { deleteTask(dayKey, task); } },
        },
        UI.icon("trash")
      )
    );
    return row;
  }

  function buildDayQuickAdd(dayKey) {
    const input = UI.h("input", {
      class: "input",
      type: "text",
      placeholder: "Add a task",
      data: { keep: "task-add-" + dayKey },
    });
    function submit() {
      const text = input.value.trim();
      if (!text) return;
      addTask(dayKey, text);
      input.value = "";
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        submit();
      }
    });
    const addBtn = UI.h(
      "button",
      { class: "btn btn-primary", type: "button", "aria-label": "Add task", on: { click: submit } },
      UI.icon("plus")
    );
    return UI.h("div", { class: "quickadd" }, input, addBtn);
  }

  function buildDayBlock(dayIdx, isToday) {
    const dayKey = DAY_KEYS[dayIdx];
    const routine = Store.get("routine") || {};
    const tasks = Array.isArray(routine[dayKey]) ? routine[dayKey] : [];
    const isOpen = UI.state.openDay === dayIdx;
    const totalMin = tasks.reduce(function (sum, t) {
      return sum + (Number(t.min) || 0);
    }, 0);

    const block = UI.h("div", {
      class: "dayblock",
      data: { open: isOpen ? "true" : "false", today: isToday ? "true" : "false" },
    });

    block.appendChild(
      UI.h(
        "button",
        {
          class: "dayblock-head",
          type: "button",
          on: {
            click: function () {
              UI.state.openDay = isOpen ? null : dayIdx;
              Router.refresh();
            },
          },
        },
        UI.h("span", { class: "d-name", text: Fmt.dayName(dayIdx) + " · " + zoneName(dayIdx) }),
        UI.h("span", { class: "d-count", text: plural(tasks.length, "task") + " · " + Fmt.minutes(totalMin) }),
        UI.h("span", { class: "caret" }, UI.icon("chevron"))
      )
    );

    if (isOpen) {
      const body = UI.h("div", { class: "dayblock-body" });
      tasks.forEach(function (t, idx) {
        body.appendChild(buildEditRow(dayKey, tasks, t, idx));
      });
      body.appendChild(buildDayQuickAdd(dayKey));
      block.appendChild(body);
    }

    return block;
  }

  function renderCleaningTab() {
    const wrap = UI.h("div", { class: "stack" });
    wrap.appendChild(
      UI.h("p", {
        class: "tiny muted",
        text: "Whatever is here shows up on the Today screen each morning.",
      })
    );

    const todayIdx = Fmt.dayIdx(new Date());
    if (UI.state.openDay === undefined) UI.state.openDay = todayIdx;

    for (let i = 0; i < 7; i++) {
      wrap.appendChild(buildDayBlock(i, i === todayIdx));
    }
    return wrap;
  }

  /* ---------- Jobs tab ---------- */

  const AREA_OPTIONS = [
    "Kitchen",
    "Bathroom",
    "Bedroom",
    "Living room",
    "Basement",
    "Garage",
    "Yard",
    "Exterior",
    "Car",
  ];
  const PRIORITY_OPTIONS = [
    ["urgent", "Urgent"],
    ["soon", "Soon"],
    ["someday", "Someday"],
  ];
  const PRI_ORDER = { urgent: 0, soon: 1, someday: 2 };

  function jobSortFn(a, b) {
    const pa = PRI_ORDER[a.priority] !== undefined ? PRI_ORDER[a.priority] : 2;
    const pb = PRI_ORDER[b.priority] !== undefined ? PRI_ORDER[b.priority] : 2;
    if (pa !== pb) return pa - pb;
    const ad = a.due || "9999-99-99";
    const bd = b.due || "9999-99-99";
    if (ad !== bd) return ad < bd ? -1 : 1;
    const aa = a.at || "";
    const ba = b.at || "";
    return aa < ba ? -1 : aa > ba ? 1 : 0;
  }

  function toggleJobDone(job) {
    const next = !job.done;
    Store.patch("jobs", job.id, { done: next, doneAt: next ? new Date().toISOString() : "" });
  }

  function openJobSheet(job) {
    const titleInput = UI.h("input", { class: "input", type: "text", value: job.title });
    const areaOptions = [{ value: "", label: "No area" }].concat(
      AREA_OPTIONS.map(function (a) {
        return { value: a, label: a };
      })
    );
    const areaSelect = buildSelect(areaOptions, job.area || "");
    const priSelect = buildSelect(
      PRIORITY_OPTIONS.map(function (p) {
        return { value: p[0], label: p[1] };
      }),
      job.priority || "soon"
    );
    const dueInput = UI.h("input", { class: "input", type: "date", value: job.due || "" });
    const notesInput = UI.h("textarea", { class: "textarea", text: job.notes || "" });

    const s = UI.sheet({
      title: "Edit job",
      body: UI.h(
        "div",
        { class: "stack" },
        field("Title", titleInput),
        field("Area", areaSelect),
        field("Priority", priSelect),
        field("Due", dueInput),
        field("Notes", notesInput)
      ),
      actions: [
        UI.h(
          "button",
          {
            class: "btn btn-danger",
            type: "button",
            on: {
              click: function () {
                UI.confirm('Delete "' + job.title + '"?', {
                  danger: true,
                  confirmText: "Delete it",
                }).then(function (ok) {
                  if (!ok) return;
                  Store.remove("jobs", job.id);
                  s.close();
                });
              },
            },
          },
          "Delete"
        ),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                const title = titleInput.value.trim();
                if (!title) {
                  UI.toast("Give the job a title first.");
                  return;
                }
                Store.patch("jobs", job.id, {
                  title: title,
                  area: areaSelect.value,
                  priority: priSelect.value,
                  due: dueInput.value || "",
                  notes: notesInput.value,
                });
                s.close();
              },
            },
          },
          "Save"
        ),
      ],
    });
  }

  function buildJobRow(job) {
    const stripe = UI.h("div", { class: "pri-stripe pri-" + (job.priority || "someday") });
    const todayKey = Fmt.dayKey();
    const overdue = !!job.due && job.due < todayKey && !job.done;

    const check = UI.h(
      "button",
      {
        class: "job-check",
        type: "button",
        "aria-label": job.done ? "Mark not done" : "Mark done",
        on: { click: function () { toggleJobDone(job); } },
      },
      UI.icon("check")
    );

    const meta = UI.h("div", { class: "job-meta" });
    if (job.area) meta.appendChild(UI.chip(job.area));
    if (job.due) meta.appendChild(UI.chip(Fmt.relDay(job.due), overdue ? "tulip" : null));

    const mainChildren = [UI.h("div", { class: "job-title", text: job.title }), meta];
    if (job.notes) mainChildren.push(UI.h("div", { class: "job-notes", text: job.notes }));

    const main = UI.h(
      "div",
      { class: "job-main", on: { click: function () { openJobSheet(job); } } },
      mainChildren
    );

    return UI.h(
      "div",
      { class: "job-row", data: { done: job.done ? "true" : "false" } },
      stripe,
      check,
      main
    );
  }

  function buildJobQuickAdd() {
    const input = UI.h("input", {
      class: "input",
      type: "text",
      placeholder: "What needs fixing?",
      data: { keep: "job-add" },
    });
    function submit() {
      const title = input.value.trim();
      if (!title) return;
      Store.put("jobs", null, {
        title: title,
        area: "",
        priority: "soon",
        notes: "",
        due: "",
        done: false,
        doneAt: "",
        at: new Date().toISOString(),
      });
      input.value = "";
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        submit();
      }
    });
    const addBtn = UI.h(
      "button",
      { class: "btn btn-primary", type: "button", "aria-label": "Add job", on: { click: submit } },
      UI.icon("plus")
    );
    return UI.h("div", { class: "quickadd" }, input, addBtn);
  }

  function buildJobFilters(filter) {
    const scroller = UI.h("div", { class: "scroller" });
    PRIORITY_OPTIONS.forEach(function (pair) {
      const key = pair[0];
      scroller.appendChild(
        UI.h(
          "button",
          {
            class: "fchip",
            type: "button",
            "aria-pressed": filter.pri[key] ? "true" : "false",
            on: {
              click: function () {
                filter.pri[key] = !filter.pri[key];
                Router.refresh();
              },
            },
          },
          pair[1]
        )
      );
    });
    scroller.appendChild(
      UI.h(
        "button",
        {
          class: "fchip",
          type: "button",
          "aria-pressed": filter.showDone ? "true" : "false",
          on: {
            click: function () {
              filter.showDone = !filter.showDone;
              Router.refresh();
            },
          },
        },
        "Show done"
      )
    );
    return scroller;
  }

  function buildDoneSection(doneJobs, filter) {
    const wrap = UI.h("div", { class: "card card-quiet" });
    wrap.appendChild(
      UI.h(
        "button",
        {
          class: "row",
          type: "button",
          on: {
            click: function () {
              filter.showDone = !filter.showDone;
              Router.refresh();
            },
          },
        },
        UI.h(
          "div",
          { class: "row-main" },
          UI.h("div", { class: "row-title", text: plural(doneJobs.length, "job") + " done" })
        ),
        UI.h("div", { class: "row-end" }, UI.icon(filter.showDone ? "up" : "down"))
      )
    );

    if (filter.showDone) {
      const rows = UI.h("div", { class: "rows" });
      doneJobs
        .slice()
        .sort(function (a, b) {
          const aa = a.doneAt || "";
          const ba = b.doneAt || "";
          return aa < ba ? 1 : aa > ba ? -1 : 0;
        })
        .forEach(function (j) {
          rows.appendChild(buildJobRow(j));
        });
      wrap.appendChild(rows);
      wrap.appendChild(
        UI.h(
          "div",
          { class: "card-pad" },
          UI.h(
            "button",
            {
              class: "btn btn-danger btn-block",
              type: "button",
              on: {
                click: function () {
                  UI.confirm("Clear all the done jobs? This can't be undone.", {
                    danger: true,
                    confirmText: "Clear the done ones",
                  }).then(function (ok) {
                    if (!ok) return;
                    doneJobs.forEach(function (j) {
                      Store.remove("jobs", j.id);
                    });
                  });
                },
              },
            },
            "Clear the done ones"
          )
        )
      );
    }
    return wrap;
  }

  function renderJobsTab() {
    if (!UI.state.jobFilter) {
      UI.state.jobFilter = { pri: { urgent: true, soon: true, someday: true }, showDone: false };
    }
    const filter = UI.state.jobFilter;

    const wrap = UI.h("div", { class: "stack" });
    wrap.appendChild(buildJobQuickAdd());
    wrap.appendChild(buildJobFilters(filter));

    const allJobs = Store.list("jobs");
    const openJobsList = allJobs
      .filter(function (j) {
        return !j.done && filter.pri[j.priority || "someday"];
      })
      .sort(jobSortFn);
    const doneJobs = allJobs.filter(function (j) {
      return j.done;
    });

    if (!openJobsList.length) {
      wrap.appendChild(
        UI.empty(
          "wrench",
          allJobs.length
            ? "No jobs match these filters."
            : "No jobs on the list yet. Add the first thing that needs fixing."
        )
      );
    } else {
      const rows = UI.h("div", { class: "rows" });
      openJobsList.forEach(function (j) {
        rows.appendChild(buildJobRow(j));
      });
      wrap.appendChild(UI.h("div", { class: "card" }, rows));
    }

    if (doneJobs.length) wrap.appendChild(buildDoneSection(doneJobs, filter));

    return wrap;
  }

  /* ---------- Projects tab ---------- */

  const CATEGORY_OPTIONS = ["Exterior", "Interior", "Yard", "Garage", "Big ticket"];
  const PROJECT_STATUS_OPTIONS = [
    ["idea", "Idea"],
    ["planned", "Planned"],
    ["in progress", "In progress"],
    ["done", "Done"],
  ];
  const STATUS_GROUPS = [
    ["in progress", "In progress"],
    ["planned", "Planned"],
    ["idea", "Ideas"],
    ["done", "Done"],
  ];
  const NEXT_STATUS = { idea: "planned", planned: "in progress", "in progress": "done" };

  function advanceProjectStatus(p) {
    const next = NEXT_STATUS[p.status];
    if (next) Store.patch("projects", p.id, { status: next });
  }

  function openProjectSheet(p) {
    const isNew = !p;
    const titleInput = UI.h("input", { class: "input", type: "text", value: p ? p.title : "" });
    const categorySelect = buildSelect(
      CATEGORY_OPTIONS.map(function (c) {
        return { value: c, label: c };
      }),
      p ? p.category : CATEGORY_OPTIONS[0]
    );
    const statusSelect = buildSelect(
      PROJECT_STATUS_OPTIONS.map(function (s) {
        return { value: s[0], label: s[1] };
      }),
      p ? p.status : "idea"
    );
    const costInput = UI.h("input", {
      class: "input",
      type: "text",
      value: p ? p.cost || "" : "",
      placeholder: "$500-1,000",
    });
    const seasonInput = UI.h("input", {
      class: "input",
      type: "text",
      value: p ? p.season || "" : "",
      placeholder: "Spring",
    });
    const nextInput = UI.h("input", {
      class: "input",
      type: "text",
      value: p ? p.next || "" : "",
      placeholder: "What's the next step?",
    });
    const notesInput = UI.h("textarea", { class: "textarea", text: p ? p.notes || "" : "" });

    const actions = [];
    if (!isNew) {
      actions.push(
        UI.h(
          "button",
          {
            class: "btn btn-danger",
            type: "button",
            on: {
              click: function () {
                UI.confirm('Delete "' + p.title + '"?', {
                  danger: true,
                  confirmText: "Delete it",
                }).then(function (ok) {
                  if (!ok) return;
                  Store.remove("projects", p.id);
                  s.close();
                });
              },
            },
          },
          "Delete"
        )
      );
    }
    actions.push(
      UI.h(
        "button",
        {
          class: "btn btn-primary",
          type: "button",
          on: {
            click: function () {
              const title = titleInput.value.trim();
              if (!title) {
                UI.toast("Give the project a name first.");
                return;
              }
              const body = {
                title: title,
                category: categorySelect.value,
                status: statusSelect.value,
                cost: costInput.value.trim(),
                season: seasonInput.value.trim(),
                next: nextInput.value.trim(),
                notes: notesInput.value,
              };
              if (isNew) {
                const all = Store.list("projects");
                const maxOrder = all.reduce(function (m, x) {
                  return Math.max(m, x.order || 0);
                }, 0);
                body.order = maxOrder + 1;
                body.at = new Date().toISOString();
                Store.put("projects", null, body);
              } else {
                Store.patch("projects", p.id, body);
              }
              s.close();
            },
          },
        },
        isNew ? "Add project" : "Save"
      )
    );

    const s = UI.sheet({
      title: isNew ? "Add a project" : "Edit project",
      body: UI.h(
        "div",
        { class: "stack" },
        field("Title", titleInput),
        field("Category", categorySelect),
        field("Status", statusSelect),
        field("Cost", costInput),
        field("Season", seasonInput),
        field("Next step", nextInput),
        field("Notes", notesInput)
      ),
      actions: actions,
    });
  }

  function buildProjectCard(p) {
    const statusTone = p.status === "in progress" ? "leaf" : p.status === "planned" ? "delft" : null;
    const statusLabel =
      p.status === "in progress"
        ? "In progress"
        : p.status === "planned"
        ? "Planned"
        : p.status === "done"
        ? "Done"
        : "Idea";

    const card = UI.h("div", {
      class: "pcard",
      on: {
        click: function (e) {
          if (e.target && e.target.closest && e.target.closest("button")) return;
          openProjectSheet(p);
        },
      },
    });

    card.appendChild(
      UI.h(
        "div",
        { class: "p-head" },
        UI.h("div", { class: "p-title", text: p.title }),
        UI.chip(statusLabel, statusTone)
      )
    );

    if (p.next) {
      card.appendChild(
        UI.h(
          "div",
          { class: "p-next" },
          UI.h("span", { class: "p-next-key", text: "Next" }),
          UI.h("span", { text: p.next })
        )
      );
    }

    const facts = UI.h("div", { class: "p-facts" });
    if (p.cost) facts.appendChild(UI.h("span", {}, "Cost ", UI.h("b", { text: p.cost })));
    if (p.season) facts.appendChild(UI.h("span", {}, "Season ", UI.h("b", { text: p.season })));
    if (p.category) facts.appendChild(UI.h("span", {}, "Category ", UI.h("b", { text: p.category })));
    if (facts.childNodes.length) card.appendChild(facts);

    if (p.notes) card.appendChild(UI.h("p", { class: "tiny muted", text: p.notes }));

    if (p.status !== "done") {
      const label = p.status === "in progress" ? "Mark it done" : "Start it";
      card.appendChild(
        UI.h(
          "button",
          {
            class: "btn btn-sm",
            type: "button",
            on: {
              click: function (e) {
                e.stopPropagation();
                advanceProjectStatus(p);
              },
            },
          },
          label
        )
      );
    }

    return card;
  }

  function renderProjectsTab() {
    const wrap = UI.h("div", { class: "stack" });
    wrap.appendChild(
      UI.h(
        "button",
        {
          class: "btn btn-primary btn-block",
          type: "button",
          on: { click: function () { openProjectSheet(null); } },
        },
        "Add a project"
      )
    );

    const all = Store.list("projects");
    STATUS_GROUPS.forEach(function (pair) {
      const status = pair[0];
      const label = pair[1];
      const items = all
        .filter(function (p) {
          return p.status === status;
        })
        .sort(function (a, b) {
          return (a.order || 0) - (b.order || 0);
        });
      if (!items.length && status !== "idea") return;

      const group = UI.h("div", { class: "status-group" });
      group.appendChild(UI.h("div", { class: "eyebrow", text: label + " (" + items.length + ")" }));
      if (!items.length) {
        group.appendChild(UI.empty("hammer", "Nothing here yet — this is where a someday idea goes."));
      } else {
        items.forEach(function (p) {
          group.appendChild(UI.h("div", { class: "card" }, buildProjectCard(p)));
        });
      }
      wrap.appendChild(group);
    });

    return wrap;
  }

  /* ---------- screen shell ---------- */

  function buildSegmented(tab) {
    const seg = UI.h("div", { class: "segmented" });
    [
      ["cleaning", "Cleaning"],
      ["jobs", "Jobs"],
      ["projects", "Projects"],
    ].forEach(function (pair) {
      const key = pair[0];
      seg.appendChild(
        UI.h(
          "button",
          {
            type: "button",
            "aria-pressed": tab === key ? "true" : "false",
            on: {
              click: function () {
                UI.state.houseTab = key;
                Router.refresh();
              },
            },
          },
          pair[1]
        )
      );
    });
    return seg;
  }

  function renderHouse(root) {
    const tab = UI.state.houseTab || "cleaning";
    UI.state.houseTab = tab;

    const jobs = Store.list("jobs");
    const projects = Store.list("projects");
    const openJobsCount = jobs.filter(function (j) {
      return !j.done;
    }).length;
    const goingCount = projects.filter(function (p) {
      return p.status === "in progress";
    }).length;

    root.appendChild(
      UI.h(
        "div",
