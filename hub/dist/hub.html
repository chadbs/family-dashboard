/* ---------- UI ---------- */

const UI = (function () {
  /* Ephemeral view state that must survive a re-render (open filters,
     which segment is showing). Never persisted. */
  const state = {};

  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    const p = props || {};
    Object.keys(p).forEach(function (key) {
      const val = p[key];
      if (val === null || val === undefined || val === false) return;
      if (key === "class") el.className = val;
      else if (key === "text") el.textContent = val;
      else if (key === "style") Object.assign(el.style, val);
      else if (key === "on") {
        Object.keys(val).forEach(function (evt) {
          el.addEventListener(evt, val[evt]);
        });
      } else if (key === "data") {
        Object.keys(val).forEach(function (d) {
          el.dataset[d] = val[d];
        });
      } else if (key === "svg") {
        el.innerHTML = val;
      } else if (val === true) {
        el.setAttribute(key, "");
      } else {
        el.setAttribute(key, String(val));
      }
    });
    appendAll(el, children);
    return el;
  }

  function appendAll(el, kids) {
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) return appendAll(el, c);
      el.appendChild(typeof c === "object" && c.nodeType ? c : document.createTextNode(String(c)));
    });
  }

  function icon(name, size) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.9");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    if (size) {
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
    }
    svg.innerHTML = ICON_PATHS[name] || ICON_PATHS.info;
    return svg;
  }

  /* --- sheets --- */

  const openSheets = [];

  function sheet(opts) {
    const o = opts || {};
    const body = h("div", { class: "sheet-body" });
    appendAll(body, [o.body]);

    const head = h(
      "div",
      { class: "sheet-head" },
      h("h2", { text: o.title || "" }),
      h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Close",
          on: { click: function () { close(); } },
        },
        icon("x")
      )
    );

    const panel = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
    panel.appendChild(h("div", { class: "sheet-grip" }));
    panel.appendChild(head);
    panel.appendChild(body);

    if (o.actions && o.actions.length) {
      const foot = h("div", { class: "sheet-foot" });
      appendAll(foot, o.actions);
      panel.appendChild(foot);
    }

    const scrim = h("div", {
      class: "scrim",
      on: {
        click: function (e) {
          if (e.target === scrim) close();
        },
      },
    });
    scrim.appendChild(panel);

    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      const i = openSheets.indexOf(api);
      if (i >= 0) openSheets.splice(i, 1);
      scrim.remove();
      if (!openSheets.length) document.body.style.overflow = "";
      if (o.onClose) o.onClose();
    }

    const api = {
      close: close,
      el: panel,
      setBody: function (node) {
        body.textContent = "";
        appendAll(body, [node]);
      },
      scrollTop: function () {
        body.scrollTop = 0;
      },
    };

    document.body.appendChild(scrim);
    document.body.style.overflow = "hidden";
    openSheets.push(api);

    const focusable = panel.querySelector("input, textarea, button.btn-primary");
    if (focusable && window.matchMedia("(min-width: 900px)").matches) focusable.focus();

    return api;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && openSheets.length) openSheets[openSheets.length - 1].close();
  });

  function confirmSheet(message, opts) {
    const o = opts || {};
    return new Promise(function (resolve) {
      let answered = false;
      const s = sheet({
        title: o.title || "Are you sure?",
        body: h("p", { class: "muted", text: message }),
        actions: [
          h(
            "button",
            {
              class: "btn",
              type: "button",
              on: { click: function () { answered = true; s.close(); resolve(false); } },
            },
            "Keep it"
          ),
          h(
            "button",
            {
              class: "btn " + (o.danger ? "btn-danger" : "btn-primary"),
              type: "button",
              on: { click: function () { answered = true; s.close(); resolve(true); } },
            },
            o.confirmText || "Yes, do it"
          ),
        ],
        onClose: function () {
          if (!answered) resolve(false);
        },
      });
    });
  }

  /* --- toasts --- */

  let toastHost = null;
  function toast(msg) {
    if (!toastHost) {
      toastHost = h("div", { class: "toasts" });
      document.body.appendChild(toastHost);
    }
    const t = h("div", { class: "toast", text: msg });
    toastHost.appendChild(t);
    setTimeout(function () {
      t.style.transition = "opacity .3s ease";
      t.style.opacity = "0";
      setTimeout(function () { t.remove(); }, 320);
    }, 2400);
  }

  /* --- composed bits every view reuses --- */

  function empty(iconName, line, action) {
    return h(
      "div",
      { class: "empty" },
      h("div", { class: "empty-mark" }, icon(iconName)),
      h("p", { text: line }),
      action || null
    );
  }

  function section(title, aside, ...children) {
    const head = h("div", { class: "section-head" }, h("h2", { text: title }));
    if (aside) head.appendChild(aside.nodeType ? aside : h("span", { class: "aside", text: aside }));
    return h("section", { class: "section" }, head, ...children);
  }

  function chip(text, tone) {
    return h("span", { class: "chip" + (tone ? " chip-" + tone : ""), text: text });
  }

  function meter(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return h(
      "div",
      { class: "meter" },
      h(
        "div",
        { class: "meter-track" },
        h("div", { class: "meter-fill", style: { width: pct + "%" } })
      ),
      h(
        "div",
        { class: "meter-label" },
        h("span", { text: done + " of " + total + " done" }),
        h("span", { class: "nums", text: pct + "%" })
      )
    );
  }

  return {
    h: h,
    icon: icon,
    sheet: sheet,
    confirm: confirmSheet,
    toast: toast,
    empty: empty,
    section: section,
    chip: chip,
    meter: meter,
    state: state,
  };
})();

/* ---------- Ask (the sample capability) ---------- */

const Ask = (function () {
  let sample = null;
  let resolved = false;

  async function init() {
    try {
      sample = await claude.use("sample");
    } catch (e) {
      sample = null;
    }
    resolved = true;
  }

  function available() {
    return resolved && !!sample;
  }

  function handle(err) {
    const code = (err && err.code) || "";
    if (code === "not_granted") {
      sample = null;
      return "Claude is not available here.";
    }
    if (code === "rate_limited") return "Too many questions at once. Give it a minute.";
    if (code === "cancelled") return "";
    return "Claude could not answer that. Try again.";
  }

  return {
    init: init,
    available: available,
    text: async function (prompt, opts) {
      if (!sample) throw new Error("unavailable");
      const res = await sample(prompt, opts || {});
      return res.text;
    },
    json: async function (prompt, opts) {
      if (!sample) throw new Error("unavailable");
      return sample.json(prompt, opts || {});
    },
    message: handle,
  };
})();

/* ---------- Router ---------- */

const Router = (function () {
  const routes = {};
  let current = "today";
  let host = null;
  let pending = false;

  function on(name, render) {
    routes[name] = render;
  }

  /* A re-render replaces the whole view, so anything the person was typing
     into would lose focus and caret. Views mark such inputs with data-keep
     and this puts them back exactly as they were. */
  function captureFocus() {
    const el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.keep) return null;
    if (!host || !host.contains(el)) return null;
    return {
      key: el.dataset.keep,
      value: el.value,
      start: el.selectionStart,
      end: el.selectionEnd,
    };
  }

  function restoreFocus(snap) {
    if (!snap || !host) return;
    const el = host.querySelector('[data-keep="' + snap.key + '"]');
    if (!el) return;
    if (snap.value !== undefined && el.value !== undefined) el.value = snap.value;
    el.focus();
    try {
      if (snap.start !== null && el.setSelectionRange) el.setSelectionRange(snap.start, snap.end);
    } catch (e) {
      /* number and date inputs refuse setSelectionRange; harmless */
    }
  }

  function paint() {
    pending = false;
    if (!host) return;
    const render = routes[current] || routes.today;
    const snap = captureFocus();
    const scroll = window.scrollY;
    const view = document.createElement("div");
    view.className = "view";
    try {
      render(view);
    } catch (e) {
      console.error("view failed", current, e);
      view.appendChild(
        UI.empty("alert", "Something in this screen broke. Switching tabs and back usually clears it.")
      );
    }
    host.replaceChildren(view);
    restoreFocus(snap);
    if (scroll) window.scrollTo(0, scroll);
    document.querySelectorAll(".tabbar button[data-route]").forEach(function (b) {
      if (b.dataset.route === current) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  }

  /* A repaint rides requestAnimationFrame so several store writes in a row
     cost one paint. But rAF never fires while the tab is hidden — a phone in
     a pocket, the wall's browser in the background — and without the timer
     below `pending` would stick on and the screen would quietly stop
     updating for the rest of the session. Whichever fires first wins; the
     other finds `pending` already cleared and does nothing. */
  function schedule() {
    if (pending) return;
    pending = true;
    const run = function () {
      if (pending) paint();
    };
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  return {
    on: on,
    mount: function (el) {
      host = el;
    },
    go: function (name) {
      if (!routes[name]) return;
      const changed = current !== name;
      current = name;
      if (changed) window.scrollTo(0, 0);
      paint();
    },
    current: function () {
      return current;
    },
    refresh: schedule,
  };
})();


/* ==== js/05-weather.js ========================================================= */
/* ============================================================
   Weather — the backyard sensor first, the forecast behind it.

   Two ways the numbers arrive:

   * Served from the family's own dashboard server (the normal case), the
     page asks /api/hub/weather, which reads the AcuRite sensor's own
     data/weather.json and adds the Open-Meteo forecast. That is the real
     backyard temperature, the same number the wall shows.

   * Published as a Claude artifact, the page cannot make network calls at
     all, so it falls back to whatever was last written into the store's
     weather document, and says how old that is.

   Either way the card renders or quietly disappears — it never blocks the
   rest of the screen.
   ============================================================ */

const Weather = (function () {
  let live = null;
  let tried = false;

  /* WMO weather codes, as Open-Meteo reports them. */
  const CODES = {
    0: ["Clear", "☀️"],
    1: ["Mostly clear", "🌤️"],
    2: ["Partly cloudy", "⛅"],
    3: ["Overcast", "☁️"],
    45: ["Fog", "🌫️"],
    48: ["Freezing fog", "🌫️"],
    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],
    56: ["Freezing drizzle", "🌧️"],
    57: ["Freezing drizzle", "🌧️"],
    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],
    66: ["Freezing rain", "🌧️"],
    67: ["Freezing rain", "🌧️"],
    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],
    77: ["Snow grains", "🌨️"],
    80: ["Showers", "🌦️"],
    81: ["Showers", "🌧️"],
    82: ["Heavy showers", "⛈️"],
    85: ["Snow showers", "🌨️"],
    86: ["Snow showers", "❄️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm", "⛈️"],
    99: ["Thunderstorm", "⛈️"],
  };

  function describe(code) {
    const hit = CODES[code];
    return { text: hit ? hit[0] : "", emoji: hit ? hit[1] : "🌡️" };
  }

  function round(n) {
    return n === null || n === undefined || isNaN(n) ? null : Math.round(Number(n));
  }

  /* The best reading we have, normalised so the card never has to care
     which of the two paths it came from. */
  function reading() {
    const src = live || Store.get("weather");
    if (!src || (!src.sensor && !src.current)) return null;

    const sensor = src.sensor || null;
    const current = src.current || null;
    const daily = src.daily || null;

    /* The backyard sensor wins for temperature — it is thirty feet away,
       not at the airport. Everything else fills in around it. */
    const sensorTemp = sensor ? round(sensor.temperature_F) : null;
    const apiTemp = current ? round(current.temperature_2m) : null;
    const code = current ? current.weather_code : null;
    const desc = describe(code);

    const days = [];
    if (daily && Array.isArray(daily.time)) {
      for (let i = 0; i < daily.time.length && i < 7; i++) {
        days.push({
          date: daily.time[i],
          hi: round(daily.temperature_2m_max && daily.temperature_2m_max[i]),
          lo: round(daily.temperature_2m_min && daily.temperature_2m_min[i]),
          rain: round(daily.precipitation_probability_max && daily.precipitation_probability_max[i]),
          code: daily.weather_code ? daily.weather_code[i] : null,
        });
      }
    }

    return {
      temp: sensorTemp !== null ? sensorTemp : apiTemp,
      fromSensor: sensorTemp !== null,
      feels: current ? round(current.apparent_temperature) : null,
      humidity: sensor && sensor.humidity != null ? round(sensor.humidity)
        : current ? round(current.relative_humidity_2m) : null,
      wind: current ? round(current.wind_speed_10m) : null,
      indoor: sensor ? round(sensor.indoor_F) : null,
      rainToday: sensor && sensor.rain_in != null ? Number(sensor.rain_in) : null,
      condition: desc.text || (sensor && sensor.condition) || "",
      emoji: desc.emoji,
      hi: days.length ? days[0].hi : null,
      lo: days.length ? days[0].lo : null,
      days: days,
      fetchedAt: src.fetchedAt || null,
      stale: isStale(src.fetchedAt),
    };
  }

  function isStale(iso) {
    if (!iso) return true;
    const age = Date.now() - new Date(iso).getTime();
    return !(age >= 0) || age > 3 * 3600 * 1000;
  }

  async function refresh() {
    if (Store.mode !== "server") return false;
    try {
      const res = await fetch("/api/hub/weather", { cache: "no-store" });
      if (!res.ok) return false;
      const data = await res.json();
      if (!data || (!data.sensor && !data.current)) return false;
      live = data;
      return true;
    } catch (e) {
      return false;
    } finally {
      tried = true;
    }
  }

  /* --- the card ------------------------------------------------------ */

  function stat(value, label) {
    return UI.h(
      "div",
      { class: "wx-stat" },
      UI.h("div", { class: "wx-stat-val", text: value }),
      UI.h("div", { class: "wx-stat-key", text: label })
    );
  }

  function dayCell(d, i) {
    const date = Fmt.fromDayKey(d.date);
    const desc = describe(d.code);
    return UI.h(
      "div",
      { class: "wx-day" },
      UI.h("div", { class: "wx-day-name", text: i === 0 ? "Today" : Fmt.dayAbbr(Fmt.dayIdx(date)) }),
      UI.h("div", { class: "wx-day-icon", text: desc.emoji }),
      UI.h(
        "div",
        { class: "wx-day-temps" },
        UI.h("span", { class: "wx-hi", text: d.hi === null ? "--" : d.hi + "°" }),
        UI.h("span", { class: "wx-lo", text: d.lo === null ? "--" : d.lo + "°" })
      ),
      d.rain !== null && d.rain >= 30
        ? UI.h("div", { class: "wx-day-rain", text: d.rain + "%" })
        : null
    );
  }

  function card() {
    const w = reading();

    if (!w) {
      /* Only worth saying anything when there is a reason it is missing. */
      if (Store.mode === "server" && !tried) return null;
      if (Store.mode !== "server") {
        return UI.h(
          "div",
          { class: "card card-pad banner-slot" },
          UI.h(
            "div",
            { class: "banner" },
            UI.icon("info"),
            UI.h("span", {
              text:
                "No weather here yet. Open the hub from the house dashboard link " +
                "and it shows the backyard sensor.",
            })
          )
        );
      }
      return null;
    }

    const bits = [];
    /* "Feels like" comes from the forecast service, so it only belongs next
       to that service's own temperature. Beside the backyard sensor it would
       be a different place's number wearing our label. */
    if (!w.fromSensor && w.feels !== null && w.feels !== w.temp) bits.push(stat(w.feels + "°", "Feels like"));
    if (w.humidity !== null) bits.push(stat(w.humidity + "%", "Humidity"));
    if (w.wind !== null) bits.push(stat(w.wind + " mph", "Wind"));
    if (w.indoor !== null) bits.push(stat(w.indoor + "°", "Inside"));
    if (w.rainToday !== null && w.rainToday > 0) bits.push(stat(w.rainToday + '"', "Rain today"));

    const head = UI.h(
      "div",
      { class: "wx-head" },
      UI.h("div", { class: "wx-emoji", text: w.emoji }),
      UI.h(
        "div",
        { class: "wx-main" },
        UI.h(
          "div",
          { class: "wx-temp nums" },
          w.temp === null ? "--" : String(w.temp),
          UI.h("span", { class: "wx-deg", text: "°" })
        ),
        UI.h("div", { class: "wx-cond", text: w.condition }),
        UI.h("div", {
          class: "wx-where",
          text: w.fromSensor ? "Backyard sensor" : "Hudsonville",
        })
      ),
      w.hi !== null
        ? UI.h(
            "div",
            { class: "wx-hilo nums" },
            UI.h("div", { text: "H " + w.hi + "°" }),
            UI.h("div", { class: "muted", text: "L " + (w.lo === null ? "--" : w.lo) + "°" })
          )
        : null
    );

    const kids = [head];
    if (bits.length) kids.push(UI.h("div", { class: "wx-stats" }, bits));
    if (w.days.length > 1)
      kids.push(UI.h("div", { class: "wx-week" }, w.days.slice(0, 7).map(dayCell)));
    if (w.stale && w.fetchedAt)
      kids.push(
        UI.h("div", { class: "wx-stale tiny muted", text: "Last updated " + Fmt.relDay(Fmt.dayKey(new Date(w.fetchedAt))) })
      );

    return UI.h("div", { class: "card wx-card" }, kids);
  }

  return {
    describe: describe,
    reading: reading,
    refresh: refresh,
    card: card,
  };
})();


/* ==== js/10-today.js ========================================================= */
/* ============================================================
   Today — the page Kenzie opens at 7am.
   Pure function of the store: header, sun strip, today's cleaning,
   tonight's dinner, needs attention, good to know.
   Defines exactly one global: Router.on("today", ...).
   ============================================================ */

(function () {
  const ASK_LOADING_KEY = "todayAskLoading";

  const DONE_LINES = [
    "Every box checked. Go put your feet up for a few minutes.",
    "That's the whole list — nicely done.",
    "All done here. The house says thank you.",
    "Kitchen's clean, kids are fed, the day's ahead of you now.",
  ];

  function stableIndex(key, len) {
    let h = 0;
    const s = String(key);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % len;
  }

  /* ---------- header ---------- */

  function renderHeader(now) {
    return UI.h(
      "div",
      { class: "page-head" },
      UI.h("div", { class: "eyebrow", text: Fmt.greeting(now) }),
      UI.h("div", { class: "title", text: Fmt.dayName(Fmt.dayIdx(now)) }),
      UI.h("div", {
        class: "sub",
        text: Fmt.date(now, { month: "long", day: "numeric", year: "numeric" }),
      })
    );
  }

  /* ---------- sun strip ---------- */

  function sunCell(val, key) {
    return UI.h(
      "div",
      { class: "cell" },
      UI.h("div", { class: "val", text: val }),
      UI.h("div", { class: "key", text: key })
    );
  }

  function renderSunStrip(now) {
    let sun;
    try {
      sun = Almanac.sunTimes(now);
    } catch (e) {
      sun = null;
    }
    let moon;
    try {
      moon = Almanac.moonPhase(now);
    } catch (e) {
      moon = null;
    }

    const cells = [];
    if (sun) {
      cells.push(sunCell(Fmt.time(sun.sunrise), "Sunrise"));
      cells.push(sunCell(Fmt.time(sun.sunset), "Sunset"));
      cells.push(sunCell(sun.dayLength, "Daylight"));
    }
    if (moon) {
      cells.push(sunCell(moon.emoji + " " + moon.name, "Moon"));
    }
    if (!cells.length) return null;
    return UI.h("div", { class: "sunstrip" }, cells);
  }

  /* ---------- today's cleaning ---------- */

  function checkRow(task) {
    return UI.h(
      "button",
      {
        class: "check",
        type: "button",
        "aria-pressed": task.done ? "true" : "false",
        on: {
          click: function () {
            House.toggleTask(new Date(), task.id);
          },
        },
      },
      UI.h("span", { class: "box" }, UI.icon("check")),
      UI.h("div", { class: "check-main" }, UI.h("div", { class: "check-text", text: task.text })),
      UI.h("span", { class: "check-min", text: Fmt.minutes(task.min) })
    );
  }

  function renderCleaningCard(now) {
    const tasks = House.todayTasks() || [];
    const body = [];

    if (!tasks.length) {
      body.push(
        UI.empty(
          "broom",
          "No cleaning tasks are set up for today.",
          UI.h(
            "button",
            {
              class: "btn btn-primary",
              type: "button",
              on: {
                click: function () {
                  Router.go("house");
                },
              },
            },
            "Set up the routine"
          )
        )
      );
    } else {
      const doneCount = tasks.filter(function (t) {
        return !!t.done;
      }).length;
      const totalMin = tasks.reduce(function (sum, t) {
        return sum + (Number(t.min) || 0);
      }, 0);

      body.push(
        UI.h(
          "div",
          { class: "zone-head" },
          UI.h(
            "div",
            {},
            UI.h("div", { class: "zone-name", text: House.zoneName(Fmt.dayIdx(now)) }),
            UI.h("div", { class: "zone-sub", text: Fmt.minutes(totalMin) + " total" })
          )
        )
      );
      body.push(UI.h("div", { class: "zone-meter" }, UI.meter(doneCount, tasks.length)));
      body.push(
        UI.h(
          "div",
          { class: "rows" },
          tasks.map(function (t) {
            return checkRow(t);
          })
        )
      );

      if (tasks.length && doneCount === tasks.length) {
        body.push(
          UI.h(
            "div",
            { class: "done-note" },
            UI.icon("check"),
            UI.h("span", { text: DONE_LINES[stableIndex(Fmt.dayKey(now), DONE_LINES.length)] })
          )
        );
      }
    }

    return UI.h("div", { class: "card" }, body);
  }

  /* ---------- tonight's dinner ---------- */

  function renderDinnerSection(now) {
    let slot = null;
    try {
      slot = Plan.slotFor(now);
    } catch (e) {
      slot = null;
    }
    let desc = null;
    try {
      desc = Plan.describe(slot);
    } catch (e) {
      desc = null;
    }
    desc = desc || {};

    const name = desc.name || "Nothing planned yet";
    const sub = desc.name ? desc.sub || "" : "Tap to pick something for tonight";
    const glyph = desc.emoji || "\u{1F372}"; // pot of food, fallback

    const dinnerBtn = UI.h(
      "button",
      {
        class: "dinner",
        type: "button",
        on: {
          click: function () {
            if (slot && slot.kind === "recipe" && slot.recipeId) {
              Recipes.openSheet(slot.recipeId);
            } else {
              Plan.openPicker(now);
            }
          },
        },
      },
      UI.h("div", { class: "glyph", text: glyph }),
      UI.h(
        "div",
        { class: "dinner-main" },
        UI.h("div", { class: "dinner-name", text: name }),
        sub ? UI.h("div", { class: "dinner-sub", text: sub }) : null
      )
    );

    return UI.section("Tonight's dinner", null, UI.h("div", { class: "card" }, dinnerBtn));
  }

  /* ---------- needs attention ---------- */

  function attentionRow(item) {
    const tone = item.tone || "someday";
    return UI.h(
      "button",
      {
        class: "row",
        type: "button",
        on: {
          click: function () {
            if (item.kind === "job") House.openJobs();
            else Router.go("house");
          },
        },
      },
      UI.h("span", { class: "pri-stripe pri-" + tone }),
      UI.h(
        "div",
        { class: "row-main" },
        UI.h("div", { class: "row-title", text: item.title }),
        item.sub ? UI.h("div", { class: "row-sub", text: item.sub }) : null
      ),
      UI.h("span", { class: "row-end" }, UI.icon("chevron", 18))
    );
  }

  function renderAttentionSection(now) {
    let items = [];
    try {
      items = House.attention(now) || [];
    } catch (e) {
      items = [];
    }
    items = items.slice(0, 4);
    if (!items.length) return null;

    return UI.section(
      "Needs attention",
      null,
      UI.h(
        "div",
        { class: "card" },
        UI.h(
          "div",
          { class: "rows" },
          items.map(function (it) {
            return attentionRow(it);
          })
        )
      )
    );
  }

  /* ---------- good to know ---------- */

  function staticRow(iconName, colorVar, text) {
    return UI.h(
      "div",
      { class: "row row-static" },
      UI.h(
        "span",
        {
          style: {
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            width: "22px",
            height: "22px",
            flexShrink: "0",
            color: "var(--" + colorVar + ")",
          },
        },
        UI.icon(iconName, 18)
      ),
      UI.h("div", { class: "row-main" }, UI.h("div", { class: "row-title", text: text }))
    );
  }

  function buildAskPrompt(now, zoneName, tasks, dinnerLine, jobLines, season, inSeasonNames) {
    return (
      "Today is " +
      Fmt.date(now) +
      " in Hudsonville, Michigan. It's " +
      season +
      ". In season: " +
      (inSeasonNames.length ? inSeasonNames.join(", ") : "nothing notable") +
      ". Today's cleaning zone is \"" +
      zoneName +
      "\" (" +
      tasks.length +
      " tasks). Tonight's dinner: " +
      dinnerLine +
      ". Most pressing jobs: " +
      (jobLines.length ? jobLines.join("; ") : "none pending") +
      ". Give 2-3 short, concrete suggestions for what today specifically needs. " +
      "Under 60 words total. No preamble, no markdown."
    );
  }

  function renderAskBlock(now) {
    if (!Ask.available()) return null;

    const dayKey = Fmt.dayKey(now);
    const daily = Store.get("daily") || {};
    const existing = daily[dayKey] && daily[dayKey].tip;

    function askClaude() {
      UI.state[ASK_LOADING_KEY] = true;
      Router.refresh();

      let zoneName = "";
      let tasks = [];
      try {
        tasks = House.todayTasks() || [];
        zoneName = House.zoneName(Fmt.dayIdx(now));
      } catch (e) {
        tasks = [];
      }

      let dinnerLine = "nothing planned";
      try {
        const slot = Plan.slotFor(now);
        const desc = Plan.describe(slot) || {};
        if (desc.name) dinnerLine = desc.name;
      } catch (e) {
        /* leave default */
      }

      let jobLines = [];
      try {
        jobLines = (House.attention(now) || [])
          .filter(function (a) {
            return a.kind === "job";
          })
          .slice(0, 2)
          .map(function (a) {
            return a.title;
          });
      } catch (e) {
        jobLines = [];
      }

      let season = "";
      let inSeasonNames = [];
      try {
        season = Almanac.season(now);
        inSeasonNames = (Almanac.inSeason(now) || []).map(function (i) {
          return i.name;
        });
      } catch (e) {
        /* leave defaults */
      }

      const prompt = buildAskPrompt(now, zoneName, tasks, dinnerLine, jobLines, season, inSeasonNames);

      Ask.text(prompt, {})
        .then(function (text) {
          UI.state[ASK_LOADING_KEY] = false;
          const patch = {};
          patch[dayKey] = { tip: text };
          Store.mergeDoc("daily", patch);
        })
        .catch(function (err) {
          UI.state[ASK_LOADING_KEY] = false;
          UI.toast(Ask.message(err));
          Router.refresh();
        });
    }

    if (existing) {
      return UI.h(
        "div",
        { class: "tipcard" },
        UI.h("div", { class: "eyebrow", text: "From Claude" }),
        UI.h("div", { class: "tip-text", text: existing }),
        UI.h(
          "button",
          {
            class: "btn btn-sm",
            type: "button",
            on: { click: askClaude },
          },
          "Ask again"
        )
      );
    }

    if (UI.state[ASK_LOADING_KEY]) {
      return UI.h(
        "div",
        { class: "thinking" },
        UI.h("div", { class: "spinner" }),
        UI.h("span", { text: "Thinking about today…" })
      );
    }

    return UI.h(
      "button",
      {
        class: "btn btn-block",
        type: "button",
        on: { click: askClaude },
      },
      "Ask Claude what today needs"
    );
  }

  function renderGoodToKnowSection(now) {
    const body = [];

    let inSeason = [];
    try {
      inSeason = (Almanac.inSeason(now) || []).slice(0, 4);
    } catch (e) {
      inSeason = [];
    }
    if (inSeason.length) {
      body.push(
        UI.h("div", { class: "eyebrow", style: { padding: "14px 16px 0" }, text: "In season in Michigan" })
      );
      body.push(
        UI.h(
          "div",
          { class: "produce" },
          inSeason.map(function (item) {
            return UI.h(
              "div",
              { class: "produce-item" },
              UI.h("span", { class: "p-emoji", text: item.emoji }),
              UI.h(
                "div",
                {},
                UI.h("div", { class: "p-name", text: item.name }),
                UI.h("div", { class: "p-note", text: item.note })
              )
            );
          })
        )
      );
    }

    let birthday = null;
    try {
      birthday = Almanac.nextBirthday(now);
    } catch (e) {
      birthday = null;
    }
    if (birthday && typeof birthday.daysAway === "number" && birthday.daysAway <= 45) {
      const tail = birthday.daysAway === 0 ? "today!" : "in " + birthday.daysAway + " days";
      body.push(staticRow("gift", "amber", birthday.name + " turns " + birthday.turning + " " + tail));
    }

    const config = Store.get("config") || {};
    if (typeof config.trashDay === "number") {
      const dow = now.getDay();
      const tomorrow = (dow + 1) % 7;
      if (dow === config.trashDay || tomorrow === config.trashDay) {
        body.push(staticRow("trash", "delft", "Trash goes out tonight"));
      }
    }

    let tip = null;
    try {
      tip = Almanac.tip(now);
    } catch (e) {
      tip = null;
    }
    if (tip) {
      body.push(
        UI.h(
          "div",
          { class: "tipcard" },
          UI.h("div", { class: "eyebrow", text: tip.tag }),
          UI.h("div", { class: "tip-text", text: tip.text })
        )
      );
    }

    const askBlock = renderAskBlock(now);
    if (askBlock) body.push(askBlock);

    if (!body.length) return null;

    return UI.section("Good to know", null, UI.h("div", { class: "card" }, body));
  }

  /* ---------- render ---------- */

  function renderToday(root) {
    const now = new Date();

    root.appendChild(renderHeader(now));

    /* The backyard temperature, when this copy of the page can reach it. */
    const wx = Weather.card();
    if (wx) root.appendChild(wx);

    const strip = renderSunStrip(now);
    if (strip) root.appendChild(strip);

    const left = UI.h("div", {}, renderCleaningCard(now), renderDinnerSection(now));
    const right = UI.h("div", {}, renderAttentionSection(now), renderGoodToKnowSection(now));

    root.appendChild(UI.h("div", { class: "two-col" }, left, right));
  }

  Router.on("today", renderToday);
})();


/* ==== js/20-meals.js ========================================================= */
/* ============================================================
   Meals — the week's dinners + the grocery list.
   Plain DOM, zero dependencies. Defines exactly three globals:
   the Router.on("meals", …) registration, Plan, and Grocery.
   Everything else lives inside this IIFE so it can never collide
   with a helper of the same name in another view module.
   ============================================================ */

(function () {
  /* ---------- grocery aisle categorization ---------- */

  const CAT_ORDER = ["Produce", "Meat", "Dairy", "Bakery", "Frozen", "Pantry", "Other"];

  /* The things the family buys every week no matter what is for dinner.
     These are the DEFAULT; once anyone edits them, the edited list lives in
     the config doc and syncs to every device. */
  const SEED_STAPLES = [
    { item: "Whole milk", qty: "3 gallons", store: "Meijer" },
    { item: "Greek yogurt", qty: "5 tubs", store: "Meijer" },
  ];

  const Staples = {
    list: function () {
      const s = (Store.get("config") || {}).staples;
      return Array.isArray(s) ? s : SEED_STAPLES.map(function (x) { return Object.assign({}, x); });
    },
    save: function (next) {
      Store.mergeDoc("config", { staples: next });
    },
  };

  /* The stuff Kenzie keeps on hand — spices, oils, baking basics. Anything
     on this list is assumed already in the cupboard and is kept OFF the
     grocery list when it builds, so the list stays to fresh things to buy.
     If she runs out of one she just adds it back by hand. */
  const SEED_PANTRY = [
    "Salt", "Black pepper", "Olive oil", "Vegetable oil", "Cooking oil",
    "Flour", "Sugar", "Brown sugar", "Baking powder", "Baking soda",
    "Vanilla", "Cornstarch", "Rice", "Paprika", "Smoked paprika", "Cumin",
    "Chili powder", "Oregano", "Basil", "Thyme", "Rosemary", "Cinnamon",
    "Garlic powder", "Onion powder", "Italian seasoning", "Red pepper flakes",
    "Bay leaves", "Soy sauce", "Vinegar", "Honey", "Ketchup", "Mustard",
    "Mayo", "Worcestershire sauce", "Hot sauce", "Cooking spray",
  ];

  /* Put every weekly staple onto the grocery list now, skipping any already
     there. Staples are always-wanted, so they bypass the pantry filter.
     Returns how many were newly added. */
  function putStaplesOnList() {
    const have = {};
    Store.list("grocery").forEach(function (it) {
      have[(it.name || "").trim().toLowerCase()] = true;
    });
    let added = 0;
    Staples.list().forEach(function (s) {
      if (!s || !s.item) return;
      const key = s.item.trim().toLowerCase();
      if (have[key]) return;
      Store.put("grocery", null, {
        name: s.item.trim(),
        qty: s.qty || "",
        cat: s.cat || categorize(s.item),
        store: normStore(s.store) || "",
        done: false,
        src: "Weekly staples",
        at: new Date().toISOString(),
      });
      have[key] = true;
      added++;
    });
    return added;
  }

  const Pantry = {
    list: function () {
      const p = (Store.get("config") || {}).pantry;
      return Array.isArray(p) ? p : SEED_PANTRY.slice();
    },
    save: function (next) {
      Store.mergeDoc("config", { pantry: next });
    },
  };

  /* True when an ingredient is something she already keeps. Matches a pantry
     entry only when it appears as whole words INSIDE the item — so "paprika"
     catches "smoked paprika", but "black pepper" never catches "bell pepper"
     and "garlic powder" never catches fresh "garlic". */
  function inPantry(name) {
    const item = String(name || "").toLowerCase().trim();
    if (!item) return false;
    return Pantry.list().some(function (p) {
      const term = String(p || "").toLowerCase().trim();
      if (!term) return false;
      const re = new RegExp("\\b" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b");
      return re.test(item);
    });
  }

  /* Keyword table, cheapest-and-most-specific-first so a jarred sauce
     doesn't get mistaken for the vegetable in its name ("canned diced
     tomatoes" should land in Pantry, not Produce). Doesn't have to be
     perfect — just right most of the time. */
  function categorize(name) {
    const n = (name || "").toLowerCase();

    if (n.indexOf("frozen") >= 0) return "Frozen";

    const pantry = [
      "canned", "jar", "sauce", "salsa", "pesto", "marinara", "bbq",
      "ketchup", "mustard", "broth", "miso", "stock", "yeast", "cornstarch",
      "baking", "spice", "seasoning", "oil", "vinegar", "syrup", "pasta",
      "noodle", "rice", "flour", "sugar", "cracker", "cereal", "bean",
      "chip", "nut",
    ];
    for (let i = 0; i < pantry.length; i++) {
      if (n.indexOf(pantry[i]) >= 0) return "Pantry";
    }

    const meat = [
      "chicken", "beef", "steak", "pork", "sausage", "bacon", "turkey",
      "ham", "rib", "shrimp", "salmon", "fish", "cod", "tilapia", "meat",
      "roast",
    ];
    for (let i = 0; i < meat.length; i++) {
      if (n.indexOf(meat[i]) >= 0) return "Meat";
    }

    const dairy = [
      "milk", "cheese", "yogurt", "cream", "butter", "egg", "mozzarella",
      "parmesan", "ricotta", "cheddar", "feta", "cotija",
    ];
    for (let i = 0; i < dairy.length; i++) {
      if (n.indexOf(dairy[i]) >= 0) return "Dairy";
    }

    const bakery = ["bread", "bun", "bagel", "tortilla", "roll", "dough", "pastry"];
    for (let i = 0; i < bakery.length; i++) {
      if (n.indexOf(bakery[i]) >= 0) return "Bakery";
    }

    const produce = [
      "lettuce", "tomato", "onion", "garlic", "pepper", "broccoli", "potato",
      "carrot", "celery", "spinach", "zucchini", "corn", "avocado", "lime",
      "lemon", "cilantro", "basil", "mushroom", "cabbage", "asparagus",
      "ginger", "cucumber", "kale", "apple", "banana", "thyme", "rosemary",
      "parsley", "dill", "mint",
    ];
    for (let i = 0; i < produce.length; i++) {
      if (n.indexOf(produce[i]) >= 0) return "Produce";
    }

    return "Other";
  }

  /* ---------- Plan ---------- */

  /* Every field spelled out, even when empty. The store merges recursively,
     so a partial slot would leave the previous dinner's recipeId sitting
     underneath a slot that is now "eating out". */
  function fullSlot(slot) {
    if (slot === null || slot === undefined) return null;
    return {
      kind: slot.kind || "text",
      recipeId: slot.recipeId || "",
      title: slot.title || "",
      note: slot.note || "",
    };
  }

  function describeSlot(slot) {
    if (!slot) return { emoji: "", name: "", sub: "" };
    if (slot.kind === "recipe") {
      const r = Recipes.byId(slot.recipeId);
      if (!r) return { emoji: "🍽️", name: "Recipe was deleted", sub: "Tap to pick something else" };
      return {
        emoji: r.emoji || "🍽️",
        name: r.name,
        sub: [r.time, r.source].filter(Boolean).join(" · "),
      };
    }
    if (slot.kind === "text") return { emoji: "🍲", name: slot.title || "", sub: "" };
    if (slot.kind === "out") return { emoji: "🍴", name: "Eating out", sub: slot.note || "" };
    if (slot.kind === "leftovers") return { emoji: "🥡", name: "Leftovers", sub: "" };
    return { emoji: "", name: "", sub: "" };
  }

  const Plan = {
    week: function (date) {
      date = date || new Date();
      const plan = Store.get("plan");
      return plan[Fmt.weekKey(date)] || {};
    },

    slotFor: function (date) {
      date = date || new Date();
      const week = Plan.week(date);
      return week[DAY_KEYS[Fmt.dayIdx(date)]] || null;
    },

    /* Every field is written explicitly, even when empty. The store merges
       recursively, so a partial slot would leave the previous dinner's
       recipeId sitting underneath a slot that is now "eating out". */
    setSlot: function (date, slot) {
      date = date || new Date();
      const wk = Fmt.weekKey(date);
      const dayKey = DAY_KEYS[Fmt.dayIdx(date)];
      const full = fullSlot(slot);
      const patch = {};
      patch[wk] = {};
      patch[wk][dayKey] = full;
      Store.mergeDoc("plan", patch);
    },

    clearSlot: function (date) {
      Plan.setSlot(date, null);
    },

    describe: describeSlot,

    openPicker: function (date) {
      date = date || new Date();
      const title = Fmt.dayName(Fmt.dayIdx(date)) + " · " + Fmt.shortDate(date);

      const searchInput = UI.h("input", {
        class: "input",
        type: "text",
        placeholder: "Search recipes, source or tag",
        data: { keep: "plan-search" },
      });

      const resultsHost = UI.h("div", { class: "stack" });

      function finish(slot, msg) {
        Plan.setSlot(date, slot);
        s.close();
        UI.toast(msg);
      }

      function rowFor(r) {
        return UI.h(
          "button",
          { class: "row", type: "button", on: { click: function () { finish({ kind: "recipe", recipeId: r.id }, "Planned"); } } },
          UI.h("span", { class: "slot-emoji", text: r.emoji || "🍽️" }),
          UI.h(
            "span",
            { class: "row-main" },
            UI.h("span", { class: "row-title", text: r.name }),
            UI.h("span", { class: "row-sub", text: r.time || "" })
          )
        );
      }

      function matches(r, q) {
        if (!q) return true;
        const hay = (
          (r.name || "") + " " + (r.source || "") + " " + (r.tags || []).join(" ")
        ).toLowerCase();
        return hay.indexOf(q) >= 0;
      }

      function renderResults() {
        const q = searchInput.value.trim().toLowerCase();
        resultsHost.textContent = "";

        const suggested = (typeof Recipes !== "undefined" && Recipes.suggest(date, 6)) || [];
        resultsHost.appendChild(
          UI.section(
            "Suggested",
            null,
            suggested.length
              ? UI.h("div", { class: "card" }, UI.h("div", { class: "rows" }, suggested.map(rowFor)))
              : UI.h("p", { class: "muted tiny", text: "Nothing suggested yet — add a few recipes to the box." })
          )
        );

        const all = ((typeof Recipes !== "undefined" && Recipes.all()) || []).filter(function (r) {
          return matches(r, q);
        });
        resultsHost.appendChild(
          UI.section(
            q ? "Results" : "All recipes",
            null,
            all.length
              ? UI.h("div", { class: "card" }, UI.h("div", { class: "rows" }, all.map(rowFor)))
              : UI.h("p", { class: "muted tiny", text: "No recipes match that search." })
          )
        );
      }

      searchInput.addEventListener("input", renderResults);

      function showTypeForm() {
        const titleInput = UI.h("input", {
          class: "input",
          type: "text",
          placeholder: "What's for dinner?",
          data: { keep: "plan-type-title" },
        });
        function save() {
          const t = titleInput.value.trim();
          if (!t) return;
          finish({ kind: "text", title: t }, "Planned");
        }
        titleInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); save(); }
        });
        s.setBody(
          UI.h(
            "div",
            { class: "stack" },
            UI.h("div", { class: "field" }, UI.h("label", { text: "Tonight's dinner" }), titleInput),
            UI.h(
              "div",
              { class: "btn-row" },
              UI.h("button", { class: "btn", type: "button", on: { click: function () { s.setBody(body); } } }, "Back"),
              UI.h("button", { class: "btn btn-primary", type: "button", on: { click: save } }, "Save")
            )
          )
        );
        titleInput.focus();
      }

      const quickRow = UI.h(
        "div",
        { class: "inline" },
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish({ kind: "out" }, "Planned"); } } }, "Eating out"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish({ kind: "leftovers" }, "Planned"); } } }, "Leftovers"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: showTypeForm } }, "Type it in")
      );

      /* When the day already has something on it, say so and offer to take
         it off — otherwise the only way to clear a dinner is a small button
         that looks like the three next to it. */
      const current = Plan.slotFor(date);
      let currentRow = null;
      if (current) {
        const d = describeSlot(current);
        currentRow = UI.h(
          "div",
          { class: "planned-now" },
          UI.h("span", { class: "pn-emoji", text: d.emoji || "🍽️" }),
          UI.h(
            "span",
            { class: "pn-main" },
            UI.h("span", { class: "pn-name", text: d.name || "Planned" }),
            UI.h("span", { class: "pn-sub", text: "Pick something else below, or take it off." })
          ),
          UI.h(
            "button",
            {
              class: "btn btn-sm btn-danger",
              type: "button",
              on: { click: function () { finish(null, "Cleared " + Fmt.dayName(Fmt.dayIdx(date))); } },
            },
            "Remove"
          )
        );
      }

      const body = UI.h("div", { class: "stack" }, currentRow, searchInput, quickRow, resultsHost);
      var s = UI.sheet({ title: title, body: body });
      renderResults();
    },

    fillWeek: function (date) {
      date = date || new Date();
      const monday = Fmt.weekStart(date);
      const wk = Fmt.weekKey(date);
      const week = Plan.week(date);

      const used = {};
      DAY_KEYS.forEach(function (k) {
        const slot = week[k];
        if (slot && slot.kind === "recipe" && slot.recipeId) used[slot.recipeId] = true;
      });

      function dateForIdx(i) {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);
        return d;
      }

      function firstUnused(d) {
        const list = (typeof Recipes !== "undefined" && Recipes.suggest(d, 20)) || [];
        for (let i = 0; i < list.length; i++) {
          if (!used[list[i].id]) return list[i];
        }
        return null;
      }

      const patch = {};

      /* Saturday is pizza night, first choice a recipe actually named pizza. */
      const SAT = DAY_KEYS[5];
      if (!week[SAT]) {
        const all = (typeof Recipes !== "undefined" && Recipes.all()) || [];
        let pizza = all.find(function (r) { return r.name && r.name.toLowerCase().indexOf("pizza") >= 0; });
        if (pizza && used[pizza.id]) pizza = null;
        const pick = pizza || firstUnused(dateForIdx(5));
        if (pick) {
          patch[SAT] = fullSlot({ kind: "recipe", recipeId: pick.id });
          used[pick.id] = true;
        }
      }

      /* Mon(0), Tue(1), Thu(3), Sun(6) — Wed(2) and Fri(4) stay open on
         purpose, to keep the week to the family's target of five dinners. */
      [0, 1, 3, 6].forEach(function (i) {
        const key = DAY_KEYS[i];
        if (week[key]) return;
        const pick = firstUnused(dateForIdx(i));
        if (!pick) return;
        patch[key] = fullSlot({ kind: "recipe", recipeId: pick.id });
        used[pick.id] = true;
      });

      if (Object.keys(patch).length) {
        const doc = {};
        doc[wk] = patch;
        Store.mergeDoc("plan", doc);
      }

      const finalWeek = deepMerge(week, patch);
      let dinners = 0;
      DAY_KEYS.forEach(function (k) {
        const slot = finalWeek[k];
        if (slot && (slot.kind === "recipe" || slot.kind === "text")) dinners++;
      });
      const open = [];
      if (!finalWeek.wed) open.push("Wednesday");
      if (!finalWeek.fri) open.push("Friday");
      let msg = "Planned " + dinners + (dinners === 1 ? " dinner." : " dinners.");
      if (open.length) msg += " " + open.join(" and ") + " " + (open.length === 1 ? "is" : "are") + " open.";
      UI.toast(msg);
    },
  };

  /* ---------- Prices, stores, the cart order ---------- */

  /* Meijer vs ALDI prices from the nightly sweep. Fetched once a session in
     server mode; absent everywhere else, and the list simply shows no prices. */
  const Prices = (function () {
    let map = {};
    let tried = false;
    async function load() {
      if (tried || Store.mode !== "server") return;
      tried = true;
      try {
        const res = await fetch("/api/prices", { cache: "no-store" });
        const d = await res.json();
        map = d && typeof d === "object" ? (d.prices || d) : {};
        Router.refresh();
      } catch (e) {
        /* no prices this session */
      }
    }
    /* "Whole milk (3 gallons)" should find the "whole milk" entry. */
    function forItem(name) {
      const t = String(name || "").toLowerCase().replace(/\(.*?\)/g, " ").replace(/\s+/g, " ").trim();
      if (!t) return null;
      if (map[t]) return map[t];
      let best = null, bestLen = 0;
      Object.keys(map).forEach(function (k) {
        if ((t.indexOf(k) >= 0 || k.indexOf(t) >= 0) && k.length > bestLen) { best = map[k]; bestLen = k.length; }
      });
      return best;
    }
    function any() { return Object.keys(map).length > 0; }
    return { load: load, forItem: forItem, any: any };
  })();

  const DEAL_LINKS = [
    { name: "Meijer weekly ad", url: "https://www.meijer.com/shopping/weekly-ad.html" },
    { name: "mPerks coupons", url: "https://www.meijer.com/shopping/mperks.html" },
    { name: "ALDI weekly ad", url: "https://www.aldi.us/weekly-specials/our-weekly-ads/" },
  ];

  function normStore(s) {
    const v = String(s || "").toLowerCase();
    if (v.indexOf("aldi") >= 0) return "Aldi";
    if (v.indexOf("meijer") >= 0) return "Meijer";
    return "";
  }

  /* Which store an item goes to, the same rule the wall used: the family's
     own choice for that item, else the cheaper store when both prices are
     known, else what the recipe said, else Meijer. */
  function storeFor(it) {
    if (it.pref) return normStore(it.pref) || "Meijer";
    const p = Prices.forItem(it.name);
    if (p && typeof p.meijer === "number" && typeof p.aldi === "number") return p.aldi < p.meijer ? "Aldi" : "Meijer";
    return normStore(it.store) || "Meijer";
  }

  function money(n) {
    return "$" + (Math.round(n * 100) / 100).toFixed(2);
  }

  function cartItems() {
    return Store.list("grocery").filter(function (it) { return !it.done && !it.skip; });
  }

  const Cart = {
    request: function () {
      const items = cartItems();
      if (!items.length) {
        UI.toast("Nothing to order yet. Build the list first.");
        return;
      }
      const week = Plan.week(new Date());
      const dinners = DAY_KEYS.map(function (k) { return week[k] ? Plan.describe(week[k]).name : ""; }).filter(Boolean);
      Store.setDoc("cart", {
        status: "pending",
        requestedAt: new Date().toISOString(),
        week: Fmt.weekKey(new Date()),
        items: items.map(function (it) { return { name: it.name, qty: it.qty || "", store: storeFor(it), pref: it.prefText || "" }; }),
        dinners: dinners,
        summary: "",
        links: {},
      });
      UI.toast("Cart order sent. Chad's PC starts on it at 7:12 or 5:12.");
    },
    clear: function () {
      Store.setDoc("cart", {});
    },
  };

  function cartStatusCard() {
    const c = Store.get("cart") || {};
    if (!c.status) return null;
    const lines = {
      pending: ["Cart order waiting", "Chad's PC picks it up at 7:12am and 5:12pm and fills the Meijer and ALDI carts."],
      building: ["Filling the carts now", "Meijer first, then ALDI. A few minutes."],
      done: ["Carts are ready", c.summary || "Open them below and check out when you're ready."],
      error: ["The cart build hit a snag", c.summary || "It will try again next time, or ask Chad."],
    };
    const l = lines[c.status] || [c.status, ""];
    const kids = [
      UI.h("div", { class: "cs-line" }, c.status === "building" ? UI.h("span", { class: "spinner" }) : null, UI.h("span", { text: l[0] })),
      l[1] ? UI.h("div", { class: "cs-sub", text: l[1] }) : null,
    ];
    if (c.status === "done" && c.links && (c.links.meijer || c.links.aldi)) {
      kids.push(
        UI.h(
          "div",
          { class: "cart-links" },
          c.links.meijer ? UI.h("a", { class: "btn btn-primary", href: c.links.meijer, target: "_blank", rel: "noopener noreferrer" }, "Open Meijer cart") : null,
          c.links.aldi ? UI.h("a", { class: "btn", href: c.links.aldi, target: "_blank", rel: "noopener noreferrer" }, "Open ALDI cart") : null
        )
      );
    }
    kids.push(
      UI.h(
        "button",
        { class: "btn btn-sm", type: "button", on: { click: function () { Cart.clear(); UI.toast("Cleared the cart order."); } } },
        c.status === "done" || c.status === "error" ? "Dismiss" : "Cancel the order"
      )
    );
    return UI.h("div", { class: "cart-status", "data-state": c.status }, kids);
  }

  /* ---------- Grocery ---------- */

  const Grocery = {
    addItem: function (name, opts) {
      const o = opts || {};
      const trimmed = (name || "").trim();
      if (!trimmed) return;
      const existing = Store.list("grocery").find(function (it) {
        return it.name && it.name.trim().toLowerCase() === trimmed.toLowerCase() && !it.done;
      });
      if (existing) {
        UI.toast(trimmed + " is already on the list");
        return;
      }
      Store.put("grocery", null, {
        name: trimmed,
        qty: o.qty || "",
        cat: o.cat || categorize(trimmed),
        store: o.store || "",
        done: false,
        src: o.src || "added",
        at: new Date().toISOString(),
      });
      UI.toast("Added " + trimmed);
    },

    buildFromWeek: function (date) {
      date = date || new Date();
      const week = Plan.week(date);
      const wanted = {};

      function addWanted(item, qty, store, cat, srcLabel) {
        const key = (item || "").trim().toLowerCase();
        if (!key) return;
        const cur = wanted[key];
        if (!cur) {
          wanted[key] = {
            name: (item || "").trim(),
            qty: qty || "",
            store: store || "",
            cat: cat,
            srcs: srcLabel ? [srcLabel] : [],
          };
          return;
        }
        if (qty && cur.qty && qty !== cur.qty) cur.qty = cur.qty + " + " + qty;
        else if (qty && !cur.qty) cur.qty = qty;
        if (!cur.store && store) cur.store = store;
        if (srcLabel && cur.srcs.indexOf(srcLabel) === -1) cur.srcs.push(srcLabel);
      }

      DAY_KEYS.forEach(function (k) {
        const slot = week[k];
        if (!slot || slot.kind !== "recipe" || !slot.recipeId) return;
        const recipe = (typeof Recipes !== "undefined" && Recipes.byId(slot.recipeId)) || null;
        if (!recipe) return;
        (recipe.ingredients || []).forEach(function (ing) {
          if (!ing || ing.pantry) return;
          addWanted(ing.item, ing.qty, ing.store, categorize(ing.item), recipe.name);
        });
      });

      /* Drop the things she keeps on hand (spices, oils, baking) before the
         staples go on — a staple is something she always wants bought, so it
         is never pantry-filtered. */
      Object.keys(wanted).forEach(function (key) {
        if (inPantry(wanted[key].name)) delete wanted[key];
      });

      Staples.list().forEach(function (s) {
        if (!s || !s.item) return;
        addWanted(s.item, s.qty, s.store, s.cat || categorize(s.item), "Weekly staples");
      });

      const existing = Store.list("grocery");
      const byKey = {};
      existing.forEach(function (it) {
        const key = (it.name || "").trim().toLowerCase();
        if (!byKey[key]) byKey[key] = it;
      });

      let added = 0, updated = 0, removed = 0;

      Object.keys(wanted).forEach(function (key) {
        const w = wanted[key];
        const src = w.srcs.join(" + ");
        const cur = byKey[key];
        if (!cur) {
          Store.put("grocery", null, {
            name: w.name,
            qty: w.qty,
            cat: w.cat,
            store: w.store,
            done: false,
            src: src,
            at: new Date().toISOString(),
          });
          added++;
          return;
        }
        if (cur.src === "added") return; // hand-added items are never rewritten
        const patch = {};
        if (cur.qty !== w.qty) patch.qty = w.qty;
        if (cur.store !== w.store) patch.store = w.store;
        if (cur.cat !== w.cat) patch.cat = w.cat;
        if (cur.src !== src) patch.src = src;
        if (Object.keys(patch).length) {
          Store.patch("grocery", cur.id, patch);
          updated++;
        }
      });

      existing.forEach(function (it) {
        if (it.src === "added") return;
        const key = (it.name || "").trim().toLowerCase();
        if (!wanted[key]) {
          Store.remove("grocery", it.id);
          removed++;
        }
      });

      const bits = [];
      if (added) bits.push(added + " added");
      if (updated) bits.push(updated + " updated");
      if (removed) bits.push(removed + " removed");
      UI.toast(bits.length ? "Grocery list: " + bits.join(", ") + "." : "Grocery list is already up to date.");
    },
  };

  /* ---------- screen: This week ---------- */

  function weekRangeLabel(monday) {
    const end = new Date(monday);
    end.setDate(end.getDate() + 6);
    const startMonth = monday.toLocaleDateString(undefined, { month: "short" });
    const endMonth = end.toLocaleDateString(undefined, { month: "short" });
    if (startMonth === endMonth) return startMonth + " " + monday.getDate() + " – " + end.getDate();
    return startMonth + " " + monday.getDate() + " – " + endMonth + " " + end.getDate();
  }

  function dayRow(d) {
    const i = Fmt.dayIdx(d);
    const isToday = Fmt.dayKey(d) === Fmt.dayKey(new Date());
    const info = describeSlot(Plan.slotFor(d));
    return UI.h(
      "button",
      {
        class: "dayrow",
        type: "button",
        data: isToday ? { today: "true" } : {},
        on: { click: function () { Plan.openPicker(d); } },
      },
      UI.h(
        "span",
        { class: "daytag" },

        UI.h("span", { class: "daynum", text: String(d.getDate()) })
      ),
      UI.h("span", { class: "slot-emoji", text: info.emoji }),
      UI.h(
        "span",
        { class: "slot" },
        info.name
          ? UI.h("span", { class: "slot-name", text: info.name })

      )

  function weekNav(monday, offset) {
    const label =
      offset === 0 ? "This week" : offset === 1 ? "Next week" : offset === -1 ? "Last week" : weekRangeLabel(monday);
    return UI.h(
      "div",
      { class: "spread" },

        {
          class: "ibtn",
          type: "button",
          "aria-label": "Previous week",

      UI.h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Next week",
          on: { click: function () { UI.state.weekOffset = offset + 1; Router.refresh(); } },
        },
        UI.icon("chevron")
      )
