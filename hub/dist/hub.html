<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Solanyk House</title>
<meta name="theme-color" content="#2b5b87">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The House">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   The Solanyk House — design system
   Direction: Dutch-kitchen porcelain. Delft blue on a cool
   porcelain ground; tulip red and garden green carry meaning,
   never decoration. Hudsonville sits in Dutch West Michigan —
   the palette comes from the kitchen, not from a template.
   ============================================================ */

:root {
  /* ground + surfaces */
  --ground: #eff2f1;
  --surface: #ffffff;
  --surface-2: #f7f9f8;
  --surface-3: #e9eeec;

  /* ink */
  --ink: #14212b;
  --ink-2: #5c6e7a;
  --ink-3: #8798a3;

  /* structure */
  --line: #dce4e3;
  --line-2: #c9d4d2;

  /* the accent + semantics */
  --delft: #2b5b87;
  --delft-soft: #e6eef5;
  --delft-ink: #1d4468;
  --tulip: #ae3a32;
  --tulip-soft: #f8e9e7;
  --leaf: #4b7a47;
  --leaf-soft: #e8f0e6;
  --amber: #b5792a;
  --amber-soft: #f8efe0;

  /* shape */
  --r-sm: 8px;
  --r: 14px;
  --r-lg: 20px;
  --r-pill: 999px;

  /* depth — spent by role, not stamped on everything */
  --shadow-card: 0 1px 2px rgba(20, 33, 43, 0.05);
  --shadow-lift: 0 6px 20px -6px rgba(20, 33, 43, 0.18);
  --shadow-sheet: 0 -12px 40px -12px rgba(20, 33, 43, 0.28);

  /* type */
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;

  /* rhythm */
  --gutter: 18px;
  --tabbar: 68px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101a20;
    --surface: #18242c;
    --surface-2: #1f2d36;
    --surface-3: #253540;
    --ink: #e7eef2;
    --ink-2: #93a7b3;
    --ink-3: #6c818e;
    --line: #27353f;
    --line-2: #354854;
    --delft: #7fb3dd;
    --delft-soft: #1c3244;
    --delft-ink: #a8cded;
    --tulip: #e4796f;
    --tulip-soft: #3a2320;
    --leaf: #8cbf86;
    --leaf-soft: #1e2f1f;
    --amber: #dfac5e;
    --amber-soft: #33281a;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-lift: 0 6px 20px -6px rgba(0, 0, 0, 0.5);
    --shadow-sheet: 0 -12px 40px -12px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --ground: #101a20;
  --surface: #18242c;
  --surface-2: #1f2d36;
  --surface-3: #253540;
  --ink: #e7eef2;
  --ink-2: #93a7b3;
  --ink-3: #6c818e;
  --line: #27353f;
  --line-2: #354854;
  --delft: #7fb3dd;
  --delft-soft: #1c3244;
  --delft-ink: #a8cded;
  --tulip: #e4796f;
  --tulip-soft: #3a2320;
  --leaf: #8cbf86;
  --leaf-soft: #1e2f1f;
  --amber: #dfac5e;
  --amber-soft: #33281a;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-lift: 0 6px 20px -6px rgba(0, 0, 0, 0.5);
  --shadow-sheet: 0 -12px 40px -12px rgba(0, 0, 0, 0.6);
}

/* ---------- base ---------- */

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--delft); text-underline-offset: 2px; }

:focus-visible {
  outline: 2px solid var(--delft);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- app frame ---------- */

.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.view {
  flex: 1;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 20px var(--gutter) calc(var(--tabbar) + 32px);
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- typography roles ---------- */

.display {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.eyebrow {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
}

.muted { color: var(--ink-2); }
.tiny { font-size: 0.82rem; }
.nums { font-variant-numeric: tabular-nums; }

/* Page header: the serif does the talking, once per screen. */
.page-head { display: flex; flex-direction: column; gap: 3px; }
.page-head .title {
  font-family: var(--serif);
  font-size: 2.1rem;
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.015em;
}
.page-head .sub { color: var(--ink-2); font-size: 0.94rem; }

/* Section heading inside a screen */
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  min-height: 24px;
}
.section-head h2 {
  font-size: 0.95rem;
  font-weight: 650;
  letter-spacing: -0.005em;
}
.section-head .aside { font-size: 0.82rem; color: var(--ink-3); }

/* ---------- card ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.card-pad { padding: 16px 16px; }
.card-quiet {
  background: transparent;
  border: 1px solid var(--line);
  box-shadow: none;
}

/* A plain grouped list — the workhorse. Not a card each; one container. */
.rows { display: flex; flex-direction: column; }
.rows > * + * { border-top: 1px solid var(--line); }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  min-height: 52px;
  background: none;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.row:hover { background: var(--surface-2); }
.row-static { cursor: default; }
.row-static:hover { background: none; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: 0.83rem; color: var(--ink-2); overflow-wrap: anywhere; }
.row-end { flex-shrink: 0; display: flex; align-items: center; gap: 8px; color: var(--ink-3); }

/* ---------- check control (the cleaning list) ---------- */

.check {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 16px;
  min-height: 54px;
  width: 100%;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.check:hover { background: var(--surface-2); }
.check .box {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  border: 1.75px solid var(--line-2);
  display: grid;
  place-items: center;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.check .box svg { width: 15px; height: 15px; opacity: 0; transform: scale(0.7); transition: all 0.15s ease; }
.check[aria-pressed="true"] .box {
  background: var(--leaf);
  border-color: var(--leaf);
  color: var(--surface);
}
:root[data-theme="dark"] .check[aria-pressed="true"] .box,
:root:not([data-theme="light"]) .check[aria-pressed="true"] .box { color: var(--ground); }
.check[aria-pressed="true"] .box svg { opacity: 1; transform: scale(1); }
.check[aria-pressed="true"] .check-text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.check-main { flex: 1; min-width: 0; }
.check-text { line-height: 1.35; overflow-wrap: anywhere; }
.check-min { flex-shrink: 0; font-size: 0.8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- progress meter ---------- */

.meter { display: flex; flex-direction: column; gap: 7px; }
.meter-track {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--leaf);
  transition: width 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.meter-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink-2); }

/* ---------- chips ---------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  background: var(--surface-3);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip-delft { background: var(--delft-soft); color: var(--delft-ink); }
.chip-tulip { background: var(--tulip-soft); color: var(--tulip); }
.chip-leaf { background: var(--leaf-soft); color: var(--leaf); }
.chip-amber { background: var(--amber-soft); color: var(--amber); }
:root[data-theme="dark"] .chip-delft,
:root:not([data-theme="light"]) .chip-delft { color: var(--delft); }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* Filter chips are pressable */
.fchip {
  padding: 7px 13px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.14s ease;
}
.fchip:hover { border-color: var(--line-2); }
.fchip[aria-pressed="true"] {
  background: var(--delft);
  border-color: var(--delft);
  color: var(--surface);
}
:root[data-theme="dark"] .fchip[aria-pressed="true"],
:root:not([data-theme="light"]) .fchip[aria-pressed="true"] { color: var(--ground); }

.scroller {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin: 0 calc(var(--gutter) * -1);
  padding-left: var(--gutter);
  padding-right: var(--gutter);
  scrollbar-width: none;
}
.scroller::-webkit-scrollbar { display: none; }

/* ---------- buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 18px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.94rem;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.14s ease;
}
.btn:hover { background: var(--surface-2); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--delft);
  border-color: var(--delft);
  color: #fff;
}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary { color: var(--ground); }
.btn-primary:hover { background: var(--delft-ink); border-color: var(--delft-ink); }
.btn-danger { color: var(--tulip); border-color: var(--line); }
.btn-danger:hover { background: var(--tulip-soft); border-color: var(--tulip); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 0 13px; font-size: 0.85rem; border-radius: var(--r-sm); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* icon-only */
.ibtn {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  border: 0;
  background: none;
  color: var(--ink-3);
  cursor: pointer;
}
.ibtn:hover { background: var(--surface-3); color: var(--ink); }
.ibtn svg { width: 19px; height: 19px; }

.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1; min-width: 130px; }

/* ---------- inputs ---------- */

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }

.input, .textarea, .select {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.95rem;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--delft);
  background: var(--surface);
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; font-family: inherit; }
.select { appearance: none; padding-right: 34px; cursor: pointer; }

.quickadd { display: flex; gap: 8px; }
.quickadd .input { flex: 1; }

/* ---------- segmented control ---------- */

.segmented {
  display: flex;
  padding: 3px;
  gap: 3px;
  background: var(--surface-3);
  border-radius: var(--r);
}
.segmented button {
  flex: 1;
  min-height: 38px;
  border: 0;
  border-radius: 11px;
  background: none;
  color: var(--ink-2);
  font-size: 0.88rem;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.16s ease;
}
.segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-card);
}

/* ---------- tab bar / rail ---------- */

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  background: none;
  color: var(--ink-3);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 0;
  transition: color 0.14s ease;
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--delft); }

@media (min-width: 900px) {
  .app { flex-direction: row; }
  .tabbar {
    position: sticky;
    top: 0;
    bottom: auto;
    height: 100dvh;
    width: 13rem;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    padding: 26px 14px;
    border-top: 0;
    border-right: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: none;
  }
  .tabbar .brand {
    font-family: var(--serif);
    font-size: 1.28rem;
    color: var(--ink);
    padding: 0 12px 20px;
    line-height: 1.15;
  }
  .tabbar button {
    flex: 0 0 auto;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    min-height: 46px;
    padding: 0 12px;
    border-radius: var(--r);
    font-size: 0.94rem;
    font-weight: 550;
    letter-spacing: 0;
  }
  .tabbar button:hover { background: var(--surface-2); color: var(--ink); }
  .tabbar button[aria-current="page"] { background: var(--delft-soft); color: var(--delft-ink); }
  .view {
    max-width: 1080px;
    padding: 34px 32px 60px;
    gap: 26px;
  }
  .two-col {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 26px;
    align-items: start;
  }
  .two-col > * { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
}
@media (max-width: 899px) {
  .tabbar .brand { display: none; }
  .two-col { display: flex; flex-direction: column; gap: 22px; }
  .two-col > * { display: flex; flex-direction: column; gap: 22px; }
}

/* ---------- sheet (bottom sheet on phone, modal on desktop) ---------- */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(12, 22, 30, 0.42);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 0.18s ease;
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

.sheet {
  width: 100%;
  max-width: 620px;
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-sheet);
  animation: rise 0.22s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.sheet-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 {
  flex: 1;
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.15;
  min-width: 0;
  overflow-wrap: anywhere;
}
.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  -webkit-overflow-scrolling: touch;
}
.sheet-foot {
  flex-shrink: 0;
  display: flex;
  gap: 9px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.sheet-foot > .btn { flex: 1; }
.sheet-grip {
  width: 38px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--line-2);
  margin: 8px auto 0;
}
@media (min-width: 900px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: var(--r-lg); max-height: 84dvh; }
  .sheet-grip { display: none; }
}

/* ---------- toast ---------- */

.toasts {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px));
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.toast {
  padding: 10px 16px;
  border-radius: var(--r-pill);
  background: var(--ink);
  color: var(--ground);
  font-size: 0.88rem;
  font-weight: 500;
  box-shadow: var(--shadow-lift);
  animation: rise 0.2s ease;
}
@media (min-width: 900px) { .toasts { bottom: 24px; } }

/* ---------- empty state ---------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
  padding: 30px 20px;
  color: var(--ink-2);
}
.empty .empty-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  color: var(--ink-3);
}
.empty .empty-mark svg { width: 21px; height: 21px; }
.empty p { font-size: 0.9rem; max-width: 34ch; }

/* ---------- banner (mode + status notices) ---------- */

.banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--r);
  background: var(--amber-soft);
  color: var(--ink);
  font-size: 0.85rem;
  line-height: 1.45;
  border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
}
.banner svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 2px; color: var(--amber); }

/* ============================================================
   Today
   ============================================================ */

.sunstrip {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 12px 4px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.sunstrip .cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0 6px;
  min-width: 0;
}
.sunstrip .cell + .cell { border-left: 1px solid var(--line); }
.sunstrip .val { font-size: 0.98rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sunstrip .key { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }

.zone-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 16px 12px;
}
.zone-head .zone-name { font-family: var(--serif); font-size: 1.32rem; font-weight: 400; line-height: 1.15; }
.zone-head .zone-sub { font-size: 0.82rem; color: var(--ink-2); margin-top: 2px; }
.zone-meter { padding: 0 16px 14px; }

.done-note {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--leaf-soft);
  color: var(--leaf);
  font-size: 0.9rem;
  font-weight: 550;
}
.done-note svg { width: 18px; height: 18px; flex-shrink: 0; }

/* Tonight's dinner — the one place a photo-less card earns some scale */
.dinner {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 18px 16px;
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.dinner:hover { background: var(--surface-2); }
.dinner .glyph {
  flex-shrink: 0;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  font-size: 27px;
  line-height: 1;
  border-radius: var(--r);
  background: var(--delft-soft);
}
.dinner .dinner-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dinner .dinner-name {
  font-family: var(--serif);
  font-size: 1.3rem;
  font-weight: 400;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.dinner .dinner-sub { font-size: 0.83rem; color: var(--ink-2); }

.produce { display: flex; flex-direction: column; gap: 11px; padding: 15px 16px; }
.produce-item { display: flex; gap: 11px; align-items: flex-start; }
.produce-item .p-emoji { font-size: 18px; line-height: 1.3; flex-shrink: 0; width: 22px; }
.produce-item .p-name { font-weight: 550; font-size: 0.92rem; }
.produce-item .p-note { font-size: 0.83rem; color: var(--ink-2); line-height: 1.4; }

.tipcard { padding: 16px; display: flex; flex-direction: column; gap: 9px; }
.tipcard .tip-text { font-size: 0.96rem; line-height: 1.5; }

/* ============================================================
   Meals
   ============================================================ */

.daylist { display: flex; flex-direction: column; }
.daylist > * + * { border-top: 1px solid var(--line); }

.dayrow {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 16px;
  min-height: 62px;
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.dayrow:hover { background: var(--surface-2); }
.dayrow .daytag {
  flex-shrink: 0;
  width: 42px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.dayrow .dayabbr {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.dayrow .daynum { font-size: 1.08rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.dayrow[data-today="true"] .dayabbr,
.dayrow[data-today="true"] .daynum { color: var(--delft); }
.dayrow .slot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dayrow .slot-name { font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.dayrow .slot-empty { color: var(--ink-3); font-style: italic; }
.dayrow .slot-sub { font-size: 0.8rem; color: var(--ink-2); }
.dayrow .slot-emoji { font-size: 20px; flex-shrink: 0; line-height: 1; }

.grocery-group { display: flex; flex-direction: column; }
.grocery-group .g-head {
  padding: 10px 16px 6px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.grocery-group:first-child .g-head { border-top: 0; }

/* ============================================================
   Recipes
   ============================================================ */

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 11px;
}
.rcard {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 14px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
  color: inherit;
  min-height: 128px;
}
.rcard:hover { border-color: var(--line-2); box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.rcard .r-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.rcard .r-emoji { font-size: 25px; line-height: 1; }
.rcard .r-fav { color: var(--amber); }
.rcard .r-fav svg { width: 16px; height: 16px; }
.rcard .r-name {
  font-family: var(--serif);
  font-size: 1.06rem;
  font-weight: 400;
  line-height: 1.2;
  flex: 1;
  overflow-wrap: anywhere;
}
.rcard .r-meta { font-size: 0.78rem; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }

.ing-list { display: flex; flex-direction: column; }
.ing-list > * + * { border-top: 1px solid var(--line); }
.ing {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 14px;
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  color: inherit;
  min-height: 46px;
}
.ing:hover { background: var(--surface-2); }
.ing .dot {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.75px solid var(--line-2);
  display: grid;
  place-items: center;
}
.ing .dot svg { width: 11px; height: 11px; opacity: 0; }
.ing[aria-pressed="true"] .dot { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.ing[aria-pressed="true"] .dot svg { opacity: 1; }
.ing[aria-pressed="true"] .ing-name { color: var(--ink-3); text-decoration: line-through; }
.ing-name { flex: 1; font-size: 0.93rem; overflow-wrap: anywhere; }
.ing-qty { flex-shrink: 0; font-size: 0.83rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.steps { display: flex; flex-direction: column; gap: 13px; counter-reset: step; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n {
  flex-shrink: 0;
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--delft-soft);
  color: var(--delft-ink);
  font-size: 0.78rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
:root[data-theme="dark"] .step .n,
:root:not([data-theme="light"]) .step .n { color: var(--delft); }
.step p { font-size: 0.95rem; line-height: 1.55; }

.sourceline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--r);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 0.86rem;
}
.sourceline .who { color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.sourceline a { flex-shrink: 0; font-weight: 600; text-decoration: none; }
.sourceline a:hover { text-decoration: underline; }

/* Import: the three doors */
.doors { display: flex; flex-direction: column; gap: 9px; }
.door {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 15px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  color: inherit;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.door:hover { border-color: var(--delft); background: var(--surface-2); }
.door .door-mark {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  background: var(--delft-soft);
  color: var(--delft-ink);
}
:root[data-theme="dark"] .door .door-mark,
:root:not([data-theme="light"]) .door .door-mark { color: var(--delft); }
.door .door-mark svg { width: 20px; height: 20px; }
.door .door-main { flex: 1; min-width: 0; }
.door .door-title { font-weight: 600; font-size: 0.96rem; }
.door .door-sub { font-size: 0.83rem; color: var(--ink-2); line-height: 1.4; margin-top: 1px; }

.thinking {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  font-size: 0.9rem;
  color: var(--ink-2);
}
.spinner {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 2px solid var(--line-2);
  border-top-color: var(--delft);
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   House — jobs + projects
   ============================================================ */

.pri-stripe {
  flex-shrink: 0;
  width: 3px;
  align-self: stretch;
  border-radius: var(--r-pill);
  background: var(--line-2);
  min-height: 30px;
}
.pri-urgent { background: var(--tulip); }
.pri-soon { background: var(--amber); }
.pri-someday { background: var(--line-2); }

.job-row { display: flex; align-items: stretch; gap: 12px; padding: 12px 16px; min-height: 58px; }
.job-row .job-check {
  flex-shrink: 0;
  align-self: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.75px solid var(--line-2);
  background: none;
  cursor: pointer;
  display: grid;
  place-items: center;
  color: transparent;
  padding: 0;
}
.job-row .job-check:hover { border-color: var(--leaf); }
.job-row .job-check svg { width: 13px; height: 13px; }
.job-row[data-done="true"] .job-check { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.job-row[data-done="true"] .job-title { color: var(--ink-3); text-decoration: line-through; }
.job-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; cursor: pointer; }
.job-title { font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.job-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.job-notes { font-size: 0.83rem; color: var(--ink-2); line-height: 1.45; overflow-wrap: anywhere; }

.pcard { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.pcard .p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pcard .p-title {
  font-family: var(--serif);
  font-size: 1.18rem;
  font-weight: 400;
  line-height: 1.2;
  flex: 1;
  overflow-wrap: anywhere;
}
.pcard .p-next {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 11px 12px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border-left: 3px solid var(--delft);
  font-size: 0.88rem;
  line-height: 1.5;
}
.pcard .p-next .p-next-key {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink-3);
  flex-shrink: 0;
  padding-top: 2px;
}
.pcard .p-facts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.84rem; color: var(--ink-2); }
.pcard .p-facts b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

.status-group { display: flex; flex-direction: column; gap: 11px; }

/* ---------- cleaning editor ---------- */

.dayblock { border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.dayblock[data-open="true"] { border-color: var(--line-2); }
.dayblock-head {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 15px;
  width: 100%;
  border: 0;
  background: none;
  cursor: pointer;
  text-align: left;
  color: inherit;
  min-height: 52px;
}
.dayblock-head:hover { background: var(--surface-2); }
.dayblock-head .d-name { flex: 1; font-weight: 600; }
.dayblock-head .d-count { font-size: 0.82rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dayblock-head .caret { transition: transform 0.18s ease; color: var(--ink-3); }
.dayblock[data-open="true"] .caret { transform: rotate(90deg); }
.dayblock[data-today="true"] .d-name { color: var(--delft); }
.dayblock-body { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }

.edit-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 4px 6px 8px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
}
.edit-row .e-text { flex: 1; min-width: 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.edit-row .e-min { flex-shrink: 0; font-size: 0.8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.edit-row .ibtn { width: 32px; height: 32px; }
.edit-row .ibtn svg { width: 16px; height: 16px; }

/* ---------- misc ---------- */

.hr { height: 1px; background: var(--line); border: 0; margin: 2px 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* main column — sits beside the rail on desktop, under the bar on phone */
main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Icons inside text buttons need an explicit size — an inline SVG with no
   width/height collapses and the button renders as an empty slab. */
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn-sm svg { width: 15px; height: 15px; }
.door svg, .empty svg, .banner svg, .done-note svg, .sunstrip svg { flex-shrink: 0; }

/* The status shortcut on a project card is a nudge, not the card's main
   action — size it to its label instead of letting the column stretch it. */
.pcard .btn-sm { align-self: flex-start; }

/* ============================================================
   Type scale by screen.

   Everything sizes in rem, so one root font-size moves the whole app.
   Phones stay at the browser default; desktops get a step up, because
   the app is read further from the screen there and Chad found the old
   size mean. The wall adds another step of its own in 60-display.css.
   ============================================================ */

html { font-size: 100%; }                              /* 16px, phones */
@media (min-width: 900px)  { html { font-size: 112.5%; } }   /* 18px */
@media (min-width: 1400px) { html { font-size: 118.75%; } }  /* 19px */

body { font-size: 1rem; }

/* ============================================================
   Phones — where this app actually lives.
   ============================================================ */

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, .row, .check, .dayrow, .rcard, .door, .chore-tile, .fchip, .g-row .box, .g-have {
  touch-action: manipulation;
}
body { overscroll-behavior-y: none; }

/* Installed to the home screen, the page runs under the notch and over
   the home indicator. */
.view { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }

@media (max-width: 899px) {
  :root { --gutter: 16px; --tabbar: 64px; }

  .view { gap: 20px; }

  /* The serif title was set for a desktop column; on a phone it wants to
     be a touch smaller so a long screen name still fits one line. */
  .page-head .title { font-size: 1.9rem; }
  .page-head .sub { font-size: 0.9rem; }

  .card { border-radius: 18px; }

  /* Comfortable thumb targets everywhere that gets tapped a lot. */
  .row, .check, .dayrow, .g-row { min-height: 56px; }
  .btn { min-height: 48px; }
  .btn-row > .btn { min-width: 0; flex: 1 1 46%; }

  .sunstrip { padding: 11px 0; }
  .sunstrip .val { font-size: 0.92rem; }
  .sunstrip .key { font-size: 0.63rem; letter-spacing: 0.05em; }

  .wx-temp { font-size: 2.8rem; }
  .wx-stat { min-width: 62px; padding: 0 4px; }
  .wx-stat-val { font-size: 0.92rem; }
  .wx-stat-key { font-size: 0.62rem; letter-spacing: 0.05em; }
  .wx-day { min-width: 48px; padding: 7px 2px; }

  .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .rcard { padding: 12px; min-height: 118px; }
  .rcard .r-name { font-size: 1rem; }
  .rcard .r-meta { font-size: 0.74rem; }
  .r-photo { margin: -12px -12px 6px; }

  .chore-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* Sheets are the main way anything gets edited on a phone: give them
     the full width and a thumb-reachable footer. */
  .sheet-head { padding: 15px 15px 11px; }
  .sheet-head h2 { font-size: 1.25rem; }
  .sheet-body { padding: 15px; gap: 15px; }
  .sheet-foot { padding: 11px 15px calc(11px + env(safe-area-inset-bottom, 0px)); }

  .deal-links a { min-height: 36px; padding: 0 11px; font-size: 0.78rem; }
  .g-sub { font-size: 0.76rem; }
}

/* Small phones (SE and the like): keep five tabs and the grids legible. */
@media (max-width: 380px) {
  :root { --gutter: 14px; }
  .page-head .title { font-size: 1.72rem; }
  .tabbar button { font-size: 0.6rem; }
  .tabbar button svg { width: 20px; height: 20px; }
  .wx-stats { gap: 0; }
  .wx-stat { min-width: 54px; }
  .chip { font-size: 0.72rem; }
}

/* Landscape phone: a 68px bar would eat a third of the screen. */
@media (max-width: 899px) and (max-height: 460px) {
  :root { --tabbar: 50px; }
  .tabbar button { flex-direction: row; gap: 6px; font-size: 0.72rem; }
  .tabbar button svg { width: 18px; height: 18px; }
  .view { padding-top: 14px; }
}

/* Four sun/moon cells will not fit across a phone in one row — "Last
   quarter" ran off the edge. Two by two instead. */
@media (max-width: 520px) {
  .sunstrip { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 0; }
  .sunstrip .cell + .cell { border-left: 1px solid var(--line); }
  .sunstrip .cell:nth-child(odd) { border-left: 0; }
  .sunstrip .val { font-size: 0.95rem; }
}


/* ==== css/05-weather.css ==== */
/* Weather card — the backyard number is the loudest thing on the screen,
   because it is the one everybody actually opens the app to check. */

.wx-card { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.wx-head { display: flex; align-items: center; gap: 14px; }
.wx-emoji { font-size: 40px; line-height: 1; flex-shrink: 0; }
.wx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.wx-temp {
  font-family: var(--serif);
  font-size: 3rem;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.02em;
  display: flex;
  align-items: flex-start;
}
.wx-deg { font-size: 1.6rem; line-height: 1.1; color: var(--ink-2); }
.wx-cond { font-size: 0.95rem; font-weight: 550; }
.wx-where {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  margin-top: 2px;
}
.wx-hilo {
  flex-shrink: 0;
  text-align: right;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.45;
}

.wx-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 11px 0;
}
.wx-stat {
  flex: 1 1 0;
  min-width: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 0 6px;
}
.wx-stat + .wx-stat { border-left: 1px solid var(--line); }
.wx-stat-val { font-size: 0.98rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx-stat-key { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }

.wx-week {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.wx-week::-webkit-scrollbar { display: none; }
.wx-day {
  flex: 1 1 0;
  min-width: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 2px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
}
.wx-day-name { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.wx-day-icon { font-size: 17px; line-height: 1.2; }
.wx-day-temps { display: flex; gap: 5px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.wx-hi { font-weight: 650; }
.wx-lo { color: var(--ink-3); }
.wx-day-rain { font-size: 0.66rem; color: var(--delft); font-variant-numeric: tabular-nums; }

.wx-stale { padding-top: 2px; }
.banner-slot { padding: 12px; }


/* ==== css/20-meals.css ==== */
/* Grocery list with prices, stores and the cart order. */

.g-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 54px; }
.g-row .box {
  flex-shrink: 0;

.g-price { font-variant-numeric: tabular-nums; }
.g-price b { font-weight: 650; color: var(--ink-2); }
.g-deal { color: var(--tulip); font-weight: 700; }
.g-qty { flex-shrink: 0; font-size: 0.83rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.g-have {
  flex-shrink: 0;
  min-height: 32px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: none;
  color: var(--ink-3);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}
.g-have[aria-pressed="true"] { background: var(--surface-3); color: var(--ink-2); border-color: var(--line-2); }

.g-total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 14px 10px; font-size: 0.82rem; color: var(--ink-2); border-top: 1px dashed var(--line); }
.g-total b { font-variant-numeric: tabular-nums; color: var(--ink); }

.deal-links { display: flex; flex-wrap: wrap; gap: 8px; }
.deal-links a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 0.82rem;
  font-weight: 600;
  text-decoration: none;
}
.deal-links a svg { width: 14px; height: 14px; }

.cart-status {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
}
.cart-status[data-state="pending"], .cart-status[data-state="building"] { border-color: color-mix(in srgb, var(--delft) 40%, transparent); background: var(--delft-soft); }
.cart-status[data-state="done"] { border-color: color-mix(in srgb, var(--leaf) 40%, transparent); background: var(--leaf-soft); }
.cart-status[data-state="error"] { border-color: color-mix(in srgb, var(--tulip) 40%, transparent); background: var(--tulip-soft); }
.cart-status .cs-line { display: flex; align-items: center; gap: 10px; font-weight: 550; font-size: 0.92rem; }
.cart-status .cs-line .spinner { flex-shrink: 0; }
.cart-status .cs-sub { font-size: 0.83rem; color: var(--ink-2); }
.cart-links { display: flex; gap: 8px; flex-wrap: wrap; }
.cart-links .btn { flex: 1; min-width: 140px; }

/* What is already on this day, at the top of the picker, with the way to
   take it off right next to it. */
.planned-now {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.pn-emoji { font-size: 1.6rem; line-height: 1; flex-shrink: 0; }
.pn-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pn-name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.pn-sub { font-size: 0.8rem; color: var(--ink-2); }

/* Weekly staples: the always-buy list editor and its entry button. */
.staples-bar { gap: 10px; }
.staple-row { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.staple-line { display: flex; gap: 6px; align-items: center; }
.staple-line .input, .staple-line .select { min-height: 42px; }
.staple-qty { flex: 0 0 42%; }
.staple-store { flex: 0 0 42%; }

/* "Already have" pantry chips — tap the x to remove. */
.pantry-chips { gap: 8px; }
.pantry-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.85rem;
  cursor: pointer;
}
.pantry-chip:hover { border-color: var(--tulip); color: var(--tulip); }
.pantry-chip svg { width: 13px; height: 13px; color: var(--ink-3); }
.pantry-chip:hover svg { color: var(--tulip); }


/* ==== css/30-recipes.css ==== */
/* Recipe photos — the box gets a lot nicer once her pins come over. */

/* Cards keep their natural height, so a card with a photo does not stretch
   its neighbours into tall empty boxes. The photo stands in for the emoji. */
.recipe-grid { align-items: start; }
.rcard { overflow: hidden; }
.r-photo + .r-top .r-emoji { display: none; }
.r-photo + .r-top { min-height: 0; justify-content: flex-end; }
.r-photo {

  aspect-ratio: 4 / 3;

}

}
@media (min-width: 900px) { .r-hero { border-radius: 0; } }


/* ==== css/40-house.css ==== */
/* Cleaning-task cadence chip inside an edit row. */
.edit-row .e-text { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.e-cad { flex-shrink: 0; }


/* ==== css/45-chores.css ==== */
/* The kids' chore chart. Big pictures, big taps, an unmistakable "done". */

.chore-kids { display: flex; flex-direction: column; gap: 14px; }
.chore-kid { display: flex; flex-direction: column; gap: 10px; }
.chore-kid-head { display: flex; align-items: center; gap: 9px; }
.chore-kid-emoji { font-size: 1.5rem; line-height: 1; }
.chore-kid-name { font-family: var(--serif); font-size: 1.25rem; flex: 1; }
.chore-kid-count { font-size: 0.82rem; color: var(--ink-2); font-weight: 600; }

.chore-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 10px;
}

.chore-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-height: 132px;
  padding: 16px 10px 12px;
  border-radius: var(--r);
  border: 1.5px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
}
.chore-tile:active { transform: scale(0.96); }
.chore-pic { font-size: 2.6rem; line-height: 1; }
.chore-name { font-size: 0.92rem; font-weight: 600; line-height: 1.2; }
.chore-meta { display: flex; gap: 6px; align-items: center; font-size: 0.72rem; color: var(--ink-3); }
.chore-cad { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
.chore-check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--leaf);
  color: var(--surface);
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.15s ease, transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1.4);
}
.chore-check svg { width: 14px; height: 14px; }
.chore-tile[aria-pressed="true"] { border-color: var(--leaf); background: var(--leaf-soft); }
.chore-tile[aria-pressed="true"] .chore-check { opacity: 1; transform: scale(1); }
.chore-tile[aria-pressed="true"] .chore-name { color: var(--leaf); }
.chore-pop { animation: chore-pop 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.4); }
@keyframes chore-pop { 30% { transform: scale(1.06); } }

.chore-edit-row { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.chore-edit-line { display: flex; gap: 6px; align-items: center; }
.chore-edit-line .input, .chore-edit-line .select { min-height: 40px; }
.chore-pic-input { width: 64px; flex: 0 0 64px; text-align: center; font-size: 1.3rem; padding: 4px; }
.chore-stars-input { width: 64px; flex: 0 0 64px; text-align: center; }

/* ---- on the wall: bigger, touchable from a stool ---- */
.wall-chores { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.5vw, 36px); flex: 1; align-content: center; }
.wall-chores .chore-kid-head { gap: 12px; margin-bottom: 4px; }
.wall-chores .chore-kid-emoji { font-size: clamp(1.8rem, 3vw, 3rem); }
.wall-chores .chore-kid-name { font-size: clamp(1.4rem, 2.4vw, 2.4rem); }
.wall-chores .chore-kid-count { font-size: clamp(0.85rem, 1.2vw, 1.15rem); }
.wall-chores .chore-grid { grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 11vw, 170px), 1fr)); gap: clamp(8px, 1.2vw, 16px); }
.wall-chores .chore-tile { min-height: clamp(130px, 15vw, 190px); }
.wall-chores .chore-pic { font-size: clamp(2.6rem, 5vw, 4.6rem); }
.wall-chores .chore-name { font-size: clamp(0.95rem, 1.4vw, 1.3rem); }
.wall-chores .chore-check { width: clamp(26px, 2.6vw, 36px); height: clamp(26px, 2.6vw, 36px); }
@media (max-width: 760px) { .wall-chores { grid-template-columns: 1fr; } }


/* ==== css/50-rewards.css ==== */
/* ============================================================
   Stars — jars, the shop, and the reason / redeem / edit sheets.
   ============================================================ */

.jars { display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 520px) {
  .jars { flex-direction: row; }
  .jars > .jar { flex: 1; min-width: 0; }
}

.jar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 22px 18px;
  text-align: center;
}
.jar .jar-emoji { font-size: 44px; line-height: 1; }
.jar .jar-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; }
.jar .jar-balance {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 7px;
  font-size: 2.5rem;
  font-weight: 650;
  line-height: 1;
}
.jar .jar-balance .unit { font-size: 1.4rem; }
.jar .jar-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }

/* ---------- "give a star" reasons ---------- */

.reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reason-btn {
  min-height: 46px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.88rem;
  font-weight: 550;
  text-align: center;
  cursor: pointer;
  transition: all 0.14s ease;
}
.reason-btn:hover { border-color: var(--delft); background: var(--delft-soft); }

/* ---------- the shop ---------- */

/* A reward nobody can afford yet stays fully legible in structure — only
   its opacity drops, never its color. */
.rcard[data-afford="false"] { opacity: 0.48; }

.redeem-emoji, .log-emoji { font-size: 24px; line-height: 1; flex-shrink: 0; }

/* ---------- edit the rewards ---------- */

.reward-edit-row { gap: 8px; }
.reward-edit-row .rwd-emoji { width: 54px; flex-shrink: 0; text-align: center; padding-left: 6px; padding-right: 6px; }
.reward-edit-row .rwd-name { flex: 1; min-width: 0; }
.reward-edit-row .rwd-cost { width: 74px; flex-shrink: 0; }


/* ==== css/60-display.css ==== */
/* ============================================================
   Display — the wall on the Surface.

   The ordinary app, fully usable, plus a thin always-on bar on top.
   Nothing here hides a control: the whole point of the wall is that
   someone can walk up and tick a chore or give a star.
   ============================================================ */

:root { --wallbar-h: 52px; }

/* Bigger overall, because it is read standing a few feet back. */

/* The bar sits above everything; the app starts below it, so the side
   rail and the bar never overlap. */

@media (min-width: 900px) {
  body.display-mode .tabbar {
    top: var(--wallbar-h);
    height: calc(100dvh - var(--wallbar-h));
  }
}

.wallbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 60;
  height: var(--wallbar-h);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.wb-left { display: flex; align-items: baseline; gap: 13px; min-width: 0; }
.wb-time {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.wb-date {
  font-size: 0.8rem;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wb-mid { flex: 1; }
.wb-temp {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Touch targets get a little more room on a wall screen — the kids use it
   standing on a stool. */
body.display-mode .check { min-height: 60px; }
body.display-mode .chore-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
body.display-mode .chore-pic { font-size: 2.9rem; }
body.display-mode .chore-tile { min-height: 150px; }

/* A short panel (an old 768-tall screen) wants a touch less. */
@media (max-height: 800px) {
  html.display-root { font-size: 19px; }
  :root { --wallbar-h: 48px; }
}

/* The daily note for Kenzie. Warm and separate from everything else, but

.love-scrim {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;

@keyframes love-in { from { opacity: 0; } }

.love-glyphs { position: absolute; inset: 0; pointer-events: none; }

  position: absolute;
  bottom: -40px;
  line-height: 1;
  opacity: 0;

  animation-timing-function: ease-out;
  animation-iteration-count: infinite;
  will-change: transform, opacity;

@keyframes love-drift {

  12%  { opacity: 0.9; }

}

.love-card {
  position: relative;
  width: 100%;
  max-width: 34rem;

  border-radius: var(--r-lg);

.love-eyebrow {

.love-msg {

  line-height: 1.45;
  letter-spacing: -0.005em;
  text-wrap: pretty;
  margin: 0;
}

.love-close {
  align-self: center;
  min-height: 46px;
  padding: 0 26px;
  border-radius: var(--r-pill);
  border: 0;
  background: var(--tulip);
  color: var(--surface);
  font-size: 0.95rem;
  font-weight: 650;
  letter-spacing: 0.02em;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .love-scrim, .love-card { animation: none; }
  .love-glyph { display: none; }
}

<script>

/* ==== data/almanac.js ========================================================= */
// Almanac -- sun times, Michigan seasonal produce, house tips, birthdays, moon phase.
// Location is fixed: Hudsonville, Michigan. lat 42.8717, lon -85.8639, America/Detroit.
// Pure functions only. No Date.now() inside computations -- always use the passed date.
// Plain top-level const, no IIFE, no export -- the build concatenates all src files
// into one script scope, so helper names below are prefixed to avoid collisions.

const ALMANAC_LAT = 42.8717;
const ALMANAC_LON = -85.8639; // degrees East; negative = West of Greenwich

// ---------------------------------------------------------------------
// small math helpers
// ---------------------------------------------------------------------

function almanacRad(d) { return d * Math.PI / 180; }
function almanacDeg(r) { return r * 180 / Math.PI; }

function almanacNormDate(date) {
  return (date instanceof Date && !isNaN(date.getTime())) ? date : new Date();
}

// ---------------------------------------------------------------------
// sunTimes -- NOAA solar position algorithm (matches the NOAA Solar
// Calculator spreadsheet, https://gml.noaa.gov/grad/solcalc/). Steps:
//
//   1. Julian Day for the calendar date (evaluated at 12:00 UTC -- the
//      declination/equation-of-time change so slowly over a day that
//      using noon instead of the true sunrise/sunset moment costs well
//      under a minute of accuracy).
//   2. Julian Century from J2000.0.
//   3. Geometric mean longitude and mean anomaly of the sun.
//   4. Eccentricity of Earth's orbit.
//   5. Sun's equation of center -> true longitude -> apparent longitude.
//   6. Mean obliquity of the ecliptic, corrected for nutation.
//   7. Solar declination from apparent longitude + obliquity correction.
//   8. Equation of time (minutes) -- clock time vs. sundial time.
//   9. Hour angle for a solar zenith of 90.833 degrees (90deg for the
//      horizon, +50 arcmin for atmospheric refraction, +16 arcmin for
//      the sun's disc radius -- the standard "sunrise/sunset" zenith).
//  10. Solar noon and sunrise/sunset, all expressed directly in minutes
//      from UTC midnight (longitude does all the work here -- no
//      timezone/DST table needed). Converted to a real UTC instant, so
//      the browser's own local-time rendering handles DST correctly.
//
// Cross-check against NOAA's published Grand Rapids-area figures:
//   Jun 21 -> sunrise ~6:02am / sunset ~9:24pm EDT
//   Dec 21 -> sunrise ~8:11am / sunset ~5:15pm EST
// ---------------------------------------------------------------------

function almanacJulianDay(y, m, d) {
  // m is 1-12. Evaluate at 12:00 UTC of the given calendar date.
  const utcNoonMs = Date.UTC(y, m - 1, d, 12, 0, 0);
  return utcNoonMs / 86400000 + 2440587.5; // Unix epoch -> Julian Day
}

function almanacSolarCalc(y, m, d) {
  const JD = almanacJulianDay(y, m, d);
  const T = (JD - 2451545.0) / 36525.0; // Julian century from J2000.0

  // Geometric mean longitude of the sun (deg), 0-360
  let geomMeanLong = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
  if (geomMeanLong < 0) geomMeanLong += 360;

  // Geometric mean anomaly of the sun (deg)
  const geomMeanAnom = 357.52911 + T * (35999.05029 - 0.0001537 * T);

  // Eccentricity of Earth's orbit
  const eccent = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);

  // Sun's equation of center (deg)
  const Mrad = almanacRad(geomMeanAnom);
  const eqOfCtr =
    Math.sin(Mrad) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
    Math.sin(2 * Mrad) * (0.019993 - 0.000101 * T) +
    Math.sin(3 * Mrad) * 0.000289;

  // True and apparent longitude of the sun (deg)
  const trueLong = geomMeanLong + eqOfCtr;
  const omega = 125.04 - 1934.136 * T;
  const appLong = trueLong - 0.00569 - 0.00478 * Math.sin(almanacRad(omega));

  // Mean obliquity of the ecliptic (deg), then corrected for nutation
  const meanObliq =
    23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const obliqCorr = meanObliq + 0.00256 * Math.cos(almanacRad(omega));

  // Solar declination (deg)
  const declin = almanacDeg(Math.asin(Math.sin(almanacRad(obliqCorr)) * Math.sin(almanacRad(appLong))));

  // Equation of time (minutes)
  const y2 = Math.pow(Math.tan(almanacRad(obliqCorr / 2)), 2);
  const geomMeanLongRad = almanacRad(geomMeanLong);
  const eqOfTime = 4 * almanacDeg(
    y2 * Math.sin(2 * geomMeanLongRad) -
    2 * eccent * Math.sin(Mrad) +
    4 * eccent * y2 * Math.sin(Mrad) * Math.cos(2 * geomMeanLongRad) -
    0.5 * y2 * y2 * Math.sin(4 * geomMeanLongRad) -
    1.25 * eccent * eccent * Math.sin(2 * Mrad)
  );

  // Hour angle for sunrise/sunset at zenith 90.833 deg
  const zenith = 90.833;
  const latRad = almanacRad(ALMANAC_LAT);
  const declinRad = almanacRad(declin);
  let haCos = Math.cos(almanacRad(zenith)) / (Math.cos(latRad) * Math.cos(declinRad)) -
    Math.tan(latRad) * Math.tan(declinRad);
  haCos = Math.max(-1, Math.min(1, haCos)); // clamp for polar edge cases
  const haSunrise = almanacDeg(Math.acos(haCos));

  // Solar noon and sunrise/sunset, in minutes from UTC midnight.
  const solarNoonUTC = 720 - 4 * ALMANAC_LON - eqOfTime;
  const sunriseUTC = solarNoonUTC - 4 * haSunrise;
  const sunsetUTC = solarNoonUTC + 4 * haSunrise;

  return { solarNoonUTC: solarNoonUTC, sunriseUTC: sunriseUTC, sunsetUTC: sunsetUTC };
}

function almanacMinutesToDate(y, m, d, minutesFromUtcMidnight) {
  const baseUtcMs = Date.UTC(y, m - 1, d, 0, 0, 0);
  return new Date(baseUtcMs + Math.round(minutesFromUtcMidnight * 60000));
}

function almanacFormatDayLength(sunrise, sunset) {
  const totalMin = Math.round((sunset.getTime() - sunrise.getTime()) / 60000);
  const h = Math.floor(totalMin / 60);
  const mnt = totalMin % 60;
  return h + "h " + mnt + "m";
}

function almanacDateSerial(date) {
  // Monotonic-enough integer per calendar day; stable within a day,
  // changes every day, no timezone math involved.
  return date.getFullYear() * 372 + date.getMonth() * 31 + date.getDate();
}

// ---------------------------------------------------------------------

const ALMANAC_SYNODIC_MONTH_DAYS = 29.530588853;
// A known new moon: 2000-01-06 18:14 UTC
const ALMANAC_KNOWN_NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14, 0);

const ALMANAC_MOON_STAGES = [
  { name: "New moon", emoji: "\u{1F311}" },

// ---------------------------------------------------------------------
// The public API. Plain top-level const object -- no IIFE, no export.
// ---------------------------------------------------------------------

const Almanac = {

  sunTimes: function (date) {
    date = almanacNormDate(date);
    const y = date.getFullYear();
    const m = date.getMonth() + 1;
    const d = date.getDate();

    const calc = almanacSolarCalc(y, m, d);
    const sunrise = almanacMinutesToDate(y, m, d, calc.sunriseUTC);
    const sunset = almanacMinutesToDate(y, m, d, calc.sunsetUTC);
    const solarNoon = almanacMinutesToDate(y, m, d, calc.solarNoonUTC);

    return {
      sunrise: sunrise,
      sunset: sunset,
      dayLength: almanacFormatDayLength(sunrise, sunset),
      solarNoon: solarNoon
    };
  },

  season: function (date) {
    date = almanacNormDate(date);
    const m = date.getMonth(); // 0-11
    if (m >= 2 && m <= 4) return "spring";   // Mar-May
    if (m >= 5 && m <= 7) return "summer";   // Jun-Aug
    if (m >= 8 && m <= 10) return "fall";    // Sep-Nov
    return "winter";                          // Dec-Feb
  },

  inSeason: function (date) {
    date = almanacNormDate(date);
    const m = date.getMonth() + 1;
    const list = ALMANAC_IN_SEASON[m] || ALMANAC_IN_SEASON[1];
    // return a shallow copy so callers can't mutate the source table
    return list.map(function (item) {
      return { name: item.name, emoji: item.emoji, note: item.note };
    });
  },

  tip: function (date) {
    date = almanacNormDate(date);
    const m = date.getMonth() + 1;
    const serial = almanacDateSerial(date);

    let pool = ALMANAC_TIPS.filter(function (t) { return t.months && t.months.indexOf(m) !== -1; });
    if (pool.length === 0) {
      pool = ALMANAC_TIPS.filter(function (t) { return !t.months; });
    }
    if (pool.length === 0) pool = ALMANAC_TIPS; // safety net, should never trigger

    let idx = serial % pool.length;
    if (idx < 0) idx += pool.length;
    const picked = pool[idx];
    return { text: picked.text, tag: picked.tag };
  },

  nextBirthday: function (date) {
    date = almanacNormDate(date);
    const today = almanacLocalMidnight(date.getFullYear(), date.getMonth() + 1, date.getDate());

    let best = null;
    ALMANAC_BIRTHDAYS.forEach(function (person) {
      let occYear = today.getFullYear();
      let occ = almanacLocalMidnight(occYear, person.born.m, person.born.d);
      if (occ.getTime() < today.getTime()) {
        occYear += 1;
        occ = almanacLocalMidnight(occYear, person.born.m, person.born.d);
      }
      const daysAway = Math.round((occ.getTime() - today.getTime()) / 86400000);
      const turning = occYear - person.born.y;
      if (best === null || daysAway < best.daysAway) {
        best = { name: person.name, date: occ, turning: turning, daysAway: daysAway };
      }
    });

    return best;
  },

  moonPhase: function (date) {
    date = almanacNormDate(date);
    const daysSince = (date.getTime() - ALMANAC_KNOWN_NEW_MOON_MS) / 86400000;
    let age = daysSince % ALMANAC_SYNODIC_MONTH_DAYS;
    if (age < 0) age += ALMANAC_SYNODIC_MONTH_DAYS;

    const fraction = age / ALMANAC_SYNODIC_MONTH_DAYS; // 0 = new, 0.5 = full, 1 = new again
    const illum = (1 - Math.cos(2 * Math.PI * fraction)) / 2;

    const stageWidth = ALMANAC_SYNODIC_MONTH_DAYS / 8;
    let stageIdx = Math.floor((age + stageWidth / 2) / stageWidth) % 8;
    if (stageIdx < 0) stageIdx += 8;
    const stage = ALMANAC_MOON_STAGES[stageIdx];

    return { name: stage.name, emoji: stage.emoji, illum: illum };
  }

};
