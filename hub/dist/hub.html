<title>The Solanyk House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   The Solanyk House — design system
   Direction: Dutch-kitchen porcelain. Delft blue on a cool
   porcelain ground; tulip red and garden green carry meaning,
   never decoration. Hudsonville sits in Dutch West Michigan —
   the palette comes from the kitchen, not from a template.
   ============================================================ */

:root {
  /* ground + surfaces */
  --ground: #eff2f1;
  --surface: #ffffff;
  --surface-2: #f7f9f8;
  --surface-3: #e9eeec;

  /* ink */
  --ink: #14212b;
  --ink-2: #5c6e7a;
  --ink-3: #8798a3;

  /* structure */
  --line: #dce4e3;
  --line-2: #c9d4d2;

  /* the accent + semantics */
  --delft: #2b5b87;
  --delft-soft: #e6eef5;
  --delft-ink: #1d4468;
  --tulip: #ae3a32;
  --tulip-soft: #f8e9e7;
  --leaf: #4b7a47;
  --leaf-soft: #e8f0e6;
  --amber: #b5792a;
  --amber-soft: #f8efe0;

  /* shape */
  --r-sm: 8px;
  --r: 14px;
  --r-lg: 20px;
  --r-pill: 999px;

  /* depth — spent by role, not stamped on everything */
  --shadow-card: 0 1px 2px rgba(20, 33, 43, 0.05);
  --shadow-lift: 0 6px 20px -6px rgba(20, 33, 43, 0.18);
  --shadow-sheet: 0 -12px 40px -12px rgba(20, 33, 43, 0.28);

  /* type */
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;

  /* rhythm */
  --gutter: 18px;
  --tabbar: 68px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101a20;
    --surface: #18242c;
    --surface-2: #1f2d36;
    --surface-3: #253540;
    --ink: #e7eef2;
    --ink-2: #93a7b3;
    --ink-3: #6c818e;
    --line: #27353f;
    --line-2: #354854;
    --delft: #7fb3dd;
    --delft-soft: #1c3244;
    --delft-ink: #a8cded;
    --tulip: #e4796f;
    --tulip-soft: #3a2320;
    --leaf: #8cbf86;
    --leaf-soft: #1e2f1f;
    --amber: #dfac5e;
    --amber-soft: #33281a;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-lift: 0 6px 20px -6px rgba(0, 0, 0, 0.5);
    --shadow-sheet: 0 -12px 40px -12px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --ground: #101a20;
  --surface: #18242c;
  --surface-2: #1f2d36;
  --surface-3: #253540;
  --ink: #e7eef2;
  --ink-2: #93a7b3;
  --ink-3: #6c818e;
  --line: #27353f;
  --line-2: #354854;
  --delft: #7fb3dd;
  --delft-soft: #1c3244;
  --delft-ink: #a8cded;
  --tulip: #e4796f;
  --tulip-soft: #3a2320;
  --leaf: #8cbf86;
  --leaf-soft: #1e2f1f;
  --amber: #dfac5e;
  --amber-soft: #33281a;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-lift: 0 6px 20px -6px rgba(0, 0, 0, 0.5);
  --shadow-sheet: 0 -12px 40px -12px rgba(0, 0, 0, 0.6);
}

/* ---------- base ---------- */

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--delft); text-underline-offset: 2px; }

:focus-visible {
  outline: 2px solid var(--delft);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- app frame ---------- */

.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.view {
  flex: 1;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 20px var(--gutter) calc(var(--tabbar) + 32px);
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- typography roles ---------- */

.display {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.eyebrow {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
}

.muted { color: var(--ink-2); }
.tiny { font-size: 0.82rem; }
.nums { font-variant-numeric: tabular-nums; }

/* Page header: the serif does the talking, once per screen. */
.page-head { display: flex; flex-direction: column; gap: 3px; }
.page-head .title {
  font-family: var(--serif);
  font-size: 2.1rem;
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.015em;
}
.page-head .sub { color: var(--ink-2); font-size: 0.94rem; }

/* Section heading inside a screen */
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  min-height: 24px;
}
.section-head h2 {
  font-size: 0.95rem;
  font-weight: 650;
  letter-spacing: -0.005em;
}
.section-head .aside { font-size: 0.82rem; color: var(--ink-3); }

/* ---------- card ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.card-pad { padding: 16px 16px; }
.card-quiet {
  background: transparent;
  border: 1px solid var(--line);
  box-shadow: none;
}

/* A plain grouped list — the workhorse. Not a card each; one container. */
.rows { display: flex; flex-direction: column; }
.rows > * + * { border-top: 1px solid var(--line); }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  min-height: 52px;
  background: none;
  border: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.row:hover { background: var(--surface-2); }
.row-static { cursor: default; }
.row-static:hover { background: none; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: 0.83rem; color: var(--ink-2); overflow-wrap: anywhere; }
.row-end { flex-shrink: 0; display: flex; align-items: center; gap: 8px; color: var(--ink-3); }

/* ---------- check control (the cleaning list) ---------- */

.check {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 16px;
  min-height: 54px;
  width: 100%;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.check:hover { background: var(--surface-2); }
.check .box {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  border: 1.75px solid var(--line-2);
  display: grid;
  place-items: center;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.check .box svg { width: 15px; height: 15px; opacity: 0; transform: scale(0.7); transition: all 0.15s ease; }
.check[aria-pressed="true"] .box {
  background: var(--leaf);
  border-color: var(--leaf);
  color: var(--surface);
}
:root[data-theme="dark"] .check[aria-pressed="true"] .box,
:root:not([data-theme="light"]) .check[aria-pressed="true"] .box { color: var(--ground); }
.check[aria-pressed="true"] .box svg { opacity: 1; transform: scale(1); }
.check[aria-pressed="true"] .check-text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.check-main { flex: 1; min-width: 0; }
.check-text { line-height: 1.35; overflow-wrap: anywhere; }
.check-min { flex-shrink: 0; font-size: 0.8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- progress meter ---------- */

.meter { display: flex; flex-direction: column; gap: 7px; }
.meter-track {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  border-radius: var(--r-pill);
  background: var(--leaf);
  transition: width 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.meter-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink-2); }

/* ---------- chips ---------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  background: var(--surface-3);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip-delft { background: var(--delft-soft); color: var(--delft-ink); }
.chip-tulip { background: var(--tulip-soft); color: var(--tulip); }
.chip-leaf { background: var(--leaf-soft); color: var(--leaf); }
.chip-amber { background: var(--amber-soft); color: var(--amber); }
:root[data-theme="dark"] .chip-delft,
:root:not([data-theme="light"]) .chip-delft { color: var(--delft); }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* Filter chips are pressable */
.fchip {
  padding: 7px 13px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 0.83rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.14s ease;
}
.fchip:hover { border-color: var(--line-2); }
.fchip[aria-pressed="true"] {
  background: var(--delft);
  border-color: var(--delft);
  color: var(--surface);
}
:root[data-theme="dark"] .fchip[aria-pressed="true"],
:root:not([data-theme="light"]) .fchip[aria-pressed="true"] { color: var(--ground); }

.scroller {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin: 0 calc(var(--gutter) * -1);
  padding-left: var(--gutter);
  padding-right: var(--gutter);
  scrollbar-width: none;
}
.scroller::-webkit-scrollbar { display: none; }

/* ---------- buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 18px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.94rem;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.14s ease;
}
.btn:hover { background: var(--surface-2); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--delft);
  border-color: var(--delft);
  color: #fff;
}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary { color: var(--ground); }
.btn-primary:hover { background: var(--delft-ink); border-color: var(--delft-ink); }
.btn-danger { color: var(--tulip); border-color: var(--line); }
.btn-danger:hover { background: var(--tulip-soft); border-color: var(--tulip); }
.btn-block { width: 100%; }
.btn-sm { min-height: 36px; padding: 0 13px; font-size: 0.85rem; border-radius: var(--r-sm); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* icon-only */
.ibtn {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  border: 0;
  background: none;
  color: var(--ink-3);
  cursor: pointer;
}
.ibtn:hover { background: var(--surface-3); color: var(--ink); }
.ibtn svg { width: 19px; height: 19px; }

.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1; min-width: 130px; }

/* ---------- inputs ---------- */

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }

.input, .textarea, .select {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 0.95rem;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--delft);
  background: var(--surface);
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; font-family: inherit; }
.select { appearance: none; padding-right: 34px; cursor: pointer; }

.quickadd { display: flex; gap: 8px; }
.quickadd .input { flex: 1; }

/* ---------- segmented control ---------- */

.segmented {
  display: flex;
  padding: 3px;
  gap: 3px;
  background: var(--surface-3);
  border-radius: var(--r);
}
.segmented button {
  flex: 1;
  min-height: 38px;
  border: 0;
  border-radius: 11px;
  background: none;
  color: var(--ink-2);
  font-size: 0.88rem;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.16s ease;
}
.segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-card);
}

/* ---------- tab bar / rail ---------- */

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  background: none;
  color: var(--ink-3);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 0;
  transition: color 0.14s ease;
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--delft); }

@media (min-width: 900px) {
  .app { flex-direction: row; }
  .tabbar {
    position: sticky;
    top: 0;
    bottom: auto;
    height: 100dvh;
    width: 218px;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    padding: 26px 14px;
    border-top: 0;
    border-right: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: none;
  }
  .tabbar .brand {
    font-family: var(--serif);
    font-size: 1.28rem;
    color: var(--ink);
    padding: 0 12px 20px;
    line-height: 1.15;
  }
  .tabbar button {
    flex: 0 0 auto;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    min-height: 46px;
    padding: 0 12px;
    border-radius: var(--r);
    font-size: 0.94rem;
    font-weight: 550;
    letter-spacing: 0;
  }
  .tabbar button:hover { background: var(--surface-2); color: var(--ink); }
  .tabbar button[aria-current="page"] { background: var(--delft-soft); color: var(--delft-ink); }
  .view {
    max-width: 1080px;
    padding: 34px 32px 60px;
    gap: 26px;
  }
  .two-col {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 26px;
    align-items: start;
  }
  .two-col > * { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
}
@media (max-width: 899px) {
  .tabbar .brand { display: none; }
  .two-col { display: flex; flex-direction: column; gap: 22px; }
  .two-col > * { display: flex; flex-direction: column; gap: 22px; }
}

/* ---------- sheet (bottom sheet on phone, modal on desktop) ---------- */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(12, 22, 30, 0.42);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 0.18s ease;
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

.sheet {
  width: 100%;
  max-width: 620px;
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-sheet);
  animation: rise 0.22s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.sheet-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 {
  flex: 1;
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 1.15;
  min-width: 0;
  overflow-wrap: anywhere;
}
.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  -webkit-overflow-scrolling: touch;
}
.sheet-foot {
  flex-shrink: 0;
  display: flex;
  gap: 9px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.sheet-foot > .btn { flex: 1; }
.sheet-grip {
  width: 38px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--line-2);
  margin: 8px auto 0;
}
@media (min-width: 900px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: var(--r-lg); max-height: 84dvh; }
  .sheet-grip { display: none; }
}

/* ---------- toast ---------- */

.toasts {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px));
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.toast {
  padding: 10px 16px;
  border-radius: var(--r-pill);
  background: var(--ink);
  color: var(--ground);
  font-size: 0.88rem;
  font-weight: 500;
  box-shadow: var(--shadow-lift);
  animation: rise 0.2s ease;
}
@media (min-width: 900px) { .toasts { bottom: 24px; } }

/* ---------- empty state ---------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
  padding: 30px 20px;
  color: var(--ink-2);
}
.empty .empty-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  color: var(--ink-3);
}
.empty .empty-mark svg { width: 21px; height: 21px; }
.empty p { font-size: 0.9rem; max-width: 34ch; }

/* ---------- banner (mode + status notices) ---------- */

.banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--r);
  background: var(--amber-soft);
  color: var(--ink);
  font-size: 0.85rem;
  line-height: 1.45;
  border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
}
.banner svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 2px; color: var(--amber); }

/* ============================================================
   Today
   ============================================================ */

.sunstrip {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 12px 4px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.sunstrip .cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0 6px;
  min-width: 0;
}
.sunstrip .cell + .cell { border-left: 1px solid var(--line); }
.sunstrip .val { font-size: 0.98rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sunstrip .key { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }

.zone-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 16px 12px;
}
.zone-head .zone-name { font-family: var(--serif); font-size: 1.32rem; font-weight: 400; line-height: 1.15; }

// Almanac -- sun times, Michigan seasonal produce, house tips, birthdays, moon phase.
// Location is fixed: Hudsonville, Michigan. lat 42.8717, lon -85.8639, America/Detroit.
// Pure functions only. No Date.now() inside computations -- always use the passed date.
// Plain top-level const, no IIFE, no export -- the build concatenates all src files
// into one script scope, so helper names below are prefixed to avoid collisions.

const ALMANAC_LAT = 42.8717;
const ALMANAC_LON = -85.8639; // degrees East; negative = West of Greenwich

// ---------------------------------------------------------------------
// small math helpers
// ---------------------------------------------------------------------

function almanacRad(d) { return d * Math.PI / 180; }
function almanacDeg(r) { return r * 180 / Math.PI; }

function almanacNormDate(date) {
  return (date instanceof Date && !isNaN(date.getTime())) ? date : new Date();
}

// ---------------------------------------------------------------------
// sunTimes -- NOAA solar position algorithm (matches the NOAA Solar
// Calculator spreadsheet, https://gml.noaa.gov/grad/solcalc/). Steps:
//
//   1. Julian Day for the calendar date (evaluated at 12:00 UTC -- the
//      declination/equation-of-time change so slowly over a day that
//      using noon instead of the true sunrise/sunset moment costs well
//      under a minute of accuracy).
//   2. Julian Century from J2000.0.
//   3. Geometric mean longitude and mean anomaly of the sun.
//   4. Eccentricity of Earth's orbit.
//   5. Sun's equation of center -> true longitude -> apparent longitude.
//   6. Mean obliquity of the ecliptic, corrected for nutation.
//   7. Solar declination from apparent longitude + obliquity correction.
//   8. Equation of time (minutes) -- clock time vs. sundial time.
//   9. Hour angle for a solar zenith of 90.833 degrees (90deg for the
//      horizon, +50 arcmin for atmospheric refraction, +16 arcmin for
//      the sun's disc radius -- the standard "sunrise/sunset" zenith).
//  10. Solar noon and sunrise/sunset, all expressed directly in minutes
//      from UTC midnight (longitude does all the work here -- no
//      timezone/DST table needed). Converted to a real UTC instant, so
//      the browser's own local-time rendering handles DST correctly.
//
// Cross-check against NOAA's published Grand Rapids-area figures:
//   Jun 21 -> sunrise ~6:02am / sunset ~9:24pm EDT
//   Dec 21 -> sunrise ~8:11am / sunset ~5:15pm EST
// ---------------------------------------------------------------------

function almanacJulianDay(y, m, d) {
  // m is 1-12. Evaluate at 12:00 UTC of the given calendar date.
  const utcNoonMs = Date.UTC(y, m - 1, d, 12, 0, 0);
  return utcNoonMs / 86400000 + 2440587.5; // Unix epoch -> Julian Day
}

function almanacSolarCalc(y, m, d) {
  const JD = almanacJulianDay(y, m, d);
  const T = (JD - 2451545.0) / 36525.0; // Julian century from J2000.0

  // Geometric mean longitude of the sun (deg), 0-360
  let geomMeanLong = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
  if (geomMeanLong < 0) geomMeanLong += 360;

  // Geometric mean anomaly of the sun (deg)
  const geomMeanAnom = 357.52911 + T * (35999.05029 - 0.0001537 * T);

  // Eccentricity of Earth's orbit
  const eccent = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);

  // Sun's equation of center (deg)
  const Mrad = almanacRad(geomMeanAnom);
  const eqOfCtr =
    Math.sin(Mrad) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
    Math.sin(2 * Mrad) * (0.019993 - 0.000101 * T) +
    Math.sin(3 * Mrad) * 0.000289;

  // True and apparent longitude of the sun (deg)
  const trueLong = geomMeanLong + eqOfCtr;
  const omega = 125.04 - 1934.136 * T;
  const appLong = trueLong - 0.00569 - 0.00478 * Math.sin(almanacRad(omega));

  // Mean obliquity of the ecliptic (deg), then corrected for nutation
  const meanObliq =
    23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const obliqCorr = meanObliq + 0.00256 * Math.cos(almanacRad(omega));

  // Solar declination (deg)
  const declin = almanacDeg(Math.asin(Math.sin(almanacRad(obliqCorr)) * Math.sin(almanacRad(appLong))));

  // Equation of time (minutes)
  const y2 = Math.pow(Math.tan(almanacRad(obliqCorr / 2)), 2);
  const geomMeanLongRad = almanacRad(geomMeanLong);
  const eqOfTime = 4 * almanacDeg(
    y2 * Math.sin(2 * geomMeanLongRad) -
    2 * eccent * Math.sin(Mrad) +
    4 * eccent * y2 * Math.sin(Mrad) * Math.cos(2 * geomMeanLongRad) -
    0.5 * y2 * y2 * Math.sin(4 * geomMeanLongRad) -
    1.25 * eccent * eccent * Math.sin(2 * Mrad)
  );

  // Hour angle for sunrise/sunset at zenith 90.833 deg
  const zenith = 90.833;
  const latRad = almanacRad(ALMANAC_LAT);
  const declinRad = almanacRad(declin);
  let haCos = Math.cos(almanacRad(zenith)) / (Math.cos(latRad) * Math.cos(declinRad)) -
    Math.tan(latRad) * Math.tan(declinRad);
  haCos = Math.max(-1, Math.min(1, haCos)); // clamp for polar edge cases
  const haSunrise = almanacDeg(Math.acos(haCos));

  // Solar noon and sunrise/sunset, in minutes from UTC midnight.
  const solarNoonUTC = 720 - 4 * ALMANAC_LON - eqOfTime;
  const sunriseUTC = solarNoonUTC - 4 * haSunrise;
  const sunsetUTC = solarNoonUTC + 4 * haSunrise;

  return { solarNoonUTC: solarNoonUTC, sunriseUTC: sunriseUTC, sunsetUTC: sunsetUTC };
}

function almanacMinutesToDate(y, m, d, minutesFromUtcMidnight) {
  const baseUtcMs = Date.UTC(y, m - 1, d, 0, 0, 0);
  return new Date(baseUtcMs + Math.round(minutesFromUtcMidnight * 60000));
}

function almanacFormatDayLength(sunrise, sunset) {
  const totalMin = Math.round((sunset.getTime() - sunrise.getTime()) / 60000);
  const h = Math.floor(totalMin / 60);
  const mnt = totalMin % 60;
  return h + "h " + mnt + "m";
}

function almanacDateSerial(date) {
  // Monotonic-enough integer per calendar day; stable within a day,
  // changes every day, no timezone math involved.
  return date.getFullYear() * 372 + date.getMonth() * 31 + date.getDate();
}

// nextBirthday -- fixed family table
// ---------------------------------------------------------------------

const ALMANAC_BIRTHDAYS = [
  { name: "Addison", born: { y: 2022, m: 3, d: 20 } },
  { name: "Sophie", born: { y: 2024, m: 7, d: 10 } }
];

function almanacLocalMidnight(y, m, d) {
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}

// ---------------------------------------------------------------------
// moonPhase -- synodic-month approximation from a known new moon epoch
// ---------------------------------------------------------------------

const ALMANAC_SYNODIC_MONTH_DAYS = 29.530588853;
// A known new moon: 2000-01-06 18:14 UTC
const ALMANAC_KNOWN_NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14, 0);

const ALMANAC_MOON_STAGES = [
  { name: "New moon", emoji: "\u{1F311}" },
  { name: "Waxing crescent", emoji: "\u{1F312}" },
  { name: "First quarter", emoji: "\u{1F313}" },
  { name: "Waxing gibbous", emoji: "\u{1F314}" },
  { name: "Full moon", emoji: "\u{1F315}" },
  { name: "Waning gibbous", emoji: "\u{1F316}" },
  { name: "Last quarter", emoji: "\u{1F317}" },
  { name: "Waning crescent", emoji: "\u{1F318}" }
];

// ---------------------------------------------------------------------
// The public API. Plain top-level const object -- no IIFE, no export.
// ---------------------------------------------------------------------

const Almanac = {

  sunTimes: function (date) {
    date = almanacNormDate(date);
    const y = date.getFullYear();
    const m = date.getMonth() + 1;
    const d = date.getDate();

    const calc = almanacSolarCalc(y, m, d);
    const sunrise = almanacMinutesToDate(y, m, d, calc.sunriseUTC);
    const sunset = almanacMinutesToDate(y, m, d, calc.sunsetUTC);
    const solarNoon = almanacMinutesToDate(y, m, d, calc.solarNoonUTC);

    return {
      sunrise: sunrise,
      sunset: sunset,
      dayLength: almanacFormatDayLength(sunrise, sunset),
      solarNoon: solarNoon
    };
  },

  season: function (date) {
    date = almanacNormDate(date);
    const m = date.getMonth(); // 0-11
    if (m >= 2 && m <= 4) return "spring";   // Mar-May
    if (m >= 5 && m <= 7) return "summer";   // Jun-Aug
    if (m >= 8 && m <= 10) return "fall";    // Sep-Nov
    return "winter";                          // Dec-Feb
  },

  inSeason: function (date) {
    date = almanacNormDate(date);
    const m = date.getMonth() + 1;
    const list = ALMANAC_IN_SEASON[m] || ALMANAC_IN_SEASON[1];
    // return a shallow copy so callers can't mutate the source table
    return list.map(function (item) {
      return { name: item.name, emoji: item.emoji, note: item.note };
    });
  },

  tip: function (date) {
    date = almanacNormDate(date);
    const m = date.getMonth() + 1;
    const serial = almanacDateSerial(date);

    let pool = ALMANAC_TIPS.filter(function (t) { return t.months && t.months.indexOf(m) !== -1; });
    if (pool.length === 0) {
      pool = ALMANAC_TIPS.filter(function (t) { return !t.months; });
    }
    if (pool.length === 0) pool = ALMANAC_TIPS; // safety net, should never trigger

    let idx = serial % pool.length;
    if (idx < 0) idx += pool.length;
    const picked = pool[idx];
    return { text: picked.text, tag: picked.tag };
  },

  nextBirthday: function (date) {
    date = almanacNormDate(date);
    const today = almanacLocalMidnight(date.getFullYear(), date.getMonth() + 1, date.getDate());

    let best = null;
    ALMANAC_BIRTHDAYS.forEach(function (person) {
      let occYear = today.getFullYear();
      let occ = almanacLocalMidnight(occYear, person.born.m, person.born.d);
      if (occ.getTime() < today.getTime()) {
        occYear += 1;
        occ = almanacLocalMidnight(occYear, person.born.m, person.born.d);
      }
      const daysAway = Math.round((occ.getTime() - today.getTime()) / 86400000);
      const turning = occYear - person.born.y;
      if (best === null || daysAway < best.daysAway) {
        best = { name: person.name, date: occ, turning: turning, daysAway: daysAway };
      }
    });

    return best;
  },

  moonPhase: function (date) {
    date = almanacNormDate(date);
    const daysSince = (date.getTime() - ALMANAC_KNOWN_NEW_MOON_MS) / 86400000;
    let age = daysSince % ALMANAC_SYNODIC_MONTH_DAYS;
    if (age < 0) age += ALMANAC_SYNODIC_MONTH_DAYS;

    const fraction = age / ALMANAC_SYNODIC_MONTH_DAYS; // 0 = new, 0.5 = full, 1 = new again
    const illum = (1 - Math.cos(2 * Math.PI * fraction)) / 2;

    const stageWidth = ALMANAC_SYNODIC_MONTH_DAYS / 8;
    let stageIdx = Math.floor((age + stageWidth / 2) / stageWidth) % 8;
    if (stageIdx < 0) stageIdx += 8;
    const stage = ALMANAC_MOON_STAGES[stageIdx];

    return { name: stage.name, emoji: stage.emoji, illum: illum };
  }

};

<script>

/* ==== js/00-core.js ========================================================= */
/* ============================================================
   Core — store, db wiring, router, DOM helpers, sheets, toasts.
   Everything the view modules are allowed to touch lives here.
   Zero dependencies. One shared script scope.
   ============================================================ */

/* ---------- paths ---------- */

const DOC_PATHS = {
  config: "config/app",
  routine: "routine/days",
  checks: "checks/recent",
  plan: "plan/current",
  daily: "daily/notes",
};

const COLL_NAMES = ["recipes", "jobs", "projects", "grocery"];

const LOCAL_KEY = "solanyk-house-v1";
const DAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const DAY_ABBR = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

/* ---------- small utilities ---------- */

function uid(prefix) {
  return (
    (prefix || "x") +
    "-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2, 7)
  );
}

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

/* Recursive merge, mirroring what db.update() does server-side so the
   optimistic local copy and the stored copy stay in step. Arrays replace
   wholesale — same rule as the store. */
function deepMerge(target, patch) {
  const out = isPlainObject(target) ? Object.assign({}, target) : {};
  Object.keys(patch || {}).forEach(function (k) {
    const v = patch[k];
    if (isPlainObject(v)) out[k] = deepMerge(out[k], v);
    else out[k] = v;
  });
  return out;
}

function clone(v) {
  return v === undefined ? v : JSON.parse(JSON.stringify(v));
}

/* ---------- Fmt ---------- */

const Fmt = {
  /* Local calendar date, never UTC — a phone in Michigan must agree with
     the wall in the kitchen about what day it is. */
  dayKey: function (d) {
    d = d || new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  },

  fromDayKey: function (key) {
    const p = String(key).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  },

  /* Monday-based index, so it lines up with DAY_KEYS. */
  dayIdx: function (d) {
    d = d || new Date();
    return (d.getDay() + 6) % 7;
  },

  dayName: function (i) {
    return DAY_NAMES[((i % 7) + 7) % 7];
  },

  dayAbbr: function (i) {
    return DAY_ABBR[((i % 7) + 7) % 7];
  },

  /* Monday of the week containing d. */
  weekStart: function (d) {
    d = d || new Date();
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    start.setDate(start.getDate() - Fmt.dayIdx(d));
    return start;
  },

  /* ISO week key, e.g. "2026-W36". */
  weekKey: function (d) {
    const t = Fmt.weekStart(d);
    const thursday = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 3);
    const firstThu = new Date(thursday.getFullYear(), 0, 4);
    firstThu.setDate(firstThu.getDate() - ((firstThu.getDay() + 6) % 7) + 3);
    const week = 1 + Math.round((thursday - firstThu) / (7 * 86400000));
    return thursday.getFullYear() + "-W" + String(week).padStart(2, "0");
  },

  date: function (d, opts) {
    d = d || new Date();
    return d.toLocaleDateString(
      undefined,
      opts || { weekday: "long", month: "long", day: "numeric" }
    );
  },

  shortDate: function (d) {
    return (d || new Date()).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  },

  time: function (d) {
    return (d || new Date()).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  },

  /* "in 3 days" / "yesterday" / "Sep 20" — for job due dates. */
  relDay: function (key) {
    if (!key) return "";
    const then = Fmt.fromDayKey(key);
    const now = Fmt.fromDayKey(Fmt.dayKey());
    const days = Math.round((then - now) / 86400000);
    if (days === 0) return "today";
    if (days === 1) return "tomorrow";
    if (days === -1) return "yesterday";
    if (days < 0) return Math.abs(days) + " days late";
    if (days <= 14) return "in " + days + " days";
    return Fmt.shortDate(then);
  },

  greeting: function (d) {
    const h = (d || new Date()).getHours();
    if (h < 5) return "Still up";
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    if (h < 21) return "Good evening";
    return "Good night";
  },

  minutes: function (n) {
    n = Number(n) || 0;
    if (n < 60) return n + " min";
    const h = Math.floor(n / 60);
    const m = n % 60;
    return m ? h + "h " + m + "m" : h + "h";
  },
};

/* ---------- Store ---------- */

const Store = (function () {
  let db = null;
  let mode = "local";
  const docs = { config: {}, routine: {}, checks: {}, plan: {}, daily: {} };
  const docExists = {};
  const docQueue = {};
  const colls = { recipes: {}, jobs: {}, projects: {}, grocery: {} };
  const listeners = [];
  let readyResolve;
  const ready = new Promise(function (r) {
    readyResolve = r;
  });
  let settled = false;

  function emit() {
    listeners.slice().forEach(function (fn) {
      try {
        fn();
      } catch (e) {
        console.error("store listener failed", e);
      }
    });
  }

  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify({ docs: docs, colls: colls }));
    } catch (e) {
      /* private window, quota, or blocked site data — the app still works,
         it just will not remember on this device. */
    }
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!isPlainObject(parsed)) return false;
      Object.keys(docs).forEach(function (k) {
        if (isPlainObject(parsed.docs && parsed.docs[k])) docs[k] = parsed.docs[k];
      });
      COLL_NAMES.forEach(function (k) {
        if (isPlainObject(parsed.colls && parsed.colls[k])) colls[k] = parsed.colls[k];
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  function applySeeds() {
    if (!Object.keys(docs.routine || {}).length) docs.routine = clone(SEED_ROUTINE);
    if (!Object.keys(docs.config || {}).length) docs.config = clone(SEED_CONFIG);
    if (!Object.keys(colls.recipes).length) {
      SEED_RECIPES.forEach(function (r) {
        colls.recipes[r.id] = clone(r);
      });
    }
    if (!Object.keys(colls.jobs).length) {
      SEED_JOBS.forEach(function (j) {
        colls.jobs[j.id] = clone(j);
      });
    }
    if (!Object.keys(colls.projects).length) {
      SEED_PROJECTS.forEach(function (p) {
        colls.projects[p.id] = clone(p);
      });
    }
  }

  function settle() {
    if (settled) return;
    settled = true;
    readyResolve();
  }

  /* --- cloud --- */

  function subscribeDoc(key) {
    const path = DOC_PATHS[key];
    db.doc(path).onSnapshot(
      function (snap) {
        docExists[key] = snap.exists;
        docs[key] = snap.exists ? clone(snap.data()) || {} : {};
        saveLocal();
        emit();
      },
      function (err) {
        console.warn("doc subscription ended", path, err && err.code);
      }
    );
  }

  function subscribeColl(name) {
    db.collection(name).onSnapshot(
      function (snap) {
        const next = {};
        snap.docs.forEach(function (d) {
          next[d.id] = clone(d.data()) || {};
        });
        colls[name] = next;
        saveLocal();
        emit();
      },
      function (err) {
        console.warn("collection subscription ended", name, err && err.code);
      }
    );
  }

  function wait(ms) {
    return new Promise(function (r) {
      setTimeout(r, ms);
    });
  }

  /* First device to open the artifact writes the starting content. The lease
     stops two phones opening it at once from both seeding.

     routine/days is written LAST and is the "already seeded" marker, so a run
     that dies halfway (a dropped connection, a rate limit) leaves the marker
     unwritten and the next open picks up where it left off instead of
     stranding the family with half a recipe box. */
  async function seedCloudIfEmpty() {
    const routineRef = db.doc(DOC_PATHS.routine);
    if ((await routineRef.get()).exists) return;

    const lease = await db.doc("config/seed").acquire({ holder: "seed", ttlMs: 120000 });
    if (!lease.acquired) return;
    if ((await routineRef.get()).exists) return;

    let n = 0;
    async function seedOne(coll, item) {
      const body = clone(item);
      delete body.id;
      const ref = db.collection(coll).doc(item.id);
      if ((await ref.get()).exists) return;
      try {
        await ref.set(body);
      } catch (e) {
        if ((e && e.code) !== "unavailable" && (e && e.code) !== "resource_exhausted") throw e;
        await wait(700);
        await ref.set(body);
      }
      /* The per-viewer call rate is a real budget; 54 writes back to back
         will trip it. Breathe every so often. */
      if (++n % 8 === 0) await wait(220);
    }

    for (const r of SEED_RECIPES) await seedOne("recipes", r);
    for (const j of SEED_JOBS) await seedOne("jobs", j);
    for (const p of SEED_PROJECTS) await seedOne("projects", p);

    await db.doc(DOC_PATHS.config).set(clone(SEED_CONFIG));
    await routineRef.set(clone(SEED_ROUTINE));
  }

  async function connect() {
    loadLocal();
    applySeeds();
    emit();

    let handle = null;
    try {
      handle = await claude.use("db");
    } catch (e) {
      handle = null;
    }

    if (!handle) {
      mode = "local";
      settle();
      emit();
      return;
    }

    db = handle;
    mode = "cloud";

    try {
      await seedCloudIfEmpty();
    } catch (e) {
      console.warn("seeding skipped", e && e.code);
    }

    Object.keys(DOC_PATHS).forEach(subscribeDoc);
    COLL_NAMES.forEach(subscribeColl);

    /* Snapshots arrive on their own; do not block the first paint on them. */
    setTimeout(settle, 600);
    emit();
  }

  function write(fn, label) {
    if (mode !== "cloud" || !db) {
      saveLocal();
      return Promise.resolve();
    }
    return fn().catch(function (err) {
      const code = (err && err.code) || "unavailable";
      if (code === "quota_exceeded") {
        UI.toast("The family store is full. Delete some old items first.");
      } else if (code === "revoked" || code === "not_granted") {
        mode = "local";
        UI.toast("Saved on this device only.");
      } else {
        UI.toast("Could not save " + (label || "that") + ". Try again.");
      }
      saveLocal();
    });
  }

  return {
    get mode() {
      return mode;
    },
    ready: ready,
    connect: connect,

    get: function (key) {
      return docs[key] || {};
    },

    setDoc: function (key, body) {
      docs[key] = clone(body) || {};
      saveLocal();
      emit();
      const full = clone(docs[key]);
      const prior = docQueue[key] || Promise.resolve();
      const next = prior.then(function () {
        if (mode !== "cloud" || !db) return;
        return db
          .doc(DOC_PATHS[key])
          .set(full)
          .then(function () {
            docExists[key] = true;
          });
      });
      docQueue[key] = next.catch(function () {});
      return write(function () {
        return next;
      }, "changes");
    },

    /* Merge a patch into one of the date-keyed documents. Two phones ticking
       different boxes must both stick, which is what update()'s recursive
       merge gives us — but update() rejects when the document does not exist
       yet, and a first-tap-of-the-day burst can fire several merges before the
       creating write lands. So writes for a key are chained: the first one
       creates, the rest merge, in order. */
    mergeDoc: function (key, patch) {
      docs[key] = deepMerge(docs[key], patch);
      saveLocal();
      emit();
      const full = clone(docs[key]);
      const body = clone(patch);
      const prior = docQueue[key] || Promise.resolve();
      const next = prior.then(function () {
        if (mode !== "cloud" || !db) return;
        const ref = db.doc(DOC_PATHS[key]);
        if (docExists[key]) return ref.update(body);
        return ref.set(full).then(function () {
          docExists[key] = true;
        });
      });
      docQueue[key] = next.catch(function () {});
      return write(function () {
        return next;
      }, "changes");
    },

    list: function (name) {
      const bag = colls[name] || {};
      return Object.keys(bag).map(function (id) {
        return Object.assign({ id: id }, bag[id]);
      });
    },

    item: function (name, id) {
      const body = (colls[name] || {})[id];
      return body ? Object.assign({ id: id }, body) : null;
    },

    put: function (name, id, body) {
      const docId = id || uid(name.slice(0, 3));
      const stored = clone(body) || {};
      delete stored.id;
      colls[name][docId] = stored;
      saveLocal();
      emit();
      write(function () {
        return db.collection(name).doc(docId).set(clone(stored));
      }, "that");
      return docId;
    },

    patch: function (name, id, patch) {
      const current = colls[name][id];
      if (!current) return Promise.resolve();
      const merged = deepMerge(current, patch);
      delete merged.id;
      colls[name][id] = merged;
      saveLocal();
      emit();
      return write(function () {
        return db.collection(name).doc(id).set(clone(merged));
      }, "that");
    },

    remove: function (name, id) {
      delete colls[name][id];
      saveLocal();
      emit();
      return write(function () {
        return db.collection(name).doc(id).delete();
      }, "the delete");
    },

    on: function (fn) {
      listeners.push(fn);
      return function () {
        const i = listeners.indexOf(fn);
        if (i >= 0) listeners.splice(i, 1);
      };
    },
  };
})();

/* ---------- UI ---------- */

const UI = (function () {
  /* Ephemeral view state that must survive a re-render (open filters,
     which segment is showing). Never persisted. */
  const state = {};

  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    const p = props || {};
    Object.keys(p).forEach(function (key) {
      const val = p[key];
      if (val === null || val === undefined || val === false) return;
      if (key === "class") el.className = val;
      else if (key === "text") el.textContent = val;
      else if (key === "style") Object.assign(el.style, val);
      else if (key === "on") {
        Object.keys(val).forEach(function (evt) {
          el.addEventListener(evt, val[evt]);
        });
      } else if (key === "data") {
        Object.keys(val).forEach(function (d) {
          el.dataset[d] = val[d];
        });
      } else if (key === "svg") {
        el.innerHTML = val;
      } else if (val === true) {
        el.setAttribute(key, "");
      } else {
        el.setAttribute(key, String(val));
      }
    });
    appendAll(el, children);
    return el;
  }

  function appendAll(el, kids) {
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) return appendAll(el, c);
      el.appendChild(typeof c === "object" && c.nodeType ? c : document.createTextNode(String(c)));
    });
  }

  function icon(name, size) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.9");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    if (size) {
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
    }
    svg.innerHTML = ICON_PATHS[name] || ICON_PATHS.info;
    return svg;
  }

  /* --- sheets --- */

  const openSheets = [];

  function sheet(opts) {
    const o = opts || {};
    const body = h("div", { class: "sheet-body" });
    appendAll(body, [o.body]);

    const head = h(
      "div",
      { class: "sheet-head" },
      h("h2", { text: o.title || "" }),
      h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Close",
          on: { click: function () { close(); } },
        },
        icon("x")
      )
    );

    const panel = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
    panel.appendChild(h("div", { class: "sheet-grip" }));
    panel.appendChild(head);
    panel.appendChild(body);

    if (o.actions && o.actions.length) {
      const foot = h("div", { class: "sheet-foot" });
      appendAll(foot, o.actions);
      panel.appendChild(foot);
    }

    const scrim = h("div", {
      class: "scrim",
      on: {
        click: function (e) {
          if (e.target === scrim) close();
        },
      },
    });
    scrim.appendChild(panel);

    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      const i = openSheets.indexOf(api);
      if (i >= 0) openSheets.splice(i, 1);
      scrim.remove();
      if (!openSheets.length) document.body.style.overflow = "";
      if (o.onClose) o.onClose();
    }

    const api = {
      close: close,
      el: panel,
      setBody: function (node) {
        body.textContent = "";
        appendAll(body, [node]);
      },
      scrollTop: function () {
        body.scrollTop = 0;
      },
    };

    document.body.appendChild(scrim);
    document.body.style.overflow = "hidden";
    openSheets.push(api);

    const focusable = panel.querySelector("input, textarea, button.btn-primary");
    if (focusable && window.matchMedia("(min-width: 900px)").matches) focusable.focus();

    return api;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && openSheets.length) openSheets[openSheets.length - 1].close();
  });

  function confirmSheet(message, opts) {
    const o = opts || {};
    return new Promise(function (resolve) {
      let answered = false;
      const s = sheet({
        title: o.title || "Are you sure?",
        body: h("p", { class: "muted", text: message }),
        actions: [
          h(
            "button",
            {
              class: "btn",
              type: "button",
              on: { click: function () { answered = true; s.close(); resolve(false); } },
            },
            "Keep it"
          ),
          h(
            "button",
            {
              class: "btn " + (o.danger ? "btn-danger" : "btn-primary"),
              type: "button",
              on: { click: function () { answered = true; s.close(); resolve(true); } },
            },
            o.confirmText || "Yes, do it"
          ),
        ],
        onClose: function () {
          if (!answered) resolve(false);
        },
      });
    });
  }

  /* --- toasts --- */

  let toastHost = null;
  function toast(msg) {
    if (!toastHost) {
      toastHost = h("div", { class: "toasts" });
      document.body.appendChild(toastHost);
    }
    const t = h("div", { class: "toast", text: msg });
    toastHost.appendChild(t);
    setTimeout(function () {
      t.style.transition = "opacity .3s ease";
      t.style.opacity = "0";
      setTimeout(function () { t.remove(); }, 320);
    }, 2400);
  }

  /* --- composed bits every view reuses --- */

  function empty(iconName, line, action) {
    return h(
      "div",
      { class: "empty" },
      h("div", { class: "empty-mark" }, icon(iconName)),
      h("p", { text: line }),
      action || null
    );
  }

  function section(title, aside, ...children) {
    const head = h("div", { class: "section-head" }, h("h2", { text: title }));
    if (aside) head.appendChild(aside.nodeType ? aside : h("span", { class: "aside", text: aside }));
    return h("section", { class: "section" }, head, ...children);
  }

  function chip(text, tone) {
    return h("span", { class: "chip" + (tone ? " chip-" + tone : ""), text: text });
  }

  function meter(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return h(
      "div",
      { class: "meter" },
      h(
        "div",
        { class: "meter-track" },
        h("div", { class: "meter-fill", style: { width: pct + "%" } })
      ),
      h(
        "div",
        { class: "meter-label" },
        h("span", { text: done + " of " + total + " done" }),
        h("span", { class: "nums", text: pct + "%" })
      )
    );
  }

  return {
    h: h,
    icon: icon,
    sheet: sheet,
    confirm: confirmSheet,
    toast: toast,
    empty: empty,
    section: section,
    chip: chip,
    meter: meter,
    state: state,
  };
})();

/* ---------- Ask (the sample capability) ---------- */

const Ask = (function () {
  let sample = null;
  let resolved = false;

  async function init() {
    try {
      sample = await claude.use("sample");
    } catch (e) {
      sample = null;
    }
    resolved = true;
  }

  function available() {
    return resolved && !!sample;
  }

  function handle(err) {
    const code = (err && err.code) || "";
    if (code === "not_granted") {
      sample = null;
      return "Claude is not available here.";
    }
    if (code === "rate_limited") return "Too many questions at once. Give it a minute.";
    if (code === "cancelled") return "";
    return "Claude could not answer that. Try again.";
  }

  return {
    init: init,
    available: available,
    text: async function (prompt, opts) {
      if (!sample) throw new Error("unavailable");
      const res = await sample(prompt, opts || {});
      return res.text;
    },
    json: async function (prompt, opts) {
      if (!sample) throw new Error("unavailable");
      return sample.json(prompt, opts || {});
    },
    message: handle,
  };
})();

/* ---------- Router ---------- */

const Router = (function () {
  const routes = {};
  let current = "today";
  let host = null;
  let pending = false;

  function on(name, render) {
    routes[name] = render;
  }

  /* A re-render replaces the whole view, so anything the person was typing
     into would lose focus and caret. Views mark such inputs with data-keep
     and this puts them back exactly as they were. */
  function captureFocus() {
    const el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.keep) return null;
    if (!host || !host.contains(el)) return null;
    return {
      key: el.dataset.keep,
      value: el.value,
      start: el.selectionStart,
      end: el.selectionEnd,
    };
  }

  function restoreFocus(snap) {
    if (!snap || !host) return;
    const el = host.querySelector('[data-keep="' + snap.key + '"]');
    if (!el) return;
    if (snap.value !== undefined && el.value !== undefined) el.value = snap.value;
    el.focus();
    try {
      if (snap.start !== null && el.setSelectionRange) el.setSelectionRange(snap.start, snap.end);
    } catch (e) {
      /* number and date inputs refuse setSelectionRange; harmless */
    }
  }

  function paint() {
    pending = false;
    if (!host) return;
    const render = routes[current] || routes.today;
    const snap = captureFocus();
    const scroll = window.scrollY;
    const view = document.createElement("div");
    view.className = "view";
    try {
      render(view);
    } catch (e) {
      console.error("view failed", current, e);
      view.appendChild(
        UI.empty("alert", "Something in this screen broke. Switching tabs and back usually clears it.")
      );
    }
    host.replaceChildren(view);
    restoreFocus(snap);
    if (scroll) window.scrollTo(0, scroll);
    document.querySelectorAll(".tabbar button[data-route]").forEach(function (b) {
      if (b.dataset.route === current) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(paint);
  }

  return {
    on: on,
    mount: function (el) {
      host = el;
    },
    go: function (name) {
      if (!routes[name]) return;
      const changed = current !== name;
      current = name;
      if (changed) window.scrollTo(0, 0);
      paint();
    },
    current: function () {
      return current;
    },
    refresh: schedule,
  };
})();


/* ==== js/10-today.js ========================================================= */
/* ============================================================
   Today — the page Kenzie opens at 7am.
   Pure function of the store: header, sun strip, today's cleaning,
   tonight's dinner, needs attention, good to know.
   Defines exactly one global: Router.on("today", ...).
   ============================================================ */

(function () {
  const ASK_LOADING_KEY = "todayAskLoading";

  const DONE_LINES = [
    "Every box checked. Go put your feet up for a few minutes.",
    "That's the whole list — nicely done.",
    "All done here. The house says thank you.",
    "Kitchen's clean, kids are fed, the day's ahead of you now.",
  ];

  function stableIndex(key, len) {
    let h = 0;
    const s = String(key);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % len;
  }

  /* ---------- header ---------- */

  function renderHeader(now) {
    return UI.h(
      "div",
      { class: "page-head" },
      UI.h("div", { class: "eyebrow", text: Fmt.greeting(now) }),
      UI.h("div", { class: "title", text: Fmt.dayName(Fmt.dayIdx(now)) }),
      UI.h("div", {
        class: "sub",
        text: Fmt.date(now, { month: "long", day: "numeric", year: "numeric" }),
      })
    );
  }

  /* ---------- sun strip ---------- */

  function sunCell(val, key) {
    return UI.h(
      "div",
      { class: "cell" },
      UI.h("div", { class: "val", text: val }),
      UI.h("div", { class: "key", text: key })
    );
  }

  function renderSunStrip(now) {
    let sun;
    try {
      sun = Almanac.sunTimes(now);
    } catch (e) {
      sun = null;
    }
    let moon;
    try {
      moon = Almanac.moonPhase(now);
    } catch (e) {
      moon = null;
    }

    const cells = [];
    if (sun) {
      cells.push(sunCell(Fmt.time(sun.sunrise), "Sunrise"));
      cells.push(sunCell(Fmt.time(sun.sunset), "Sunset"));
      cells.push(sunCell(sun.dayLength, "Daylight"));
    }
    if (moon) {
      cells.push(sunCell(moon.emoji + " " + moon.name, "Moon"));
    }
    if (!cells.length) return null;
    return UI.h("div", { class: "sunstrip" }, cells);
  }

  /* ---------- today's cleaning ---------- */

  function checkRow(task) {
    return UI.h(
      "button",
      {
        class: "check",
        type: "button",
        "aria-pressed": task.done ? "true" : "false",
        on: {
          click: function () {
            House.toggleTask(new Date(), task.id);
          },
        },
      },
      UI.h("span", { class: "box" }, UI.icon("check")),
      UI.h("div", { class: "check-main" }, UI.h("div", { class: "check-text", text: task.text })),
      UI.h("span", { class: "check-min", text: Fmt.minutes(task.min) })
    );
  }

  function renderCleaningCard(now) {
    const tasks = House.todayTasks() || [];
    const body = [];

    if (!tasks.length) {
      body.push(
        UI.empty(
          "broom",
          "No cleaning tasks are set up for today.",
          UI.h(
            "button",
            {
              class: "btn btn-primary",
              type: "button",
              on: {
                click: function () {
                  Router.go("house");
                },
              },
            },
            "Set up the routine"
          )
        )
      );
    } else {
      const doneCount = tasks.filter(function (t) {
        return !!t.done;
      }).length;
      const totalMin = tasks.reduce(function (sum, t) {
        return sum + (Number(t.min) || 0);
      }, 0);

      body.push(
        UI.h(
          "div",
          { class: "zone-head" },
          UI.h(
            "div",
            {},
            UI.h("div", { class: "zone-name", text: House.zoneName(Fmt.dayIdx(now)) }),
            UI.h("div", { class: "zone-sub", text: Fmt.minutes(totalMin) + " total" })
          )
        )
      );
      body.push(UI.h("div", { class: "zone-meter" }, UI.meter(doneCount, tasks.length)));
      body.push(
        UI.h(
          "div",
          { class: "rows" },
          tasks.map(function (t) {
            return checkRow(t);
          })
        )
      );

      if (tasks.length && doneCount === tasks.length) {
        body.push(
          UI.h(
            "div",
            { class: "done-note" },
            UI.icon("check"),
            UI.h("span", { text: DONE_LINES[stableIndex(Fmt.dayKey(now), DONE_LINES.length)] })
          )
        );
      }
    }

    return UI.h("div", { class: "card" }, body);
  }

  /* ---------- tonight's dinner ---------- */

  function renderDinnerSection(now) {
    let slot = null;
    try {
      slot = Plan.slotFor(now);
    } catch (e) {
      slot = null;
    }
    let desc = null;
    try {
      desc = Plan.describe(slot);
    } catch (e) {
      desc = null;
    }
    desc = desc || {};

    const name = desc.name || "Nothing planned yet";
    const sub = desc.name ? desc.sub || "" : "Tap to pick something for tonight";
    const glyph = desc.emoji || "\u{1F372}"; // pot of food, fallback

    const dinnerBtn = UI.h(
      "button",
      {
        class: "dinner",
        type: "button",
        on: {
          click: function () {
            if (slot && slot.kind === "recipe" && slot.recipeId) {
              Recipes.openSheet(slot.recipeId);
            } else {
              Plan.openPicker(now);
            }
          },
        },
      },
      UI.h("div", { class: "glyph", text: glyph }),
      UI.h(
        "div",
        { class: "dinner-main" },
        UI.h("div", { class: "dinner-name", text: name }),
        sub ? UI.h("div", { class: "dinner-sub", text: sub }) : null
      )
    );

    return UI.section("Tonight's dinner", null, UI.h("div", { class: "card" }, dinnerBtn));
  }

  /* ---------- needs attention ---------- */

  function attentionRow(item) {
    const tone = item.tone || "someday";
    return UI.h(
      "button",
      {
        class: "row",
        type: "button",
        on: {
          click: function () {
            if (item.kind === "job") House.openJobs();
            else Router.go("house");
          },
        },
      },
      UI.h("span", { class: "pri-stripe pri-" + tone }),
      UI.h(
        "div",
        { class: "row-main" },
        UI.h("div", { class: "row-title", text: item.title }),
        item.sub ? UI.h("div", { class: "row-sub", text: item.sub }) : null
      ),
      UI.h("span", { class: "row-end" }, UI.icon("chevron", 18))
    );
  }

  function renderAttentionSection(now) {
    let items = [];
    try {
      items = House.attention(now) || [];
    } catch (e) {
      items = [];
    }
    items = items.slice(0, 4);
    if (!items.length) return null;

    return UI.section(
      "Needs attention",
      null,
      UI.h(
        "div",
        { class: "card" },
        UI.h(
          "div",
          { class: "rows" },
          items.map(function (it) {
            return attentionRow(it);
          })
        )
      )
    );
  }

  /* ---------- good to know ---------- */

  function staticRow(iconName, colorVar, text) {
    return UI.h(
      "div",
      { class: "row row-static" },
      UI.h(
        "span",
        {
          style: {
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            width: "22px",
            height: "22px",
            flexShrink: "0",
            color: "var(--" + colorVar + ")",
          },
        },
        UI.icon(iconName, 18)
      ),
      UI.h("div", { class: "row-main" }, UI.h("div", { class: "row-title", text: text }))
    );
  }

  function buildAskPrompt(now, zoneName, tasks, dinnerLine, jobLines, season, inSeasonNames) {
    return (
      "Today is " +
      Fmt.date(now) +
      " in Hudsonville, Michigan. It's " +
      season +
      ". In season: " +
      (inSeasonNames.length ? inSeasonNames.join(", ") : "nothing notable") +
      ". Today's cleaning zone is \"" +
      zoneName +
      "\" (" +
      tasks.length +
      " tasks). Tonight's dinner: " +
      dinnerLine +
      ". Most pressing jobs: " +
      (jobLines.length ? jobLines.join("; ") : "none pending") +
      ". Give 2-3 short, concrete suggestions for what today specifically needs. " +
      "Under 60 words total. No preamble, no markdown."
    );
  }

  function renderAskBlock(now) {
    if (!Ask.available()) return null;

    const dayKey = Fmt.dayKey(now);
    const daily = Store.get("daily") || {};
    const existing = daily[dayKey] && daily[dayKey].tip;

    function askClaude() {
      UI.state[ASK_LOADING_KEY] = true;
      Router.refresh();

      let zoneName = "";
      let tasks = [];
      try {
        tasks = House.todayTasks() || [];
        zoneName = House.zoneName(Fmt.dayIdx(now));
      } catch (e) {
        tasks = [];
      }

      let dinnerLine = "nothing planned";
      try {
        const slot = Plan.slotFor(now);
        const desc = Plan.describe(slot) || {};
        if (desc.name) dinnerLine = desc.name;
      } catch (e) {
        /* leave default */
      }

      let jobLines = [];
      try {
        jobLines = (House.attention(now) || [])
          .filter(function (a) {
            return a.kind === "job";
          })
          .slice(0, 2)
          .map(function (a) {
            return a.title;
          });
      } catch (e) {
        jobLines = [];
      }

      let season = "";
      let inSeasonNames = [];
      try {
        season = Almanac.season(now);
        inSeasonNames = (Almanac.inSeason(now) || []).map(function (i) {
          return i.name;
        });
      } catch (e) {
        /* leave defaults */
      }

      const prompt = buildAskPrompt(now, zoneName, tasks, dinnerLine, jobLines, season, inSeasonNames);

      Ask.text(prompt, {})
        .then(function (text) {
          UI.state[ASK_LOADING_KEY] = false;
          const patch = {};
          patch[dayKey] = { tip: text };
          Store.mergeDoc("daily", patch);
        })
        .catch(function (err) {
          UI.state[ASK_LOADING_KEY] = false;
          UI.toast(Ask.message(err));
          Router.refresh();
        });
    }

    if (existing) {
      return UI.h(
        "div",
        { class: "tipcard" },
        UI.h("div", { class: "eyebrow", text: "From Claude" }),
        UI.h("div", { class: "tip-text", text: existing }),
        UI.h(
          "button",
          {
            class: "btn btn-sm",
            type: "button",
            on: { click: askClaude },
          },
          "Ask again"
        )
      );
    }

    if (UI.state[ASK_LOADING_KEY]) {
      return UI.h(
        "div",
        { class: "thinking" },
        UI.h("div", { class: "spinner" }),
        UI.h("span", { text: "Thinking about today…" })
      );
    }

    return UI.h(
      "button",
      {
        class: "btn btn-block",
        type: "button",
        on: { click: askClaude },
      },
      "Ask Claude what today needs"
    );
  }

  function renderGoodToKnowSection(now) {
    const body = [];

    let inSeason = [];
    try {
      inSeason = (Almanac.inSeason(now) || []).slice(0, 4);
    } catch (e) {
      inSeason = [];
    }
    if (inSeason.length) {
      body.push(
        UI.h("div", { class: "eyebrow", style: { padding: "14px 16px 0" }, text: "In season in Michigan" })
      );
      body.push(
        UI.h(
          "div",
          { class: "produce" },
          inSeason.map(function (item) {
            return UI.h(
              "div",
              { class: "produce-item" },
              UI.h("span", { class: "p-emoji", text: item.emoji }),
              UI.h(
                "div",
                {},
                UI.h("div", { class: "p-name", text: item.name }),
                UI.h("div", { class: "p-note", text: item.note })
              )
            );
          })
        )
      );
    }

    let birthday = null;
    try {
      birthday = Almanac.nextBirthday(now);
    } catch (e) {
      birthday = null;
    }
    if (birthday && typeof birthday.daysAway === "number" && birthday.daysAway <= 45) {
      const tail = birthday.daysAway === 0 ? "today!" : "in " + birthday.daysAway + " days";
      body.push(staticRow("gift", "amber", birthday.name + " turns " + birthday.turning + " " + tail));
    }

    const config = Store.get("config") || {};
    if (typeof config.trashDay === "number") {
      const dow = now.getDay();
      const tomorrow = (dow + 1) % 7;
      if (dow === config.trashDay || tomorrow === config.trashDay) {
        body.push(staticRow("trash", "delft", "Trash goes out tonight"));
      }
    }

    let tip = null;
    try {
      tip = Almanac.tip(now);
    } catch (e) {
      tip = null;
    }
    if (tip) {
      body.push(
        UI.h(
          "div",
          { class: "tipcard" },
          UI.h("div", { class: "eyebrow", text: tip.tag }),
          UI.h("div", { class: "tip-text", text: tip.text })
        )
      );
    }

    const askBlock = renderAskBlock(now);
    if (askBlock) body.push(askBlock);

    if (!body.length) return null;

    return UI.section("Good to know", null, UI.h("div", { class: "card" }, body));
  }

  /* ---------- render ---------- */

  function renderToday(root) {
    const now = new Date();

    root.appendChild(renderHeader(now));

    const strip = renderSunStrip(now);
    if (strip) root.appendChild(strip);

    const left = UI.h("div", {}, renderCleaningCard(now), renderDinnerSection(now));
    const right = UI.h("div", {}, renderAttentionSection(now), renderGoodToKnowSection(now));

    root.appendChild(UI.h("div", { class: "two-col" }, left, right));
  }

  Router.on("today", renderToday);
})();


/* ==== js/20-meals.js ========================================================= */
/* ============================================================
   Meals — the week's dinners + the grocery list.
   Plain DOM, zero dependencies. Defines exactly three globals:
   the Router.on("meals", …) registration, Plan, and Grocery.
   Everything else lives inside this IIFE so it can never collide
   with a helper of the same name in another view module.
   ============================================================ */

(function () {
  /* ---------- grocery aisle categorization ---------- */

  const CAT_ORDER = ["Produce", "Meat", "Dairy", "Bakery", "Frozen", "Pantry", "Other"];

  const STAPLES = [
    { item: "Whole milk", qty: "3 gallons", store: "Meijer", cat: "Dairy" },
    { item: "Greek yogurt", qty: "5 tubs", store: "Meijer", cat: "Dairy" },
  ];

  /* Keyword table, cheapest-and-most-specific-first so a jarred sauce
     doesn't get mistaken for the vegetable in its name ("canned diced
     tomatoes" should land in Pantry, not Produce). Doesn't have to be
     perfect — just right most of the time. */
  function categorize(name) {
    const n = (name || "").toLowerCase();

    if (n.indexOf("frozen") >= 0) return "Frozen";

    const pantry = [
      "canned", "jar", "sauce", "salsa", "pesto", "marinara", "bbq",
      "ketchup", "mustard", "broth", "miso", "stock", "yeast", "cornstarch",
      "baking", "spice", "seasoning", "oil", "vinegar", "syrup", "pasta",
      "noodle", "rice", "flour", "sugar", "cracker", "cereal", "bean",
      "chip", "nut",
    ];
    for (let i = 0; i < pantry.length; i++) {
      if (n.indexOf(pantry[i]) >= 0) return "Pantry";
    }

    const meat = [
      "chicken", "beef", "steak", "pork", "sausage", "bacon", "turkey",
      "ham", "rib", "shrimp", "salmon", "fish", "cod", "tilapia", "meat",
      "roast",
    ];
    for (let i = 0; i < meat.length; i++) {
      if (n.indexOf(meat[i]) >= 0) return "Meat";
    }

    const dairy = [
      "milk", "cheese", "yogurt", "cream", "butter", "egg", "mozzarella",
      "parmesan", "ricotta", "cheddar", "feta", "cotija",
    ];
    for (let i = 0; i < dairy.length; i++) {
      if (n.indexOf(dairy[i]) >= 0) return "Dairy";
    }

    const bakery = ["bread", "bun", "bagel", "tortilla", "roll", "dough", "pastry"];
    for (let i = 0; i < bakery.length; i++) {
      if (n.indexOf(bakery[i]) >= 0) return "Bakery";
    }

    const produce = [
      "lettuce", "tomato", "onion", "garlic", "pepper", "broccoli", "potato",
      "carrot", "celery", "spinach", "zucchini", "corn", "avocado", "lime",
      "lemon", "cilantro", "basil", "mushroom", "cabbage", "asparagus",
      "ginger", "cucumber", "kale", "apple", "banana", "thyme", "rosemary",
      "parsley", "dill", "mint",
    ];
    for (let i = 0; i < produce.length; i++) {
      if (n.indexOf(produce[i]) >= 0) return "Produce";
    }

    return "Other";
  }

  /* ---------- Plan ---------- */

  function describeSlot(slot) {
    if (!slot) return { emoji: "", name: "", sub: "" };
    if (slot.kind === "recipe") {
      const r = Recipes.byId(slot.recipeId);
      if (!r) return { emoji: "🍽️", name: "Recipe was deleted", sub: "Tap to pick something else" };
      return {
        emoji: r.emoji || "🍽️",
        name: r.name,
        sub: [r.time, r.source].filter(Boolean).join(" · "),
      };
    }
    if (slot.kind === "text") return { emoji: "🍲", name: slot.title || "", sub: "" };
    if (slot.kind === "out") return { emoji: "🍴", name: "Eating out", sub: slot.note || "" };
    if (slot.kind === "leftovers") return { emoji: "🥡", name: "Leftovers", sub: "" };
    return { emoji: "", name: "", sub: "" };
  }

  const Plan = {
    week: function (date) {
      date = date || new Date();
      const plan = Store.get("plan");
      return plan[Fmt.weekKey(date)] || {};
    },

    slotFor: function (date) {
      date = date || new Date();
      const week = Plan.week(date);
      return week[DAY_KEYS[Fmt.dayIdx(date)]] || null;
    },

    setSlot: function (date, slot) {
      date = date || new Date();
      const wk = Fmt.weekKey(date);
      const dayKey = DAY_KEYS[Fmt.dayIdx(date)];
      const patch = {};
      patch[wk] = {};
      patch[wk][dayKey] = slot;
      Store.mergeDoc("plan", patch);
    },

    clearSlot: function (date) {
      Plan.setSlot(date, null);
    },

    describe: describeSlot,

    openPicker: function (date) {
      date = date || new Date();
      const title = Fmt.dayName(Fmt.dayIdx(date)) + " · " + Fmt.shortDate(date);

      const searchInput = UI.h("input", {
        class: "input",
        type: "text",
        placeholder: "Search recipes, source or tag",
        data: { keep: "plan-search" },
      });

      const resultsHost = UI.h("div", { class: "stack" });

      function finish(slot, msg) {
        Plan.setSlot(date, slot);
        s.close();
        UI.toast(msg);
      }

      function rowFor(r) {
        return UI.h(
          "button",
          { class: "row", type: "button", on: { click: function () { finish({ kind: "recipe", recipeId: r.id }, "Planned"); } } },
          UI.h("span", { class: "slot-emoji", text: r.emoji || "🍽️" }),
          UI.h(
            "span",
            { class: "row-main" },
            UI.h("span", { class: "row-title", text: r.name }),
            UI.h("span", { class: "row-sub", text: r.time || "" })
          )
        );
      }

      function matches(r, q) {
        if (!q) return true;
        const hay = (
          (r.name || "") + " " + (r.source || "") + " " + (r.tags || []).join(" ")
        ).toLowerCase();
        return hay.indexOf(q) >= 0;
      }

      function renderResults() {
        const q = searchInput.value.trim().toLowerCase();
        resultsHost.textContent = "";

        const suggested = (typeof Recipes !== "undefined" && Recipes.suggest(date, 6)) || [];
        resultsHost.appendChild(
          UI.section(
            "Suggested",
            null,
            suggested.length
              ? UI.h("div", { class: "card" }, UI.h("div", { class: "rows" }, suggested.map(rowFor)))
              : UI.h("p", { class: "muted tiny", text: "Nothing suggested yet — add a few recipes to the box." })
          )
        );

        const all = ((typeof Recipes !== "undefined" && Recipes.all()) || []).filter(function (r) {
          return matches(r, q);
        });
        resultsHost.appendChild(
          UI.section(
            q ? "Results" : "All recipes",
            null,
            all.length
              ? UI.h("div", { class: "card" }, UI.h("div", { class: "rows" }, all.map(rowFor)))
              : UI.h("p", { class: "muted tiny", text: "No recipes match that search." })
          )
        );
      }

      searchInput.addEventListener("input", renderResults);

      function showTypeForm() {
        const titleInput = UI.h("input", {
          class: "input",
          type: "text",
          placeholder: "What's for dinner?",
          data: { keep: "plan-type-title" },
        });
        function save() {
          const t = titleInput.value.trim();
          if (!t) return;
          finish({ kind: "text", title: t }, "Planned");
        }
        titleInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); save(); }
        });
        s.setBody(
          UI.h(
            "div",
            { class: "stack" },
            UI.h("div", { class: "field" }, UI.h("label", { text: "Tonight's dinner" }), titleInput),
            UI.h(
              "div",
              { class: "btn-row" },
              UI.h("button", { class: "btn", type: "button", on: { click: function () { s.setBody(body); } } }, "Back"),
              UI.h("button", { class: "btn btn-primary", type: "button", on: { click: save } }, "Save")
            )
          )
        );
        titleInput.focus();
      }

      const quickRow = UI.h(
        "div",
        { class: "inline" },
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish({ kind: "out" }, "Planned"); } } }, "Eating out"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish({ kind: "leftovers" }, "Planned"); } } }, "Leftovers"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: showTypeForm } }, "Type it in"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish(null, "Cleared"); } } }, "Clear this day")
      );

      const body = UI.h("div", { class: "stack" }, searchInput, quickRow, resultsHost);
      var s = UI.sheet({ title: title, body: body });
      renderResults();
    },

    fillWeek: function (date) {
      date = date || new Date();
      const monday = Fmt.weekStart(date);
      const wk = Fmt.weekKey(date);
      const week = Plan.week(date);

      const used = {};
      DAY_KEYS.forEach(function (k) {
        const slot = week[k];
        if (slot && slot.kind === "recipe" && slot.recipeId) used[slot.recipeId] = true;
      });

      function dateForIdx(i) {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);
        return d;
      }

      function firstUnused(d) {
        const list = (typeof Recipes !== "undefined" && Recipes.suggest(d, 20)) || [];
        for (let i = 0; i < list.length; i++) {
          if (!used[list[i].id]) return list[i];
        }
        return null;
      }

      const patch = {};

      /* Saturday is pizza night, first choice a recipe actually named pizza. */
      const SAT = DAY_KEYS[5];
      if (!week[SAT]) {
        const all = (typeof Recipes !== "undefined" && Recipes.all()) || [];
        let pizza = all.find(function (r) { return r.name && r.name.toLowerCase().indexOf("pizza") >= 0; });
        if (pizza && used[pizza.id]) pizza = null;
        const pick = pizza || firstUnused(dateForIdx(5));
        if (pick) {
          patch[SAT] = { kind: "recipe", recipeId: pick.id };
          used[pick.id] = true;
        }
      }

      /* Mon(0), Tue(1), Thu(3), Sun(6) — Wed(2) and Fri(4) stay open on
         purpose, to keep the week to the family's target of five dinners. */
      [0, 1, 3, 6].forEach(function (i) {
        const key = DAY_KEYS[i];
        if (week[key]) return;
        const pick = firstUnused(dateForIdx(i));
        if (!pick) return;
        patch[key] = { kind: "recipe", recipeId: pick.id };
        used[pick.id] = true;
      });

      if (Object.keys(patch).length) {
        const doc = {};
        doc[wk] = patch;
        Store.mergeDoc("plan", doc);
      }

      const finalWeek = deepMerge(week, patch);
      let dinners = 0;
      DAY_KEYS.forEach(function (k) {
        const slot = finalWeek[k];
        if (slot && (slot.kind === "recipe" || slot.kind === "text")) dinners++;
      });
      const open = [];
      if (!finalWeek.wed) open.push("Wednesday");
      if (!finalWeek.fri) open.push("Friday");
      let msg = "Planned " + dinners + (dinners === 1 ? " dinner." : " dinners.");
      if (open.length) msg += " " + open.join(" and ") + " " + (open.length === 1 ? "is" : "are") + " open.";
      UI.toast(msg);
    },
  };

  /* ---------- Grocery ---------- */

  const Grocery = {
    addItem: function (name, opts) {
      const o = opts || {};
      const trimmed = (name || "").trim();
      if (!trimmed) return;
      const existing = Store.list("grocery").find(function (it) {
        return it.name && it.name.trim().toLowerCase() === trimmed.toLowerCase() && !it.done;
      });
      if (existing) {
        UI.toast(trimmed + " is already on the list");
        return;
      }
      Store.put("grocery", null, {
        name: trimmed,
        qty: o.qty || "",
