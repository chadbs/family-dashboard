  truth: "Noah did not shut the door himself. The LORD shut him in, and kept him safe.",
  q: {
    q: "Who shut the door of the ark?",
    options: [["The LORD did", 1], ["Noah did", 0], ["The animals did", 0]],
    teach: "And the LORD shut him in. God is the one who saves, and he keeps his people safe.",
    ref: "Genesis 7:16",
  },
};

</script>
<script>

/* ==== js/00-core.js ========================================================= */
/* ============================================================
   Core — store, db wiring, router, DOM helpers, sheets, toasts.
   Everything the view modules are allowed to touch lives here.
   Zero dependencies. One shared script scope.
   ============================================================ */

/* ---------- paths ---------- */

const DOC_PATHS = {
  config: "config/app",
  routine: "routine/days",
  checks: "checks/recent",
  plan: "plan/current",
  daily: "daily/notes",
  weather: "weather/current",
  rewards: "rewards/state",
  rewardShop: "rewards/shop",
  chores: "chores/board",
  cart: "cart/request",
};

const COLL_NAMES = ["recipes", "jobs", "projects", "grocery"];

const LOCAL_KEY = "solanyk-house-v1";
const DAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const DAY_ABBR = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

/* ---------- small utilities ---------- */

function uid(prefix) {
  return (
    (prefix || "x") +
    "-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2, 7)
  );
}

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

/* Recursive merge, mirroring what db.update() does server-side so the
   optimistic local copy and the stored copy stay in step. Arrays replace
   wholesale — same rule as the store. */
function deepMerge(target, patch) {
  const out = isPlainObject(target) ? Object.assign({}, target) : {};
  Object.keys(patch || {}).forEach(function (k) {
    const v = patch[k];
    if (isPlainObject(v)) out[k] = deepMerge(out[k], v);
    else out[k] = v;
  });
  return out;
}

function clone(v) {
  return v === undefined ? v : JSON.parse(JSON.stringify(v));
}

/* ---------- Fmt ---------- */

const Fmt = {
  /* Local calendar date, never UTC — a phone in Michigan must agree with
     the wall in the kitchen about what day it is. */
  dayKey: function (d) {
    d = d || new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  },

  fromDayKey: function (key) {
    const p = String(key).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  },

  /* Monday-based index, so it lines up with DAY_KEYS. */
  dayIdx: function (d) {
    d = d || new Date();
    return (d.getDay() + 6) % 7;
  },

  dayName: function (i) {
    return DAY_NAMES[((i % 7) + 7) % 7];
  },

  dayAbbr: function (i) {
    return DAY_ABBR[((i % 7) + 7) % 7];
  },

  /* Monday of the week containing d. */
  weekStart: function (d) {
    d = d || new Date();
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    start.setDate(start.getDate() - Fmt.dayIdx(d));
    return start;
  },

  /* ISO week key, e.g. "2026-W36". */
  weekKey: function (d) {
    const t = Fmt.weekStart(d);
    const thursday = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 3);
    const firstThu = new Date(thursday.getFullYear(), 0, 4);
    firstThu.setDate(firstThu.getDate() - ((firstThu.getDay() + 6) % 7) + 3);
    const week = 1 + Math.round((thursday - firstThu) / (7 * 86400000));
    return thursday.getFullYear() + "-W" + String(week).padStart(2, "0");
  },

  date: function (d, opts) {
    d = d || new Date();
    return d.toLocaleDateString(
      undefined,
      opts || { weekday: "long", month: "long", day: "numeric" }
    );
  },

  shortDate: function (d) {
    return (d || new Date()).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  },

  time: function (d) {
    return (d || new Date()).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  },

  /* "in 3 days" / "yesterday" / "Sep 20" — for job due dates. */
  relDay: function (key) {
    if (!key) return "";
    const then = Fmt.fromDayKey(key);
    const now = Fmt.fromDayKey(Fmt.dayKey());
    const days = Math.round((then - now) / 86400000);
    if (days === 0) return "today";
    if (days === 1) return "tomorrow";
    if (days === -1) return "yesterday";
    if (days < 0) return Math.abs(days) + " days late";
    if (days <= 14) return "in " + days + " days";
    return Fmt.shortDate(then);
  },

  greeting: function (d) {
    const h = (d || new Date()).getHours();
    if (h < 5) return "Still up";
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    if (h < 21) return "Good evening";
    return "Good night";
  },

  minutes: function (n) {
    n = Number(n) || 0;
    if (n < 60) return n + " min";
    const h = Math.floor(n / 60);
    const m = n % 60;
    return m ? h + "h " + m + "m" : h + "h";
  },
};

/* ---------- Store ---------- */

const Store = (function () {
  let db = null;
  let mode = "local";
  const docs = {
    config: {},
    routine: {},
    checks: {},
    plan: {},
    daily: {},
    weather: {},
    rewards: {},
    rewardShop: {},
    chores: {},
    cart: {},
  };
  const docExists = {};
  const docQueue = {};
  const colls = { recipes: {}, jobs: {}, projects: {}, grocery: {} };
  const listeners = [];
  let readyResolve;
  const ready = new Promise(function (r) {
    readyResolve = r;
  });
  let settled = false;

  function emit() {
    listeners.slice().forEach(function (fn) {
      try {
        fn();
      } catch (e) {
        console.error("store listener failed", e);
      }
    });
  }

  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify({ docs: docs, colls: colls }));
    } catch (e) {
      /* private window, quota, or blocked site data — the app still works,
         it just will not remember on this device. */
    }
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!isPlainObject(parsed)) return false;
      Object.keys(docs).forEach(function (k) {
        if (isPlainObject(parsed.docs && parsed.docs[k])) docs[k] = parsed.docs[k];
      });
      COLL_NAMES.forEach(function (k) {
        if (isPlainObject(parsed.colls && parsed.colls[k])) colls[k] = parsed.colls[k];
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  function applySeeds() {
    if (!Object.keys(docs.routine || {}).length) docs.routine = clone(SEED_ROUTINE);
    if (!Object.keys(docs.config || {}).length) docs.config = clone(SEED_CONFIG);
    if (typeof SEED_REWARD_SHOP !== "undefined" && !Object.keys(docs.rewardShop || {}).length)
      docs.rewardShop = clone(SEED_REWARD_SHOP);
    if (typeof SEED_REWARD_STATE !== "undefined" && !Object.keys(docs.rewards || {}).length)
      docs.rewards = clone(SEED_REWARD_STATE);
    if (!Object.keys(colls.recipes).length) {
      SEED_RECIPES.forEach(function (r) {
        colls.recipes[r.id] = clone(r);
      });
    }
    if (!Object.keys(colls.jobs).length) {
      SEED_JOBS.forEach(function (j) {
        colls.jobs[j.id] = clone(j);
      });
    }
    if (!Object.keys(colls.projects).length) {
      SEED_PROJECTS.forEach(function (p) {
        colls.projects[p.id] = clone(p);
      });
    }
  }

  function settle() {
    if (settled) return;
    settled = true;
    readyResolve();
  }

  /* --- cloud --- */

  function subscribeDoc(key) {
    const path = DOC_PATHS[key];
    db.doc(path).onSnapshot(
      function (snap) {
        docExists[key] = snap.exists;
        docs[key] = snap.exists ? clone(snap.data()) || {} : {};
        saveLocal();
        emit();
      },
      function (err) {
        console.warn("doc subscription ended", path, err && err.code);
      }
    );
  }

  function subscribeColl(name) {
    db.collection(name).onSnapshot(
      function (snap) {
        const next = {};
        snap.docs.forEach(function (d) {
          next[d.id] = clone(d.data()) || {};
        });
        colls[name] = next;
        saveLocal();
        emit();
      },
      function (err) {
        console.warn("collection subscription ended", name, err && err.code);
      }
    );
  }

  function wait(ms) {
    return new Promise(function (r) {
      setTimeout(r, ms);
    });
  }

  /* --- server mode ---------------------------------------------------
     When the page is served by the family's own dashboard server (the wall
     Surface, reachable from anywhere through its tunnel), the store talks to
     /api/hub instead of the artifact database. Same data shape, no sign-in,
     and the page can reach the backyard sensor because it is same-origin
     with the server that owns it.

     Writes go out as small ops applied onto whatever is on disk right now, so
     two phones editing different things never overwrite each other. */

  let pendingOps = [];
  let flushTimer = null;
  let inFlight = 0;
  let seenVersion = null;

  function pushOp(op) {
    pendingOps.push(op);
    nudge();
    saveLocal();
    if (flushTimer) return Promise.resolve();
    flushTimer = setTimeout(flushOps, 120);
    return Promise.resolve();
  }

  async function flushOps() {
    flushTimer = null;
    if (!pendingOps.length) return;
    const ops = pendingOps;
    pendingOps = [];
    inFlight++;
    try {
      const res = await fetch("/api/hub", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ops: ops }),
      });
      const out = await res.json();
      if (!out || out.ok !== true) throw new Error((out && out.error) || "save failed");
      seenVersion = out.version;
    } catch (e) {
      /* Put them back at the front and try again shortly — a phone that walks
         out of wifi mid-tap must not silently lose the tap. */
      pendingOps = ops.concat(pendingOps);
      UI.toast("Saving when the connection is back...");
      setTimeout(function () {
        if (!flushTimer) flushTimer = setTimeout(flushOps, 10);
      }, 4000);
    } finally {
      inFlight--;
    }
  }

  function applyServerBlob(blob) {
    Object.keys(docs).forEach(function (k) {
      if (blob.docs && isPlainObject(blob.docs[k])) docs[k] = blob.docs[k];
    });
    COLL_NAMES.forEach(function (k) {
      if (blob.colls && isPlainObject(blob.colls[k])) colls[k] = blob.colls[k];
    });
    seenVersion = blob.version;
    saveLocal();
    emit();
  }

  async function serverSeedIfEmpty() {
    if (Object.keys(docs.routine || {}).length) return false;
    const ops = [
      { type: "doc", key: "routine", mode: "set", body: clone(SEED_ROUTINE) },
      { type: "doc", key: "config", mode: "set", body: clone(SEED_CONFIG) },
    ];
    /* The stars carry over from the wall dashboard, balances and streak and
       all. Defined in 50-rewards.js, which has evaluated by the time this
       runs, but guarded so the store never depends on load order. */
    if (typeof SEED_REWARD_SHOP !== "undefined")
      ops.push({ type: "doc", key: "rewardShop", mode: "set", body: clone(SEED_REWARD_SHOP) });
    if (typeof SEED_REWARD_STATE !== "undefined")
      ops.push({ type: "doc", key: "rewards", mode: "set", body: clone(SEED_REWARD_STATE) });
    SEED_RECIPES.forEach(function (r) {
      const b = clone(r);
      delete b.id;
      ops.push({ type: "item", coll: "recipes", id: r.id, mode: "set", body: b });
    });
    SEED_JOBS.forEach(function (j) {
      const b = clone(j);
      delete b.id;
      ops.push({ type: "item", coll: "jobs", id: j.id, mode: "set", body: b });
    });
    SEED_PROJECTS.forEach(function (p) {
      const b = clone(p);
      delete b.id;
      ops.push({ type: "item", coll: "projects", id: p.id, mode: "set", body: b });
    });
    await fetch("/api/hub", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ops: ops }),
    });
    return true;
  }

  /* Poll for other people's changes. Cheap: a version token, and the full
     blob only when it actually moved. Skipped while our own writes are in
     flight so a slow round trip cannot flicker the screen back. */
  async function pollOnce() {
    if (mode !== "server" || inFlight || pendingOps.length) return;
    try {
      const res = await fetch("/api/hub/version", { cache: "no-store" });
      const out = await res.json();
      if (!out || out.version === seenVersion) return;
      const blob = await (await fetch("/api/hub", { cache: "no-store" })).json();
      applyServerBlob(blob);
    } catch (e) {
      /* offline for a moment; the next tick tries again */
    }
  }

  /* How often to ask the server whether anything changed.

     Polling every five seconds around the clock is what a wall screen does
     for 17,280 requests a day, which on its own ate half the hosting
     allowance. So the app leans in when someone is actually using it and
     backs off when nobody is: five seconds for two minutes after any touch
     or write, twenty seconds otherwise, and nothing at all while the tab is
     hidden. A phone in a pocket costs nothing; a phone in a hand feels
     instant; the wall still picks up a change within twenty seconds. */
  const BUSY_MS = 5000;
  const IDLE_MS = 20000;
  const STAY_BUSY_MS = 2 * 60 * 1000;
  let lastTouch = Date.now();
  let lastPoll = 0;

  function nudge() {
    lastTouch = Date.now();
  }

  function startPolling() {
    setInterval(function () {
      if (document.hidden) return;
      const busy = Date.now() - lastTouch < STAY_BUSY_MS;
      const every = busy ? BUSY_MS : IDLE_MS;
      if (Date.now() - lastPoll < every) return;
      lastPoll = Date.now();
      pollOnce();
    }, 2500);

    /* Anything that suggests a person is here: a tap, a key, or the tab
       coming back from a pocket — which also polls immediately, so their
       first glance is current. */
    ["pointerdown", "keydown"].forEach(function (evt) {
      document.addEventListener(evt, nudge, { passive: true, capture: true });
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      nudge();
      lastPoll = Date.now();
      pollOnce();
    });
  }

  async function tryServer() {
    try {
      const ctl = new AbortController();
      const t = setTimeout(function () {
        ctl.abort();
      }, 2500);
      const res = await fetch("/api/hub", { cache: "no-store", signal: ctl.signal });
      clearTimeout(t);
      if (!res.ok) return false;
      const blob = await res.json();
      if (!blob || typeof blob !== "object" || !blob.docs) return false;
      applyServerBlob(blob);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* First device to open the artifact writes the starting content. The lease
     stops two phones opening it at once from both seeding.

     routine/days is written LAST and is the "already seeded" marker, so a run
     that dies halfway (a dropped connection, a rate limit) leaves the marker
     unwritten and the next open picks up where it left off instead of
     stranding the family with half a recipe box. */
  async function seedCloudIfEmpty() {
    const routineRef = db.doc(DOC_PATHS.routine);
    if ((await routineRef.get()).exists) return;

    const lease = await db.doc("config/seed").acquire({ holder: "seed", ttlMs: 120000 });
    if (!lease.acquired) return;
    if ((await routineRef.get()).exists) return;

    let n = 0;
    async function seedOne(coll, item) {
      const body = clone(item);
      delete body.id;
      const ref = db.collection(coll).doc(item.id);
      if ((await ref.get()).exists) return;
      try {
        await ref.set(body);
      } catch (e) {
        if ((e && e.code) !== "unavailable" && (e && e.code) !== "resource_exhausted") throw e;
        await wait(700);
        await ref.set(body);
      }
      /* The per-viewer call rate is a real budget; 54 writes back to back
         will trip it. Breathe every so often. */
      if (++n % 8 === 0) await wait(220);
    }

    for (const r of SEED_RECIPES) await seedOne("recipes", r);
    for (const j of SEED_JOBS) await seedOne("jobs", j);
    for (const p of SEED_PROJECTS) await seedOne("projects", p);

    await db.doc(DOC_PATHS.config).set(clone(SEED_CONFIG));
    await routineRef.set(clone(SEED_ROUTINE));
  }

  async function connect() {
    loadLocal();
    applySeeds();
    emit();

    /* Served by the family's own server? That is the best case: no sign-in,
       and the page can reach the backyard sensor. Try it first. */
    if (typeof fetch === "function" && location.protocol.indexOf("http") === 0) {
      const onServer = await tryServer();
      if (onServer) {
        mode = "server";
        try {
          /* On a brand-new server the blob comes back empty, so seed it and
             read it straight back — otherwise the very first open sits there
             looking empty until the next poll. */
          if (await serverSeedIfEmpty()) await tryServer();
        } catch (e) {
          console.warn("hub seeding skipped", e && e.message);
        }
        startPolling();
        settle();
        emit();
        return;
      }
    }

    let handle = null;
    try {
      handle = await claude.use("db");
    } catch (e) {
      handle = null;
    }

    if (!handle) {
      mode = "local";
      settle();
      emit();
      return;
    }

    db = handle;
    mode = "cloud";

    try {
      await seedCloudIfEmpty();
    } catch (e) {
      console.warn("seeding skipped", e && e.code);
    }

    Object.keys(DOC_PATHS).forEach(subscribeDoc);
    COLL_NAMES.forEach(subscribeColl);

    /* Snapshots arrive on their own; do not block the first paint on them. */
    setTimeout(settle, 600);
    emit();
  }

  function write(fn, label) {
    if (mode !== "cloud" || !db) {
      saveLocal();
      return Promise.resolve();
    }
    return fn().catch(function (err) {
      const code = (err && err.code) || "unavailable";
      if (code === "quota_exceeded") {
        UI.toast("The family store is full. Delete some old items first.");
      } else if (code === "revoked" || code === "not_granted") {
        mode = "local";
        UI.toast("Saved on this device only.");
      } else {
        UI.toast("Could not save " + (label || "that") + ". Try again.");
      }
      saveLocal();
    });
  }

  return {
    get mode() {
      return mode;
    },
    ready: ready,
    connect: connect,
    sync: function () {
      return pollOnce();
    },

    get: function (key) {
      return docs[key] || {};
    },

    setDoc: function (key, body) {
      docs[key] = clone(body) || {};
      saveLocal();
      emit();
      const full = clone(docs[key]);
      if (mode === "server") return pushOp({ type: "doc", key: key, mode: "set", body: full });
      const prior = docQueue[key] || Promise.resolve();
      const next = prior.then(function () {
        if (mode !== "cloud" || !db) return;
        return db
          .doc(DOC_PATHS[key])
          .set(full)
          .then(function () {
            docExists[key] = true;
          });
      });
      docQueue[key] = next.catch(function () {});
      return write(function () {
        return next;
      }, "changes");
    },

    /* Merge a patch into one of the date-keyed documents. Two phones ticking
       different boxes must both stick, which is what update()'s recursive
       merge gives us — but update() rejects when the document does not exist
       yet, and a first-tap-of-the-day burst can fire several merges before the
       creating write lands. So writes for a key are chained: the first one
       creates, the rest merge, in order. */
    mergeDoc: function (key, patch) {
      docs[key] = deepMerge(docs[key], patch);
      saveLocal();
      emit();
      const full = clone(docs[key]);
      const body = clone(patch);
      if (mode === "server") return pushOp({ type: "doc", key: key, mode: "merge", body: body });
      const prior = docQueue[key] || Promise.resolve();
      const next = prior.then(function () {
        if (mode !== "cloud" || !db) return;
        const ref = db.doc(DOC_PATHS[key]);
        if (docExists[key]) return ref.update(body);
        return ref.set(full).then(function () {
          docExists[key] = true;
        });
      });
      docQueue[key] = next.catch(function () {});
      return write(function () {
        return next;
      }, "changes");
    },

    list: function (name) {
      const bag = colls[name] || {};
      return Object.keys(bag).map(function (id) {
        return Object.assign({ id: id }, bag[id]);
      });
    },

    item: function (name, id) {
      const body = (colls[name] || {})[id];
      return body ? Object.assign({ id: id }, body) : null;
    },

    put: function (name, id, body) {
      const docId = id || uid(name.slice(0, 3));
      const stored = clone(body) || {};
      delete stored.id;
      colls[name][docId] = stored;
      saveLocal();
      emit();
      if (mode === "server") {
        pushOp({ type: "item", coll: name, id: docId, mode: "set", body: clone(stored) });
        return docId;
      }
      write(function () {
        return db.collection(name).doc(docId).set(clone(stored));
      }, "that");
      return docId;
    },

    patch: function (name, id, patch) {
      const current = colls[name][id];
      if (!current) return Promise.resolve();
      const merged = deepMerge(current, patch);
      delete merged.id;
      colls[name][id] = merged;
      saveLocal();
      emit();
      if (mode === "server")
        return pushOp({ type: "item", coll: name, id: id, mode: "patch", body: clone(patch) });
      return write(function () {
        return db.collection(name).doc(id).set(clone(merged));
      }, "that");
    },

    remove: function (name, id) {
      delete colls[name][id];
      saveLocal();
      emit();
      if (mode === "server") return pushOp({ type: "item", coll: name, id: id, mode: "delete" });
      return write(function () {
        return db.collection(name).doc(id).delete();
      }, "the delete");
    },

    on: function (fn) {
      listeners.push(fn);
      return function () {
        const i = listeners.indexOf(fn);
        if (i >= 0) listeners.splice(i, 1);
      };
    },
  };
})();

/* ---------- icons ---------- */

const ICON_PATHS = {
  check: '<polyline points="20 6 9 17 4 12"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  chevron: '<polyline points="9 18 15 12 9 6"/>',
  back: '<polyline points="15 18 9 12 15 6"/>',
  down: '<polyline points="6 9 12 15 18 9"/>',

/* ---------- UI ---------- */

const UI = (function () {
  /* Ephemeral view state that must survive a re-render (open filters,
     which segment is showing). Never persisted. */
  const state = {};

  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    const p = props || {};
    Object.keys(p).forEach(function (key) {
      const val = p[key];
      if (val === null || val === undefined || val === false) return;
      if (key === "class") el.className = val;
      else if (key === "text") el.textContent = val;
      else if (key === "style") Object.assign(el.style, val);
      else if (key === "on") {
        Object.keys(val).forEach(function (evt) {
          el.addEventListener(evt, val[evt]);
        });
      } else if (key === "data") {
        Object.keys(val).forEach(function (d) {
          el.dataset[d] = val[d];
        });
      } else if (key === "svg") {
        el.innerHTML = val;
      } else if (val === true) {
        el.setAttribute(key, "");
      } else {
        el.setAttribute(key, String(val));
      }
    });
    appendAll(el, children);
    return el;
  }

  function appendAll(el, kids) {
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) return appendAll(el, c);
      el.appendChild(typeof c === "object" && c.nodeType ? c : document.createTextNode(String(c)));
    });
  }

  function icon(name, size) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.9");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    if (size) {
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
    }
    svg.innerHTML = ICON_PATHS[name] || ICON_PATHS.info;
    return svg;
  }

  /* --- sheets --- */

  const openSheets = [];

  function sheet(opts) {
    const o = opts || {};
    const body = h("div", { class: "sheet-body" });
    appendAll(body, [o.body]);

    const head = h(
      "div",
      { class: "sheet-head" },
      h("h2", { text: o.title || "" }),
      h(
        "button",
        {
          class: "ibtn",
          type: "button",
          "aria-label": "Close",
          on: { click: function () { close(); } },
        },
        icon("x")
      )
    );

    const panel = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
    panel.appendChild(h("div", { class: "sheet-grip" }));
    panel.appendChild(head);
    panel.appendChild(body);

    if (o.actions && o.actions.length) {
      const foot = h("div", { class: "sheet-foot" });
      appendAll(foot, o.actions);
      panel.appendChild(foot);
    }

    const scrim = h("div", {
      class: "scrim",
      on: {
        click: function (e) {
          if (e.target === scrim) close();
        },
      },
    });
    scrim.appendChild(panel);

    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      const i = openSheets.indexOf(api);
      if (i >= 0) openSheets.splice(i, 1);
      scrim.remove();
      if (!openSheets.length) document.body.style.overflow = "";
      if (o.onClose) o.onClose();
    }

    const api = {
      close: close,
      el: panel,
      setBody: function (node) {
        body.textContent = "";
        appendAll(body, [node]);
      },
      scrollTop: function () {
        body.scrollTop = 0;
      },
    };

    document.body.appendChild(scrim);
    document.body.style.overflow = "hidden";
    openSheets.push(api);

    const focusable = panel.querySelector("input, textarea, button.btn-primary");
    if (focusable && window.matchMedia("(min-width: 900px)").matches) focusable.focus();

    return api;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && openSheets.length) openSheets[openSheets.length - 1].close();
  });

  function confirmSheet(message, opts) {
    const o = opts || {};
    return new Promise(function (resolve) {
      let answered = false;
      const s = sheet({
        title: o.title || "Are you sure?",
        body: h("p", { class: "muted", text: message }),
        actions: [
          h(
            "button",
            {
              class: "btn",
              type: "button",
              on: { click: function () { answered = true; s.close(); resolve(false); } },
            },
            "Keep it"
          ),
          h(
            "button",
            {
              class: "btn " + (o.danger ? "btn-danger" : "btn-primary"),
              type: "button",
              on: { click: function () { answered = true; s.close(); resolve(true); } },
            },
            o.confirmText || "Yes, do it"
          ),
        ],
        onClose: function () {
          if (!answered) resolve(false);
        },
      });
    });
  }

  /* --- toasts --- */

  let toastHost = null;
  function toast(msg) {
    if (!toastHost) {
      toastHost = h("div", { class: "toasts" });
      document.body.appendChild(toastHost);
    }
    const t = h("div", { class: "toast", text: msg });
    toastHost.appendChild(t);
    setTimeout(function () {
      t.style.transition = "opacity .3s ease";
      t.style.opacity = "0";
      setTimeout(function () { t.remove(); }, 320);
    }, 2400);
  }

  /* --- composed bits every view reuses --- */

  function empty(iconName, line, action) {
    return h(
      "div",
      { class: "empty" },
      h("div", { class: "empty-mark" }, icon(iconName)),
      h("p", { text: line }),
      action || null
    );
  }

  function section(title, aside, ...children) {
    const head = h("div", { class: "section-head" }, h("h2", { text: title }));
    if (aside) head.appendChild(aside.nodeType ? aside : h("span", { class: "aside", text: aside }));
    return h("section", { class: "section" }, head, ...children);
  }

  function chip(text, tone) {
    return h("span", { class: "chip" + (tone ? " chip-" + tone : ""), text: text });
  }

  function meter(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    return h(
      "div",
      { class: "meter" },
      h(
        "div",
        { class: "meter-track" },
        h("div", { class: "meter-fill", style: { width: pct + "%" } })
      ),
      h(
        "div",
        { class: "meter-label" },
        h("span", { text: done + " of " + total + " done" }),
        h("span", { class: "nums", text: pct + "%" })
      )
    );
  }

  return {
    h: h,
    icon: icon,
    sheet: sheet,
    confirm: confirmSheet,
    toast: toast,
    empty: empty,
    section: section,
    chip: chip,
    meter: meter,
    state: state,
  };
})();

/* ---------- Ask (the sample capability) ---------- */

const Ask = (function () {
  let sample = null;
  let resolved = false;

  async function init() {
    try {
      sample = await claude.use("sample");
    } catch (e) {
      sample = null;
    }
    resolved = true;
  }

  function available() {
    return resolved && !!sample;
  }

  function handle(err) {
    const code = (err && err.code) || "";
    if (code === "not_granted") {
      sample = null;
      return "Claude is not available here.";
    }
    if (code === "rate_limited") return "Too many questions at once. Give it a minute.";
    if (code === "cancelled") return "";
    return "Claude could not answer that. Try again.";
  }

  return {
    init: init,
    available: available,
    text: async function (prompt, opts) {
      if (!sample) throw new Error("unavailable");
      const res = await sample(prompt, opts || {});
      return res.text;
    },
    json: async function (prompt, opts) {
      if (!sample) throw new Error("unavailable");
      return sample.json(prompt, opts || {});
    },
    message: handle,
  };
})();

/* ---------- Router ---------- */

const Router = (function () {
  const routes = {};
  let current = "today";
  let host = null;
  let pending = false;

  function on(name, render) {
    routes[name] = render;
  }

  /* A re-render replaces the whole view, so anything the person was typing
     into would lose focus and caret. Views mark such inputs with data-keep
     and this puts them back exactly as they were. */
  function captureFocus() {
    const el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.keep) return null;
    if (!host || !host.contains(el)) return null;
    return {
      key: el.dataset.keep,
      value: el.value,
      start: el.selectionStart,
      end: el.selectionEnd,
    };
  }

  function restoreFocus(snap) {
    if (!snap || !host) return;
    const el = host.querySelector('[data-keep="' + snap.key + '"]');
    if (!el) return;
    if (snap.value !== undefined && el.value !== undefined) el.value = snap.value;
    el.focus();
    try {
      if (snap.start !== null && el.setSelectionRange) el.setSelectionRange(snap.start, snap.end);
    } catch (e) {
      /* number and date inputs refuse setSelectionRange; harmless */
    }
  }

  function paint() {
    pending = false;
    if (!host) return;
    const render = routes[current] || routes.today;
    const snap = captureFocus();
    const scroll = window.scrollY;
    const view = document.createElement("div");
    view.className = "view";
    try {
      render(view);
    } catch (e) {
      console.error("view failed", current, e);
      view.appendChild(
        UI.empty("alert", "Something in this screen broke. Switching tabs and back usually clears it.")
      );
    }
    host.replaceChildren(view);
    restoreFocus(snap);
    if (scroll) window.scrollTo(0, scroll);
    document.querySelectorAll(".tabbar button[data-route]").forEach(function (b) {
      if (b.dataset.route === current) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  }

  /* A repaint rides requestAnimationFrame so several store writes in a row
     cost one paint. But rAF never fires while the tab is hidden — a phone in
     a pocket, the wall's browser in the background — and without the timer
     below `pending` would stick on and the screen would quietly stop
     updating for the rest of the session. Whichever fires first wins; the
     other finds `pending` already cleared and does nothing. */
  function schedule() {
    if (pending) return;
    pending = true;
    const run = function () {
      if (pending) paint();
    };
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  return {
    on: on,
    mount: function (el) {
      host = el;
    },
    go: function (name) {
      if (!routes[name]) return;
      const changed = current !== name;
      current = name;
      if (changed) window.scrollTo(0, 0);
      paint();
    },
    current: function () {
      return current;
    },
    refresh: schedule,
  };
})();


/* ==== js/05-weather.js ========================================================= */
/* ============================================================
   Weather — the backyard sensor first, the forecast behind it.

   Two ways the numbers arrive:

   * Served from the family's own dashboard server (the normal case), the
     page asks /api/hub/weather, which reads the AcuRite sensor's own
     data/weather.json and adds the Open-Meteo forecast. That is the real
     backyard temperature, the same number the wall shows.

   * Published as a Claude artifact, the page cannot make network calls at
     all, so it falls back to whatever was last written into the store's
     weather document, and says how old that is.

   Either way the card renders or quietly disappears — it never blocks the
   rest of the screen.
   ============================================================ */

const Weather = (function () {
  let live = null;
  let tried = false;

  /* WMO weather codes, as Open-Meteo reports them. */
  const CODES = {
    0: ["Clear", "☀️"],
    1: ["Mostly clear", "🌤️"],
    2: ["Partly cloudy", "⛅"],
    3: ["Overcast", "☁️"],
    45: ["Fog", "🌫️"],
    48: ["Freezing fog", "🌫️"],
    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],
    56: ["Freezing drizzle", "🌧️"],
    57: ["Freezing drizzle", "🌧️"],
    61: ["Light rain", "🌦️"],
    63: ["Rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],
    66: ["Freezing rain", "🌧️"],
    67: ["Freezing rain", "🌧️"],
    71: ["Light snow", "🌨️"],
    73: ["Snow", "🌨️"],
    75: ["Heavy snow", "❄️"],
    77: ["Snow grains", "🌨️"],
    80: ["Showers", "🌦️"],
    81: ["Showers", "🌧️"],
    82: ["Heavy showers", "⛈️"],
    85: ["Snow showers", "🌨️"],
    86: ["Snow showers", "❄️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm", "⛈️"],
    99: ["Thunderstorm", "⛈️"],
  };

  function describe(code) {
    const hit = CODES[code];
    return { text: hit ? hit[0] : "", emoji: hit ? hit[1] : "🌡️" };
  }

  function round(n) {
    return n === null || n === undefined || isNaN(n) ? null : Math.round(Number(n));
  }

  /* The best reading we have, normalised so the card never has to care
     which of the two paths it came from. */
  function reading() {
    const src = live || Store.get("weather");
    if (!src || (!src.sensor && !src.current)) return null;

    const sensor = src.sensor || null;
    const current = src.current || null;
    const daily = src.daily || null;

    /* The backyard sensor wins for temperature — it is thirty feet away,
       not at the airport. Everything else fills in around it. */
    const sensorTemp = sensor ? round(sensor.temperature_F) : null;
    const apiTemp = current ? round(current.temperature_2m) : null;
    const code = current ? current.weather_code : null;
    const desc = describe(code);

    const days = [];
    if (daily && Array.isArray(daily.time)) {
      for (let i = 0; i < daily.time.length && i < 7; i++) {
        days.push({
          date: daily.time[i],
          hi: round(daily.temperature_2m_max && daily.temperature_2m_max[i]),
          lo: round(daily.temperature_2m_min && daily.temperature_2m_min[i]),
          rain: round(daily.precipitation_probability_max && daily.precipitation_probability_max[i]),
          code: daily.weather_code ? daily.weather_code[i] : null,
        });
      }
    }

    return {
      temp: sensorTemp !== null ? sensorTemp : apiTemp,
      fromSensor: sensorTemp !== null,
      feels: current ? round(current.apparent_temperature) : null,
      humidity: sensor && sensor.humidity != null ? round(sensor.humidity)
        : current ? round(current.relative_humidity_2m) : null,
      wind: current ? round(current.wind_speed_10m) : null,
      indoor: sensor ? round(sensor.indoor_F) : null,
      rainToday: sensor && sensor.rain_in != null ? Number(sensor.rain_in) : null,
      condition: desc.text || (sensor && sensor.condition) || "",
      emoji: desc.emoji,
      hi: days.length ? days[0].hi : null,
      lo: days.length ? days[0].lo : null,
      days: days,
      fetchedAt: src.fetchedAt || null,
      stale: isStale(src.fetchedAt),
    };
  }

  function isStale(iso) {
    if (!iso) return true;
    const age = Date.now() - new Date(iso).getTime();
    return !(age >= 0) || age > 3 * 3600 * 1000;
  }

  async function refresh() {
    if (Store.mode !== "server") return false;
    try {
      const res = await fetch("/api/hub/weather", { cache: "no-store" });
      if (!res.ok) return false;
      const data = await res.json();
      if (!data || (!data.sensor && !data.current)) return false;
      live = data;
      return true;
    } catch (e) {
      return false;
    } finally {
      tried = true;
    }
  }

  /* --- the card ------------------------------------------------------ */

  function stat(value, label) {
    return UI.h(
      "div",
      { class: "wx-stat" },
      UI.h("div", { class: "wx-stat-val", text: value }),
      UI.h("div", { class: "wx-stat-key", text: label })
    );
  }

  function dayCell(d, i) {
    const date = Fmt.fromDayKey(d.date);
    const desc = describe(d.code);
    return UI.h(
      "div",
      { class: "wx-day" },
      UI.h("div", { class: "wx-day-name", text: i === 0 ? "Today" : Fmt.dayAbbr(Fmt.dayIdx(date)) }),
      UI.h("div", { class: "wx-day-icon", text: desc.emoji }),
      UI.h(
        "div",
        { class: "wx-day-temps" },
        UI.h("span", { class: "wx-hi", text: d.hi === null ? "--" : d.hi + "°" }),
        UI.h("span", { class: "wx-lo", text: d.lo === null ? "--" : d.lo + "°" })
      ),
      d.rain !== null && d.rain >= 30
        ? UI.h("div", { class: "wx-day-rain", text: d.rain + "%" })
        : null
    );
  }

  function card() {
    const w = reading();

    if (!w) {
      /* Only worth saying anything when there is a reason it is missing. */
      if (Store.mode === "server" && !tried) return null;
      if (Store.mode !== "server") {
        return UI.h(
          "div",
          { class: "card card-pad banner-slot" },
          UI.h(
            "div",
            { class: "banner" },
            UI.icon("info"),
            UI.h("span", {
              text:
                "No weather here yet. Open the hub from the house dashboard link " +
                "and it shows the backyard sensor.",
            })
          )
        );
      }
      return null;
    }

    const bits = [];
    /* "Feels like" comes from the forecast service, so it only belongs next
       to that service's own temperature. Beside the backyard sensor it would
       be a different place's number wearing our label. */
    if (!w.fromSensor && w.feels !== null && w.feels !== w.temp) bits.push(stat(w.feels + "°", "Feels like"));
    if (w.humidity !== null) bits.push(stat(w.humidity + "%", "Humidity"));
    if (w.wind !== null) bits.push(stat(w.wind + " mph", "Wind"));
    if (w.indoor !== null) bits.push(stat(w.indoor + "°", "Inside"));
    if (w.rainToday !== null && w.rainToday > 0) bits.push(stat(w.rainToday + '"', "Rain today"));

    const head = UI.h(
      "div",
      { class: "wx-head" },
      UI.h("div", { class: "wx-emoji", text: w.emoji }),
      UI.h(
        "div",
        { class: "wx-main" },
        UI.h(
          "div",
          { class: "wx-temp nums" },
          w.temp === null ? "--" : String(w.temp),
          UI.h("span", { class: "wx-deg", text: "°" })
        ),
        UI.h("div", { class: "wx-cond", text: w.condition }),
        UI.h("div", {
          class: "wx-where",
          text: w.fromSensor ? "Backyard sensor" : "Hudsonville",
        })
      ),
      w.hi !== null
        ? UI.h(
            "div",
            { class: "wx-hilo nums" },
            UI.h("div", { text: "H " + w.hi + "°" }),
            UI.h("div", { class: "muted", text: "L " + (w.lo === null ? "--" : w.lo) + "°" })
          )
        : null
    );

    const kids = [head];
    if (bits.length) kids.push(UI.h("div", { class: "wx-stats" }, bits));
    if (w.days.length > 1)
      kids.push(UI.h("div", { class: "wx-week" }, w.days.slice(0, 7).map(dayCell)));
    if (w.stale && w.fetchedAt)
      kids.push(
        UI.h("div", { class: "wx-stale tiny muted", text: "Last updated " + Fmt.relDay(Fmt.dayKey(new Date(w.fetchedAt))) })
      );

    return UI.h("div", { class: "card wx-card" }, kids);
  }

  return {
    describe: describe,
    reading: reading,
    refresh: refresh,
    card: card,
  };
})();


/* ==== js/10-today.js ========================================================= */
/* ============================================================
   Today — the page Kenzie opens at 7am.
   Pure function of the store: header, sun strip, today's cleaning,
   tonight's dinner, needs attention, good to know.
   Defines exactly one global: Router.on("today", ...).
   ============================================================ */

(function () {
  const ASK_LOADING_KEY = "todayAskLoading";

  const DONE_LINES = [
    "Every box checked. Go put your feet up for a few minutes.",
    "That's the whole list — nicely done.",
    "All done here. The house says thank you.",
    "Kitchen's clean, kids are fed, the day's ahead of you now.",
  ];

  function stableIndex(key, len) {
    let h = 0;
    const s = String(key);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % len;
  }

  /* ---------- header ---------- */

  function renderHeader(now) {
    return UI.h(
      "div",
      { class: "page-head" },
      UI.h("div", { class: "eyebrow", text: Fmt.greeting(now) }),
      UI.h("div", { class: "title", text: Fmt.dayName(Fmt.dayIdx(now)) }),
      UI.h("div", {
        class: "sub",
        text: Fmt.date(now, { month: "long", day: "numeric", year: "numeric" }),
      })
    );
  }

  /* ---------- sun strip ---------- */

  function sunCell(val, key) {
    return UI.h(
      "div",
      { class: "cell" },
      UI.h("div", { class: "val", text: val }),
      UI.h("div", { class: "key", text: key })
    );
  }

  function renderSunStrip(now) {
    let sun;
    try {
      sun = Almanac.sunTimes(now);
    } catch (e) {
      sun = null;
    }
    let moon;
    try {
      moon = Almanac.moonPhase(now);
    } catch (e) {
      moon = null;
    }

    const cells = [];
    if (sun) {
      cells.push(sunCell(Fmt.time(sun.sunrise), "Sunrise"));
      cells.push(sunCell(Fmt.time(sun.sunset), "Sunset"));
      cells.push(sunCell(sun.dayLength, "Daylight"));
    }
    if (moon) {
      cells.push(sunCell(moon.emoji + " " + moon.name, "Moon"));
    }
    if (!cells.length) return null;
    return UI.h("div", { class: "sunstrip" }, cells);
  }

  /* ---------- today's cleaning ---------- */

  function checkRow(task) {
    return UI.h(
      "button",
      {
        class: "check",
        type: "button",
        "aria-pressed": task.done ? "true" : "false",
        on: {
          click: function () {
            House.toggleTask(new Date(), task.id);
          },
        },
      },
      UI.h("span", { class: "box" }, UI.icon("check")),
      UI.h("div", { class: "check-main" }, UI.h("div", { class: "check-text", text: task.text })),
      UI.h("span", { class: "check-min", text: Fmt.minutes(task.min) })
    );
  }

  function renderCleaningCard(now) {
    const tasks = House.todayTasks() || [];
    const body = [];

    if (!tasks.length) {
      body.push(
        UI.empty(
          "broom",
          "No cleaning tasks are set up for today.",
          UI.h(
            "button",
            {
              class: "btn btn-primary",
              type: "button",
              on: {
                click: function () {
                  Router.go("house");
                },
              },
            },
            "Set up the routine"
          )
        )
      );
    } else {
      const doneCount = tasks.filter(function (t) {
        return !!t.done;
      }).length;
      const totalMin = tasks.reduce(function (sum, t) {
        return sum + (Number(t.min) || 0);
      }, 0);

      body.push(
        UI.h(
          "div",
          { class: "zone-head" },
          UI.h(
            "div",
            {},
            UI.h("div", { class: "zone-name", text: House.zoneName(Fmt.dayIdx(now)) }),
            UI.h("div", { class: "zone-sub", text: Fmt.minutes(totalMin) + " total" })
          )
        )
      );
      body.push(UI.h("div", { class: "zone-meter" }, UI.meter(doneCount, tasks.length)));
      body.push(
        UI.h(
          "div",
          { class: "rows" },
          tasks.map(function (t) {
            return checkRow(t);
          })
        )
      );

      if (tasks.length && doneCount === tasks.length) {
        body.push(
          UI.h(
            "div",
            { class: "done-note" },
            UI.icon("check"),
            UI.h("span", { text: DONE_LINES[stableIndex(Fmt.dayKey(now), DONE_LINES.length)] })
          )
        );
      }
    }

    return UI.h("div", { class: "card" }, body);
  }

  /* ---------- tonight's dinner ---------- */

  function renderDinnerSection(now) {
    let slot = null;
    try {
      slot = Plan.slotFor(now);
    } catch (e) {
      slot = null;
    }
    let desc = null;
    try {
      desc = Plan.describe(slot);
    } catch (e) {
      desc = null;
    }
    desc = desc || {};

    const name = desc.name || "Nothing planned yet";
    const sub = desc.name ? desc.sub || "" : "Tap to pick something for tonight";
    const glyph = desc.emoji || "\u{1F372}"; // pot of food, fallback

    const dinnerBtn = UI.h(
      "button",
      {
        class: "dinner",
        type: "button",
        on: {
          click: function () {
            if (slot && slot.kind === "recipe" && slot.recipeId) {
              Recipes.openSheet(slot.recipeId);
            } else {
              Plan.openPicker(now);
            }
          },
        },
      },
      UI.h("div", { class: "glyph", text: glyph }),
      UI.h(
        "div",
        { class: "dinner-main" },
        UI.h("div", { class: "dinner-name", text: name }),
        sub ? UI.h("div", { class: "dinner-sub", text: sub }) : null
      )
    );

    return UI.section("Tonight's dinner", null, UI.h("div", { class: "card" }, dinnerBtn));
  }

  /* ---------- needs attention ---------- */

  function attentionRow(item) {
    const tone = item.tone || "someday";
    return UI.h(
      "button",
      {
        class: "row",
        type: "button",
        on: {
          click: function () {
            if (item.kind === "job") House.openJobs();
            else Router.go("house");
          },
        },
      },
      UI.h("span", { class: "pri-stripe pri-" + tone }),
      UI.h(
        "div",
        { class: "row-main" },
        UI.h("div", { class: "row-title", text: item.title }),
        item.sub ? UI.h("div", { class: "row-sub", text: item.sub }) : null
      ),
      UI.h("span", { class: "row-end" }, UI.icon("chevron", 18))
    );
  }

  function renderAttentionSection(now) {
    let items = [];
    try {
      items = House.attention(now) || [];
    } catch (e) {
      items = [];
    }
    items = items.slice(0, 4);
    if (!items.length) return null;

    return UI.section(
      "Needs attention",
      null,
      UI.h(
        "div",
        { class: "card" },
        UI.h(
          "div",
          { class: "rows" },
          items.map(function (it) {
            return attentionRow(it);
          })
        )
      )
    );
  }

  /* ---------- good to know ---------- */

  function staticRow(iconName, colorVar, text) {
    return UI.h(
      "div",
      { class: "row row-static" },
      UI.h(
        "span",
        {
          style: {
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            width: "22px",
            height: "22px",
            flexShrink: "0",
            color: "var(--" + colorVar + ")",
          },
        },
        UI.icon(iconName, 18)
      ),
      UI.h("div", { class: "row-main" }, UI.h("div", { class: "row-title", text: text }))
    );
  }

  function buildAskPrompt(now, zoneName, tasks, dinnerLine, jobLines, season, inSeasonNames) {
    return (
      "Today is " +
      Fmt.date(now) +
      " in Hudsonville, Michigan. It's " +
      season +
      ". In season: " +
      (inSeasonNames.length ? inSeasonNames.join(", ") : "nothing notable") +
      ". Today's cleaning zone is \"" +
      zoneName +
      "\" (" +
      tasks.length +
      " tasks). Tonight's dinner: " +
      dinnerLine +
      ". Most pressing jobs: " +
      (jobLines.length ? jobLines.join("; ") : "none pending") +
      ". Give 2-3 short, concrete suggestions for what today specifically needs. " +
      "Under 60 words total. No preamble, no markdown."
    );
  }

  function renderAskBlock(now) {
    if (!Ask.available()) return null;

    const dayKey = Fmt.dayKey(now);
    const daily = Store.get("daily") || {};
    const existing = daily[dayKey] && daily[dayKey].tip;

    function askClaude() {
      UI.state[ASK_LOADING_KEY] = true;
      Router.refresh();

      let zoneName = "";
      let tasks = [];
      try {
        tasks = House.todayTasks() || [];
        zoneName = House.zoneName(Fmt.dayIdx(now));
      } catch (e) {
        tasks = [];
      }

      let dinnerLine = "nothing planned";
      try {
        const slot = Plan.slotFor(now);
        const desc = Plan.describe(slot) || {};
        if (desc.name) dinnerLine = desc.name;
      } catch (e) {
        /* leave default */
      }

      let jobLines = [];
      try {
        jobLines = (House.attention(now) || [])
          .filter(function (a) {
            return a.kind === "job";
          })
          .slice(0, 2)
          .map(function (a) {
            return a.title;
          });
      } catch (e) {
        jobLines = [];
      }

      let season = "";
      let inSeasonNames = [];
      try {
        season = Almanac.season(now);
        inSeasonNames = (Almanac.inSeason(now) || []).map(function (i) {
          return i.name;
        });
      } catch (e) {
        /* leave defaults */
      }

      const prompt = buildAskPrompt(now, zoneName, tasks, dinnerLine, jobLines, season, inSeasonNames);

      Ask.text(prompt, {})
        .then(function (text) {
          UI.state[ASK_LOADING_KEY] = false;
          const patch = {};
          patch[dayKey] = { tip: text };
          Store.mergeDoc("daily", patch);
        })
        .catch(function (err) {
          UI.state[ASK_LOADING_KEY] = false;
          UI.toast(Ask.message(err));
          Router.refresh();
        });
    }

    if (existing) {
      return UI.h(
        "div",
        { class: "tipcard" },
        UI.h("div", { class: "eyebrow", text: "From Claude" }),
        UI.h("div", { class: "tip-text", text: existing }),
        UI.h(
          "button",
          {
            class: "btn btn-sm",
            type: "button",
            on: { click: askClaude },
          },
          "Ask again"
        )
      );
    }

    if (UI.state[ASK_LOADING_KEY]) {
      return UI.h(
        "div",
        { class: "thinking" },
        UI.h("div", { class: "spinner" }),
        UI.h("span", { text: "Thinking about today…" })
      );
    }

    return UI.h(
      "button",
      {
        class: "btn btn-block",
        type: "button",
        on: { click: askClaude },
      },
      "Ask Claude what today needs"
    );
  }

  function renderGoodToKnowSection(now) {
    const body = [];

    let inSeason = [];
    try {
      inSeason = (Almanac.inSeason(now) || []).slice(0, 4);
    } catch (e) {
      inSeason = [];
    }
    if (inSeason.length) {
      body.push(
        UI.h("div", { class: "eyebrow", style: { padding: "14px 16px 0" }, text: "In season in Michigan" })
      );
      body.push(
        UI.h(
          "div",
          { class: "produce" },
          inSeason.map(function (item) {
            return UI.h(
              "div",
              { class: "produce-item" },
              UI.h("span", { class: "p-emoji", text: item.emoji }),
              UI.h(
                "div",
                {},
                UI.h("div", { class: "p-name", text: item.name }),
                UI.h("div", { class: "p-note", text: item.note })
              )
            );
          })
        )
      );
    }

    let birthday = null;
    try {
      birthday = Almanac.nextBirthday(now);
    } catch (e) {
      birthday = null;
    }
    if (birthday && typeof birthday.daysAway === "number" && birthday.daysAway <= 45) {
      const tail = birthday.daysAway === 0 ? "today!" : "in " + birthday.daysAway + " days";
      body.push(staticRow("gift", "amber", birthday.name + " turns " + birthday.turning + " " + tail));
    }

    const config = Store.get("config") || {};
    if (typeof config.trashDay === "number") {
      const dow = now.getDay();
      const tomorrow = (dow + 1) % 7;
      if (dow === config.trashDay || tomorrow === config.trashDay) {
        body.push(staticRow("trash", "delft", "Trash goes out tonight"));
      }
    }

    let tip = null;
    try {
      tip = Almanac.tip(now);
    } catch (e) {
      tip = null;
    }
    if (tip) {
      body.push(
        UI.h(
          "div",
          { class: "tipcard" },
          UI.h("div", { class: "eyebrow", text: tip.tag }),
          UI.h("div", { class: "tip-text", text: tip.text })
        )
      );
    }

    const askBlock = renderAskBlock(now);
    if (askBlock) body.push(askBlock);

    if (!body.length) return null;

    return UI.section("Good to know", null, UI.h("div", { class: "card" }, body));
  }

  /* ---------- render ---------- */

  function renderToday(root) {
    const now = new Date();

    root.appendChild(renderHeader(now));

    /* The backyard temperature, when this copy of the page can reach it. */
    const wx = Weather.card();
    if (wx) root.appendChild(wx);

    const strip = renderSunStrip(now);
    if (strip) root.appendChild(strip);

    /* The morning verse, same on every screen in the house. */
    if (typeof Word !== "undefined") {
      const word = Word.card(now);
      if (word) root.appendChild(word);
    }

    const left = UI.h("div", {}, renderCleaningCard(now), renderDinnerSection(now));
    const right = UI.h("div", {}, renderAttentionSection(now), renderGoodToKnowSection(now));

    root.appendChild(UI.h("div", { class: "two-col" }, left, right));
  }

  Router.on("today", renderToday);
})();


/* ==== js/15-word.js ========================================================= */
/* ============================================================
   Word — the morning verse.

   One KJV verse a day, the same one on every phone and on the wall, with
   a line from a Reformed voice beneath it. The pick is arithmetic on the
   date, so it needs no store, never repeats two days running, and comes
   round in a different order each year. A speaker button reads it aloud
   for the two who cannot read yet.

   Voice lives here too, because the Bible game (55) borrows it: the
   browser's default voice is the old robotic desktop one on Windows, so
   we go looking for a natural voice — Edge's "Natural" set, Chrome's
   Google voices, Siri's Samantha on an iPhone — and fall back gracefully.
   ============================================================ */

const Voice = (function () {
  let cached = null;
  const supported = typeof window !== "undefined" && "speechSynthesis" in window;

  function score(v) {
    if (!/^en/i.test(v.lang || "")) return -1;
    const n = (v.name || "").toLowerCase();
    let s = 0;
    if (/en[-_]us/i.test(v.lang)) s += 3;
    if (/natural|neural|premium|enhanced|wavenet/.test(n)) s += 8;
    if (/google/.test(n)) s += 6;
    if (/aria|jenny|michelle|ana|samantha|ava|allison|zoe|emma|libby|sonia|karen|moira/.test(n)) s += 4;
    if (/online/.test(n)) s += 2;
    /* The old Windows desktop voices are the robotic ones. Still English,
       so still a last resort — Zira is the gentler of them for the girls. */
    if (/desktop|david|zira|mark|compact|espeak|microsoft [a-z]+ - /.test(n) && !/natural/.test(n)) s -= 3;
    if (/zira/.test(n)) s += 2;
    return s;
  }

  function pick() {
    if (!supported) return null;
    if (cached) return cached;
    let list = [];
    try { list = window.speechSynthesis.getVoices() || []; } catch (e) { list = []; }
    if (!list.length) return null;
    let best = null;
    let bs = -Infinity;
    list.forEach(function (v) {
      const s = score(v);
      if (s < 0 && !/^en/i.test(v.lang || "")) return;
      if (s > bs) { bs = s; best = v; }
    });
    cached = best;
    return best;
  }

  if (supported) {
    try {
      window.speechSynthesis.addEventListener("voiceschanged", function () { cached = null; });
      /* Chrome hands back an empty list until it has been asked once. */
      window.speechSynthesis.getVoices();
    } catch (e) { /* fine */ }
  }

  function browserSpeak(text, opts, done) {
    if (!supported) return false;
    const o = opts || {};
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pick();
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-US"; }
      u.rate = o.rate || 0.95;
      u.pitch = o.pitch || 1.05;
      u.volume = 1;
      if (done) { u.onend = done; u.onerror = done; }
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---- the good voice ----
     The hosted app can synthesise a line properly and hands back an mp3
     (see /api/say in cloud/main.ts). It answers 204 when it can't, and then
     we fall back to the browser. Clips are memoised here as well as cached
     on the server, so a repeated prompt costs nothing at all. */

  let server = null;     /* null = untried, true/false once known */
  let el = null;         /* one <audio>, unlocked by the first real tap */
  let unlocked = false;
  let lastAsked = "";
  const clips = new Map();
  const SILENCE =
    "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXOle0KVK5nnzXPmveWjNORFllsbmoxDVUlM7A//tQxAgAA4AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXOle0KVK5nnzXPmveWjNORFllsbmoxDVU";

  function audio() {
    if (el) return el;
    try {
      el = new Audio();
      el.preload = "auto";
    } catch (e) {
      el = null;
    }
    return el;
  }

  /* Phones refuse to play audio that no finger started. The game is nothing
     but taps, so we spend the very first one priming a silent clip; every
     later play reuses that same element and is allowed through. */
  function unlock() {
    if (unlocked) return;
    const a = audio();
    if (!a) return;
    unlocked = true;
    try {
      a.src = SILENCE;
      const p = a.play();
      if (p && p.catch) p.catch(function () { /* it will work on a later tap */ });
    } catch (e) { /* fine */ }
  }
  if (typeof document !== "undefined") {
    ["pointerdown", "touchstart", "click"].forEach(function (ev) {
      document.addEventListener(ev, unlock, { once: true, capture: true, passive: true });
    });
  }

  function url(text) {
    return "/api/say?t=" + encodeURIComponent(text);
  }

  /* Ask for a line ahead of time so it plays the instant it is wanted. */
  function prefetch(text) {
    if (server === false || !text) return;
    const t = String(text).trim();
    if (!t || clips.has(t)) return;
    clips.set(
      t,
      fetch(url(t))
        .then(function (r) {
          if (r.status === 204) { server = false; return null; }
          if (!r.ok) return null;
          server = true;
          return r.blob().then(function (b) { return URL.createObjectURL(b); });
        })
        .catch(function () { return null; })
    );
  }

  /* Every line gets a turn number; saying something new, or hushing,
     starts a new turn. A line only reports that it finished if it is still
     the current turn, so a follow-on never fires after being talked over. */
  let turn = 0;

  /* opts.onEnd runs once, when the line has been said. It always runs —
     if the audio is blocked or the device has no voice at all, a timer
     sized to the length of the line stands in for it — so a sequence of
     lines can never stall halfway. */
  function speak(text, opts) {
    const t = String(text || "").trim();
    if (!t) return false;
    hush();
    const my = turn;
    const o = opts || {};
    let fired = false;
    const done = function () {
      if (fired || my !== turn) return;
      fired = true;
      if (o.onEnd) o.onEnd();
    };
    if (o.onEnd) setTimeout(done, 1400 + t.length * 90);

    if (server === false) {
      if (!browserSpeak(t, o, done)) setTimeout(done, 600);
      return true;
    }

    prefetch(t);
    const want = t;
    clips.get(t).then(function (src) {
      /* Something else started talking while this was loading. */
      if (want !== lastAsked || my !== turn) return;
      const a = audio();
      if (!src || !a) return void browserSpeak(t, o, done);
      try {
        a.onended = done;
        a.src = src;
        a.playbackRate = o.rate || 1;
        const p = a.play();
        if (p && p.catch) p.catch(function () { browserSpeak(t, o, done); });
      } catch (e) {
        browserSpeak(t, o, done);
      }
    });
    lastAsked = t;
    return true;
  }

  function hush() {
    turn++;
    lastAsked = "";
    try { window.speechSynthesis.cancel(); } catch (e) { /* fine */ }
    try { if (el) { el.onended = null; el.pause(); el.currentTime = 0; } } catch (e) { /* fine */ }
  }

  return {
    speak: speak,
    hush: hush,
    prefetch: prefetch,
    unlock: unlock,
    pick: pick,
    supported: supported,
    server: function () { return server; },
  };
})();

const Word = (function () {
  /* UTC arithmetic on purpose: local-midnight subtraction is off by an hour
     across daylight saving, which made "tomorrow" come out as today. */
  function dayOfYear(d) {
    const start = Date.UTC(d.getFullYear(), 0, 0);
    const day = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.round((day - start) / 86400000);
  }

  function today(date) {
    const d = date || new Date();
    const V = (typeof SCRIPTURE !== "undefined" && SCRIPTURE.verses) || [];
    const Q = (typeof SCRIPTURE !== "undefined" && SCRIPTURE.quotes) || [];
    if (!V.length) return null;
    const doy = dayOfYear(d);
    const y = d.getFullYear();
    /* Stride by a number coprime to the list length so a year walks the
       whole list rather than revisiting a short cycle; the year offsets it. */
    const vi = (doy * 7 + y * 3) % V.length;
    const qi = Q.length ? (doy * 5 + y) % Q.length : -1;
    return { verse: V[vi], quote: qi >= 0 ? Q[qi] : null };
  }

  function card(date) {
    const w = today(date);
    if (!w) return null;
    const v = w.verse;

    const readBtn = UI.h(
      "button",
      { class: "ibtn word-read", type: "button", "aria-label": "Read it aloud", title: "Read it aloud" },
      UI.icon("sound")
    );
    readBtn.addEventListener("click", function () {
      const ok = Voice.speak(v.text + " " + v.ref.replace(/(\d+):(\d+)/, "$1 verse $2") + ".", { rate: 0.92 });
      if (!ok) UI.toast("This browser can't read aloud.");
    });

    return UI.h(
      "div",
      { class: "card word-card" },
      UI.h(
        "div",
        { class: "word-head" },
        UI.h("div", { class: "eyebrow", text: "This morning's word" }),
        readBtn
      ),
      UI.h("p", { class: "word-verse", text: v.text }),
      UI.h("div", { class: "word-ref", text: v.ref + " (KJV)" }),
      w.quote
        ? UI.h(
            "div",
            { class: "word-quote" },
            UI.h("p", { class: "word-quote-text", text: "“" + w.quote.text + "”" }),
            UI.h("div", { class: "word-quote-who", text: "— " + w.quote.who })
          )
        : null
    );
  }

  return { today: today, card: card, dayOfYear: dayOfYear };
})();

/* ============================================================
   Meals — the week's dinners + the grocery list.
   Plain DOM, zero dependencies. Defines exactly three globals:
   the Router.on("meals", …) registration, Plan, and Grocery.
   Everything else lives inside this IIFE so it can never collide
   with a helper of the same name in another view module.
   ============================================================ */

(function () {
  /* ---------- grocery aisle categorization ---------- */

  const CAT_ORDER = ["Produce", "Meat", "Dairy", "Bakery", "Frozen", "Pantry", "Other"];

  /* The things the family buys every week no matter what is for dinner.
     These are the DEFAULT; once anyone edits them, the edited list lives in
     the config doc and syncs to every device. */
  const SEED_STAPLES = [
    { item: "Whole milk", qty: "3 gallons", store: "Meijer" },
    { item: "Greek yogurt", qty: "5 tubs", store: "Meijer" },
  ];

  const Staples = {
    list: function () {
      const s = (Store.get("config") || {}).staples;
      return Array.isArray(s) ? s : SEED_STAPLES.map(function (x) { return Object.assign({}, x); });
    },
    save: function (next) {
      Store.mergeDoc("config", { staples: next });
    },
  };

  /* The stuff Kenzie keeps on hand — spices, oils, baking basics. Anything
     on this list is assumed already in the cupboard and is kept OFF the
     grocery list when it builds, so the list stays to fresh things to buy.
     If she runs out of one she just adds it back by hand. */
  const SEED_PANTRY = [
    "Salt", "Black pepper", "Olive oil", "Vegetable oil", "Cooking oil",
    "Flour", "Sugar", "Brown sugar", "Baking powder", "Baking soda",
    "Vanilla", "Cornstarch", "Rice", "Paprika", "Smoked paprika", "Cumin",
    "Chili powder", "Oregano", "Basil", "Thyme", "Rosemary", "Cinnamon",
    "Garlic powder", "Onion powder", "Italian seasoning", "Red pepper flakes",
    "Bay leaves", "Soy sauce", "Vinegar", "Honey", "Ketchup", "Mustard",
    "Mayo", "Worcestershire sauce", "Hot sauce", "Cooking spray",
  ];

  /* Put every weekly staple onto the grocery list now, skipping any already
     there. Staples are always-wanted, so they bypass the pantry filter.
     Returns how many were newly added. */
  function putStaplesOnList() {
    const have = {};
    Store.list("grocery").forEach(function (it) {
      have[(it.name || "").trim().toLowerCase()] = true;
    });
    let added = 0;
    Staples.list().forEach(function (s) {
      if (!s || !s.item) return;
      const key = s.item.trim().toLowerCase();
      if (have[key]) return;
      Store.put("grocery", null, {
        name: s.item.trim(),
        qty: s.qty || "",
        cat: s.cat || categorize(s.item),
        store: normStore(s.store) || "",
        done: false,
        src: "Weekly staples",
        at: new Date().toISOString(),
      });
      have[key] = true;
      added++;
    });
    return added;
  }

  const Pantry = {
    list: function () {
      const p = (Store.get("config") || {}).pantry;
      return Array.isArray(p) ? p : SEED_PANTRY.slice();
    },
    save: function (next) {
      Store.mergeDoc("config", { pantry: next });
    },
  };

  /* True when an ingredient is something she already keeps. Matches a pantry
     entry only when it appears as whole words INSIDE the item — so "paprika"
     catches "smoked paprika", but "black pepper" never catches "bell pepper"
     and "garlic powder" never catches fresh "garlic". */
  function inPantry(name) {
    const item = String(name || "").toLowerCase().trim();
    if (!item) return false;
    return Pantry.list().some(function (p) {
      const term = String(p || "").toLowerCase().trim();
      if (!term) return false;
      const re = new RegExp("\\b" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b");
      return re.test(item);
    });
  }

  /* Keyword table, cheapest-and-most-specific-first so a jarred sauce
     doesn't get mistaken for the vegetable in its name ("canned diced
     tomatoes" should land in Pantry, not Produce). Doesn't have to be
     perfect — just right most of the time. */
  function categorize(name) {
    const n = (name || "").toLowerCase();

    if (n.indexOf("frozen") >= 0) return "Frozen";

    const pantry = [
      "canned", "jar", "sauce", "salsa", "pesto", "marinara", "bbq",
      "ketchup", "mustard", "broth", "miso", "stock", "yeast", "cornstarch",
      "baking", "spice", "seasoning", "oil", "vinegar", "syrup", "pasta",
      "noodle", "rice", "flour", "sugar", "cracker", "cereal", "bean",
      "chip", "nut",
    ];
    for (let i = 0; i < pantry.length; i++) {
      if (n.indexOf(pantry[i]) >= 0) return "Pantry";
    }

    const meat = [
      "chicken", "beef", "steak", "pork", "sausage", "bacon", "turkey",
      "ham", "rib", "shrimp", "salmon", "fish", "cod", "tilapia", "meat",
      "roast",
    ];
    for (let i = 0; i < meat.length; i++) {
      if (n.indexOf(meat[i]) >= 0) return "Meat";
    }

    const dairy = [
      "milk", "cheese", "yogurt", "cream", "butter", "egg", "mozzarella",
      "parmesan", "ricotta", "cheddar", "feta", "cotija",
    ];
    for (let i = 0; i < dairy.length; i++) {
      if (n.indexOf(dairy[i]) >= 0) return "Dairy";
    }

    const bakery = ["bread", "bun", "bagel", "tortilla", "roll", "dough", "pastry"];
    for (let i = 0; i < bakery.length; i++) {
      if (n.indexOf(bakery[i]) >= 0) return "Bakery";
    }

    const produce = [
      "lettuce", "tomato", "onion", "garlic", "pepper", "broccoli", "potato",
      "carrot", "celery", "spinach", "zucchini", "corn", "avocado", "lime",
      "lemon", "cilantro", "basil", "mushroom", "cabbage", "asparagus",
      "ginger", "cucumber", "kale", "apple", "banana", "thyme", "rosemary",
      "parsley", "dill", "mint",
    ];
    for (let i = 0; i < produce.length; i++) {
      if (n.indexOf(produce[i]) >= 0) return "Produce";
    }

    return "Other";
  }

  /* ---------- Plan ---------- */

  /* Every field spelled out, even when empty. The store merges recursively,
     so a partial slot would leave the previous dinner's recipeId sitting
     underneath a slot that is now "eating out". */
  function fullSlot(slot) {
    if (slot === null || slot === undefined) return null;
    return {
      kind: slot.kind || "text",
      recipeId: slot.recipeId || "",
      title: slot.title || "",
      note: slot.note || "",
    };
  }

  function describeSlot(slot) {
    if (!slot) return { emoji: "", name: "", sub: "" };
    if (slot.kind === "recipe") {
      const r = Recipes.byId(slot.recipeId);
      if (!r) return { emoji: "🍽️", name: "Recipe was deleted", sub: "Tap to pick something else" };
      return {
        emoji: r.emoji || "🍽️",
        name: r.name,
        sub: [r.time, r.source].filter(Boolean).join(" · "),
      };
    }
    if (slot.kind === "text") return { emoji: "🍲", name: slot.title || "", sub: "" };
    if (slot.kind === "out") return { emoji: "🍴", name: "Eating out", sub: slot.note || "" };
    if (slot.kind === "leftovers") return { emoji: "🥡", name: "Leftovers", sub: "" };
    return { emoji: "", name: "", sub: "" };
  }

  const Plan = {
    week: function (date) {
      date = date || new Date();
      const plan = Store.get("plan");
      return plan[Fmt.weekKey(date)] || {};
    },

    slotFor: function (date) {
      date = date || new Date();
      const week = Plan.week(date);
      return week[DAY_KEYS[Fmt.dayIdx(date)]] || null;
    },

    /* Every field is written explicitly, even when empty. The store merges
       recursively, so a partial slot would leave the previous dinner's
       recipeId sitting underneath a slot that is now "eating out". */
    setSlot: function (date, slot) {
      date = date || new Date();
      const wk = Fmt.weekKey(date);
      const dayKey = DAY_KEYS[Fmt.dayIdx(date)];
      const full = fullSlot(slot);
      const patch = {};
      patch[wk] = {};
      patch[wk][dayKey] = full;
      Store.mergeDoc("plan", patch);
    },

    clearSlot: function (date) {
      Plan.setSlot(date, null);
    },

    describe: describeSlot,

    openPicker: function (date) {
      date = date || new Date();
      const title = Fmt.dayName(Fmt.dayIdx(date)) + " · " + Fmt.shortDate(date);

      const searchInput = UI.h("input", {
        class: "input",
        type: "text",
        placeholder: "Search recipes, source or tag",
        data: { keep: "plan-search" },
      });

      const resultsHost = UI.h("div", { class: "stack" });

      function finish(slot, msg) {
        Plan.setSlot(date, slot);
        s.close();
        UI.toast(msg);
      }

      function rowFor(r) {
        return UI.h(
          "button",
          { class: "row", type: "button", on: { click: function () { finish({ kind: "recipe", recipeId: r.id }, "Planned"); } } },
          UI.h("span", { class: "slot-emoji", text: r.emoji || "🍽️" }),
          UI.h(
            "span",
            { class: "row-main" },
            UI.h("span", { class: "row-title", text: r.name }),
            UI.h("span", { class: "row-sub", text: r.time || "" })
          )

      function matches(r, q) {

          (r.name || "") + " " + (r.source || "") + " " + (r.tags || []).join(" ")
        ).toLowerCase();
        return hay.indexOf(q) >= 0;
      }

      function renderResults() {
        const q = searchInput.value.trim().toLowerCase();
        resultsHost.textContent = "";

        const suggested = (typeof Recipes !== "undefined" && Recipes.suggest(date, 6)) || [];
        resultsHost.appendChild(

            "Suggested",
            null,
            suggested.length
              ? UI.h("div", { class: "card" }, UI.h("div", { class: "rows" }, suggested.map(rowFor)))
              : UI.h("p", { class: "muted tiny", text: "Nothing suggested yet — add a few recipes to the box." })
          )
        );

        const all = ((typeof Recipes !== "undefined" && Recipes.all()) || []).filter(function (r) {
          return matches(r, q);
        });
        resultsHost.appendChild(
          UI.section(
            q ? "Results" : "All recipes",
            null,
            all.length
              ? UI.h("div", { class: "card" }, UI.h("div", { class: "rows" }, all.map(rowFor)))
              : UI.h("p", { class: "muted tiny", text: "No recipes match that search." })

      searchInput.addEventListener("input", renderResults);

      function showTypeForm() {

          class: "input",
          type: "text",

          UI.h(
            "div",
            { class: "stack" },
            UI.h("div", { class: "field" }, UI.h("label", { text: "Tonight's dinner" }), titleInput),
            UI.h(
              "div",
              { class: "btn-row" },
              UI.h("button", { class: "btn", type: "button", on: { click: function () { s.setBody(body); } } }, "Back"),

            )

      const quickRow = UI.h(
        "div",
        { class: "inline" },
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish({ kind: "out" }, "Planned"); } } }, "Eating out"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: function () { finish({ kind: "leftovers" }, "Planned"); } } }, "Leftovers"),
        UI.h("button", { class: "btn btn-sm", type: "button", on: { click: showTypeForm } }, "Type it in")
      );

      /* When the day already has something on it, say so and offer to take

        const d = describeSlot(current);

          "div",
          { class: "planned-now" },
          UI.h("span", { class: "pn-emoji", text: d.emoji || "🍽️" }),
          UI.h(
            "span",
            { class: "pn-main" },
            UI.h("span", { class: "pn-name", text: d.name || "Planned" }),
            UI.h("span", { class: "pn-sub", text: "Pick something else below, or take it off." })
          ),
          UI.h(
            "button",
            {
              class: "btn btn-sm btn-danger",
              type: "button",

            },

      }

      const body = UI.h("div", { class: "stack" }, currentRow, searchInput, quickRow, resultsHost);
      var s = UI.sheet({ title: title, body: body });

    },

    fillWeek: function (date) {
      date = date || new Date();
      const monday = Fmt.weekStart(date);
      const wk = Fmt.weekKey(date);
      const week = Plan.week(date);

      const used = {};
      DAY_KEYS.forEach(function (k) {
        const slot = week[k];
        if (slot && slot.kind === "recipe" && slot.recipeId) used[slot.recipeId] = true;
      });

      function dateForIdx(i) {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);

      }

      function firstUnused(d) {
        const list = (typeof Recipes !== "undefined" && Recipes.suggest(d, 20)) || [];
        for (let i = 0; i < list.length; i++) {
          if (!used[list[i].id]) return list[i];
