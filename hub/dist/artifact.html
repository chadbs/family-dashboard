  }

  function buildProjectCard(p) {
    const statusTone = p.status === "in progress" ? "leaf" : p.status === "planned" ? "delft" : null;
    const statusLabel =
      p.status === "in progress"
        ? "In progress"
        : p.status === "planned"
        ? "Planned"
        : p.status === "done"
        ? "Done"
        : "Idea";

    const card = UI.h("div", {
      class: "pcard",
      on: {
        click: function (e) {
          if (e.target && e.target.closest && e.target.closest("button")) return;
          openProjectSheet(p);
        },
      },
    });

    card.appendChild(
      UI.h(
        "div",
        { class: "p-head" },
        UI.h("div", { class: "p-title", text: p.title }),
        UI.chip(statusLabel, statusTone)
      )
    );

    if (p.next) {
      card.appendChild(
        UI.h(
          "div",
          { class: "p-next" },
          UI.h("span", { class: "p-next-key", text: "Next" }),
          UI.h("span", { text: p.next })
        )
      );
    }

    const facts = UI.h("div", { class: "p-facts" });
    if (p.cost) facts.appendChild(UI.h("span", {}, "Cost ", UI.h("b", { text: p.cost })));
    if (p.season) facts.appendChild(UI.h("span", {}, "Season ", UI.h("b", { text: p.season })));
    if (p.category) facts.appendChild(UI.h("span", {}, "Category ", UI.h("b", { text: p.category })));
    if (facts.childNodes.length) card.appendChild(facts);

    if (p.notes) card.appendChild(UI.h("p", { class: "tiny muted", text: p.notes }));

    if (p.status !== "done") {
      const label = p.status === "in progress" ? "Mark it done" : "Start it";
      card.appendChild(
        UI.h(
          "button",
          {
            class: "btn btn-sm",
            type: "button",
            on: {
              click: function (e) {
                e.stopPropagation();
                advanceProjectStatus(p);
              },
            },
          },
          label
        )
      );
    }

    return card;
  }

  function renderProjectsTab() {
    const wrap = UI.h("div", { class: "stack" });
    wrap.appendChild(
      UI.h(
        "button",
        {
          class: "btn btn-primary btn-block",
          type: "button",
          on: { click: function () { openProjectSheet(null); } },
        },
        "Add a project"
      )
    );

    const all = Store.list("projects");
    STATUS_GROUPS.forEach(function (pair) {
      const status = pair[0];
      const label = pair[1];
      const items = all
        .filter(function (p) {
          return p.status === status;
        })
        .sort(function (a, b) {
          return (a.order || 0) - (b.order || 0);
        });
      if (!items.length && status !== "idea") return;

      const group = UI.h("div", { class: "status-group" });
      group.appendChild(UI.h("div", { class: "eyebrow", text: label + " (" + items.length + ")" }));
      if (!items.length) {
        group.appendChild(UI.empty("hammer", "Nothing here yet — this is where a someday idea goes."));
      } else {
        items.forEach(function (p) {
          group.appendChild(UI.h("div", { class: "card" }, buildProjectCard(p)));
        });
      }
      wrap.appendChild(group);
    });

    return wrap;
  }

  /* ---------- screen shell ---------- */

  function buildSegmented(tab) {
    const seg = UI.h("div", { class: "segmented" });
    [
      ["cleaning", "Cleaning"],
      ["jobs", "Jobs"],
      ["projects", "Projects"],
    ].forEach(function (pair) {
      const key = pair[0];
      seg.appendChild(
        UI.h(
          "button",
          {
            type: "button",
            "aria-pressed": tab === key ? "true" : "false",
            on: {
              click: function () {
                UI.state.houseTab = key;
                Router.refresh();
              },
            },
          },
          pair[1]
        )
      );
    });
    return seg;
  }

  function renderHouse(root) {
    const tab = UI.state.houseTab || "cleaning";
    UI.state.houseTab = tab;

    const jobs = Store.list("jobs");
    const projects = Store.list("projects");
    const openJobsCount = jobs.filter(function (j) {
      return !j.done;
    }).length;
    const goingCount = projects.filter(function (p) {
      return p.status === "in progress";
    }).length;

    root.appendChild(
      UI.h(
        "div",
        { class: "page-head" },
        UI.h("h1", { class: "title", text: "The house" }),
        UI.h("p", {
          class: "sub",
          text: plural(openJobsCount, "job") + " open · " + plural(goingCount, "project") + " going",
        })
      )
    );

    root.appendChild(buildSegmented(tab));

    if (tab === "jobs") root.appendChild(renderJobsTab());
    else if (tab === "projects") root.appendChild(renderProjectsTab());
    else root.appendChild(renderCleaningTab());
  }

  Router.on("house", renderHouse);

  return {
    todayTasks: todayTasks,
    toggleTask: toggleTask,
    zoneName: zoneName,
    openJobs: openJobs,
    attention: attention,
  };
})();


/* ==== js/45-chores.js ========================================================= */
/* ============================================================
   Chores — the kids' chart, carried over from the wall.

   Addison (4) and Sophie (2) each have a few chores with a big picture.
   Tapping one marks it done and drops a star in that kid's jar, with the
   streak bonus the wall already gave. Tapping again takes it back. Daily
   chores clear each morning; weekly ones clear each Monday.

   Lives in one document, chores/board:
     { list: [{ id, name, who, cadence:"daily"|"weekly", pic, stars }],
       done: { "<periodKey>": { "<choreId>": true } } }
   where periodKey is the day for daily chores and the ISO week for weekly
   ones, so "done" prunes itself as time moves on.

   Used by the Stars tab (phone) and by the wall, where it is the one panel
   the kids are meant to touch.
   ============================================================ */

const SEED_CHORES = {
  list: [
    { id: "windows", name: "Wash windows", who: "Addison", cadence: "weekly", pic: "\u{1F9FD}", stars: 1 },
    { id: "shoes", name: "Clean up shoes", who: "Sophie", cadence: "weekly", pic: "\u{1F45F}", stars: 1 },
    { id: "toys-a", name: "Pick up toys", who: "Addison", cadence: "daily", pic: "\u{1F9F8}", stars: 1 },
    { id: "toys-s", name: "Pick up toys", who: "Sophie", cadence: "daily", pic: "\u{1F9F8}", stars: 1 },
    { id: "table", name: "Help set the table", who: "Addison", cadence: "daily", pic: "\u{1F37D}\u{FE0F}", stars: 1 },
    { id: "books", name: "Put books away", who: "Sophie", cadence: "daily", pic: "\u{1F4DA}", stars: 1 },
  ],
  done: {},
};

/* Chores without a picture get one guessed from the name, like the wall. */
const CHORE_PICS = [
  [/window/i, "\u{1F9FD}"],
  [/shoe/i, "\u{1F45F}"],
  [/toy|lego|block/i, "\u{1F9F8}"],
  [/book/i, "\u{1F4DA}"],
  [/table|dish|plate/i, "\u{1F37D}\u{FE0F}"],
  [/bed/i, "\u{1F6CF}\u{FE0F}"],
  [/laundry|cloth|sock/i, "\u{1F9E6}"],
  [/dog|cat|pet|feed/i, "\u{1F436}"],
  [/plant|water|flower/i, "\u{1FAB4}"],
  [/trash|garbage|recycl/i, "\u{1F5D1}\u{FE0F}"],
  [/teeth|brush/i, "\u{1FAA5}"],
  [/vacuum|sweep|floor/i, "\u{1F9F9}"],
  [/wipe|clean/i, "\u{1F9FC}"],
];

const Chores = (function () {
  function picFor(name) {
    for (let i = 0; i < CHORE_PICS.length; i++) if (CHORE_PICS[i][0].test(name || "")) return CHORE_PICS[i][1];
    return "\u{2B50}";
  }

  /* The list and the ticks are read independently: the very first tap
     creates the document with only a `done` map (a merge), and the chart
     must still show the starting list — with that tick on it. */
  function board() {
    const doc = Store.get("chores") || {};
    return {
      list: Array.isArray(doc.list) ? doc.list : SEED_CHORES.list,
      done: doc.done && typeof doc.done === "object" ? doc.done : {},
    };
  }

  function list() {
    return (board().list || []).filter(function (c) {
      return c && c.id && c.name;
    });
  }

  function forKid(kid) {
    return list().filter(function (c) {
      return c.who === kid;
    });
  }

  function periodKey(chore, date) {
    return chore.cadence === "weekly" ? Fmt.weekKey(date) : Fmt.dayKey(date);
  }

  function isDone(chore, date) {
    const done = board().done || {};
    const bucket = done[periodKey(chore, date || new Date())];
    return !!(bucket && bucket[chore.id]);
  }

  function starsFor(chore) {
    const n = Math.round(Number(chore.stars));
    return n > 0 ? n : 1;
  }

  /* Tap = done + a star. Tap again = undone, star back. The kids see it
     change on the wall within seconds of a phone tap, and the other way. */
  function toggle(id, date) {
    const now = date || new Date();
    const chore = list().find(function (c) {
      return c.id === id;
    });
    if (!chore) return;
    const key = periodKey(chore, now);
    const wasDone = isDone(chore, now);
    const patch = { done: {} };
    patch.done[key] = {};
    patch.done[key][id] = !wasDone;
    Store.mergeDoc("chores", patch);

    if (chore.who && typeof Rewards !== "undefined") {
      const n = starsFor(chore);
      if (wasDone) Rewards.give(chore.who, -n, "Took back: " + chore.name);
      else Rewards.give(chore.who, n, "Did a chore: " + chore.name);
    }
    return !wasDone;
  }

  function saveList(next) {
    const cur = board();
    /* Keep only the current day and week of ticks; older buckets are just
       history nobody reads, and the store is happier small. */
    const keep = {};
    const dk = Fmt.dayKey();
    const wk = Fmt.weekKey();
    const done = cur.done || {};
    if (done[dk]) keep[dk] = done[dk];
    if (done[wk]) keep[wk] = done[wk];
    Store.setDoc("chores", { list: next, done: keep });
  }

  /* ---------- the tiles ---------- */

  function tile(chore, opts) {
    const o = opts || {};
    const done = isDone(chore, new Date());
    const el = UI.h(
      "button",
      {
        class: "chore-tile" + (o.big ? " chore-tile-big" : ""),
        type: "button",
        "aria-pressed": done ? "true" : "false",
        "aria-label": chore.name + (done ? ", done" : ""),
      },
      UI.h("span", { class: "chore-pic", text: chore.pic || picFor(chore.name) }),
      UI.h("span", { class: "chore-name", text: chore.name }),
      UI.h(
        "span",
        { class: "chore-meta" },
        chore.cadence === "weekly" ? UI.h("span", { class: "chore-cad", text: "this week" }) : null,
        UI.h("span", { class: "chore-stars nums", text: starsFor(chore) + " \u{2B50}" })
      ),
      UI.h("span", { class: "chore-check" }, UI.icon("check"))
    );
    el.addEventListener("click", function () {
      const nowDone = toggle(chore.id);
      if (nowDone) {
        el.classList.add("chore-pop");
        if (o.onDone) o.onDone(chore);
      }
    });
    return el;
  }

  /* One block per kid: emoji, name, tiles. Shared by the phone and the wall. */
  function kidBlocks(opts) {
    const o = opts || {};
    const shop = typeof Rewards !== "undefined" ? Rewards.shop() || {} : {};
    const kids = shop.kids || [];
    const blocks = [];
    kids.forEach(function (k) {
      const mine = forKid(k.name);
      if (!mine.length) return;
      const doneN = mine.filter(function (c) {
        return isDone(c, new Date());
      }).length;
      blocks.push(
        UI.h(
          "div",
          { class: "chore-kid" },
          UI.h(
            "div",
            { class: "chore-kid-head" },
            UI.h("span", { class: "chore-kid-emoji", text: k.emoji || "\u{2B50}" }),
            UI.h("span", { class: "chore-kid-name", text: k.name }),
            UI.h("span", {
              class: "chore-kid-count nums",
              text: doneN === mine.length ? "All done!" : doneN + " of " + mine.length,
            })
          ),
          UI.h(
            "div",
            { class: "chore-grid" },
            mine.map(function (c) {
              return tile(c, o);
            })
          )
        )
      );
    });
    return blocks;
  }

  /* ---------- editing ---------- */

  function openEditor() {
    const shop = typeof Rewards !== "undefined" ? Rewards.shop() || {} : {};
    const kids = (shop.kids || []).map(function (k) {
      return k.name;
    });
    let working = list().map(function (c) {
      return Object.assign({}, c);
    });

    let sheet;
    function row(c, idx) {
      const name = UI.h("input", { class: "input", type: "text", value: c.name, placeholder: "Chore" });
      const who = UI.h("select", { class: "select" });
      kids.forEach(function (k) {
        who.appendChild(UI.h("option", { value: k, text: k, selected: c.who === k ? true : null }));
      });
      const cad = UI.h(
        "select",
        { class: "select" },
        UI.h("option", { value: "daily", text: "Every day", selected: c.cadence !== "weekly" ? true : null }),
        UI.h("option", { value: "weekly", text: "Once a week", selected: c.cadence === "weekly" ? true : null })
      );
      const pic = UI.h("input", { class: "input chore-pic-input", type: "text", value: c.pic || "", placeholder: picFor(c.name) });
      const stars = UI.h("input", { class: "input chore-stars-input", type: "number", min: "1", max: "5", value: starsFor(c) });
      const del = UI.h("button", { class: "ibtn", type: "button", "aria-label": "Remove" }, UI.icon("trash"));
      del.addEventListener("click", function () {
        working.splice(idx, 1);
        render();
      });
      function sync() {
        c.name = name.value.trim();
        c.who = who.value;
        c.cadence = cad.value;
        c.pic = pic.value.trim();
        c.stars = Math.max(1, Math.round(Number(stars.value)) || 1);
      }
      [name, who, cad, pic, stars].forEach(function (i) {
        i.addEventListener("input", sync);
        i.addEventListener("change", sync);
      });
      return UI.h(
        "div",
        { class: "chore-edit-row" },
        UI.h("div", { class: "chore-edit-line" }, pic, name, del),
        UI.h("div", { class: "chore-edit-line" }, who, cad, stars)
      );
    }

    function render() {
      const rows = working.map(row);
      const add = UI.h("button", { class: "btn btn-block", type: "button" }, UI.icon("plus"), "Add a chore");
      add.addEventListener("click", function () {
        working.push({ id: uid("chore"), name: "", who: kids[0] || "", cadence: "daily", pic: "", stars: 1 });
        render();
      });
      const body = UI.h(
        "div",
        { class: "stack" },
        UI.h("p", { class: "tiny muted", text: "Every day clears each morning. Once a week clears each Monday. Stars are what a tap is worth." }),
        UI.h("div", { class: "stack" }, rows),
        add
      );
      if (sheet) sheet.setBody(body);
      return body;
    }

    sheet = UI.sheet({
      title: "The chore chart",
      body: render(),
      actions: [
        UI.h("button", { class: "btn", type: "button", on: { click: function () { sheet.close(); } } }, "Cancel"),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                const cleaned = working
                  .map(function (c) {
                    return {
                      id: c.id || uid("chore"),
                      name: (c.name || "").trim(),
                      who: c.who || "",
                      cadence: c.cadence === "weekly" ? "weekly" : "daily",
                      pic: (c.pic || "").trim() || picFor(c.name),
                      stars: starsFor(c),
                    };
                  })
                  .filter(function (c) {
                    return c.name;
                  });
                saveList(cleaned);
                sheet.close();
                UI.toast("Chore chart saved");
              },
            },
          },
          "Save"
        ),
      ],
    });
  }

  /* The section the Stars tab shows above the jars. */
  function section() {
    const blocks = kidBlocks({});
    const editBtn = UI.h("button", { class: "btn btn-sm", type: "button" }, UI.icon("pencil"), "Edit");
    editBtn.addEventListener("click", openEditor);
    if (!blocks.length) {
      return UI.section(
        "Chores",
        editBtn,
        UI.h("div", { class: "card" }, UI.empty("star", "No chores on the chart yet. Add a few and the kids can start earning.", UI.h("button", { class: "btn btn-primary", type: "button", on: { click: openEditor } }, "Set up the chart")))
      );
    }
    return UI.section("Chores", editBtn, UI.h("div", { class: "chore-kids" }, blocks));
  }

  return {
    list: list,
    forKid: forKid,
    isDone: isDone,
    toggle: toggle,
    kidBlocks: kidBlocks,
    section: section,
    openEditor: openEditor,
  };
})();


/* ==== js/50-rewards.js ========================================================= */
/* ============================================================
   Stars — the kids' reward economy, carried over from the wall
   dashboard so it works on a phone too.

   Public surface (see CONTRACT.md): Router.on("rewards", …) and
   `const Rewards`. Everything else here is private to this file.
   ============================================================ */

const SEED_REWARD_SHOP = {
  kids: [
    { name: "Addison", emoji: "🐰" },
    { name: "Sophie", emoji: "🐢" },
  ],
  starEmoji: "⭐",
  streakBonusEvery: 3,
  streakBonus: 1,
  rewards: [
    { id: "candy", name: "Candy", emoji: "🍬", cost: 3 },
    { id: "stayup", name: "Stay up late", emoji: "🌙", cost: 4 },
    { id: "playdad", name: "Play with Dad", emoji: "🎲", cost: 4 },
    { id: "tv", name: "Watch TV 30 min", emoji: "📺", cost: 5 },
    { id: "icecream", name: "Ice cream", emoji: "🍦", cost: 5 },
    { id: "park", name: "Park trip", emoji: "🌳", cost: 5 },
  ],
};

const SEED_REWARD_STATE = {
  stars: { Addison: 0, Sophie: 0 },
  streak: { Addison: { count: 1, last: "2026-07-22" } },
  log: [],
};

const Rewards = (function () {
  const REASONS = [
    "Did a chore",
    "Was kind",
    "Helped without asking",
    "Listened the first time",
  ];

  /* ---------- data ---------- */

  function shop() {
    const doc = Store.get("rewardShop");
    return isPlainObject(doc) && Object.keys(doc).length ? doc : SEED_REWARD_SHOP;
  }

  function state() {
    const doc = Store.get("rewards");
    const base = isPlainObject(doc) && Object.keys(doc).length ? doc : SEED_REWARD_STATE;
    return {
      stars: isPlainObject(base.stars) ? base.stars : {},
      streak: isPlainObject(base.streak) ? base.streak : {},
      log: Array.isArray(base.log) ? base.log : [],
    };
  }

  function kids() {
    const list = shop().kids;
    return Array.isArray(list) ? list.filter(Boolean) : [];
  }

  function kidByName(name) {
    return kids().filter(function (k) { return k && k.name === name; })[0] || null;
  }

  function balance(kid) {
    const st = state();
    const n = Number(st.stars && st.stars[kid]);
    if (!isFinite(n)) return 0;
    return Math.max(0, Math.round(n));
  }

  function rewardById(id) {
    const list = shop().rewards;
    const arr = Array.isArray(list) ? list : [];
    return arr.filter(function (r) { return r && r.id === id; })[0] || null;
  }

  /* Add (or, with a negative n, take back) stars for a kid and log it.
     Also advances that kid's streak — but only on a positive award, and
     only the first time today, so a correction never touches it and a
     second star the same day doesn't double-count the day. */
  function give(kid, n, why) {
    kid = String(kid || "").trim();
    const amt = Math.round(Number(n)) || 0;
    if (!kid || !amt) return;

    const st = state();
    const before = balance(kid);
    const after = Math.max(0, before + amt);
    if (after === before) return; // e.g. "take back" with nothing left to take

    const patch = { stars: {} };
    patch.stars[kid] = after;

    const log = st.log.slice();
    log.unshift({
      at: new Date().toISOString(),
      kid: kid,
      delta: after - before,
      why: String(why || "").trim(),
    });

    let bonusAmt = 0;
    let bonusCount = 0;
    if (amt > 0) {
      const todayKey = Fmt.dayKey();
      const cur = st.streak[kid] || {};
      if (cur.last !== todayKey) {
        const yestKey = Fmt.dayKey(new Date(Date.now() - 86400000));
        const count = cur.last === yestKey ? (Number(cur.count) || 0) + 1 : 1;
        const sh = shop();
        const every = Math.max(1, Math.round(Number(sh.streakBonusEvery)) || 3);
        const bonusEach = Math.max(0, Math.round(Number(sh.streakBonus)) || 0);

        patch.streak = {};
        patch.streak[kid] = { count: count, last: todayKey };

        if (bonusEach > 0 && count % every === 0) {
          bonusAmt = bonusEach;
          bonusCount = count;
          patch.stars[kid] = after + bonusAmt;
          log.unshift({
            at: new Date().toISOString(),
            kid: kid,
            delta: bonusAmt,
            why: bonusCount + "-day streak bonus",
          });
        }
      }
    }

    patch.log = log.slice(0, 80);
    Store.mergeDoc("rewards", patch);

    if (bonusAmt > 0) {
      UI.toast(
        kid + " hit a " + bonusCount + "-day streak — " + bonusAmt + " bonus " +
          (shop().starEmoji || "⭐") + "!"
      );
    }
  }

  function redeem(kid, rewardId) {
    kid = String(kid || "").trim();
    const reward = rewardById(rewardId);
    if (!kid || !reward) return false;

    const star = shop().starEmoji || "⭐";
    const bal = balance(kid);
    const cost = Math.max(0, Math.round(Number(reward.cost)) || 0);
    if (bal < cost) {
      UI.toast(kid + " needs " + (cost - bal) + " more " + star + " for " + reward.name + ".");
      return false;
    }

    const st = state();
    const after = bal - cost;
    const patch = { stars: {} };
    patch.stars[kid] = after;
    const log = st.log.slice();
    log.unshift({ at: new Date().toISOString(), kid: kid, delta: -cost, why: reward.name });
    patch.log = log.slice(0, 80);
    Store.mergeDoc("rewards", patch);

    UI.toast(kid + " cashed in for " + (reward.emoji ? reward.emoji + " " : "") + reward.name + "!");
    return true;
  }

  /* ---------- shared little helpers ---------- */

  function field(label, control) {
    return UI.h("div", { class: "field" }, UI.h("label", { text: label }), control);
  }

  function isStreakLive(entry) {
    if (!entry || !entry.last) return false;
    const todayKey = Fmt.dayKey();
    const yestKey = Fmt.dayKey(new Date(Date.now() - 86400000));
    return entry.last === todayKey || entry.last === yestKey;
  }

  /* "just now" precision isn't needed here — today shows a time, yesterday
     says so, anything older gets a short date. Fmt.relDay reads "3 days
     late" for anything further back, which is the wrong voice for a log
     of stars already given. */
  function whenLabel(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const dayKey = Fmt.dayKey(d);
    if (dayKey === Fmt.dayKey()) return Fmt.time(d);
    if (dayKey === Fmt.dayKey(new Date(Date.now() - 86400000))) return "yesterday";
    return Fmt.shortDate(d);
  }

  /* ---------- the jars ---------- */

  function openGiveSheet(kid) {
    const star = shop().starEmoji || "⭐";
    const input = UI.h("input", {
      class: "input",
      type: "text",
      placeholder: "What was it for?",
      data: { keep: "give-reason-" + kid },
    });

    function award(reason) {
      give(kid, 1, reason);
      s.close();
    }

    const grid = UI.h("div", { class: "reason-grid" });
    REASONS.forEach(function (r) {
      grid.appendChild(
        UI.h(
          "button",
          { class: "reason-btn", type: "button", on: { click: function () { award(r); } } },
          r
        )
      );
    });

    const s = UI.sheet({
      title: "Give " + kid + " a star " + star,
      body: UI.h("div", { class: "stack" }, grid, field("Or write your own", input)),
      actions: [
        UI.h(
          "button",
          { class: "btn", type: "button", on: { click: function () { s.close(); } } },
          "Cancel"
        ),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                const text = input.value.trim();
                if (!text) {
                  UI.toast("Say what it was for first.");
                  return;
                }
                award(text);
              },
            },
          },
          "Give the star"
        ),
      ],
    });
  }

  function takeOneBack(kid) {
    if (balance(kid) <= 0) {
      UI.toast(kid + " doesn't have any stars to take back yet.");
      return;
    }
    give(kid, -1, "Correction");
    UI.toast("Took back a star from " + kid + ".");
  }

  function buildJar(sh, kidInfo) {
    const name = kidInfo.name;
    const bal = balance(name);
    const streakEntry = state().streak[name];
    const live = isStreakLive(streakEntry);

    const jar = UI.h("div", { class: "card jar" });
    jar.appendChild(UI.h("div", { class: "jar-emoji", text: kidInfo.emoji || "⭐" }));
    jar.appendChild(UI.h("div", { class: "jar-name", text: name }));
    jar.appendChild(
      UI.h(
        "div",
        { class: "jar-balance" },
        UI.h("span", { class: "nums", text: String(bal) }),
        UI.h("span", { class: "unit", text: sh.starEmoji || "⭐" })
      )
    );
    if (live) {
      jar.appendChild(UI.chip("🔥 " + (streakEntry.count || 1) + " day streak", "amber"));
    }

    const actions = UI.h("div", { class: "jar-actions" });
    actions.appendChild(
      UI.h(
        "button",
        {
          class: "btn btn-primary btn-block",
          type: "button",
          on: { click: function () { openGiveSheet(name); } },
        },
        "Give a star"
      )
    );
    actions.appendChild(
      UI.h(
        "button",
        {
          class: "btn btn-sm btn-block",
          type: "button",
          on: { click: function () { takeOneBack(name); } },
        },
        "Take one back"
      )
    );
    jar.appendChild(actions);
    return jar;
  }

  function renderJars(sh) {
    const wrap = UI.h("div", { class: "jars" });
    kids().forEach(function (k) {
      wrap.appendChild(buildJar(sh, k));
    });
    return wrap;
  }

  /* ---------- the shop ---------- */

  function openRedeemSheet(reward) {
    const sh = shop();
    const star = sh.starEmoji || "⭐";
    const list = kids();
    const affordable = list.filter(function (k) { return balance(k.name) >= reward.cost; });

    let body;
    if (affordable.length) {
      const rows = UI.h("div", { class: "rows" });
      affordable.forEach(function (k) {
        const bal = balance(k.name);
        const left = bal - reward.cost;
        rows.appendChild(
          UI.h(
            "button",
            {
              class: "row",
              type: "button",
              on: {
                click: function () {
                  if (redeem(k.name, reward.id)) s.close();
                },
              },
            },
            UI.h("span", { class: "redeem-emoji", text: k.emoji || "⭐" }),
            UI.h(
              "div",
              { class: "row-main" },
              UI.h("div", { class: "row-title", text: k.name }),
              UI.h("div", {
                class: "row-sub",
                text: bal + " " + star + " now · " + left + " " + star + " left",
              })
            )
          )
        );
      });
      body = UI.h(
        "div",
        { class: "stack" },
        UI.h("p", { class: "tiny muted", text: "Who's cashing in?" }),
        UI.h("div", { class: "card" }, rows)
      );
    } else {
      let closest = null;
      list.forEach(function (k) {
        const need = reward.cost - balance(k.name);
        if (!closest || need < closest.need) closest = { name: k.name, need: need };
      });
      const msg = closest
        ? closest.name + " needs " + closest.need + " more " + star + " for " + reward.name + "."
        : "No kids are set up in the shop yet.";
      body = UI.empty("star", msg);
    }

    const s = UI.sheet({
      title: (reward.emoji ? reward.emoji + " " : "") + reward.name,
      body: body,
      actions: [
        UI.h(
          "button",
          { class: "btn btn-block", type: "button", on: { click: function () { s.close(); } } },
          "Close"
        ),
      ],
    });
  }

  function buildRewardCard(reward) {
    const star = shop().starEmoji || "⭐";
    const affordable = kids().some(function (k) { return balance(k.name) >= reward.cost; });
    const card = UI.h(
      "button",
      { class: "rcard", type: "button", data: { afford: affordable ? "true" : "false" } },
      UI.h("div", { class: "r-top" }, UI.h("span", { class: "r-emoji", text: reward.emoji || "🎁" })),
      UI.h("div", { class: "r-name", text: reward.name || "Reward" }),
      UI.h(
        "div",
        { class: "r-meta" },
        UI.h("span", { class: "nums", text: (Math.round(Number(reward.cost)) || 0) + " " + star })
      )
    );
    card.addEventListener("click", function () { openRedeemSheet(reward); });
    return card;
  }

  function renderShop(sh) {
    const wrap = UI.h("div", { class: "stack" });
    wrap.appendChild(UI.h("div", { class: "eyebrow", text: "What stars can buy" }));

    const rewards = (Array.isArray(sh.rewards) ? sh.rewards.filter(Boolean).slice() : []).sort(
      function (a, b) { return (Number(a.cost) || 0) - (Number(b.cost) || 0); }
    );

    if (!rewards.length) {
      wrap.appendChild(UI.empty("gift", "Nothing in the shop yet — add something below."));
    } else {
      const grid = UI.h("div", { class: "recipe-grid" });
      rewards.forEach(function (r) { grid.appendChild(buildRewardCard(r)); });
      wrap.appendChild(grid);
    }
    return wrap;
  }

  /* ---------- recent stars ---------- */

  function renderRecent(st) {
    const star = shop().starEmoji || "⭐";
    const entries = st.log.slice(0, 12);

    let body;
    if (!entries.length) {
      body = UI.empty("star", "No stars given yet — tap “Give a star” above to start.");
    } else {
      const rows = UI.h("div", { class: "rows" });
      entries.forEach(function (e) {
        const kidInfo = kidByName(e.kid);
        const delta = Number(e.delta) || 0;
        rows.appendChild(
          UI.h(
            "div",
            { class: "row row-static" },
            UI.h("span", { class: "log-emoji", text: (kidInfo && kidInfo.emoji) || star }),
            UI.h(
              "div",
              { class: "row-main" },
              UI.h("div", { class: "row-title", text: e.why || (e.kid + " star") }),
              UI.h("div", { class: "row-sub", text: e.kid + " · " + whenLabel(e.at) })
            ),
            UI.h(
              "div",
              { class: "row-end" },
              UI.chip((delta > 0 ? "+" : "") + delta + " " + star, delta > 0 ? "leaf" : "tulip")
            )
          )
        );
      });
      body = UI.h("div", { class: "card" }, rows);
    }

    return UI.section("Recent stars", null, body);
  }

  /* ---------- edit the shop ---------- */

  function saveShopRewards(sh, nextRewards) {
    const next = Object.assign({}, sh, { rewards: nextRewards });
    Store.setDoc("rewardShop", next);
  }

  function buildRewardEditRow(draft, idx, rerender) {
    const r = draft[idx];
    const emojiInput = UI.h("input", {
      class: "input rwd-emoji",
      type: "text",
      value: r.emoji || "",
      placeholder: "🎁",
    });
    const nameInput = UI.h("input", {
      class: "input rwd-name",
      type: "text",
      value: r.name || "",
      placeholder: "Reward name",
    });
    const costInput = UI.h("input", {
      class: "input rwd-cost",
      type: "number",
      min: "1",
      value: String(r.cost || 1),
    });
    emojiInput.addEventListener("input", function () { r.emoji = emojiInput.value; });
    nameInput.addEventListener("input", function () { r.name = nameInput.value; });
    costInput.addEventListener("input", function () { r.cost = costInput.value; });

    const del = UI.h(
      "button",
      {
        class: "ibtn",
        type: "button",
        "aria-label": "Delete " + (r.name || "reward"),
        on: {
          click: function () {
            draft.splice(idx, 1);
            rerender();
          },
        },
      },
      UI.icon("trash")
    );

    return UI.h("div", { class: "edit-row reward-edit-row" }, emojiInput, nameInput, costInput, del);
  }

  function openEditShopSheet() {
    const sh = shop();
    const draft = (Array.isArray(sh.rewards) ? sh.rewards.filter(Boolean) : []).map(function (r) {
      return Object.assign({}, r);
    });

    function buildBody() {
      const wrap = UI.h("div", { class: "stack" });
      draft.forEach(function (r, idx) {
        wrap.appendChild(buildRewardEditRow(draft, idx, function () { s.setBody(buildBody()); }));
      });
      wrap.appendChild(
        UI.h(
          "button",
          {
            class: "btn btn-block",
            type: "button",
            on: {
              click: function () {
                draft.push({ id: uid("rwd"), name: "", emoji: "🎁", cost: 3 });
                s.setBody(buildBody());
              },
            },
          },
          "Add a reward"
        )
      );
      return wrap;
    }

    const s = UI.sheet({
      title: "Edit the rewards",
      body: buildBody(),
      actions: [
        UI.h(
          "button",
          { class: "btn", type: "button", on: { click: function () { s.close(); } } },
          "Cancel"
        ),
        UI.h(
          "button",
          {
            class: "btn btn-primary",
            type: "button",
            on: {
              click: function () {
                const cleaned = draft
                  .map(function (r) {
                    return {
                      id: r.id || uid("rwd"),
                      name: String(r.name || "").trim(),
                      emoji: String(r.emoji || "").trim() || "🎁",
                      cost: Math.max(1, Math.round(Number(r.cost) || 1)),
                    };
                  })
                  .filter(function (r) { return r.name; });
                saveShopRewards(sh, cleaned);
                s.close();
              },
            },
          },
          "Save"
        ),
      ],
    });
  }

  /* ---------- screen shell ---------- */

  function renderRewards(root) {
    const sh = shop();
    const st = state();
    const star = sh.starEmoji || "⭐";
    const list = kids();

    const sub = list
      .map(function (k) { return k.name + " has " + balance(k.name) + " " + star; })
      .join(" · ");

    root.appendChild(
      UI.h(
        "div",
        { class: "page-head" },
        UI.h("h1", { class: "title", text: "Stars" }),
        UI.h("p", { class: "sub", text: sub || "No kids set up in the shop yet." })
      )
    );

    if (list.length) root.appendChild(renderJars(sh));
    else root.appendChild(UI.empty("star", "Add kids in “Edit the rewards” to start giving stars."));

    /* The chore chart: where most of the stars actually come from. */
    if (typeof Chores !== "undefined" && list.length) root.appendChild(Chores.section());

    root.appendChild(renderShop(sh));
    root.appendChild(renderRecent(st));

    root.appendChild(
      UI.h(
        "button",
        { class: "btn btn-sm", type: "button", on: { click: openEditShopSheet } },
        "Edit the rewards"
      )
    );
  }

  Router.on("rewards", renderRewards);

  return {
    shop: shop,
    state: state,
    balance: balance,
    give: give,
    redeem: redeem,
  };
})();


/* ==== js/55-bible.js ========================================================= */
/* ============================================================
   Bible — play & learn, for Addison (nearly five) and Sophie (two).

   Four games, played full-screen on a real game engine (Phaser, loaded
   only when a game opens — see 56-engine.js):

     Two by Two  — lead the animals up the gangplank into Noah's ark;
                   then the LORD shuts the door, the rain comes, the ark
                   floats, the dove flies and the rainbow comes out.
     Join the dots — draw a glowing line through the stars and the
                   picture blooms out of the night.
     Mazes       — walk the shepherd through the hedges to his lost sheep.
     Jigsaws     — real cardboard pieces that lift, tilt and snap home.

   Every game ends on a Bible picture: its name and KJV verse, one plain
   truth said out loud, and for Addison a catechism question — saved by
   grace not works, God chose first, the shepherd seeks the sheep.

   No stars, no score, no difficulty switch. Each child simply has her own
   version (config.gameLevel); the games get bigger as she goes.

   This file is the tab itself (who's playing, which game) and the kit the
   games share: the voice, the catechism card, and the geometry for mazes
   and jigsaw pieces.
   ============================================================ */

const PlayKit = (function () {
  const h = UI.h;
  const games = {};

  function register(id, def) {
    games[id] = def;
  }

  const reduceMotion = (function () {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
  })();

  /* ---------- the voice ---------- */

  let muted = false;
  try { muted = localStorage.getItem("pk-muted") === "1"; } catch (e) { /* fine */ }

  function setMuted(v) {
    muted = !!v;
    try { localStorage.setItem("pk-muted", muted ? "1" : "0"); } catch (e) { /* fine */ }
    if (muted) Voice.hush();
  }

  /* Say a line; `onEnd` runs when it has been said (or at once when the
     sound is off), so a sequence of lines never talks over itself. */
  function say(text, onEnd) {
    if (muted || !text) {
      if (onEnd) setTimeout(onEnd, 250);
      return;
    }
    Voice.speak(text, { rate: 1, onEnd: onEnd });
  }
  function hush() { Voice.hush(); }
  function prefetch(lines) {
    if (muted) return;
    (lines || []).forEach(function (t) { if (t) Voice.prefetch(t); });
  }

  /* ---------- numbers and chance ---------- */

  const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
    "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty"];
  function numberWord(n) { return NUMBER_WORDS[n] || String(n); }

  function hashStr(s) {
    let x = 2166136261;
    for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
    return x >>> 0;
  }
  /* mulberry32: small, good enough, repeatable from a seed. */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, r) {
    const a = arr.slice();
    const rand = r || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* Today's place in the rotation. Each game starts somewhere different,
     so one morning never offers the same picture three times. */
  function dayIndex() {
    const d = new Date();
    return Word.dayOfYear(d) + d.getFullYear() * 3;
  }
  function rotation(list, offset) {
    const n = list.length;
    const start = (((dayIndex() + (offset || 0)) % n) + n) % n;
    return list.slice(start).concat(list.slice(0, start));
  }
  function todaysPicture() {
    return rotation(PICTURES, 0)[0];
  }

  function svg(viewBox, inner, cls) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", viewBox);
    /* game art fills its tile edge to edge */
    if (cls === "pk-tile-svg") s.setAttribute("preserveAspectRatio", "xMidYMid slice");
    if (cls) s.setAttribute("class", cls);
    if (inner) s.innerHTML = inner;
    return s;
  }
  const r2 = function (v) { return Math.round(v * 100) / 100; };

  /* ---------- mazes ---------- */

  const N = 1, E = 2, S = 4, W = 8;

  /* A perfect maze — exactly one road between any two places — by the
     depth-first "backtracker", which gives long winding corridors rather
     than a field of short stubs. */
  function mazeGen(cols, rows, rand) {
    const total = cols * rows;
    const open = new Array(total).fill(0);
    const seen = new Array(total).fill(false);
    const first = Math.floor(rand() * total);
    const stack = [first];
    seen[first] = true;
    while (stack.length) {
      const cur = stack[stack.length - 1];
      const x = cur % cols, y = (cur / cols) | 0;
      const next = [];
      if (y > 0 && !seen[cur - cols]) next.push([cur - cols, N, S]);
      if (x < cols - 1 && !seen[cur + 1]) next.push([cur + 1, E, W]);
      if (y < rows - 1 && !seen[cur + cols]) next.push([cur + cols, S, N]);
      if (x > 0 && !seen[cur - 1]) next.push([cur - 1, W, E]);
      if (!next.length) { stack.pop(); continue; }
      const o = next[Math.floor(rand() * next.length)];
      open[cur] |= o[1];
      open[o[0]] |= o[2];
      seen[o[0]] = true;
      stack.push(o[0]);
    }
    return { cols: cols, rows: rows, open: open };
  }

  function mazeNeighbour(m, cell, dir) {
    if (!(m.open[cell] & dir)) return -1;
    if (dir === N) return cell - m.cols;
    if (dir === S) return cell + m.cols;
    if (dir === E) return cell + 1;
    return cell - 1;
  }

  function mazeDistances(m, from) {
    const dist = new Array(m.open.length).fill(-1);
    const q = [from];
    dist[from] = 0;
    while (q.length) {
      const c = q.shift();
      [N, E, S, W].forEach(function (d) {
        const nb = mazeNeighbour(m, c, d);
        if (nb >= 0 && dist[nb] < 0) { dist[nb] = dist[c] + 1; q.push(nb); }
      });
    }
    return dist;
  }

  /* The way from one cell to another, cell by cell. */
  function mazeWay(m, from, to) {
    const prev = new Array(m.open.length).fill(-1);
    const q = [from];
    prev[from] = from;
    while (q.length) {
      const c = q.shift();
      if (c === to) break;
      [N, E, S, W].forEach(function (d) {
        const nb = mazeNeighbour(m, c, d);
        if (nb >= 0 && prev[nb] < 0) { prev[nb] = c; q.push(nb); }
      });
    }
    const way = [];
    for (let c = to; c !== from && c >= 0; c = prev[c]) way.push(c);
    way.push(from);
    return way.reverse();
  }

  /* ---------- jigsaw piece outlines ---------- */

  /* One edge of a piece, from (x0,y0) to (x1,y1). s = +1 puts a knob
     outward, -1 a socket inward, 0 leaves it flat. The knob is symmetric,
     so the two pieces sharing a seam draw exactly the same curve. */
  function edgePath(x0, y0, x1, y1, s, H) {
    if (!s) return " L" + r2(x1) + " " + r2(y1);
    const L = Math.hypot(x1 - x0, y1 - y0);
    const dx = (x1 - x0) / L, dy = (y1 - y0) / L;
    const nx = dy, ny = -dx;
    const P = function (u, v) {
      return r2(x0 + dx * u * L + nx * v * H * s) + " " + r2(y0 + dy * u * L + ny * v * H * s);
    };
    return " L" + P(0.36, 0) +
      " C" + P(0.4, 0) + " " + P(0.42, 0.25) + " " + P(0.39, 0.45) +
      " C" + P(0.34, 0.75) + " " + P(0.42, 1) + " " + P(0.5, 1) +
      " C" + P(0.58, 1) + " " + P(0.66, 0.75) + " " + P(0.61, 0.45) +
      " C" + P(0.58, 0.25) + " " + P(0.6, 0) + " " + P(0.64, 0) +
      " L" + r2(x1) + " " + r2(y1);
  }

  function piecePath(x0, y0, w, hgt, e, H) {
    return "M" + r2(x0) + " " + r2(y0) +
      edgePath(x0, y0, x0 + w, y0, e.t, H) +
      edgePath(x0 + w, y0, x0 + w, y0 + hgt, e.r, H) +
      edgePath(x0 + w, y0 + hgt, x0, y0 + hgt, e.b, H) +
      edgePath(x0, y0 + hgt, x0, y0, e.l, H) + " Z";
  }

  /* Which way every seam's knob points, for a cols x rows cut. */
  function jigsawEdges(cols, rows, rand) {
    const hs = [], vs = [];
    for (let y = 0; y < rows; y++) {
      hs.push([]); vs.push([]);
      for (let x = 0; x < cols; x++) {
        hs[y].push(rand() < 0.5 ? 1 : -1);
        vs[y].push(rand() < 0.5 ? 1 : -1);
      }
    }
    return function (x, y) {
      return {
        t: y === 0 ? 0 : -hs[y - 1][x],
        b: y === rows - 1 ? 0 : hs[y][x],
        l: x === 0 ? 0 : -vs[y][x - 1],
        r: x === cols - 1 ? 0 : vs[y][x],
      };
    };
  }

  /* ---------- the card at the end of every picture ---------- */

  /* The picture's name, the verse, the truth in it — and for Addison one
     question about it. Built in the page rather than the game, so the
     words are real text: crisp, selectable, read by a screen reader. */
  function finale(host, o) {
    const pic = o.pic;
    const card = h("div", { class: "pk-finale", role: "dialog", "aria-label": pic.name });

    const again = h("button", { class: "ibtn pk-hear", type: "button", "aria-label": "Hear it again" }, UI.icon("sound"));
    again.addEventListener("click", function () { say(pic.truth); });

    const next = h("button", { class: "btn btn-primary btn-block pk-next", type: "button" }, o.nextLabel || "Play again");
    next.addEventListener("click", function () { hush(); o.onNext(); });
    const menu = h("button", { class: "btn btn-block pk-other", type: "button" }, "Choose another game");
    menu.addEventListener("click", function () { hush(); o.onMenu(); });
    const actions = h("div", { class: "pk-fin-actions" }, next, menu);

    const body = h(
      "div",
      { class: "pk-fin-body" },
      h("div", { class: "pk-fin-head" }, h("div", { class: "pk-fin-name", text: pic.name }), again),
      h("p", { class: "pk-fin-verse", text: "“" + pic.verse + "”" }),
      h("div", { class: "word-ref", text: pic.ref + " (KJV)" }),
      h("p", { class: "pk-fin-truth", text: pic.truth })
    );

    if (o.big && pic.q) {
      const q = question(pic.q, o, function () { body.appendChild(actions); });
      body.appendChild(q.el);
      card._ask = q.ask;
    } else {
      body.appendChild(actions);
    }

    card.appendChild(body);
    host.appendChild(card);
    return card;
  }

  /* One catechism question about the picture just finished. The wrong
     answers are plainly wrong on purpose; a near miss would teach the
     error. Getting it right is followed by the truth said in full.

     The order is shuffled but the same every time for a given question,
     so the voice and the buttons always agree and each question is one
     voice clip, synthesised (and paid for) once. */
  function question(spec, o, onDone) {
    const opts = shuffle(spec.options.map(function (x) { return { text: x[0], ok: !!x[1] }; }), rng(hashStr(spec.q)));
    const block = h("div", { class: "pk-q" });
    const spoken = spec.q + " Is it: " + opts.map(function (x) { return x.text; }).join("? Or: ") + "?";

    const replay = h("button", { class: "ibtn pk-hear", type: "button", "aria-label": "Say the question again" }, UI.icon("sound"));
    replay.addEventListener("click", function () { say(spoken); });

    block.appendChild(h("div", { class: "pk-q-head" }, h("div", { class: "pk-q-label", text: "A question" }), replay));
    block.appendChild(h("div", { class: "pk-q-text", text: spec.q }));

    const answers = h("div", { class: "pk-q-answers" });
    opts.forEach(function (x) {
      const b = h("button", { class: "pk-q-answer", type: "button" }, x.text);
      b.addEventListener("click", function () {
        if (!x.ok) {
          if (o.onWrong) o.onWrong();
          b.classList.add("is-wrong");
          b.disabled = true;
          say("Have another think!");
          return;
        }
        if (o.onRight) o.onRight();
        answers.querySelectorAll("button").forEach(function (y) { y.disabled = true; });
        b.classList.add("is-right");
        const teach = h(
          "div",
          { class: "pk-q-teach" },
          h("p", { text: spec.teach }),
          spec.ref ? h("div", { class: "word-ref", text: spec.ref }) : null
        );
        block.appendChild(teach);
        say(spec.teach);
        onDone();
        scrollDown(block.closest(".pk-finale"));
      });
      answers.appendChild(b);
    });
    block.appendChild(answers);

    return {
      el: block,
      /* By the time the question is asked, the name and verse have been
         said; roll the card up so every answer is in reach without her
         having to know that a card can scroll. */
      ask: function () {
        scrollDown(block.closest(".pk-finale"));
        say(spoken);
      },
    };
  }

  function scrollDown(card) {
    if (!card) return;
    card.scrollTo({ top: card.scrollHeight, behavior: reduceMotion ? "auto" : "smooth" });
    /* A smooth scroll can be cut short (a hidden tab never animates it at
       all); make sure it arrives. */
    setTimeout(function () {
      if (card.scrollTop < card.scrollHeight - card.clientHeight - 2) card.scrollTop = card.scrollHeight;
    }, 700);
  }

  return {
    register: register,
    games: games,
    say: say,
    hush: hush,
    prefetch: prefetch,
    muted: function () { return muted; },
    setMuted: setMuted,
    numberWord: numberWord,
    hashStr: hashStr,
    rng: rng,
    shuffle: shuffle,
    rotation: rotation,
    todaysPicture: todaysPicture,
    svg: svg,
    maze: { gen: mazeGen, next: mazeNeighbour, distances: mazeDistances, way: mazeWay, N: N, E: E, S: S, W: W },
    jigsaw: { path: piecePath, edges: jigsawEdges },
    finale: finale,
    reduceMotion: reduceMotion,
  };
})();

/* ============================================================

(function () {
  const h = UI.h;
  const ORDER = ["ark", "dots", "maze", "jigsaw"];

  function S() {
    if (!UI.state.play) UI.state.play = { phase: "kid" };
    return UI.state.play;
  }

  /* Addison is nearly five and gets the older game; Sophie is two. The
     setting lives in config so it can change when they grow, with no
     switch on the screen for anyone to get wrong. */
  function isBig(name) {
    const cfg = Store.get("config") || {};
    const set = (cfg.gameLevel || {})[name];
    if (set === "big") return true;
    if (set === "little") return false;
    const age = (cfg.kidAges || {})[name];
    return typeof age === "number" ? age >= 4 : false;
  }

  function kids() {
    const shop = typeof Rewards !== "undefined" ? Rewards.shop() || {} : {};
    const list = (shop.kids || []).filter(function (k) { return k && k.name; });
    return list.length ? list : [{ name: "Addison", emoji: "\u{1F430}" }, { name: "Sophie", emoji: "\u{1F422}" }];
  }

  function startGame(id) {
    const st = S();
    const def = PlayKit.games[id];
    if (!def || typeof Engine === "undefined") return;
    Voice.unlock();
    Engine.open(def, { kid: st.kid, big: isBig(st.kid) });
  }

  /* ---------- who's playing ---------- */

  function renderKids(root) {
    const st = S();
    const pic = PlayKit.todaysPicture();

    root.appendChild(
      h("div", { class: "page-head" },
        h("div", { class: "eyebrow", text: "Play & learn" }),
        h("div", { class: "title", text: "Who's playing?" }))
    );

    const list = kids();
    root.appendChild(
      h("div", { class: "pk-kids", "data-n": String(list.length) },
        list.map(function (k, i) {
          const b = h("button", { class: "pk-kid pk-kid-" + (i % 4), type: "button" },
            h("span", { class: "pk-kid-face", text: k.emoji || "\u{2B50}" }),
            h("span", { class: "pk-kid-name", text: k.name }),
            h("span", { class: "pk-kid-sub", text: "Let's play!" }));
          b.addEventListener("click", function () {
            Voice.unlock();
            st.kid = k.name;
            st.phase = "menu";
            window.scrollTo(0, 0);
            Router.refresh();
          });
          return b;
        }))
    );

    const art = PlayKit.svg("0 0 100 100", picMarkup(pic), "pk-hero-art");
    const hear = h("button", { class: "ibtn pk-hear", type: "button", "aria-label": "Hear today's verse" }, UI.icon("sound"));
    hear.addEventListener("click", function () { PlayKit.say(pic.verse + " " + pic.ref.replace(/(\d+):(\d+)/, "$1 verse $2") + "."); });
    root.appendChild(
      h("div", { class: "card pk-hero" },
        h("div", { class: "pk-hero-frame" }, art),
        h("div", { class: "pk-hero-text" },
          h("div", { class: "pk-hero-head" }, h("div", { class: "eyebrow", text: "Today's picture" }), hear),
          h("div", { class: "pk-hero-name", text: pic.name }),
          h("p", { class: "pk-hero-verse", text: "“" + pic.verse + "”" }),
          h("div", { class: "word-ref", text: pic.ref + " (KJV)" })))
    );
  }

  /* ---------- which game ---------- */

  function renderMenu(root) {
    const st = S();
    const big = isBig(st.kid);
    const back = h("button", { class: "ibtn", type: "button", "aria-label": "Back" }, UI.icon("back"));
    back.addEventListener("click", function () { st.phase = "kid"; Router.refresh(); });

    root.appendChild(
      h("div", { class: "pk-menu-head" },
        back,
        h("div", {},
          h("div", { class: "eyebrow", text: st.kid + " is playing" }),
          h("div", { class: "title", text: "Pick a game" })))
    );

    root.appendChild(
      h("div", { class: "pk-tiles" },
        ORDER.filter(function (id) { return PlayKit.games[id]; }).map(function (id, i) {
          const def = PlayKit.games[id];
          const b = h("button", { class: "pk-tile pk-tile-" + id + (i === 0 ? " is-hero" : ""), type: "button" },
            h("span", { class: "pk-tile-art" }, def.preview()),
            h("span", { class: "pk-tile-body" },
              h("span", { class: "pk-tile-title", text: def.title }),
              h("span", { class: "pk-tile-sub", text: big ? def.blurbBig : def.blurbLittle })),
            h("span", { class: "pk-tile-play", "aria-hidden": "true" }, UI.icon("chevron")));
          b.addEventListener("click", function () { startGame(id); });
          return b;
        }))
    );
  }

  function render(root) {
    root.classList.add("pk-view");
    const st = S();
    if (st.phase === "menu" && st.kid) return renderMenu(root);
    return renderKids(root);
  }

  Router.on("bible", render);
})();


/* ==== js/56-engine.js ========================================================= */
/* ============================================================
   Engine — the games' shared machinery.

   The Bible tab's games run on Phaser 4 (WebGL), vendored in hub/vendor
   and loaded only the first time a game is opened, so nothing else in the
   app pays for it. A game opens full-screen over the app, the way a game
   on a tablet does, and the back button (or the phone's own back gesture)
   closes it.

   What lives here, so each game can be about its own idea:

     open()       the full-screen shell: canvas, back and mute buttons,
                  loading, the end-of-picture card, and the history entry
                  that lets "back" close the game.
     Sfx          sound designed rather than beeped: a mixing bus with a
                  touch of room reverb, bells, a marimba, pops, whooshes,
                  a wooden snap, rain — and a music box playing "Jesus
                  Loves Me" very quietly, which dips whenever the voice
                  speaks.
     textures     the storybook SVGs turned into crisp WebGL textures, and
                  the little shapes the effects are made of.
     kit()        effects every game wants: a sky, drifting motes,
                  sparkle bursts, confetti, a hint hand, and the
                  "picture comes alive" moment at the end.
     celebrate()  the finish: fanfare, confetti, the picture's name said
                  out loud, then the card slides in and the camera frames
                  the picture beside it.

   Game coordinates are device pixels (the canvas is sized to the screen
   times its pixel ratio, then shown at 1/ratio), so everything is sharp on
   a phone; `ctx.u` turns CSS pixels into game pixels.
   ============================================================ */

const Engine = (function () {
  const h = UI.h;
  const PHASER = "/vendor/phaser-4.2.1.min.js";
  const PHASER_CDN = "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js";

  /* ---------- loading Phaser ---------- */

  let loading = null;
  function loadPhaser() {
    if (window.Phaser) return Promise.resolve();
    if (loading) return loading;
    loading = new Promise(function (resolve, reject) {
      function add(src, fallback) {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = function () { if (window.Phaser) resolve(); else fallback(); };
        s.onerror = fallback;
        document.head.appendChild(s);
      }
      /* Our own copy first; the public CDN only if this copy of the app
         can't serve it (the Surface's local fallback server, say). */
      add(PHASER, function () {
        add(PHASER_CDN, function () { loading = null; reject(new Error("The game engine didn't load.")); });
      });
    });
    return loading;
  }

  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* fine */ }
  }

  /* ============================================================
     Sound
     ============================================================ */

  const Sfx = (function () {
    let ac = null, master = null, sfx = null, music = null, wet = null;
    let noiseBuf = null;

    function ctx() {
      if (ac) return ac;
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.ratio.value = 3.5;
        master = ac.createGain();
        master.gain.value = PlayKit.muted() ? 0 : 0.9;
        master.connect(comp);
        comp.connect(ac.destination);

        /* A small warm room, so a bell rings rather than clicks. */
        const verb = ac.createConvolver();
        verb.buffer = impulse(1.8, 3.2);
        wet = ac.createGain();
        wet.gain.value = 0.24;
        verb.connect(wet);
        wet.connect(master);

        sfx = ac.createGain();
        sfx.connect(master);
        sfx.connect(verb);
        music = ac.createGain();
        music.gain.value = 0;
        music.connect(master);
        music.connect(verb);

        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) {
        ac = null;
      }
      return ac;
    }

    function impulse(sec, decay) {
      const rate = ac.sampleRate, len = Math.floor(rate * sec);
      const b = ac.createBuffer(2, len, rate);
      for (let c = 0; c < 2; c++) {
        const d = b.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return b;
    }

    function now() {
      const c = ctx();
      if (!c) return -1;
      if (c.state === "suspended") c.resume();
      return c.currentTime;
    }

    /* One enveloped oscillator. `to` sweeps the pitch; `bus` picks the mix. */
    function tone(o) {
      const t0 = now();
      if (t0 < 0) return;
      const t = t0 + (o.at || 0);
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.sweep || o.dur));
      if (o.detune) osc.detune.value = o.detune;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      osc.connect(g);
      g.connect(o.bus || sfx);
      osc.start(t);
      osc.stop(t + o.dur + 0.05);
    }

    function noise(o) {
      const t0 = now();
      if (t0 < 0) return null;
      const t = t0 + (o.at || 0);
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = !!o.loop;
      const f = ac.createBiquadFilter();
      f.type = o.filter || "bandpass";
      f.frequency.setValueAtTime(o.f, t);
      if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
      f.Q.value = o.q || 1;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.004));
      if (!o.loop) g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      src.connect(f);
      f.connect(g);
      g.connect(o.bus || sfx);
      src.start(t, Math.random());
      if (!o.loop) src.stop(t + o.dur + 0.05);
      return { src: src, gain: g };
    }

    /* A bell: a pure tone with the slightly-off overtone real bells have. */
    function bell(f, at, vol, dur) {
      tone({ f: f, at: at, vol: vol, dur: dur || 1.4 });
      tone({ f: f * 2.76, at: at, vol: vol * 0.22, dur: (dur || 1.4) * 0.35 });
      tone({ f: f * 5.4, at: at, vol: vol * 0.06, dur: (dur || 1.4) * 0.15 });
    }
    function marimba(f, at, vol) {
      tone({ f: f, at: at, vol: vol, dur: 0.6, type: "sine" });
      tone({ f: f * 4, at: at, vol: vol * 0.18, dur: 0.09, type: "sine" });
      tone({ f: f * 10, at: at, vol: vol * 0.05, dur: 0.03, type: "sine" });
    }

    /* C major pentatonic, from middle C up three octaves. Any run of these
       sounds like a tune, so joining dots plays something pleasant. */
    const PENTA = [];
    [261.63, 293.66, 329.63, 392, 440].forEach(function (f) { PENTA.push(f, f * 2, f * 4); });
    PENTA.sort(function (a, b) { return a - b; });

    const fx = {
      pop: function () {
        tone({ f: 420, to: 1150, sweep: 0.07, dur: 0.12, vol: 0.22 });
        noise({ f: 3200, q: 2, dur: 0.02, vol: 0.12 });
      },
      sparkle: function () {
        for (let i = 0; i < 4; i++) bell(PENTA[10 + Math.floor(Math.random() * 5)], i * 0.045, 0.045, 0.6);
      },
      note: function (i) {
        marimba(PENTA[Math.min(PENTA.length - 1, 5 + i)], 0, 0.22);
      },
      chime: function () {
        bell(1046.5, 0, 0.07);
        bell(1318.5, 0.07, 0.06);
        bell(1568, 0.14, 0.06);
      },
      snap: function () {
        noise({ f: 2400, q: 5, dur: 0.035, vol: 0.4 });
        tone({ f: 160, to: 80, dur: 0.09, vol: 0.28 });
        bell(1568, 0.02, 0.035, 0.5);
      },
      lift: function () {
        tone({ f: 330, to: 520, sweep: 0.08, dur: 0.12, vol: 0.08, type: "triangle" });
      },
      drop: function () {
        tone({ f: 220, to: 140, dur: 0.1, vol: 0.12 });
        noise({ f: 700, filter: "lowpass", dur: 0.06, vol: 0.08 });
      },
      boing: function () {
        tone({ f: 200, to: 520, sweep: 0.06, dur: 0.06, vol: 0.14, type: "triangle" });
        tone({ f: 520, to: 160, at: 0.06, dur: 0.34, vol: 0.12, type: "triangle" });
      },
      miss: function () {
        tone({ f: 330, to: 247, dur: 0.18, vol: 0.09, type: "triangle" });
      },
      whoosh: function () {
        noise({ f: 300, to: 2600, q: 0.8, dur: 0.38, vol: 0.12, attack: 0.08 });
      },
      step: function (i) {
        noise({ f: i % 2 ? 900 : 700, filter: "lowpass", dur: 0.035, vol: 0.06 });
        tone({ f: i % 2 ? 196 : 220, dur: 0.05, vol: 0.03 });
      },
      hop: function () {
        tone({ f: 330, to: 660, sweep: 0.09, dur: 0.11, vol: 0.08 });
      },
      thud: function () {
        tone({ f: 110, to: 55, dur: 0.28, vol: 0.4 });
        noise({ f: 400, filter: "lowpass", dur: 0.18, vol: 0.2 });
      },
      splash: function () {
        noise({ f: 2200, to: 500, filter: "lowpass", dur: 0.7, vol: 0.18, attack: 0.02 });
      },
      chirp: function () {
        tone({ f: 2300, to: 3100, sweep: 0.06, dur: 0.08, vol: 0.05 });
        tone({ f: 2500, to: 3300, sweep: 0.06, at: 0.12, dur: 0.08, vol: 0.05 });
      },
      win: function () {
        [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach(function (f, i) { bell(f, i * 0.09, 0.07, 1.6); });
        /* a soft warm chord underneath */
        [261.63, 329.63, 392].forEach(function (f, i) {
          tone({ f: f, at: 0.05, vol: 0.035, dur: 2.2, type: "sawtooth", attack: 0.25, detune: i * 4 - 4 });
        });
      },
    };

    /* Rain: a loop of filtered noise that fades in and out. */
    let rainNode = null;
    function rain(on) {
      if (!ctx()) return;
      if (on && !rainNode) {
        rainNode = noise({ f: 1400, filter: "lowpass", q: 0.4, loop: true, vol: 0.09, attack: 1.2 });
      } else if (!on && rainNode) {
        const n = rainNode;
        rainNode = null;
        const t = ac.currentTime;
        n.gain.gain.cancelScheduledValues(t);
        n.gain.gain.setValueAtTime(n.gain.gain.value, t);
        n.gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        n.src.stop(t + 1.5);
      }
    }

    /* ---------- the music box ----------
       "Jesus Loves Me" (William Bradbury, 1862), the verse, round and
       round, on a music box so quiet it is more felt than heard. */
    const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392, A4 = 440, C5 = 523.25, E5 = 659.25, D5 = 587.33, G5 = 783.99, A5 = 880, C6 = 1046.5;
    const TUNE = [
      [G5, 1], [E5, 1], [E5, 1], [D5, 1], [E5, 1], [G5, 1], [G5, 2],
      [A5, 1], [A5, 1], [C6, 1], [A5, 1], [A5, 1], [G5, 1], [G5, 2],
      [G5, 1], [E5, 1], [E5, 1], [D5, 1], [E5, 1], [G5, 1], [G5, 2],
      [A5, 1], [A5, 1], [G5, 1], [C5, 1], [E5, 1], [D5, 1], [C5, 2],
    ];
    const BASS = [C4, G4, C4, G4, F4, C4, C4, G4, C4, G4, C4, G4, F4, G4, C4, C4];
    const BEAT = 60 / 88;
    let musicOn = false, musicTimer = null, nextAt = 0, step = 0, ducked = false;
    const LEN = TUNE.reduce(function (n, x) { return n + x[1]; }, 0) + 4;

    function scheduleMusic() {
      if (!ac || !musicOn) return;
      while (nextAt < ac.currentTime + 0.5) {
        /* walk the tune: find which note starts on this beat */
        let beat = step % LEN, at = 0, idx = -1;
        for (let i = 0; i < TUNE.length; i++) {
          if (at === beat) { idx = i; break; }
          at += TUNE[i][1];
        }
        const when = nextAt - ac.currentTime;
        if (idx >= 0) {
          tone({ f: TUNE[idx][0], at: when, vol: 0.5, dur: 1.5, bus: music });
          tone({ f: TUNE[idx][0] * 3, at: when, vol: 0.05, dur: 0.3, bus: music });
        }
        if (beat % 2 === 0 && beat < LEN - 4) {
          tone({ f: BASS[(beat / 2) % BASS.length] / 2, at: when, vol: 0.16, dur: 1.8, bus: music });
        }
        nextAt += BEAT;
        step++;
      }
    }
    function musicLevel() {
      if (!music || !ac) return;
      const target = !musicOn ? 0.0001 : ducked ? 0.012 : 0.05;
      const t = ac.currentTime;
      music.gain.cancelScheduledValues(t);
      music.gain.setValueAtTime(Math.max(0.0001, music.gain.value), t);
      music.gain.exponentialRampToValueAtTime(target, t + 0.4);
    }
    function startMusic() {
      if (!ctx() || musicOn) return;
      musicOn = true;
      nextAt = ac.currentTime + 0.6;
      step = 0;
      musicLevel();
      musicTimer = setInterval(scheduleMusic, 120);
    }
    function stopMusic() {
      musicOn = false;
      clearInterval(musicTimer);
      musicTimer = null;
      musicLevel();
    }
    function duck(on) {
      ducked = !!on;
      musicLevel();
    }

    function applyMute() {
      if (!master || !ac) return;
      const t = ac.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), t);
      master.gain.exponentialRampToValueAtTime(PlayKit.muted() ? 0.0001 : 0.9, t + 0.15);
    }

    return Object.assign({ ctx: ctx, rain: rain, startMusic: startMusic, stopMusic: stopMusic, duck: duck, applyMute: applyMute, PENTA: PENTA }, fx);
  })();

  /* Speak, with the music ducked underneath. */
  function say(text, onEnd) {
    Sfx.duck(true);
    PlayKit.say(text, function () {
      Sfx.duck(false);
      if (onEnd) onEnd();
    });
  }

  /* ============================================================
     Textures
     ============================================================ */

  const canvases = new Map();

  /* An SVG drawing, rasterised once at the size it will be used, kept for
     every later game. */
  function svgTexture(key, inner, vb, w, hgt) {
    if (canvases.has(key)) return Promise.resolve(canvases.get(key));
    return new Promise(function (resolve) {
      const svgText = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '" width="' + w + '" height="' + hgt + '">' + inner + "</svg>";
      const img = new Image();
      img.onload = function () {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = hgt;
        c.getContext("2d").drawImage(img, 0, 0, w, hgt);
        canvases.set(key, c);
        resolve(c);
      };
      img.onerror = function () {
        const c = document.createElement("canvas");
        c.width = c.height = 4;
        canvases.set(key, c);
        resolve(c);
      };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
    });
  }

  function canvasTexture(key, w, hgt, draw) {
    if (canvases.has(key)) return canvases.get(key);
    const c = document.createElement("canvas");
    c.width = w;
    c.height = hgt;
    draw(c.getContext("2d"), w, hgt);
    canvases.set(key, c);
    return c;
  }

  /* The little shapes the effects are made of. Drawn once, white, and
     tinted wherever they are used. */
  function makeEffectTextures() {
    canvasTexture("fx-glow", 128, 128, function (g) {
      const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, "rgba(255,255,255,1)");
      gr.addColorStop(0.25, "rgba(255,255,255,0.6)");
      gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr;
      g.fillRect(0, 0, 128, 128);
    });
    canvasTexture("fx-dot", 32, 32, function (g) {
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(16, 16, 14, 0, Math.PI * 2); g.fill();
    });
    canvasTexture("fx-spark", 64, 64, function (g) {
      g.fillStyle = "#fff";
      g.beginPath();
      g.moveTo(32, 2);
      g.quadraticCurveTo(36, 28, 62, 32);
      g.quadraticCurveTo(36, 36, 32, 62);
      g.quadraticCurveTo(28, 36, 2, 32);
      g.quadraticCurveTo(28, 28, 32, 2);
      g.fill();
    });
    canvasTexture("fx-heart", 64, 64, function (g) {
      g.fillStyle = "#fff";
      g.beginPath();
      g.moveTo(32, 56);
      g.bezierCurveTo(8, 40, 2, 24, 14, 14);
      g.bezierCurveTo(22, 8, 30, 12, 32, 20);
      g.bezierCurveTo(34, 12, 42, 8, 50, 14);
      g.bezierCurveTo(62, 24, 56, 40, 32, 56);
      g.fill();
    });
    canvasTexture("fx-ring", 128, 128, function (g) {
      g.strokeStyle = "#fff";
      g.lineWidth = 8;
      g.beginPath(); g.arc(64, 64, 58, 0, Math.PI * 2); g.stroke();
    });
    canvasTexture("fx-bit", 16, 10, function (g) {
      g.fillStyle = "#fff";
      g.fillRect(0, 0, 16, 10);
    });
    canvasTexture("fx-drop", 16, 48, function (g) {
      const gr = g.createLinearGradient(0, 0, 0, 48);
      gr.addColorStop(0, "rgba(255,255,255,0)");
      gr.addColorStop(1, "rgba(255,255,255,0.95)");
      g.fillStyle = gr;
      g.beginPath();
      g.moveTo(8, 0); g.lineTo(11, 40); g.arc(8, 41, 3.5, 0, Math.PI); g.lineTo(5, 40);
      g.fill();
    });
    canvasTexture("fx-shadow", 128, 48, function (g) {
      const gr = g.createRadialGradient(64, 24, 0, 64, 24, 64);
      gr.addColorStop(0, "rgba(0,0,0,0.42)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr;
      g.save(); g.scale(1, 48 / 128); g.beginPath(); g.arc(64, 64, 64, 0, Math.PI * 2); g.restore();
      g.fill();
    });
    canvasTexture("fx-z", 64, 64, function (g) {
      g.fillStyle = "#fff";
      g.font = "800 52px system-ui, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("z", 32, 34);
    });
    canvasTexture("fx-rays", 256, 256, function (g) {
      g.translate(128, 128);
      for (let i = 0; i < 14; i++) {
        g.rotate((Math.PI * 2) / 14);
        const gr = g.createLinearGradient(0, 0, 0, -128);
        gr.addColorStop(0, "rgba(255,255,255,0.9)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr;
        g.beginPath(); g.moveTo(-5, 0); g.lineTo(-20, -128); g.lineTo(20, -128); g.lineTo(5, 0); g.fill();
      }
    });
    canvasTexture("fx-shine", 128, 512, function (g) {
      const gr = g.createLinearGradient(0, 0, 128, 0);
      gr.addColorStop(0, "rgba(255,255,255,0)");
      gr.addColorStop(0.5, "rgba(255,255,255,0.7)");
      gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr;
      g.fillRect(0, 0, 128, 512);
    });
  }

  /* Hand every texture made so far to this game. */
  function useTextures(scene) {
    canvases.forEach(function (c, key) {
      if (!scene.textures.exists(key)) scene.textures.addCanvas(key, c);
    });
  }

  /* A picture, or one of its subjects alone. */
  function pictureTexture(pic, size) {
    return svgTexture("pic-" + pic.id, picMarkup(pic), "0 0 100 100", size || 1024, size || 1024);
  }
  function subjectTexture(key, pic, size) {
    return svgTexture(key, (pic.tokenExtra || "") + picMarkup(pic, { body: true, details: true, token: true }), "0 0 100 100", size || 320, size || 320);
  }
  function castTexture(key, size) {
    if (key === "ark") return svgTexture("cast-ark", CAST.ark, "0 0 200 130", 900, 585);
    if (key === "plank") return svgTexture("cast-plank", CAST.plank, "0 0 100 24", 400, 96);
    return svgTexture("cast-" + key, CAST[key], "0 0 100 100", size || 320, size || 320);
  }
  function zooTexture(name) {
    return svgTexture("zoo-" + name, ZOO[name].svg, "0 0 100 100", 320, 320);
  }

  /* ============================================================
     The full-screen shell
     ============================================================ */

  let current = null;

  function open(def, opts) {
    close();
    const ctx = {
      def: def,
      kid: opts.kid,
      big: !!opts.big,
      level: 0,
      u: 1,
      game: null,
      scene: null,
      alive: true,
      say: say,
      onResize: null,
    };
    current = ctx;

    const holder = h("div", { class: "ge-canvas" });
    const back = h("button", { class: "ge-btn ge-back", type: "button", "aria-label": "Back to the games" }, UI.icon("x"));
    back.addEventListener("click", function () { leave(); });
    const muteBtn = h("button", { class: "ge-btn ge-mute", type: "button" });
    function paintMute() {
      muteBtn.textContent = "";
      muteBtn.appendChild(UI.icon(PlayKit.muted() ? "mute" : "sound"));
      muteBtn.setAttribute("aria-label", PlayKit.muted() ? "Turn the sound on" : "Turn the sound off");
      muteBtn.setAttribute("aria-pressed", PlayKit.muted() ? "true" : "false");
    }
    muteBtn.addEventListener("click", function () {
      PlayKit.setMuted(!PlayKit.muted());
      Sfx.applyMute();
      paintMute();
    });
    paintMute();

    const caption = h("span", { class: "ge-caption" });
    const top = h("div", { class: "ge-top" },
      back,
      h("div", { class: "ge-title" }, h("span", { class: "ge-name", text: def.title }), caption),
      muteBtn);
    const loader = h("div", { class: "ge-load" },
      h("div", { class: "ge-load-art" }, def.preview()),
      h("div", { class: "ge-load-text", text: "Getting ready…" }));
    const cards = h("div", { class: "ge-cards" });
    const root = h("div", { class: "ge ge-" + def.id, role: "dialog", "aria-modal": "true", "aria-label": def.title },
      holder, top, loader, cards);

    ctx.root = root;
    ctx.holder = holder;
    ctx.cards = cards;
    ctx.loader = loader;
    ctx.caption = function (t) { caption.textContent = t || ""; };

    document.body.appendChild(root);
    document.documentElement.classList.add("ge-open");
    try { history.pushState({ ge: 1 }, ""); ctx.pushed = true; } catch (e) { ctx.pushed = false; }

    Sfx.ctx();
    Sfx.applyMute();
    makeEffectTextures();

    loadPhaser()
      .then(function () { return Promise.resolve(def.prepare(ctx)); })
      .then(function () { if (ctx.alive) boot(ctx); })
      .catch(function (e) {
        console.error("game failed to start", e);
        if (!ctx.alive) return;
        loader.textContent = "";
        const b = h("button", { class: "btn btn-primary", type: "button" }, "Back");
        b.addEventListener("click", leave);
        loader.appendChild(h("div", { class: "ge-load-text", text: "The game couldn't start. It needs a connection the first time." }));
        loader.appendChild(b);
      });
  }

  function screen() {
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    return { w: window.innerWidth, h: window.innerHeight, dpr: dpr };
  }

  function boot(ctx) {
    const s = screen();
    ctx.u = s.dpr;
    ctx.game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: ctx.holder,
      width: Math.round(s.w * s.dpr),
      height: Math.round(s.h * s.dpr),
      zoom: 1 / s.dpr,
      backgroundColor: ctx.def.background || "#1b2a36",
      scale: { mode: Phaser.Scale.NONE },
      audio: { noAudio: true },
      input: { activePointers: 3 },
      banner: false,
      render: { antialias: true, powerPreference: "high-performance" },
      scene: sceneFor(ctx),
    });
    Sfx.startMusic();
  }

  /* Each level is a fresh scene with fresh state: the game's `scene(ctx)`
     returns { create, update } closures, and a new level asks for new
     ones rather than resetting the old. */
  function sceneFor(ctx) {
    const def = ctx.def.scene(ctx);
    return {
      key: "play",
      create: function () {
        ctx.scene = this;
        useTextures(this);
        this.input.dragDistanceThreshold = 2;
        if (ctx.loader.isConnected) {
          ctx.loader.classList.add("is-gone");
          setTimeout(function () { ctx.loader.remove(); }, 400);
        }
        def.create.call(this);
      },
      update: function (time, dt) {
        if (def.update) def.update.call(this, time, dt);
      },
    };
  }

  function nextLevel(ctx) {
    if (!ctx.alive || !ctx.game) return;
    ctx.cards.textContent = "";
    ctx.level++;
    Promise.resolve(ctx.def.prepare(ctx)).then(function () {
      if (!ctx.alive) return;
      const game = ctx.game;
      game.scene.remove("play");
      game.scene.add("play", sceneFor(ctx), true);
    });
  }

  function leave() {
    if (current && current.pushed && history.state && history.state.ge) history.back();
    else close();
  }

  function close() {
    const ctx = current;
    if (!ctx) return;
    current = null;
    ctx.alive = false;
    Sfx.stopMusic();
    Sfx.rain(false);
    PlayKit.hush();
    try { if (ctx.game) ctx.game.destroy(true); } catch (e) { /* fine */ }
    if (ctx.root) ctx.root.remove();
    document.documentElement.classList.remove("ge-open");
  }

  window.addEventListener("popstate", function () { if (current) close(); });

  let resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      const ctx = current;
      if (!ctx || !ctx.game) return;
      const s = screen();
      ctx.u = s.dpr;
      ctx.game.scale.resize(Math.round(s.w * s.dpr), Math.round(s.h * s.dpr));
      ctx.game.scale.setZoom(1 / s.dpr);
      if (ctx.onResize) ctx.onResize();
    }, 120);
  });

  /* ============================================================
     The kit: effects for inside a game
     ============================================================ */

  function kit(scene, ctx) {
    const u = ctx.u;
    const W = function () { return scene.scale.width; };
