    const H = function () { return scene.scale.height; };
    /* Room at the top for the back and mute buttons. */
    const top = function () { return 68 * u; };

    function hex(c) { return typeof c === "number" ? c : parseInt(String(c).replace("#", ""), 16); }

    /* A vertical gradient filling the screen, redrawn on resize. It runs on
       well past every edge in its end colours, so when the camera pulls
       back to frame the finished picture there is never an edge to see. */
    function sky(topColor, bottomColor, depth) {
      const g = scene.add.graphics().setDepth(depth || -100);
      let a = hex(topColor), b = hex(bottomColor);
      function draw() {
        const w = W(), h = H();
        g.clear();
        g.fillStyle(a, 1);
        g.fillRect(-w * 2, -h * 2, w * 5, h * 2);
        g.fillGradientStyle(a, a, b, b, 1);
        g.fillRect(-w * 2, 0, w * 5, h);
        g.fillStyle(b, 1);
        g.fillRect(-w * 2, h, w * 5, h * 2);
        scene.cameras.main.setBackgroundColor(b);
      }
      draw();
      return {
        g: g,
        draw: draw,
        set: function (t, bt) { a = hex(t); b = hex(bt); draw(); },
      };
    }

    /* Soft motes drifting up through the scene, for depth and life. */
    function motes(tint, alpha) {
      return scene.add.particles(0, 0, "fx-glow", {
        x: { min: 0, max: W() },
        y: { min: H() * 0.2, max: H() * 1.05 },
        speedY: { min: -14 * u, max: -36 * u },
        speedX: { min: -8 * u, max: 8 * u },
        scale: { min: 0.05 * u, max: 0.16 * u },
        /* fade in, then out, over each mote's life */
        alpha: { onEmit: function () { return 0; }, onUpdate: function (p, k, t) { return Math.sin(t * Math.PI) * (alpha || 0.35); } },
        lifespan: { min: 5000, max: 9000 },
        frequency: 260,
        tint: tint || 0xffffff,
        blendMode: "ADD",
      }).setDepth(-50);
    }

    /* A one-off burst of sparkles, hearts or confetti at a point. */
    function burst(x, y, o) {
      const opt = o || {};
      const em = scene.add.particles(0, 0, opt.tex || "fx-spark", {
        speed: { min: (opt.speed || 260) * 0.35 * u, max: (opt.speed || 260) * u },
        angle: opt.angle || { min: 0, max: 360 },
        scale: { start: (opt.scale || 0.35) * u, end: 0 },
        alpha: { start: 1, end: 0 },
        rotate: opt.spin ? { min: -180, max: 180 } : 0,
        lifespan: { min: 400, max: opt.life || 900 },
        gravityY: (opt.gravity || 0) * u,
        tint: opt.tints || [0xffffff, 0xffe08a, 0xffc94a, 0xfff3c4],
        blendMode: opt.blend || "ADD",
        emitting: false,
      }).setDepth(opt.depth || 900);
      if (opt.parent) opt.parent.add(em);
      em.explode(opt.count || 18, x, y);
      scene.time.delayedCall((opt.life || 900) + 200, function () { em.destroy(); });
      return em;
    }

    /* A ring that grows and fades, for a snap or an arrival. */
    function ring(x, y, r, tint, parent) {
      const s = scene.add.image(x, y, "fx-ring").setTint(tint || 0xffffff).setDepth(880).setAlpha(0.9);
      s.setScale((r * 0.4) / 64);
      if (parent) parent.add(s);
      scene.tweens.add({ targets: s, scale: (r * 1.3) / 64, alpha: 0, duration: 520, ease: "Cubic.easeOut", onComplete: function () { s.destroy(); } });
    }

    /* Confetti from the top of the screen. */
    function confetti() {
      if (PlayKit.reduceMotion) return;
      const em = scene.add.particles(0, 0, "fx-bit", {
        x: { min: 0, max: W() },
        y: -20 * u,
        speedY: { min: 200 * u, max: 520 * u },
        speedX: { min: -140 * u, max: 140 * u },
        gravityY: 320 * u,
        rotate: { min: 0, max: 360 },
        scaleX: { min: 0.6 * u, max: 1.1 * u },
        scaleY: { min: 0.5 * u, max: 1 * u },
        lifespan: 3600,
        quantity: 6,
        frequency: 18,
        tint: [0xef6f6c, 0xf6a24b, 0xffd166, 0x8fd18a, 0x6fb6e8, 0x9b7fd1, 0xffffff],
        emitting: true,
      }).setDepth(950);
      scene.time.delayedCall(900, function () { em.stop(); });
      scene.time.delayedCall(4800, function () { em.destroy(); });
    }

    /* The hint hand: shows a tap or a drag, then gets out of the way. */
    let handSprite = null, handTween = null;
    function hand() {
      if (!handSprite) {
        handSprite = scene.add.image(0, 0, "cast-hand").setOrigin(0.37, 0.07).setDepth(990).setAlpha(0);
        handSprite.setScale((64 * u) / 320);
      }
      return handSprite;
    }
    function showDrag(from, to, opts) {
      const o = opts || {};
      const s = hand();
      if (handTween) handTween.stop();
      s.setPosition(from.x, from.y).setAlpha(0).setScale((64 * u) / 320);
      handTween = scene.tweens.chain({
        targets: s,
        loop: o.loops === undefined ? 1 : o.loops,
        loopDelay: 400,
        tweens: [
          { alpha: 1, duration: 260, x: from.x, y: from.y },
          { scale: (56 * u) / 320, duration: 160 },
          { x: to.x, y: to.y, duration: o.dur || 900, ease: "Sine.easeInOut" },
          { scale: (64 * u) / 320, duration: 160 },
          { alpha: 0, duration: 260 },
        ],
      });
    }
    function showTap(at) {
      const s = hand();
      if (handTween) handTween.stop();
      s.setPosition(at.x, at.y).setAlpha(0).setScale((64 * u) / 320);
      handTween = scene.tweens.chain({
        targets: s,
        loop: 1,
        loopDelay: 300,
        tweens: [
          { alpha: 1, duration: 220 },
          { scale: (54 * u) / 320, duration: 140, yoyo: true, repeat: 1 },
          { alpha: 0, duration: 260, delay: 200 },
        ],
      });
    }
    function hideHand() {
      if (handTween) handTween.stop();
      handTween = null;
      if (handSprite) handSprite.setAlpha(0);
    }

    /* The picture comes alive: each one does its own thing. Coordinates in
       picture units (0-100) inside a container whose 100 units are `size`
       pixels across. */
    const ALIVE = {
      ark: { kind: "rainbow", at: [50, 30] },
      dove: { kind: "feathers", at: [56, 34] },
      whale: { kind: "spray", at: [36, 12] },
      sheep: { kind: "hearts", at: [50, 32] },
      lion: { kind: "zzz", at: [80, 24] },
      basket: { kind: "ripples", at: [50, 74] },
      star: { kind: "twinkle", at: [50, 44] },
      crown: { kind: "twinkle", at: [50, 52] },
      cross: { kind: "rays", at: [50, 36] },
      tomb: { kind: "rays", at: [50, 52] },
      heart: { kind: "hearts", at: [50, 46] },
    };
    function alive(picId, container, size) {
      const a = ALIVE[picId] || { kind: "twinkle", at: [50, 50] };
      const k = size / 100;
      const x = a.at[0] * k, y = a.at[1] * k;
      let em = null;
      if (a.kind === "spray") {
        em = scene.add.particles(x, y, "fx-drop", {
          angle: { min: -120, max: -60 }, speed: { min: 180 * k, max: 300 * k }, gravityY: 520 * k,
          scale: { start: 0.09 * k, end: 0.04 * k }, alpha: { start: 1, end: 0 }, lifespan: 1100, frequency: 45,
          tint: [0x9fd8ff, 0xffffff], rotate: { min: -20, max: 20 },
        });
      } else if (a.kind === "hearts") {
        em = scene.add.particles(x, y, "fx-heart", {
          x: { min: -18 * k, max: 18 * k }, speedY: { min: -26 * k, max: -46 * k }, speedX: { min: -8 * k, max: 8 * k },
          scale: { start: 0.05 * k, end: 0.12 * k }, alpha: { start: 1, end: 0 }, lifespan: 2400, frequency: 420,
          tint: [0xef5f67, 0xf6a3b8, 0xff8fa3],
        });
      } else if (a.kind === "zzz") {
        em = scene.add.particles(x, y, "fx-z", {
          speedY: { min: -14 * k, max: -22 * k }, speedX: { min: 6 * k, max: 14 * k },
          scale: { start: 0.05 * k, end: 0.13 * k }, alpha: { start: 1, end: 0 }, lifespan: 2600, frequency: 900, tint: 0x7a5aa8,
        });
      } else if (a.kind === "feathers") {
        em = scene.add.particles(x, y, "fx-glow", {
          x: { min: -20 * k, max: 20 * k }, speedY: { min: 6 * k, max: 16 * k }, speedX: { min: -12 * k, max: 12 * k },
          scaleX: { start: 0.07 * k, end: 0.04 * k }, scaleY: 0.025 * k, rotate: { min: 0, max: 360 }, alpha: { start: 0.9, end: 0 },
          lifespan: 3200, frequency: 520, tint: 0xffffff,
        });
      } else if (a.kind === "ripples") {
        const loop = scene.time.addEvent({
          delay: 900, loop: true, callback: function () {
            const s = scene.add.image(x, y, "fx-ring").setTint(0xffffff).setAlpha(0.8).setScale(0.05 * k, 0.018 * k);
            container.add(s);
            scene.tweens.add({ targets: s, scaleX: 0.42 * k, scaleY: 0.12 * k, alpha: 0, duration: 1800, ease: "Sine.easeOut", onComplete: function () { s.destroy(); } });
          },
        });
        return loop;
      } else if (a.kind === "rays") {
        const r = scene.add.image(x, y, "fx-rays").setBlendMode("ADD").setAlpha(0.32).setTint(0xfff3c4).setScale((1.2 * size) / 256);
        container.addAt(r, 1);
        scene.tweens.add({ targets: r, angle: 360, duration: 24000, repeat: -1 });
        scene.tweens.add({ targets: r, alpha: 0.18, duration: 1800, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
        return r;
      } else if (a.kind === "rainbow") {
        em = scene.add.particles(x, y, "fx-spark", {
          emitZone: { type: "random", source: new Phaser.Geom.Rectangle(-44 * k, -20 * k, 88 * k, 40 * k) },
          scale: { start: 0, end: 0.12 * k, ease: "Sine.easeOut" }, alpha: { start: 1, end: 0 }, lifespan: 1000, frequency: 120,
          tint: [0xef6f6c, 0xf6a24b, 0xffd166, 0x8fd18a, 0x6fb6e8], blendMode: "ADD",
        });
      } else {
        em = scene.add.particles(x, y, "fx-spark", {
          emitZone: { type: "random", source: new Phaser.Geom.Circle(0, 0, 40 * k) },
          scale: { start: 0, end: 0.1 * k, ease: "Sine.easeOut" }, alpha: { start: 1, end: 0 }, lifespan: 900, frequency: 140,
          tint: [0xffffff, 0xffe08a], blendMode: "ADD",
        });
      }
      if (em) container.add(em);
      return em;
    }

    /* A gentle, endless "breathing" so a finished picture never looks
       frozen. */
    function breathe(target, amount) {
      return scene.tweens.add({
        targets: target, scale: target.scale * (1 + (amount || 0.02)),
        duration: 1600, yoyo: true, repeat: -1, ease: "Sine.easeInOut",
      });
    }

    return {
      u: u, W: W, H: H, top: top, sky: sky, motes: motes, burst: burst, ring: ring, confetti: confetti,
      showDrag: showDrag, showTap: showTap, hideHand: hideHand, alive: alive, breathe: breathe, hex: hex,
    };
  }

  /* ============================================================
     The finish
     ============================================================ */

  /* o.pic       the picture whose card to show
     o.region()  where the picture is on screen, in game pixels
     o.nextLabel the button that plays on */
  function celebrate(ctx, o) {
    const scene = ctx.scene;
    const k = kit(scene, ctx);
    Sfx.win();
    k.confetti();
    buzz(40);
    say(o.pic.said, function () {
      if (!ctx.alive || ctx.scene !== scene) return;
      const card = PlayKit.finale(ctx.cards, {
        pic: o.pic,
        big: ctx.big,
        nextLabel: o.nextLabel || "Play again",
        onNext: function () { Sfx.pop(); nextLevel(ctx); },
        onMenu: leave,
        onWrong: function () { Sfx.miss(); },
        onRight: function () { Sfx.chime(); k.confetti(); },
      });
      /* Frame the picture in whatever the card leaves free. */
      requestAnimationFrame(function () {
        if (!o.region || !card.isConnected) return;
        frame(scene, ctx, o.region(), freeArea(ctx, card));
      });
      say(o.pic.truth, function () {
        if (card.isConnected && card._ask) card._ask();
      });
    });
  }

  /* The part of the screen the card isn't covering, in game pixels. */
  function freeArea(ctx, card) {
    const u = ctx.u;
    const r = card.getBoundingClientRect();
    const W = window.innerWidth, H = window.innerHeight;
    const topPad = 64;
    if (r.left > W * 0.3) return { x: 0, y: topPad * u, w: r.left * u, h: (H - topPad) * u };
    return { x: 0, y: topPad * u, w: W * u, h: Math.max(80, r.top - topPad) * u };
  }

  /* Move and zoom the camera so `region` sits in the middle of `free`. */
  function frame(scene, ctx, region, free) {
    const cam = scene.cameras.main;
    const pad = 0.9;
    const z = Math.max(0.3, Math.min(1.25, Math.min((free.w * pad) / region.w, (free.h * pad) / region.h)));
    const rcx = region.x + region.w / 2, rcy = region.y + region.h / 2;
    const fcx = free.x + free.w / 2, fcy = free.y + free.h / 2;
    const W = scene.scale.width, H = scene.scale.height;
    /* Put world point (rcx, rcy) at screen point (fcx, fcy). */
    const cx = rcx + (W / 2 - fcx) / z;
    const cy = rcy + (H / 2 - fcy) / z;
    cam.zoomTo(z, 650, "Cubic.easeInOut");
    cam.pan(cx, cy, 650, "Cubic.easeInOut");
  }

  return {
    open: open,
    close: close,
    leave: leave,
    kit: kit,
    celebrate: celebrate,
    say: say,
    Sfx: Sfx,
    buzz: buzz,
    svgTexture: svgTexture,
    canvasTexture: canvasTexture,
    canvas: function (key) { return canvases.get(key); },
    pictureTexture: pictureTexture,
    subjectTexture: subjectTexture,
    castTexture: castTexture,
    zooTexture: zooTexture,
    current: function () { return current; },
  };
})();


/* ==== js/57-ark.js ========================================================= */
/* ============================================================
   Two by Two — Noah's ark.

   The animals mill about in the meadow in front of the ark. Pick one up
   (it says its name), carry it to the gangplank, and it trots up and in.
   Sophie (2) can bring them in any order. Addison (nearly 5) has Noah
   calling for them two by two: a speech bubble shows which animals he
   wants next, and anyone else hops back to the meadow.

   When the last one is aboard the story carries on by itself, because the
   point of the story is that Noah didn't do this part: "and the LORD shut
   him in." The gangplank swings up and closes the door, the sky darkens,
   the rain comes, the water rises and the ark floats. Then the rain stops,
   the dove flies in and the rainbow comes out — God's promise.

   Every level is a new set of animals, and there are more of them.
   ============================================================ */

(function () {
  const ANIM_MAX = 6;

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function lines(ctx) {
    const out = ["Help the animals into Noah's ark!", "Noah needs the animals, two by two!", "And the LORD shut him in."];
    ctx.kinds.forEach(function (k) {
      const z = ZOO[k];
      out.push(cap(z.name) + "!", "In goes the " + z.name + "!", "Two " + z.plural + ", please!",
        "One " + z.name + ". Where is the other " + z.name + "?", "Two " + z.plural + "! Well done!");
    });
    return out;
  }

  function prepare(ctx) {
    const pairs = ctx.big ? Math.min(3 + ctx.level, ANIM_MAX) : Math.min(2 + ctx.level, 4);
    ctx.kinds = PlayKit.shuffle(ZOO_ORDER).slice(0, pairs);
    const jobs = [
      Engine.castTexture("ark"), Engine.castTexture("plank"), Engine.castTexture("cloud", 256), Engine.castTexture("hand", 320),
      Engine.subjectTexture("subj-dove", PICTURE_BY_ID.dove, 256),
    ];
    ctx.kinds.forEach(function (k) { jobs.push(Engine.zooTexture(k)); });
    PlayKit.prefetch(lines(ctx).concat([ARK_STORY.said, ARK_STORY.truth, ARK_STORY.q.teach]));
    return Promise.all(jobs);
  }

  function scene(ctx) {
    let S, K, u;
    let L = null;                 /* layout, in game pixels */
    let sky, sun, sunRays, clouds = [], stormClouds = [], hills, ground, arkC, arkImg, plank, blocks, water, rain = null, rainbow = null;
    let animals = [];
    let held = null;
    let bubble = null, order = [], pairIdx = 0, inThisPair = 0;
    let boarded = 0, total = 0, phase = "play";
    let waterLevel = 0, waterTarget = 0, floatT = 0;
    let idleTimer = null, hintTimer = null, stepN = 0;

    /* ---------- layout ---------- */

    function layout() {
      const W = K.W(), H = K.H();
      const portrait = H > W * 1.05;
      const groundY = Math.round(H * (portrait ? 0.56 : 0.6));
      const arkW = Math.min(W * (portrait ? 0.66 : 0.42), H * (portrait ? 0.36 : 0.5) * (200 / 130));
      const arkH = arkW * 0.65;
      const arkX = W - arkW - W * 0.03;
      const lift = arkH * 0.12;                         /* on its blocks */
      const arkY = groundY - lift - arkH * (118 / 130);
      const doorX = arkX + (41 / 200) * arkW, doorY = arkY + (102 / 130) * arkH;
      const doorH = (32 / 130) * arkH, doorW = (22 / 200) * arkW;
      const ang = 0.42;
      const drop = Math.max(10, groundY + arkH * 0.04 - doorY);
      const plankL = drop / Math.sin(ang);
      const footX = doorX - plankL * Math.cos(ang), footY = doorY + drop;
      const size = Math.min(W * (portrait ? 0.21 : 0.12), H * (portrait ? 0.13 : 0.17));
      L = {
        W: W, H: H, portrait: portrait, groundY: groundY,
        arkX: arkX, arkY: arkY, arkW: arkW, arkH: arkH, lift: lift,
        doorX: doorX, doorY: doorY, doorH: doorH, doorW: doorW,
        ang: ang, plankL: plankL, footX: footX, footY: footY,
        size: size,
        /* the meadow in front of the ark, edge to edge */
        meadow: portrait
          ? { x0: W * 0.06 + size * 0.4, x1: W * 0.94 - size * 0.4, y0: groundY + size * 1.15, y1: H - size * 0.25 }
          : { x0: W * 0.05 + size * 0.5, x1: W * 0.95 - size * 0.5, y0: groundY + size * 1.05, y1: H - size * 0.22 },
      };
    }

    /* ---------- the world ---------- */

    function drawLand() {
      const W = L.W, H = L.H;
      hills.clear();
      hills.fillStyle(0xa9d98a, 1);
      hills.fillEllipse(W * 0.2, L.groundY + 6 * u, W * 0.9, H * 0.14);
      hills.fillStyle(0x98cf78, 1);
      hills.fillEllipse(W * 0.78, L.groundY + 8 * u, W * 1.0, H * 0.12);
      ground.clear();
      ground.fillGradientStyle(0x8cc964, 0x8cc964, 0x6fb24e, 0x6fb24e, 1);
      ground.fillRect(-W, L.groundY, W * 3, H - L.groundY);
      ground.fillStyle(0x6fb24e, 1);
      ground.fillRect(-W, H, W * 3, H);
      /* tufts and little flowers, scattered the same way every time */
      const r = PlayKit.rng(4242);
      for (let i = 0; i < 70; i++) {
        const x = r() * W, y = L.groundY + 8 * u + r() * (H - L.groundY);
        ground.fillStyle(0x5f9f42, 0.7);
        ground.fillTriangle(x, y, x + 3 * u, y - 7 * u, x + 6 * u, y);
        if (i % 6 === 0) {
          ground.fillStyle(i % 12 === 0 ? 0xffffff : 0xffd166, 1);
          ground.fillCircle(x + 9 * u, y - 2 * u, 2.6 * u);
        }
      }
      blocks.clear();
      blocks.fillStyle(0x8a5a2b, 1);
      blocks.lineStyle(2 * u, 0x3b2f2a, 1);
      [0.3, 0.68].forEach(function (f) {
        const bx = L.arkX + L.arkW * f - L.arkW * 0.05, by = L.groundY - L.lift - 2 * u;
        blocks.fillRect(bx, by, L.arkW * 0.1, L.lift + 4 * u);
        blocks.strokeRect(bx, by, L.arkW * 0.1, L.lift + 4 * u);
      });
    }

    function placeArk() {
      arkC.setPosition(L.arkX, L.arkY);
      arkImg.setDisplaySize(L.arkW, L.arkH);
      plank.setPosition(L.doorX - L.arkX, L.doorY - L.arkY);
      plank.setScale(L.plankL / 400, (L.arkH * 0.085) / 96);
      if (phase === "play") plank.setRotation(-L.ang);
      sun.setPosition(L.W * 0.18, L.H * 0.16).setScale((L.W * 0.5) / 128);
      sunRays.setPosition(L.W * 0.18, L.H * 0.16).setScale((L.W * 0.7) / 256);
      if (bubble) placeBubble();
    }

    function makeClouds() {
      for (let i = 0; i < 4; i++) {
        const c = S.add.image(0, 0, "cast-cloud").setDepth(-80).setAlpha(0.95);
        c.setScale(((0.22 + Math.random() * 0.14) * Math.max(L.W, L.H) * 0.7) / 256);
        c.setPosition(Math.random() * L.W, L.H * (0.12 + Math.random() * 0.28));
        c.speed = (6 + Math.random() * 10) * u;
        clouds.push(c);
      }
    }

    /* ---------- the animals ---------- */

    function spawnAnimals() {
      const kinds = [];
      ctx.kinds.forEach(function (k) { kinds.push(k, k); });
      total = kinds.length;
      const m = L.meadow;
      const cols = L.portrait ? 3 : Math.min(total, 6);
      const rows = Math.ceil(total / cols);
      const slots = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          slots.push({
            x: m.x0 + ((c + 0.5) / cols) * (m.x1 - m.x0) + (Math.random() - 0.5) * (m.x1 - m.x0) / cols * 0.4,
            y: m.y0 + ((r + 0.5) / rows) * (m.y1 - m.y0) + (Math.random() - 0.5) * (m.y1 - m.y0) / rows * 0.3,
          });
        }
      }
      const spots = PlayKit.shuffle(slots).slice(0, total);
      PlayKit.shuffle(kinds).forEach(function (kind, i) {
        const c = S.add.container(spots[i].x, spots[i].y);
        const shadow = S.add.image(0, 2 * u, "fx-shadow").setScale((L.size * 0.85) / 128, (L.size * 0.28) / 48);
        const body = S.add.container(0, 0);
        const sprite = S.add.image(0, 0, "zoo-" + kind).setOrigin(0.5, 0.94).setScale(L.size / 320);
        body.add(sprite);
        c.add([shadow, body]);
        const a = { c: c, body: body, sprite: sprite, shadow: shadow, kind: kind, state: "idle", home: { x: c.x, y: c.y }, tx: c.x, ty: c.y, vx: 0 };
        face(a, Math.random() < 0.5 ? 1 : -1);
        animals.push(a);
        /* pop in, one after another */
        c.setScale(0);
        S.tweens.add({ targets: c, scale: 1, duration: 420, delay: 120 + i * 90, ease: "Back.easeOut" });
      });
      sortDepth();
    }

    function face(a, dir) {
      a.dir = dir;
      a.sprite.setFlipX((dir < 0) === (ZOO[a.kind].faces > 0));
    }

    function sortDepth() {
      animals.forEach(function (a) { if (a.state !== "held") a.c.setDepth(100 + a.c.y / 10); });
    }

    function hop(a, height, dur) {
      S.tweens.add({ targets: a.body, y: -(height || 10) * u, duration: (dur || 180), yoyo: true, ease: "Quad.easeOut" });
      S.tweens.add({ targets: a.body, scaleY: 0.9, scaleX: 1.08, duration: 80, yoyo: true, delay: (dur || 180) * 2 - 40 });
    }

    /* Every few seconds somebody does something: a hop, a turn. */
    function fidget() {
      const free = animals.filter(function (a) { return a.state === "idle"; });
      if (free.length) {
        const a = free[Math.floor(Math.random() * free.length)];
        if (Math.random() < 0.5) hop(a, 6 + Math.random() * 8);
        else face(a, -a.dir);
      }
    }

    /* Walk an animal through a list of points, hopping as it goes. */
    function walk(a, points, speed, done) {
      const tweens = [];
      let px = a.c.x, py = a.c.y;
      points.forEach(function (p) {
        const d = Math.hypot(p.x - px, p.y - py);
        tweens.push({
          x: p.x, y: p.y, duration: Math.max(120, (d / (speed * u)) * 1000), ease: "Linear",
          onStart: (function (tx) { return function () { face(a, tx >= a.c.x ? 1 : -1); }; })(p.x),
        });
        px = p.x; py = p.y;
      });
      const bob = S.tweens.add({
        targets: a.body, y: -7 * u, duration: 150, yoyo: true, repeat: -1, ease: "Quad.easeOut",
        onYoyo: function () { Engine.Sfx.step(stepN++); },
      });
      S.tweens.chain({
        targets: a.c, tweens: tweens,
        onComplete: function () { bob.stop(); a.body.y = 0; if (done) done(); },
      });
    }

    /* ---------- Noah's speech bubble (Addison) ---------- */

    function makeBubble() {
      bubble = S.add.container(0, 0).setDepth(600);
      bubble.bg = S.add.graphics();
      bubble.icons = [S.add.image(0, 0, "zoo-" + order[0]), S.add.image(0, 0, "zoo-" + order[0])];
      bubble.add([bubble.bg].concat(bubble.icons));
      placeBubble();
      paintBubble();
    }

    function placeBubble() {
      const bw = Math.min(L.W * 0.42, 150 * u), bh = bw * 0.5;
      bubble.w = bw; bubble.h = bh;
      bubble.setPosition(L.arkX + L.arkW * 0.5 - bw * 0.15, L.arkY - bh - 4 * u);
      bubble.bg.clear();
      bubble.bg.fillStyle(0x000000, 0.12);
      bubble.bg.fillRoundedRect(-bw / 2 + 3 * u, 4 * u, bw, bh, bh * 0.4);
      bubble.bg.fillStyle(0xffffff, 1);
      bubble.bg.lineStyle(2.4 * u, 0x3b2f2a, 1);
      bubble.bg.fillRoundedRect(-bw / 2, 0, bw, bh, bh * 0.4);
      bubble.bg.strokeRoundedRect(-bw / 2, 0, bw, bh, bh * 0.4);
      bubble.bg.fillTriangle(bw * 0.05, bh - 1 * u, bw * 0.22, bh - 1 * u, bw * 0.16, bh + bh * 0.32);
      bubble.bg.lineBetween(bw * 0.05, bh, bw * 0.16, bh + bh * 0.32);
      bubble.bg.lineBetween(bw * 0.22, bh, bw * 0.16, bh + bh * 0.32);
      bubble.icons.forEach(function (ic, i) {
        ic.setScale((bh * 0.92) / 320).setOrigin(0.5, 0.94);
        ic.setPosition((i ? 1 : -1) * bw * 0.22, bh * 0.94);
      });
    }

    function paintBubble() {
      const want = order[pairIdx];
      bubble.icons.forEach(function (ic, i) {
        ic.setTexture("zoo-" + want);
        ic.setAlpha(i < inThisPair ? 0.3 : 1);
      });
    }

    function popBubble() {
      S.tweens.add({ targets: bubble, scale: 1.15, duration: 120, yoyo: true, ease: "Quad.easeOut" });
    }

    /* ---------- dragging ---------- */

    function pickAt(p) {
      let best = null, bestD = Infinity;
      animals.forEach(function (a) {
        if (a.state !== "idle") return;
        const cx = a.c.x, cy = a.c.y - L.size * 0.45;
        const d = Math.hypot(p.x - cx, p.y - cy);
        if (d < L.size * 0.62 && (d < bestD || (best && a.c.depth > best.c.depth && d < bestD + L.size * 0.2))) { best = a; bestD = d; }
      });
      return best;
    }

    function onDown(p) {
      if (phase !== "play" || held) return;
      const a = pickAt(p);
      if (!a) return;
      K.hideHand();
      armHint();
      held = a;
      a.state = "held";
      a.pointer = p.id;
      a.ox = a.c.x - p.x;
      a.oy = a.c.y - p.y + L.size * 0.25;
      a.tx = a.c.x; a.ty = a.c.y - L.size * 0.25;
      a.c.setDepth(800);
      S.tweens.add({ targets: a.c, scale: 1.14, duration: 140, ease: "Back.easeOut" });
      S.tweens.add({ targets: a.shadow, alpha: 0.45, duration: 140 });
      Engine.Sfx.lift();
      Engine.buzz(10);
      Engine.say(cap(ZOO[a.kind].name) + "!");
    }

    function onMove(p) {
      if (!held || held.pointer !== p.id) return;
      held.tx = Math.max(L.size * 0.3, Math.min(L.W - L.size * 0.3, p.x + held.ox));
      held.ty = Math.max(K.top() + L.size, Math.min(L.H - 4 * u, p.y + held.oy));
    }

    function onUp(p) {
      if (!held || held.pointer !== p.id) return;
      const a = held;
      held = null;
      S.tweens.add({ targets: a.c, scale: 1, duration: 160, ease: "Quad.easeOut" });
      S.tweens.add({ targets: a.shadow, alpha: 1, duration: 160 });
      a.body.angle = 0;
      if (nearArk(a.c.x, a.c.y)) return offer(a);
      /* Put down in the meadow: it stays where it was put. */
      const m = L.meadow;
      const x = Math.max(m.x0, Math.min(m.x1, a.c.x)), y = Math.max(m.y0 * 0.98, Math.min(m.y1, a.c.y));
      a.state = "busy";
      S.tweens.add({
        targets: a.c, x: x, y: y, duration: 180, ease: "Quad.easeOut",
        onComplete: function () { a.state = "idle"; a.home = { x: x, y: y }; sortDepth(); },
      });
      S.tweens.add({ targets: a.body, scaleY: 0.86, scaleX: 1.1, duration: 90, yoyo: true, delay: 140 });
      Engine.Sfx.drop();
    }

    function nearArk(x, y) {
      /* anywhere along the gangplank, or at the door, counts */
      const ax = L.footX, ay = L.footY, bx = L.doorX, by = L.doorY;
      const t = Math.max(0, Math.min(1, ((x - ax) * (bx - ax) + (y - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2)));
      const d = Math.hypot(x - (ax + t * (bx - ax)), y - (ay + t * (by - ay)));
      const atDoor = x > L.doorX - L.doorW * 1.4 && x < L.doorX + L.doorW * 1.6 && y > L.doorY - L.doorH * 1.4 && y < L.doorY + L.size * 0.8;
      return d < L.size * 0.85 || atDoor;
    }

    /* The animal is at the gangplank: up it goes — or, if it isn't the
       one Noah asked for, back it hops. */
    function offer(a) {
      if (ctx.big) {
        const want = order[pairIdx];
        if (a.kind !== want) {
          a.state = "busy";
          Engine.Sfx.boing();
          Engine.buzz(25);
          Engine.say("That's the " + ZOO[a.kind].name + "! Noah wants the " + ZOO[want].plural + ".");
          popBubble();
          hop(a, 16, 200);
          S.time.delayedCall(300, function () {
            walk(a, [a.home], 320, function () { a.state = "idle"; sortDepth(); });
          });
          return;
        }
      }
      board(a);
    }

    function board(a) {
      a.state = "boarding";
      a.c.setDepth(500);
      const up = [];
      if (Math.hypot(a.c.x - L.footX, a.c.y - L.footY) > L.size * 0.4 && a.c.x < L.footX + L.size * 0.2) up.push({ x: L.footX, y: L.footY });
      up.push({ x: (L.footX + L.doorX) / 2, y: (L.footY + L.doorY) / 2 }, { x: L.doorX, y: L.doorY });
      walk(a, up, 260, function () {
        face(a, 1);
        S.tweens.add({
          targets: a.c, x: L.doorX + L.doorW * 0.3, scale: 0.55, alpha: 0, duration: 260, ease: "Quad.easeIn",
          onComplete: function () { a.c.setVisible(false); aboard(a); },
        });
      });
      if (ctx.big && a.kind === order[pairIdx]) { inThisPair++; paintBubble(); }
    }

    function aboard(a) {
      boarded++;
      a.state = "aboard";
      K.burst(L.doorX, L.doorY - L.doorH * 0.5, { count: 14, speed: 200, depth: 700 });
      Engine.Sfx.sparkle();
      const z = ZOO[a.kind];
      if (ctx.big) {
        if (inThisPair >= 2) {
          Engine.say("Two " + z.plural + "! Well done!");
          Engine.Sfx.chime();
          K.ring(L.doorX, L.doorY - L.doorH * 0.5, L.size, 0xffe08a);
          pairIdx++;
          inThisPair = 0;
          if (pairIdx < order.length) {
            S.time.delayedCall(1700, function () {
              if (phase !== "play") return;
              paintBubble();
              popBubble();
              Engine.say("Two " + ZOO[order[pairIdx]].plural + ", please!");
            });
          } else if (bubble) {
            S.tweens.add({ targets: bubble, scale: 0, alpha: 0, duration: 260 });
          }
        } else {
          Engine.say("One " + z.name + ". Where is the other " + z.name + "?");
        }
      } else {
        Engine.say("In goes the " + z.name + "!");
      }
      if (boarded >= total) S.time.delayedCall(1400, storm);
    }

    /* ---------- hints ---------- */

    function armHint() {
      clearTimeout(hintTimer);
      hintTimer = setTimeout(hint, ctx.big ? 12000 : 6000);
    }
    function hint() {
      if (!ctx.alive || phase !== "play" || held) return armHint();
      let a = null;
      const idle = animals.filter(function (x) { return x.state === "idle"; });
      if (ctx.big) a = idle.filter(function (x) { return x.kind === order[pairIdx]; })[0];
      a = a || idle[0];
      if (a) K.showDrag({ x: a.c.x, y: a.c.y - L.size * 0.4 }, { x: L.footX + (L.doorX - L.footX) * 0.4, y: L.footY + (L.doorY - L.footY) * 0.4 }, { dur: 1100 });
      armHint();
    }

    /* ---------- and the LORD shut him in ---------- */

    function storm() {
      if (!ctx.alive) return;
      phase = "storm";
      clearTimeout(hintTimer);
      K.hideHand();
      Engine.say("And the LORD shut him in.");
      /* the gangplank swings up and becomes the door */
      S.tweens.add({ targets: plank, rotation: Math.PI / 2, scaleX: (L.doorH * 1.05) / 400, duration: 1300, delay: 300, ease: "Cubic.easeInOut",
        onComplete: function () {
          plank.x = (L.doorX - L.arkX) + L.doorW * 0.02;
          Engine.Sfx.thud();
          Engine.buzz(60);
          S.cameras.main.shake(260, 0.004);
        } });

      /* the sky darkens and the rain comes */
      S.time.delayedCall(2000, function () {
        if (!ctx.alive) return;
        tweenSky(0x5d7286, 0x9fb1c2, 1600);
        S.tweens.add({ targets: [sun, sunRays], alpha: 0, duration: 1400 });
        clouds.forEach(function (c) { c.setTint(0xa9b6c4); });
        for (let i = 0; i < 4; i++) {
          const c = S.add.image(-200 * u - Math.random() * 300 * u, L.H * (0.08 + Math.random() * 0.25), "cast-cloud").setDepth(-79).setTint(0x8796a6);
          stormClouds.push(c);
          c.setScale((0.5 * Math.max(L.W, L.H) * 0.7) / 256);
          S.tweens.add({ targets: c, x: L.W * (0.1 + i * 0.27), duration: 1800 + i * 200, ease: "Cubic.easeOut" });
        }
        rain = S.add.particles(0, 0, "fx-drop", {
          x: { min: -L.W * 0.1, max: L.W * 1.1 }, y: -40 * u,
          speedY: { min: 900 * u, max: 1300 * u }, speedX: -120 * u,
          scale: { min: 0.35 * u, max: 0.6 * u }, alpha: { min: 0.35, max: 0.7 },
          lifespan: 1800, quantity: 4, frequency: 16, tint: 0xdcecff, rotate: 7,
        }).setDepth(700);
        Engine.Sfx.rain(true);
        waterTarget = L.H - (L.groundY - L.arkH * 0.18);
        /* the blocks the ark sat on are gone under the water */
        S.tweens.add({ targets: blocks, alpha: 0, duration: 2500, delay: 1200 });
      });

      /* then it stops, and the dove, and the rainbow */
      S.time.delayedCall(8200, function () {
        if (!ctx.alive) return;
        if (rain) rain.stop();
        Engine.Sfx.rain(false);
        tweenSky(0x7cc4f2, 0xe9f7ff, 2200);
        S.tweens.add({ targets: [sun, sunRays], alpha: 1, duration: 2000 });
        clouds.forEach(function (c) { c.clearTint(); });
        stormClouds.forEach(function (c) { S.tweens.add({ targets: c, x: L.W + 400 * u, alpha: 0, duration: 2600, ease: "Cubic.easeIn" }); });
        drawRainbow();
        S.time.delayedCall(1200, flyDove);
      });

      S.time.delayedCall(12200, function () {
        if (!ctx.alive) return;
        phase = "done";
        Engine.celebrate(ctx, {
          pic: ARK_STORY,
          nextLabel: "More animals!",
          region: function () {
            const R = L.rbR;
            const x0 = Math.min(L.rbX - R, L.arkX), x1 = Math.max(L.rbX + R, L.arkX + L.arkW);
            const y0 = L.rbY - R - 10 * u, y1 = arkC.y + L.arkH;
            return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
          },
        });
      });
    }

    function tweenSky(top, bottom, dur) {
      const from = { a: sky.a || 0x8fd0f6, b: sky.b || 0xe6f6ff };
      const o = { t: 0 };
      S.tweens.add({
        targets: o, t: 1, duration: dur,
        onUpdate: function () {
          const ca = Phaser.Display.Color.Interpolate.ColorWithColor(Phaser.Display.Color.ValueToColor(from.a), Phaser.Display.Color.ValueToColor(top), 100, o.t * 100);
          const cb = Phaser.Display.Color.Interpolate.ColorWithColor(Phaser.Display.Color.ValueToColor(from.b), Phaser.Display.Color.ValueToColor(bottom), 100, o.t * 100);
          sky.set(Phaser.Display.Color.GetColor(ca.r, ca.g, ca.b), Phaser.Display.Color.GetColor(cb.r, cb.g, cb.b));
        },
        onComplete: function () { sky.a = top; sky.b = bottom; },
      });
    }

    function drawRainbow() {
      L.rbR = Math.min(L.W * 0.46, L.H * 0.3);
      L.rbX = L.W * (L.portrait ? 0.5 : 0.55);
      L.rbY = L.groundY;
      rainbow = S.add.graphics().setDepth(-60).setAlpha(0);
      const bands = [0xef6f6c, 0xf6a24b, 0xffd166, 0x8fd18a, 0x6fb6e8, 0x9b7fd1];
      const o = { p: 0 };
      S.tweens.add({
        targets: o, p: 1, duration: 1800, ease: "Cubic.easeOut",
        onStart: function () { rainbow.setAlpha(0.92); Engine.Sfx.sparkle(); },
        onUpdate: function () {
          rainbow.clear();
          const w = L.rbR * 0.07;
          bands.forEach(function (c, i) {
            rainbow.lineStyle(w, c, 1);
            rainbow.beginPath();
            rainbow.arc(L.rbX, L.rbY, L.rbR - i * w, Math.PI, Math.PI + Math.PI * o.p, false);
            rainbow.strokePath();
          });
        },
      });
    }

    function flyDove() {
      const d = S.add.image(-60 * u, L.H * 0.22, "subj-dove").setDepth(650).setScale((L.size * 1.1) / 256);
      const tx = L.arkX + L.arkW * 0.5, ty = arkC.y - L.size * 0.4;
      S.tweens.add({ targets: d, scaleY: d.scaleY * 0.75, duration: 160, yoyo: true, repeat: 9, ease: "Sine.easeInOut" });
      S.tweens.add({ targets: d, x: tx, duration: 3000, ease: "Sine.easeOut" });
      S.tweens.add({ targets: d, y: ty, duration: 3000, ease: "Sine.easeInOut",
        onComplete: function () { Engine.Sfx.chirp(); K.burst(tx, ty, { tex: "fx-heart", count: 8, speed: 120, tints: [0xffffff, 0xffd6dd], blend: "NORMAL", scale: 0.25 }); } });
      Engine.Sfx.chirp();
    }

    function drawWater() {
      if (waterLevel <= 0.5) { water.clear(); return; }
      const top = L.H - waterLevel;
      const t = S.time.now / 1000;
      water.clear();
      /* drawn a screen-width past each side, for when the camera pulls back */
      const x0 = -L.W, x1 = L.W * 2;
      water.fillStyle(0x3f86bd, 0.92);
      water.beginPath();
      water.moveTo(x0, L.H * 2);
      for (let x = x0; x <= x1; x += 20 * u) water.lineTo(x, top + Math.sin(x / (60 * u) + t * 2) * 5 * u);
      water.lineTo(x1, L.H * 2);
      water.closePath();
      water.fillPath();
      water.fillStyle(0x6fb6e8, 0.9);
      water.beginPath();
      water.moveTo(x0, top + 14 * u);
      for (let x = x0; x <= x1; x += 20 * u) water.lineTo(x, top + Math.sin(x / (60 * u) + t * 2) * 5 * u);
      for (let x = x1; x >= x0; x -= 20 * u) water.lineTo(x, top + 12 * u + Math.sin(x / (50 * u) + t * 2.4) * 3 * u);
      water.closePath();
      water.fillPath();
    }

    /* ---------- the scene ---------- */

    return {
      create: function () {
        S = this;
        K = Engine.kit(S, ctx);
        u = ctx.u;
        layout();
        sky = K.sky(0x8fd0f6, 0xe6f6ff);
        sky.a = 0x8fd0f6; sky.b = 0xe6f6ff;
        sunRays = S.add.image(0, 0, "fx-rays").setTint(0xfff7cf).setAlpha(0.4).setBlendMode("ADD").setDepth(-92);
        sun = S.add.image(0, 0, "fx-glow").setTint(0xffe9a0).setDepth(-91);
        S.tweens.add({ targets: sunRays, angle: 360, duration: 60000, repeat: -1 });
        makeClouds();
        hills = S.add.graphics().setDepth(-70);
        ground = S.add.graphics().setDepth(-65);
        blocks = S.add.graphics().setDepth(40);
        arkC = S.add.container(0, 0).setDepth(50);
        arkImg = S.add.image(0, 0, "cast-ark").setOrigin(0, 0);
        plank = S.add.image(0, 0, "cast-plank").setOrigin(1, 0.5);
        arkC.add([arkImg, plank]);
        water = S.add.graphics().setDepth(690);
        drawLand();
        placeArk();
        K.motes(0xffffff, 0.3);

        order = PlayKit.shuffle(ctx.kinds);
        spawnAnimals();
        if (ctx.big) makeBubble();

        ctx.caption(ctx.big ? total / 2 + " pairs of animals" : total + " animals");
        S.time.delayedCall(500, function () {
          Engine.say(ctx.big ? "Noah needs the animals, two by two!" : "Help the animals into Noah's ark!", function () {
            if (ctx.big && phase === "play") Engine.say("Two " + ZOO[order[0]].plural + ", please!");
          });
        });
        S.time.delayedCall(ctx.big ? 4200 : 2200, function () { if (phase === "play" && !held && boarded === 0) hint(); });
        armHint();
        idleTimer = S.time.addEvent({ delay: 1400, loop: true, callback: fidget });

        S.input.on("pointerdown", onDown);
        S.input.on("pointermove", onMove);
        S.input.on("pointerup", onUp);
        S.input.on("pointerupoutside", onUp);
        S.events.once("shutdown", function () { clearTimeout(hintTimer); Engine.Sfx.rain(false); });

        ctx.onResize = function () {
          const old = L;
          layout();
          sky.draw();
          drawLand();
          placeArk();
          animals.forEach(function (a) {
            if (a.state === "aboard") return;
            a.c.x = (a.c.x / old.W) * L.W;
            a.c.y = L.meadow.y0 + ((a.c.y - old.meadow.y0) / Math.max(1, old.meadow.y1 - old.meadow.y0)) * (L.meadow.y1 - L.meadow.y0);
            a.home = { x: a.c.x, y: a.c.y };
            a.sprite.setScale(L.size / 320);
          });
        };
      },

      update: function (time, dt) {
        const k = Math.min(1, dt / 16.7);
        clouds.forEach(function (c) {
          c.x += c.speed * dt / 1000;
          if (c.x > L.W + 160 * u) c.x = -160 * u;
        });
        if (held) {
          const a = held;
          const nx = a.c.x + (a.tx - a.c.x) * 0.38 * k;
          a.vx = nx - a.c.x;
          a.c.x = nx;
          a.c.y += (a.ty - a.c.y) * 0.38 * k;
          a.body.angle = Math.max(-16, Math.min(16, a.vx * 1.4 / u)) + Math.sin(time / 120) * 4;
          if (Math.abs(a.vx) > 0.5 * u) face(a, a.vx > 0 ? 1 : -1);
          a.shadow.y = 18 * u;
          a.shadow.setScale((L.size * 0.6) / 128, (L.size * 0.2) / 48);
        } else {
          animals.forEach(function (a) {
            if (a.state === "idle" && a.shadow.y !== 2 * u) {
              a.shadow.y = 2 * u;
              a.shadow.setScale((L.size * 0.85) / 128, (L.size * 0.28) / 48);
            }
          });
        }
        if (phase !== "play") {
          if (waterLevel < waterTarget) waterLevel = Math.min(waterTarget, waterLevel + (waterTarget / 4200) * dt);
          drawWater();
          /* the ark lifts with the water once it reaches the hull */
          const hullY = L.groundY - L.lift;
          const top = L.H - waterLevel;
          floatT += dt / 1000;
          const rise = Math.max(0, hullY - top + L.arkH * 0.1);
          if (rise > 0) {
            arkC.y = L.arkY - rise + Math.sin(floatT * 1.6) * 4 * u;
            arkC.rotation = Math.sin(floatT * 1.1) * 0.025;
          }
        }
      },
    };
  }

  /* The menu's picture: the ark, with a giraffe on its way. */
  function preview() {
    const s =
      '<rect width="200" height="150" fill="#9fd3f5"/>' +
      '<circle cx="36" cy="30" r="16" fill="#ffe08a"/>' +
      '<ellipse cx="60" cy="112" rx="110" ry="22" fill="#a9d98a"/><rect y="112" width="200" height="40" fill="#8cc964"/>' +
      '<svg x="70" y="44" width="124" height="81" viewBox="0 0 200 130">' + CAST.ark + "</svg>" +
      '<svg x="8" y="66" width="56" height="56" viewBox="0 0 100 100">' + ZOO.giraffe.svg + "</svg>" +
      '<svg x="40" y="94" width="34" height="34" viewBox="0 0 100 100">' + ZOO.bunny.svg + "</svg>";
    return PlayKit.svg("0 0 200 150", s, "pk-tile-svg");
  }

  PlayKit.register("ark", {
    id: "ark",
    title: "Two by Two",
    background: "#9fd3f5",
    blurbBig: "Noah needs the animals, two by two",
    blurbLittle: "Help the animals into Noah's ark",
    preview: preview,
    prepare: prepare,
    scene: scene,
  });
})();


/* ==== js/58-dots.js ========================================================= */
/* ============================================================
   Join the dots — drawing with starlight.

   A night sky, and the numbers glowing in it. Sweep a finger through them
   (or tap them one by one) and a golden line follows, each star chiming
   the next note of a little tune, sparks trailing behind the finger. When
   the shape closes the night lifts and the picture blooms where the line
   was — and then comes alive: the whale spouts, the lion snores, hearts
   float up from the lost sheep.

   Sophie (2) gets five big stars, and the next one always glows. Addison
   (nearly 5) gets every number on the picture's outline and finds the
   next one herself; it only glows if she has been looking a while.
   ============================================================ */

(function () {
  /* Pick `m` of the outline's points, spread evenly round it. */
  function sample(points, m) {
    if (points.length <= m) return points.slice();
    const out = [];
    for (let i = 0; i < m; i++) out.push(points[Math.round((i * points.length) / m) % points.length]);
    return out;
  }

  function roundedPicture(pic) {
    return '<defs><clipPath id="rr"><rect width="100" height="100" rx="5"/></clipPath></defs><g clip-path="url(#rr)">' + picMarkup(pic) + "</g>";
  }

  function prepare(ctx) {
    const order = PlayKit.rotation(PICTURES, 0);
    ctx.pic = order[ctx.level % order.length];
    const p = ctx.pic;
    PlayKit.prefetch([p.said, p.truth, p.q ? p.q.teach : "", "Touch the shining star!",
      "Join the dots, from one to " + PlayKit.numberWord(p.outline.length) + ". What will it be?"]);
    return Promise.all([
      Engine.svgTexture("picr-" + p.id, roundedPicture(p), "0 0 100 100", 1024, 1024),
      Engine.castTexture("hand", 320),
    ]);
  }

  function scene(ctx) {
    const pic = ctx.pic;
    const big = ctx.big;
    let S, K, u, B;
    let board, lines, rope, picImg, frameG, trail, hero;
    let dots = [], glows = [], cores = [], labels = [];
    let next = 0, done = false, down = false, pointerId = -1;
    let hintTimer = null, lastNudge = 0, lastP = null;

    /* sizes in CSS pixels, turned into board units */
    function bu(css) { return (css * u * 1000) / B.s; }

    function layout() {
      const W = K.W(), H = K.H(), top = K.top();
      const s = Math.min(W * 0.9, (H - top) * 0.8, 900 * u);
      B = { x: (W - s) / 2, y: top + ((H - top) - s) * 0.4, s: s };
    }

    function placeBoard() {
      board.setPosition(B.x, B.y).setScale(B.s / 1000);
      frameG.clear();
      frameG.fillStyle(0xffffff, 0.05);
      frameG.fillRoundedRect(B.x - 10 * u, B.y - 10 * u, B.s + 20 * u, B.s + 20 * u, 26 * u);
      frameG.lineStyle(1.5 * u, 0xffffff, 0.14);
      frameG.strokeRoundedRect(B.x - 10 * u, B.y - 10 * u, B.s + 20 * u, B.s + 20 * u, 26 * u);
    }

    function toBoard(p) {
      return { x: (p.x - board.x) / board.scaleX, y: (p.y - board.y) / board.scaleY };
    }
    function toScreen(i) {
      return { x: board.x + dots[i][0] * 10 * board.scaleX, y: board.y + dots[i][1] * 10 * board.scaleY };
    }

    function build() {
      dots = big ? pic.outline.map(function (p) { return [p[0], p[1]]; }) : sample(pic.outline, 5);
      let cx = 0, cy = 0;
      dots.forEach(function (d) { cx += d[0]; cy += d[1]; });
      cx /= dots.length; cy /= dots.length;

      const coreR = bu(big ? 7 : 11), glowD = bu(big ? 46 : 70), font = bu(big ? 17 : 24);
      dots.forEach(function (d, i) {
        const x = d[0] * 10, y = d[1] * 10;
        /* Each star is its own little group, and it is the group that pops
           in. Under Phaser 4 a Text or Shape whose own scale or alpha starts
           at zero stays undrawn when tweened back up; a container doesn't. */
        const star = S.add.container(x, y);
        const g = S.add.image(0, 0, "fx-glow").setTint(0xffd36b).setAlpha(0.45).setBlendMode("ADD").setScale(glowD / 128);
        const c = S.add.circle(0, 0, coreR, 0xffffff).setStrokeStyle(bu(2.4), 0xffc94a);
        const vx = d[0] - cx, vy = d[1] - cy, len = Math.hypot(vx, vy) || 1;
        const off = bu(big ? 18 : 26);
        const t = S.add.text((vx / len) * off, (vy / len) * off, String(i + 1), {
          fontFamily: "Public Sans, system-ui, sans-serif", fontSize: font + "px", fontStyle: "800",
          color: "#ffffff", stroke: "#1b1f4a", strokeThickness: bu(5),
        }).setOrigin(0.5);
        star.add([g, c, t]);
        board.add(star);
        glows.push(g); cores.push(c); labels.push(t);
        star.setScale(0);
        S.tweens.add({ targets: star, scale: 1, duration: 380, delay: 200 + i * 70, ease: "Back.easeOut" });
      });
      target();
    }

    function targetIndex() { return next < dots.length ? next : 0; }

    /* The star wanted now pulses. Sophie's always does; Addison's only at
       the start, for the jump back to one, or when she is stuck. */
    let pulse = null;
    function target() {
      if (pulse) { pulse.stop(); pulse = null; }
      glows.forEach(function (g, i) {
        g.setScale((bu(big ? 46 : 70)) / 128);
        g.setTint(i < next ? 0xffe9a8 : 0xffd36b);
      });
      if (done) return;
      if (!big || next === 0 || next === dots.length) shine();
      else armHint();
    }
    function shine() {
      const g = glows[targetIndex()];
      if (!g || done) return;
      if (pulse) pulse.stop();
      g.setTint(0xffffff);
      pulse = S.tweens.add({ targets: g, scale: g.scale * 1.7, alpha: 0.9, duration: 650, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    }
    function armHint() {
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function () {
        if (!ctx.alive || done) return;
        shine();
        const to = toScreen(targetIndex());
        const from = next > 0 ? toScreen(next - 1) : { x: to.x - 60 * u, y: to.y + 60 * u };
        if (next === 0) K.showTap(to);
        else K.showDrag(from, to, { dur: 800 });
      }, big ? 7000 : 4000);
    }

    function drawLines() {
      lines.clear();
      const n = Math.min(next, dots.length);
      const seg = [];
      for (let i = 1; i < n; i++) seg.push([dots[i - 1], dots[i]]);
      if (done) seg.push([dots[dots.length - 1], dots[0]]);
      [[bu(14), 0xffd36b, 0.22], [bu(5), 0xfff1c2, 1]].forEach(function (st) {
        lines.lineStyle(st[0], st[1], st[2]);
        seg.forEach(function (s) { lines.lineBetween(s[0][0] * 10, s[0][1] * 10, s[1][0] * 10, s[1][1] * 10); });
        lines.fillStyle(st[1], st[2]);
        for (let i = 0; i < n; i++) lines.fillCircle(dots[i][0] * 10, dots[i][1] * 10, st[0] / 2);
      });
    }

    function drawRope(p) {
      rope.clear();
      if (!down || done || next === 0 || !p) return;
      const a = dots[next - 1];
      const b = toBoard(p);
      rope.lineStyle(bu(12), 0xffd36b, 0.16);
      rope.lineBetween(a[0] * 10, a[1] * 10, b.x, b.y);
      rope.lineStyle(bu(3.5), 0xfff1c2, 0.75);
      rope.lineBetween(a[0] * 10, a[1] * 10, b.x, b.y);
    }

    function light(i) {
      const c = cores[i];
      c.setFillStyle(0xffd36b);
      S.tweens.add({ targets: c, scale: 1.7, duration: 120, yoyo: true, ease: "Quad.easeOut" });
      S.tweens.add({ targets: labels[i], scale: 1.25, duration: 120, yoyo: true });
      labels[i].setColor("#ffe08a");
      const p = toScreen(i);
      K.burst(p.x, p.y, { count: 10, speed: 170, scale: 0.28 });
    }

    function connect() {
      K.hideHand();
      if (next === 0) {
        light(0);
        next = 1;
        Engine.Sfx.note(0);
        Engine.say("one");
      } else if (next < dots.length) {
        light(next);
        Engine.Sfx.note(next);
        next++;
        Engine.say(next === dots.length && big ? PlayKit.numberWord(next) + "! Now back to one." : PlayKit.numberWord(next));
      } else {
        Engine.Sfx.note(dots.length);
        finish();
        return;
      }
      Engine.buzz(8);
      drawLines();
      target();
    }

    function nudge(i) {
      const t = labels[i];
      S.tweens.add({ targets: [cores[i], t], x: "+=" + bu(5), duration: 50, yoyo: true, repeat: 2 });
      Engine.Sfx.miss();
      const now = Date.now();
      if (now - lastNudge > 1800) {
        lastNudge = now;
        Engine.say(big ? "Find number " + PlayKit.numberWord(targetIndex() + 1) + "." : "Touch the shining star!");
      }
      shine();
    }

    function hit(p, isDown) {
      if (done) return;
      const b = toBoard(p);
      const reach = bu(big ? 26 : 40);
      const t = dots[targetIndex()];
      if (Math.hypot(t[0] * 10 - b.x, t[1] * 10 - b.y) <= reach) return connect();
      if (!isDown) return;
      for (let i = 0; i < dots.length; i++) {
        if (i === targetIndex() || (next > 0 && i === next - 1)) continue;
        if (Math.hypot(dots[i][0] * 10 - b.x, dots[i][1] * 10 - b.y) <= reach * 0.75) return nudge(i);
      }
    }

    /* The shape closes: the night lifts and the picture blooms. */
    function finish() {
      done = true;
      down = false;
      clearTimeout(hintTimer);
      K.hideHand();
      if (pulse) pulse.stop();
      trail.stop();
      drawLines();
      rope.clear();
      S.tweens.add({ targets: lines, alpha: 1.6, duration: 200, yoyo: true });
      K.burst(B.x + B.s / 2, B.y + B.s / 2, { count: 40, speed: 520, scale: 0.45, life: 1200 });
      Engine.Sfx.whoosh();
      picImg.setVisible(true).setAlpha(0).setScale(0.9 * (1000 / 1024));
      S.tweens.add({ targets: picImg, alpha: 1, scale: 1000 / 1024, duration: 900, delay: 250, ease: "Back.easeOut" });
      S.tweens.add({ targets: glows.concat(cores, labels), alpha: 0, duration: 500, delay: 300 });
      S.tweens.add({ targets: lines, alpha: 0, duration: 700, delay: 900 });
      S.time.delayedCall(1100, function () {
        if (!ctx.alive) return;
        K.alive(pic.id, hero, 1000);
        K.breathe(picImg, 0.015);
      });
      S.time.delayedCall(1400, function () {
        if (!ctx.alive) return;
        Engine.celebrate(ctx, {
          pic: pic,
          nextLabel: "Next picture",
          region: function () { return { x: B.x - 10 * u, y: B.y - 10 * u, w: B.s + 20 * u, h: B.s + 20 * u }; },
        });
      });
    }

    return {
      create: function () {
        S = this;
        K = Engine.kit(S, ctx);
        u = ctx.u;
        layout();
        K.sky(0x141a42, 0x3b2c70);
        /* a field of tiny twinkling stars behind everything */
        S.add.particles(0, 0, "fx-spark", {
          x: { min: 0, max: K.W() }, y: { min: 0, max: K.H() },
          scale: { onEmit: function () { return 0; }, onUpdate: function (p, k, t) { return Math.sin(t * Math.PI) * 0.09 * u; } },
          lifespan: { min: 1800, max: 3600 }, frequency: 90, tint: [0xffffff, 0xd8d4ff, 0xfff1c2], blendMode: "ADD",
        }).setDepth(-60);
        K.motes(0xb9b2ff, 0.25);
        frameG = S.add.graphics().setDepth(-10);
        board = S.add.container(0, 0);
        hero = S.add.container(0, 0);
        board.add(hero);
        picImg = S.add.image(500, 500, "picr-" + pic.id).setVisible(false).setScale(1000 / 1024);
        hero.add(picImg);
        lines = S.add.graphics();
        rope = S.add.graphics();
        board.add([lines, rope]);
        placeBoard();
        build();

        trail = S.add.particles(0, 0, "fx-spark", {
          speed: { min: 10 * u, max: 50 * u }, scale: { start: 0.22 * u, end: 0 }, alpha: { start: 1, end: 0 },
          lifespan: 520, frequency: 22, tint: [0xffffff, 0xffe08a, 0xffc94a], blendMode: "ADD", emitting: false,
        }).setDepth(500);

        ctx.caption(big ? "Picture " + (ctx.level + 1) + " · " + dots.length + " dots" : "Touch the shining star");
        S.time.delayedCall(400, function () {
          Engine.say(big ? "Join the dots, from one to " + PlayKit.numberWord(dots.length) + ". What will it be?" : "Touch the shining star!");
        });
        if (!big) S.time.delayedCall(1800, function () { if (next === 0 && !done) K.showTap(toScreen(0)); });

        S.input.on("pointerdown", function (p) {
          if (done) return;
          down = true;
          pointerId = p.id;
          lastP = p;
          trail.setPosition(p.x, p.y);
          trail.start();
          hit(p, true);
          drawRope(p);
        });
        S.input.on("pointermove", function (p) {
          if (!down || p.id !== pointerId) return;
          lastP = p;
          trail.setPosition(p.x, p.y);
          hit(p, false);
          drawRope(p);
        });
        const up = function (p) {
          if (p.id !== pointerId) return;
          down = false;
          trail.stop();
          drawRope(null);
        };
        S.input.on("pointerup", up);
        S.input.on("pointerupoutside", up);
        S.events.once("shutdown", function () { clearTimeout(hintTimer); });

        ctx.onResize = function () {
          layout();
          placeBoard();
        };
      },
    };
  }

  /* The menu's picture: a constellation half drawn. */
  function preview() {
    const star = PICTURE_BY_ID.star.outline;
    const pts = star.map(function (p) { return [p[0] * 1.6 + 20, p[1] * 1.15 + 14]; });
    let s = '<defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d4c"/><stop offset="1" stop-color="#46307a"/></linearGradient>' +
      '<radialGradient id="dgl"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></radialGradient></defs>' +
      '<rect width="200" height="150" fill="url(#dg)"/>';
    const r = PlayKit.rng(7);
    for (let i = 0; i < 26; i++) s += '<circle cx="' + (r() * 200).toFixed(1) + '" cy="' + (r() * 150).toFixed(1) + '" r="' + (0.4 + r() * 0.9).toFixed(2) + '" fill="#fff" opacity=".7"/>';
    s += '<polyline points="' + pts.slice(0, 7).map(function (p) { return p.join(","); }).join(" ") + '" fill="none" stroke="#ffd36b" stroke-width="5" opacity=".35" stroke-linecap="round" stroke-linejoin="round"/>';
    s += '<polyline points="' + pts.slice(0, 7).map(function (p) { return p.join(","); }).join(" ") + '" fill="none" stroke="#fff1c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach(function (p, i) {
      s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (i === 7 ? 11 : 7) + '" fill="url(#dgl)"/>';
      s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="' + (i < 7 ? "#ffd36b" : "#fff") + '"/>';
    });
    return PlayKit.svg("0 0 200 150", s, "pk-tile-svg");
  }

  PlayKit.register("dots", {
    id: "dots",
    title: "Join the Dots",
    background: "#1a1c46",
    blurbBig: "Draw with starlight and see what God made",
    blurbLittle: "Touch the shining stars",
    preview: preview,
    prepare: prepare,
    scene: scene,
  });
})();


/* ==== js/59-jigsaw.js ========================================================= */
/* ============================================================
   Jigsaws.

   A Bible picture cut into real interlocking pieces — knobs and sockets
   — with a cardboard bevel and a drop shadow, scattered on a wooden table
   beside the tray. Pick one up and it lifts towards you, grows to full
   size, straightens, and swings a little with the finger's momentum; put
   it near where it belongs and it snaps home with a click and a ring of
   light. Finished, the seams melt away, a shine sweeps across, and the
   picture comes alive.

   The tray shows a faint copy of the picture, so nobody is guessing:
   clearer for Sophie, with every piece's outline drawn in its place;
   fainter for Addison, whose outlines go after her first puzzle. Sophie
   starts with four pieces, Addison with nine, and each finished puzzle
   makes the next one a little bigger.
   ============================================================ */

(function () {
  const GRIDS_BIG = [[3, 3], [3, 4], [4, 4], [4, 5]];
  const GRIDS_LITTLE = [[2, 2], [2, 3], [3, 3]];
  const RES = 1024;               /* texture pixels across the whole picture */

  function prepare(ctx) {
    const order = PlayKit.rotation(PICTURES, 5);
    /* don't open on the picture the dots or the maze is showing today */
    const taken = [PlayKit.rotation(PICTURES, 0)[0].id, PlayKit.rotation(MAZE_THEMES, 1)[0].pic];
    for (let i = 0; i < order.length && taken.indexOf(order[0].id) >= 0; i++) order.push(order.shift());
    ctx.pic = order[ctx.level % order.length];
    const p = ctx.pic;
    PlayKit.prefetch([p.said, p.truth, p.q ? p.q.teach : "", "Put the picture back together!", "Drag the pieces into the picture!"]);
    return Promise.all([Engine.pictureTexture(p, RES), Engine.castTexture("hand", 320)]);
  }

  function scene(ctx) {
    const pic = ctx.pic;
    const big = ctx.big;
    let S, K, u, G, cols, rows;
    let tableG, trayG, ghost, slots, full, hero;
    let pieces = [], done = false, z = 100, hintTimer = null;

    function grid() {
      const list = big ? GRIDS_BIG : GRIDS_LITTLE;
      return list[Math.min(ctx.level, list.length - 1)];
    }

    /* Where the tray and the heap go for the space there is; and how small
       pieces wait in the heap so they all fit. */
    function layout() {
      const W = K.W(), H = K.H(), top = K.top();
      const wide = W > H * 1.1;
      let s, bx, by, heap;
      if (wide) {
        s = Math.min(H - top - 24 * u, W * 0.52);
        bx = Math.max(16 * u, W * 0.29 - s / 2);
        by = top + (H - top - s) / 2;
        heap = { x: bx + s + 24 * u, y: top + 8 * u, w: W - (bx + s + 24 * u) - 16 * u, h: H - top - 24 * u };
      } else {
        s = Math.min(W - 28 * u, (H - top) * 0.56);
        bx = (W - s) / 2;
        by = top + 6 * u;
        heap = { x: 12 * u, y: by + s + 18 * u, w: W - 24 * u, h: H - (by + s + 18 * u) - 12 * u };
      }
      const n = cols * rows, bw = s / cols, bh = s / rows;
      let best = { k: 0.2, c: 1 };
      /* a piece is ~1.5x its body with the knobs, more when tilted */
      for (let c = 1; c <= n; c++) {
        const r = Math.ceil(n / c);
        const k = Math.min(heap.w / (c * bw * 1.75), heap.h / (r * bh * 1.75));
        if (k > best.k) best = { k: k, c: c };
      }
      G = { s: s, bx: bx, by: by, heap: heap, k: Math.min(1, best.k), c: best.c, scale: s / RES };
    }

    /* ---------- the table and the tray ---------- */

    function drawTable() {
      const W = K.W(), H = K.H();
      tableG.clear();
      const r = PlayKit.rng(77);
      for (let i = 0; i < 46; i++) {
        const y = r() * H;
        tableG.lineStyle((0.6 + r() * 1.6) * u, 0x7a4f2c, 0.06 + r() * 0.06);
        tableG.beginPath();
        tableG.moveTo(-W, y);
        for (let x = -W; x <= W * 2; x += 40 * u) tableG.lineTo(x, y + Math.sin(x / (120 * u) + i) * 6 * u);
        tableG.strokePath();
      }
      trayG.clear();
      const pad = 10 * u;
      trayG.fillStyle(0x000000, 0.22);
      trayG.fillRoundedRect(G.bx - pad + 2 * u, G.by - pad + 5 * u, G.s + pad * 2, G.s + pad * 2, 18 * u);
      trayG.fillStyle(0x5c3d22, 1);
      trayG.fillRoundedRect(G.bx - pad, G.by - pad, G.s + pad * 2, G.s + pad * 2, 18 * u);
      trayG.fillStyle(0xf1e6d3, 1);
      trayG.fillRoundedRect(G.bx, G.by, G.s, G.s, 6 * u);
      ghost.setPosition(G.bx, G.by).setScale(G.scale);
      slots.setPosition(G.bx, G.by).setScale(G.scale);
      full.setPosition(G.bx, G.by).setScale(G.scale);
      hero.setPosition(G.bx, G.by);
    }

    /* ---------- cutting the pieces ---------- */

    function cut() {
      const art = Engine.canvas("pic-" + pic.id);
      const edges = PlayKit.jigsaw.edges(cols, rows, PlayKit.rng((Math.random() * 4294967296) >>> 0));
      const pw = 100 / cols, ph = 100 / rows, T = Math.min(pw, ph) * 0.24;
      const k = RES / 100;
      const tag = "pc" + ctx.level + "-" + Date.now().toString(36);

      /* the outlines drawn in the tray (Sophie's, and Addison's first) */
      const slotC = document.createElement("canvas");
      slotC.width = slotC.height = RES;
      const sg = slotC.getContext("2d");
      sg.scale(k, k);
      sg.setLineDash([1.6, 1.2]);
      sg.lineWidth = 0.45;
      sg.strokeStyle = "rgba(59,47,42,0.45)";

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const x0 = x * pw, y0 = y * ph;
          const d = PlayKit.jigsaw.path(x0, y0, pw, ph, edges(x, y), T);
          const path = new Path2D(d);
          sg.stroke(path);

          const w = Math.ceil((pw + 2 * T) * k), hh = Math.ceil((ph + 2 * T) * k);
          /* the piece: the picture, clipped, with a cardboard bevel */
          const c = document.createElement("canvas");
          c.width = w; c.height = hh;
          const g = c.getContext("2d");
          g.scale(k, k);
          g.translate(-(x0 - T), -(y0 - T));
          g.save();
          g.clip(path);
          g.drawImage(art, 0, 0, 100, 100);
          g.restore();
          g.lineJoin = "round";
          g.save(); g.translate(0.22, 0.22); g.strokeStyle = "rgba(0,0,0,0.32)"; g.lineWidth = 0.55; g.stroke(path); g.restore();
          g.save(); g.translate(-0.18, -0.18); g.strokeStyle = "rgba(255,255,255,0.6)"; g.lineWidth = 0.4; g.stroke(path); g.restore();
          g.strokeStyle = "rgba(59,47,42,0.6)"; g.lineWidth = 0.32; g.stroke(path);
          const key = tag + "-" + x + "-" + y;
          S.textures.addCanvas(key, c);

          /* and its shadow, soft */
          const sc = document.createElement("canvas");
          const pad = 12;
          sc.width = w + pad * 2; sc.height = hh + pad * 2;
          const s2 = sc.getContext("2d");
          s2.filter = "blur(6px)";
          s2.translate(pad, pad);
          s2.scale(k, k);
          s2.translate(-(x0 - T), -(y0 - T));
          s2.fillStyle = "rgba(0,0,0,0.5)";
          s2.fill(path);
          S.textures.addCanvas(key + "-s", sc);

          pieces.push({
            key: key, x0: x0, y0: y0, pw: pw, ph: ph, T: T,
            /* where its centre belongs, in board units (0-100) */
            hx: x0 + pw / 2, hy: y0 + ph / 2,
            locked: false, held: false, full: false,
          });
        }
      }
      S.textures.addCanvas(tag + "-slots", slotC);
      slots.setTexture(tag + "-slots");
    }

    function home(p) {
      return { x: G.bx + p.hx * G.s / 100, y: G.by + p.hy * G.s / 100 };
    }

    function makeSprites() {
      pieces.forEach(function (p) {
        p.shadow = S.add.image(0, 0, p.key + "-s").setAlpha(0.55);
        p.img = S.add.image(0, 0, p.key).setInteractive({ pixelPerfect: true, alphaTolerance: 8, draggable: true, useHandCursor: true });
        p.img.piece = p;
        p.rot = big ? (Math.random() - 0.5) * 0.55 : (Math.random() - 0.5) * 0.2;
      });
      scatter(true);
    }

    /* Deal the pieces into the heap: a loose grid, shuffled, each a little
       askew, so they read as a pile and not a list. */
    function scatter(fresh) {
      const t = G.heap;
      const c = G.c, r = Math.ceil(pieces.length / c);
      const cw = t.w / c, ch = t.h / r;
      const loose = pieces.filter(function (p) { return !p.locked; });
      PlayKit.shuffle(loose).forEach(function (p, i) {
        p.x = t.x + (i % c) * cw + cw / 2 + (Math.random() - 0.5) * cw * 0.16;
        p.y = t.y + Math.floor(i / c) * ch + ch / 2 + (Math.random() - 0.5) * ch * 0.16;
        p.full = false;
        place(p);
        if (fresh) {
          p.img.setScale(0); p.shadow.setScale(0);
          S.tweens.add({ targets: [p.img, p.shadow], scale: G.scale * G.k, duration: 380, delay: 150 + i * 60, ease: "Back.easeOut" });
          if (i < 6) S.time.delayedCall(150 + i * 60, function () { Engine.Sfx.drop(); });
        }
      });
      pieces.filter(function (p) { return p.locked; }).forEach(function (p) {
        const hp = home(p);
        p.x = hp.x; p.y = hp.y;
        place(p);
      });
    }

    function scaleOf(p) {
      return G.scale * (p.locked || p.full || p.held ? 1 : G.k) * (p.held ? 1.06 : 1);
    }

    function place(p) {
      const s = scaleOf(p);
      p.img.setPosition(p.x, p.y).setScale(s).setRotation(p.locked ? 0 : p.rot + (p.tilt || 0));
      const lift = p.held ? 16 * u : p.locked ? 0 : 5 * u;
      p.shadow.setPosition(p.x + lift * 0.4, p.y + lift).setScale(s).setRotation(p.img.rotation).setVisible(!p.locked);
    }

    /* ---------- dragging ---------- */

    function onDragStart(pointer, obj) {
      const p = obj.piece;
      if (!p || p.locked || done) return;
      p.held = true;
      p.full = true;
      /* hold the piece by exactly the point she touched */
      p.gx = pointer.downX - p.x;
      p.gy = pointer.downY - p.y;
      p.tx = p.x; p.ty = p.y;
      p.vx = 0;
      obj.setDepth(++z);
      p.shadow.setDepth(z - 0.5);
      S.tweens.add({ targets: p, rot: 0, duration: 200, ease: "Quad.easeOut" });
      Engine.Sfx.lift();
      Engine.buzz(8);
      K.hideHand();
      armHint();
    }
    function onDrag(pointer, obj, dragX, dragY) {
      const p = obj.piece;
      if (!p || !p.held) return;
      p.tx = Math.max(0, Math.min(K.W(), pointer.x - p.gx));
      p.ty = Math.max(K.top() * 0.6, Math.min(K.H(), pointer.y - p.gy));
    }
    function onDragEnd(pointer, obj) {
      const p = obj.piece;
      if (!p || !p.held) return;
      p.held = false;
      p.tilt = 0;
      const hp = home(p);
      const body = Math.min(p.pw, p.ph) * G.s / 100;
      if (Math.hypot(p.x - hp.x, p.y - hp.y) <= body * (big ? 0.34 : 0.55)) return snap(p);
      /* left on the tray it stays full size; back in the heap it shrinks */
      p.full = p.x > G.bx && p.x < G.bx + G.s && p.y > G.by && p.y < G.by + G.s;
      S.tweens.add({ targets: p.img, scale: scaleOf(p), duration: 160, ease: "Quad.easeOut" });
      Engine.Sfx.drop();
    }

    function snap(p) {
      const hp = home(p);
      p.locked = true;
      p.img.disableInteractive();
      p.img.setDepth(5);
      p.shadow.setVisible(false);
      S.tweens.add({
        targets: p, x: hp.x, y: hp.y, rot: 0, duration: 200, ease: "Back.easeOut",
        onUpdate: function () { place(p); },
        onComplete: function () {
          place(p);
          S.tweens.add({ targets: p.img, scale: G.scale * 1.04, duration: 90, yoyo: true });
        },
      });
      Engine.Sfx.snap();
      Engine.buzz(15);
      K.ring(hp.x, hp.y, Math.min(p.pw, p.ph) * G.s / 100, 0xffffff);
      K.burst(hp.x, hp.y, { count: 10, speed: 200, scale: 0.28 });
      if (pieces.every(function (q) { return q.locked; })) S.time.delayedCall(350, finish);
    }

    /* ---------- hints ---------- */

    function armHint() {
      clearTimeout(hintTimer);
      hintTimer = setTimeout(hint, big ? 12000 : 6000);
    }
    function hint() {
      if (done || !ctx.alive) return;
      const loose = pieces.filter(function (p) { return !p.locked && !p.held; });
      if (loose.length) {
        const p = loose[0];
        const hp = home(p);
        K.showDrag({ x: p.x, y: p.y }, hp, { dur: 1000 });
        S.tweens.add({ targets: p.img, scale: p.img.scale * 1.12, duration: 220, yoyo: true, repeat: 1 });
      }
      armHint();
    }

    /* ---------- whole again ---------- */

    function finish() {
      done = true;
      clearTimeout(hintTimer);
      K.hideHand();
      full.setVisible(true).setAlpha(0).setDepth(20);
      S.tweens.add({ targets: full, alpha: 1, duration: 600, ease: "Sine.easeOut" });
      S.tweens.add({ targets: slots, alpha: 0, duration: 400 });
      /* a shine across the finished picture */
      const shine = S.add.image(G.bx - 80 * u, G.by + G.s / 2, "fx-shine").setDepth(30).setBlendMode("ADD").setAlpha(0.8).setRotation(0.35);
      shine.setScale((G.s * 0.4) / 128, (G.s * 1.6) / 512);
      try {
        const mg = S.make.graphics({}, false);
        mg.fillStyle(0xffffff);
        mg.fillRect(G.bx, G.by, G.s, G.s);
        shine.setMask(mg.createGeometryMask());
      } catch (e) {
        shine.setVisible(false);   /* no mask, no shine: better than one across the table */
      }
      S.tweens.add({ targets: shine, x: G.bx + G.s + 80 * u, duration: 900, delay: 300, ease: "Sine.easeInOut", onComplete: function () { shine.destroy(); } });
      Engine.Sfx.whoosh();
      K.burst(G.bx + G.s / 2, G.by + G.s / 2, { count: 36, speed: 480, scale: 0.42, life: 1200 });
      S.time.delayedCall(900, function () {
        if (!ctx.alive) return;
        K.alive(pic.id, hero, G.s);
      });
      S.time.delayedCall(1200, function () {
        if (!ctx.alive) return;
        Engine.celebrate(ctx, {
          pic: pic,
          nextLabel: "Next puzzle",
          region: function () { return { x: G.bx - 12 * u, y: G.by - 12 * u, w: G.s + 24 * u, h: G.s + 24 * u }; },
        });
      });
    }

    return {
      create: function () {
        S = this;
        K = Engine.kit(S, ctx);
        u = ctx.u;
        const g = grid();
        cols = g[0]; rows = g[1];
        layout();
        K.sky(0xd2a06c, 0xa9733f);
        tableG = S.add.graphics().setDepth(-40);
        trayG = S.add.graphics().setDepth(-5);
        ghost = S.add.image(0, 0, "pic-" + pic.id).setOrigin(0, 0).setAlpha(big ? 0.2 : 0.36).setDepth(-4);
        slots = S.add.image(0, 0, "fx-dot").setOrigin(0, 0).setDepth(-3).setVisible(!big || ctx.level === 0);
        full = S.add.image(0, 0, "pic-" + pic.id).setOrigin(0, 0).setVisible(false);
        hero = S.add.container(0, 0).setDepth(25);
        drawTable();
        cut();
        drawTable();
        makeSprites();

        ctx.caption((big ? "Puzzle " + (ctx.level + 1) + " · " : "") + cols * rows + " pieces");
        S.time.delayedCall(500, function () {
          Engine.say(big ? "Put the picture back together!" : "Drag the pieces into the picture!");
        });
        S.time.delayedCall(big ? 6000 : 2600, function () { if (!pieces.some(function (p) { return p.locked || p.held; })) hint(); });
        armHint();

        S.input.on("dragstart", onDragStart);
        S.input.on("drag", onDrag);
        S.input.on("dragend", onDragEnd);
        S.events.once("shutdown", function () { clearTimeout(hintTimer); });

        ctx.onResize = function () {
          layout();
          drawTable();
          scatter(false);
        };
      },

      update: function (time, dt) {
        const k = Math.min(1, dt / 16.7);
        pieces.forEach(function (p) {
          if (!p.held) return;
          const nx = p.x + (p.tx - p.x) * 0.42 * k;
          p.vx = nx - p.x;
          p.x = nx;
          p.y += (p.ty - p.y) * 0.42 * k;
          /* swing a little with the finger's momentum */
          p.tilt = (p.tilt || 0) * 0.8 + Math.max(-0.22, Math.min(0.22, (p.vx / u) * 0.012)) * 0.2;
          place(p);
        });
      },
    };
  }

  /* The menu's picture: the heart puzzle with its last piece lifted out. */
  function preview() {
    const pic = PICTURE_BY_ID.heart;
    const edges = PlayKit.jigsaw.edges(2, 2, PlayKit.rng(11));
    const T = 12;
    const ps = [];
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) ps.push(PlayKit.jigsaw.path(x * 50, y * 50, 50, 50, edges(x, y), T));
    const art = picMarkup(pic);
    const s = '<rect width="200" height="150" fill="#c8945f"/>' +
      '<defs><clipPath id="jpa"><path d="' + ps[0] + " " + ps[1] + " " + ps[2] + '"/></clipPath><clipPath id="jpb"><path d="' + ps[3] + '"/></clipPath></defs>' +
      '<g transform="translate(30 14) scale(1.12)"><rect x="-5" y="-5" width="110" height="110" rx="8" fill="#5c3d22"/><rect width="100" height="100" rx="3" fill="#f1e6d3"/>' +
      '<g clip-path="url(#jpa)">' + art + "</g>" +
      ps.slice(0, 3).map(function (d) { return '<path d="' + d + '" fill="none" stroke="#3b2f2a" stroke-opacity=".5" stroke-width="1"/>'; }).join("") +
      '<g transform="translate(18 16) rotate(8 75 75)"><path d="' + ps[3] + '" fill="#000" opacity=".25" transform="translate(3 5)"/>' +
      '<g clip-path="url(#jpb)">' + art + '</g><path d="' + ps[3] + '" fill="none" stroke="#3b2f2a" stroke-opacity=".6" stroke-width="1.1"/></g></g>';
    return PlayKit.svg("0 0 200 150", s, "pk-tile-svg");
  }

  PlayKit.register("jigsaw", {
    id: "jigsaw",
    title: "Jigsaws",
    background: "#b98556",
    blurbBig: "Real puzzle pieces that snap into place",
    blurbLittle: "Big pieces that snap into place",
    preview: preview,
    prepare: prepare,
    scene: scene,
  });
})();


/* ==== js/59-maze.js ========================================================= */
/* ============================================================
   Mazes.

   Hedges, clouds, riverbanks or desert rocks, drawn with a top light and
   a soft shadow so the walls stand up off the ground. Put a finger down
   and the traveller walks the paths towards it — turning where the path
   turns, never through a wall — kicking up a little dust, leaving a
   coloured trail. Backing up rubs the trail out. Twinkles hide in the
   dead ends, a reason to explore the side paths.

   The story is always the right way round: in the lost-sheep maze it is
   the shepherd who travels, and the sheep waits to be found.

   Sophie (2) gets a three-by-three maze with hardly a turn in it.
   Addison (nearly 5) starts on a real one and each is bigger than the
   last. Stuck for a while, and a line of sparkles runs the way from
   wherever she is standing.

   Mazes are generated, never stored: there is no answer to memorise.
   ============================================================ */

(function () {
  const M = PlayKit.maze;
  const SIZES_BIG = [[5, 7], [6, 8], [7, 9], [8, 10], [8, 11]];
  const SIZES_LITTLE = [[3, 3], [3, 4], [4, 4], [4, 5]];

  const LOOK = {
    sheep: { bg: 0x86c76a, bg2: 0x6fb256, floor: 0xf3e3bb, wall: 0x4f9a45, hi: 0x76bf60, shade: 0x2c6629, trail: 0xef7d57, dust: 0xd8c08a,
      mover: "cast-shepherd", goal: "zoo-sheep" },
    dove: { bg: 0x6fb8ea, bg2: 0x4a9ad8, floor: 0xbfe1f7, wall: 0xffffff, hi: 0xffffff, shade: 0x7aaed6, trail: 0xf39a3d, dust: 0xffffff,
      mover: "subj-dove", goal: "cast-ark" },
    moses: { bg: 0x7fb85e, bg2: 0x6aa64c, floor: 0x74bde6, wall: 0x5d9e45, hi: 0x86c56a, shade: 0x356b2b, trail: 0xffffff, dust: 0xc8ecff,
      mover: "subj-basket", goal: "subj-crown" },
    star: { bg: 0x1d2452, bg2: 0x2c2f6b, floor: 0xe7c992, wall: 0x8b6a3e, hi: 0xb38d5a, shade: 0x4a3519, trail: 0xffd166, dust: 0xf3dcae,
      mover: "cast-gift", goal: "cast-stable" },
  };

  function prepare(ctx) {
    const themes = PlayKit.rotation(MAZE_THEMES, 1);
    ctx.theme = themes[ctx.level % themes.length];
    const pic = PICTURE_BY_ID[ctx.theme.pic];
    PlayKit.prefetch([ctx.theme.prompt, ctx.theme.little, pic.said, pic.truth, pic.q ? pic.q.teach : "", "Follow the sparkles!"]);
    const look = LOOK[ctx.theme.id];
    const jobs = [Engine.castTexture("hand", 320)];
    [look.mover, look.goal].forEach(function (key) {
      if (key.indexOf("cast-") === 0) jobs.push(Engine.castTexture(key.slice(5), 320));
      else if (key.indexOf("zoo-") === 0) jobs.push(Engine.zooTexture(key.slice(4)));
      else jobs.push(Engine.subjectTexture(key, PICTURE_BY_ID[key.slice(5)], 320));
    });
    return Promise.all(jobs);
  }

  function scene(ctx) {
    const theme = ctx.theme;
    const look = LOOK[theme.id];
    const big = ctx.big;
    let S, K, u, maze, G;
    let wallsG, trailG, floorG, mover, moverBody, goal, dust;
    let start = 0, goalCell = 0, path = [], aim = -1, down = false, pointerId = -1, moving = false, won = false;
    let sparks = {}, steps = 0, idleTimer = null, firstMove = true;

    function dims() {
      const list = big ? SIZES_BIG : SIZES_LITTLE;
      const s = list[Math.min(ctx.level, list.length - 1)];
      return K.W() > K.H() * 1.1 ? [s[1], s[0]] : s;
    }

    function layout() {
      const W = K.W(), H = K.H(), top = K.top();
      const c = Math.min((W - 28 * u) / maze.cols, (H - top - 36 * u) / maze.rows, 130 * u);
      G = { c: c, x: (W - maze.cols * c) / 2, y: top + ((H - top) - maze.rows * c) / 2 + 4 * u };
    }

    function centre(i) {
      return { x: G.x + (i % maze.cols) * G.c + G.c / 2, y: G.y + ((i / maze.cols) | 0) * G.c + G.c / 2 };
    }

    function cellAt(p) {
      const x = Math.floor((p.x - G.x) / G.c), y = Math.floor((p.y - G.y) / G.c);
      if (x < 0 || y < 0 || x >= maze.cols || y >= maze.rows) return -1;
      return y * maze.cols + x;
    }

    /* The walls: every closed edge, drawn three times — a shadow below, the
       wall, a lit top — with round ends, so they read as hedges standing
       up off the path. */
    function drawMaze() {
      const c = G.c, W = maze.cols * c, H = maze.rows * c;
      floorG.clear();
      floorG.fillStyle(0x000000, 0.18);
      floorG.fillRoundedRect(G.x - c * 0.1, G.y - c * 0.02, W + c * 0.2, H + c * 0.2, c * 0.28);
      floorG.fillStyle(look.floor, 1);
      floorG.fillRoundedRect(G.x - c * 0.12, G.y - c * 0.12, W + c * 0.24, H + c * 0.24, c * 0.26);
      /* pebbles on the path */
      const r = PlayKit.rng(maze.open.length * 31 + ctx.level);
      floorG.fillStyle(0x000000, 0.06);
      for (let i = 0; i < maze.open.length * 3; i++) {
        floorG.fillCircle(G.x + r() * W, G.y + r() * H, (0.015 + r() * 0.02) * c);
      }

      const segs = [];
      for (let i = 0; i < maze.open.length; i++) {
        const x = i % maze.cols, y = (i / maze.cols) | 0;
        const x0 = G.x + x * c, y0 = G.y + y * c;
        if (!(maze.open[i] & M.N)) segs.push([x0, y0, x0 + c, y0]);
        if (!(maze.open[i] & M.W)) segs.push([x0, y0, x0, y0 + c]);
        if (y === maze.rows - 1 && !(maze.open[i] & M.S)) segs.push([x0, y0 + c, x0 + c, y0 + c]);
