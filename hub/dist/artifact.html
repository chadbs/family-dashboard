        if (x === maze.cols - 1 && !(maze.open[i] & M.E)) segs.push([x0 + c, y0, x0 + c, y0 + c]);
      }
      const t = c * 0.26;
      wallsG.clear();
      [[look.shade, t, c * 0.07, 1], [look.wall, t, 0, 1], [look.hi, t * 0.42, -c * 0.035, 0.85]].forEach(function (pass) {
        wallsG.lineStyle(pass[1], pass[0], pass[3]);
        wallsG.fillStyle(pass[0], pass[3]);
        segs.forEach(function (s) {
          wallsG.lineBetween(s[0], s[1] + pass[2], s[2], s[3] + pass[2]);
          wallsG.fillCircle(s[0], s[1] + pass[2], pass[1] / 2);
          wallsG.fillCircle(s[2], s[3] + pass[2], pass[1] / 2);
        });
      });
      /* flowers on the hedges, stars in the rocks */
      if (theme.id === "sheep" || theme.id === "star") {
        const fr = PlayKit.rng(segs.length * 17 + ctx.level);
        segs.forEach(function (s) {
          if (fr() > 0.45) return;
          const k = fr();
          wallsG.fillStyle(theme.id === "star" ? 0xffe9a8 : (fr() < 0.5 ? 0xffffff : 0xffd166), 1);
          wallsG.fillCircle(s[0] + (s[2] - s[0]) * k, s[1] + (s[3] - s[1]) * k - c * 0.04, c * 0.035);
        });
      }
    }

    function drawTrail() {
      trailG.clear();
      if (path.length < 2) return;
      trailG.lineStyle(G.c * 0.16, look.trail, 0.85);
      trailG.fillStyle(look.trail, 0.85);
      for (let i = 1; i < path.length; i++) {
        const a = centre(path[i - 1]), b = centre(path[i]);
        trailG.lineBetween(a.x, a.y, b.x, b.y);
        trailG.fillCircle(b.x, b.y, G.c * 0.08);
      }
      const s = centre(path[0]);
      trailG.fillCircle(s.x, s.y, G.c * 0.08);
    }

    function makeActors() {
      const c = G.c;
      const g = centre(goalCell);
      goal = S.add.container(g.x, g.y).setDepth(60);
      const aura = S.add.image(0, 0, "fx-glow").setTint(0xfff3b0).setBlendMode("ADD").setAlpha(0.7).setScale((c * 1.7) / 128);
      const gs = S.add.image(0, c * 0.32, look.goal).setOrigin(0.5, 0.92);
      gs.setScale((c * (look.goal === "cast-ark" ? 1.25 : 0.95)) / (look.goal === "cast-ark" ? 900 : 320));
      goal.add([aura, gs]);
      goal.sprite = gs;
      S.tweens.add({ targets: aura, scale: aura.scale * 1.25, alpha: 0.35, duration: 1100, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
      S.tweens.add({ targets: gs, y: c * 0.24, duration: 900, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });

      const m = centre(start);
      mover = S.add.container(m.x, m.y).setDepth(70);
      const shadow = S.add.image(0, c * 0.3, "fx-shadow").setScale((c * 0.7) / 128, (c * 0.22) / 48);
      moverBody = S.add.container(0, 0);
      /* Drawn standing, feet just below the middle of the cell, head just
         under the wall above: tall enough to read, never through a wall. */
      const ms = S.add.image(0, c * 0.3, look.mover).setOrigin(0.5, 0.92).setScale((c * 0.8) / 320);
      moverBody.add(ms);
      mover.add([shadow, moverBody]);
      mover.sprite = ms;
      /* an idle breath, so the traveller always looks alive */
      S.tweens.add({ targets: moverBody, scaleY: 1.04, scaleX: 0.97, duration: 900, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
      mover.setScale(0);
      S.tweens.add({ targets: mover, scale: 1, duration: 500, delay: 200, ease: "Back.easeOut" });
    }

    /* Twinkles in a few dead ends. */
    function makeSparks() {
      const ends = [];
      for (let i = 0; i < maze.open.length; i++) {
        const o = maze.open[i];
        if (i !== start && i !== goalCell && (o === M.N || o === M.E || o === M.S || o === M.W)) ends.push(i);
      }
      PlayKit.shuffle(ends).slice(0, big ? 3 : 1).forEach(function (i) {
        const p = centre(i);
        const s = S.add.image(p.x, p.y, "fx-spark").setTint(theme.id === "dove" ? 0xffc94a : 0xffffff).setBlendMode(theme.id === "dove" ? "NORMAL" : "ADD").setScale((G.c * 0.45) / 64).setDepth(50);
        S.tweens.add({ targets: s, angle: 45, scale: s.scale * 1.3, duration: 800, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
        sparks[i] = s;
      });
    }

    function face(dx) {
      if (!dx) return;
      const flip = look.mover === "subj-dove" ? dx > 0 : dx < 0;
      mover.sprite.setFlipX(flip);
    }

    /* One cell towards the finger: along the path in the direction the
       finger mostly is, or the other way it is, if that way is open. */
    function step() {
      if (moving || won || aim < 0) return;
      const cur = path[path.length - 1];
      if (aim === cur) return;
      const cx = cur % maze.cols, cy = (cur / maze.cols) | 0;
      const ax = aim % maze.cols, ay = (aim / maze.cols) | 0;
      const dx = ax - cx, dy = ay - cy;
      const horiz = Math.abs(dx) >= Math.abs(dy);
      const first = horiz ? (dx > 0 ? M.E : M.W) : (dy > 0 ? M.S : M.N);
      const second = horiz ? (dy ? (dy > 0 ? M.S : M.N) : 0) : (dx ? (dx > 0 ? M.E : M.W) : 0);
      let nb = M.next(maze, cur, first);
      if (nb < 0 && second) nb = M.next(maze, cur, second);
      if (nb >= 0) go(nb);
    }

    function go(nb) {
      const cur = path[path.length - 1];
      if (path.length >= 2 && path[path.length - 2] === nb) path.pop();
      else path.push(nb);
      const p = centre(nb);
      face(p.x - mover.x);
      moving = true;
      K.hideHand();
      armIdle();
      S.tweens.add({
        targets: mover, x: p.x, y: p.y, duration: 135, ease: "Sine.easeInOut",
        onComplete: function () {
          moving = false;
          drawTrail();
          arrive(nb);
          if (down && !won) step();
        },
      });
      S.tweens.add({ targets: moverBody, y: -G.c * 0.12, duration: 67, yoyo: true, ease: "Quad.easeOut" });
      Engine.Sfx.step(steps++);
      dust.emitParticleAt(mover.x, mover.y + G.c * 0.28, 3);
      if (firstMove) { firstMove = false; }
      void cur;
    }

    function arrive(cell) {
      if (sparks[cell]) {
        const s = sparks[cell];
        delete sparks[cell];
        K.burst(s.x, s.y, { count: 14, speed: 220, scale: 0.3 });
        Engine.Sfx.chime();
        S.tweens.add({ targets: s, scale: s.scale * 2.4, alpha: 0, duration: 380, onComplete: function () { s.destroy(); } });
      }
      if (cell === goalCell) win();
    }

    function armIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(showWay, big ? 11000 : 5000);
    }

    /* Stuck? A line of sparkles runs the way, from where she stands. */
    function showWay() {
      if (won || !ctx.alive) return;
      const way = M.way(maze, path[path.length - 1], goalCell);
      way.forEach(function (cell, i) {
        S.time.delayedCall(i * 70, function () {
          if (won) return;
          const p = centre(cell);
          const s = S.add.image(p.x, p.y, "fx-spark").setTint(look.trail).setScale(0).setDepth(55).setBlendMode(theme.id === "dove" || theme.id === "sheep" ? "NORMAL" : "ADD");
          S.tweens.add({ targets: s, scale: (G.c * 0.3) / 64, duration: 200, yoyo: true, hold: 500, onComplete: function () { s.destroy(); } });
        });
      });
      if (way.length > 1) {
        const a = centre(way[0]), b = centre(way[Math.min(2, way.length - 1)]);
        K.showDrag(a, b, { dur: 700, loops: 0 });
      }
      Engine.say(big ? "Follow the sparkles!" : theme.little);
      armIdle();
    }

    function win() {
      won = true;
      down = false;
      clearTimeout(idleTimer);
      K.hideHand();
      const g = centre(goalCell);
      S.tweens.add({ targets: moverBody, y: -G.c * 0.5, duration: 220, yoyo: true, repeat: 1, ease: "Quad.easeOut" });
      S.tweens.add({ targets: goal.sprite, scaleX: goal.sprite.scaleX * 1.15, scaleY: goal.sprite.scaleY * 1.15, duration: 200, yoyo: true, repeat: 1 });
      K.burst(g.x, g.y, { tex: "fx-heart", count: 16, speed: 260, scale: 0.4, tints: [0xef5f67, 0xff8fa3, 0xffffff], blend: "NORMAL" });
      K.ring(g.x, g.y, G.c, 0xffffff);
      Engine.Sfx.chime();
      S.time.delayedCall(700, function () {
        if (!ctx.alive) return;
        Engine.celebrate(ctx, {
          pic: PICTURE_BY_ID[theme.pic],
          nextLabel: "Next maze",
          region: function () {
            return { x: G.x - G.c * 0.2, y: G.y - G.c * 0.2, w: maze.cols * G.c + G.c * 0.4, h: maze.rows * G.c + G.c * 0.4 };
          },
        });
      });
    }

    return {
      create: function () {
        S = this;
        K = Engine.kit(S, ctx);
        u = ctx.u;
        const d = dims();
        maze = M.gen(d[0], d[1], PlayKit.rng((Math.random() * 4294967296) >>> 0));
        const dist = M.distances(maze, 0);
        goalCell = dist.indexOf(Math.max.apply(null, dist));
        path = [start];
        layout();
        /* for automated play-testing */
        ctx.debug = { maze: maze, goal: goalCell, centre: function (i) { return centre(i); } };

        K.sky(look.bg, look.bg2);
        if (theme.id === "star") {
          S.add.particles(0, 0, "fx-spark", {
            x: { min: 0, max: K.W() }, y: { min: 0, max: K.H() },
            scale: { onEmit: function () { return 0; }, onUpdate: function (p, k, t) { return Math.sin(t * Math.PI) * 0.08 * u; } },
            lifespan: { min: 1800, max: 3400 }, frequency: 120, tint: 0xffffff, blendMode: "ADD",
          }).setDepth(-60);
        } else {
          K.motes(0xffffff, 0.25);
        }
        floorG = S.add.graphics().setDepth(10);
        trailG = S.add.graphics().setDepth(20);
        wallsG = S.add.graphics().setDepth(30);
        drawMaze();
        makeSparks();
        makeActors();
        dust = S.add.particles(0, 0, "fx-dot", {
          speed: { min: 10 * u, max: 40 * u }, angle: { min: 200, max: 340 }, scale: { start: 0.25 * u, end: 0 }, alpha: { start: 0.7, end: 0 },
          lifespan: 450, tint: look.dust, emitting: false,
        }).setDepth(65);

        ctx.caption(big ? "Level " + (ctx.level + 1) : theme.little);
        S.time.delayedCall(400, function () { Engine.say(big ? theme.prompt : theme.little); });
        S.time.delayedCall(big ? 4500 : 1800, function () {
          if (path.length === 1 && !won) {
            const way = M.way(maze, start, goalCell);
            K.showDrag(centre(way[0]), centre(way[Math.min(2, way.length - 1)]), { dur: 800 });
          }
        });
        armIdle();

        S.input.on("pointerdown", function (p) {
          if (won) return;
          down = true;
          pointerId = p.id;
          aim = cellAt(p);
          step();
        });
        S.input.on("pointermove", function (p) {
          if (!down || p.id !== pointerId) return;
          aim = cellAt(p);
          step();
        });
        const up = function (p) { if (p.id === pointerId) down = false; };
        S.input.on("pointerup", up);
        S.input.on("pointerupoutside", up);
        S.events.once("shutdown", function () { clearTimeout(idleTimer); });

        ctx.onResize = function () {
          layout();
          drawMaze();
          drawTrail();
          const m = centre(path[path.length - 1]), g = centre(goalCell);
          mover.setPosition(m.x, m.y);
          goal.setPosition(g.x, g.y);
          Object.keys(sparks).forEach(function (cell) { const p = centre(+cell); sparks[cell].setPosition(p.x, p.y); });
        };
      },
    };
  }

  /* The menu's picture: a hedge maze with the shepherd setting out. */
  function preview() {
    const m = M.gen(5, 4, PlayKit.rng(20261005));
    const c = 34, ox = 15, oy = 7;
    let walls = "";
    for (let i = 0; i < m.open.length; i++) {
      const x = i % 5, y = (i / 5) | 0, x0 = ox + x * c, y0 = oy + y * c;
      if (!(m.open[i] & M.N)) walls += "M" + x0 + " " + y0 + "h" + c;
      if (!(m.open[i] & M.W)) walls += "M" + x0 + " " + y0 + "v" + c;
      if (y === 3) walls += "M" + x0 + " " + (y0 + c) + "h" + c;
      if (x === 4) walls += "M" + (x0 + c) + " " + y0 + "v" + c;
    }
    const s = '<rect width="200" height="150" fill="#86c76a"/>' +
      '<rect x="' + (ox - 4) + '" y="' + (oy - 4) + '" width="' + (5 * c + 8) + '" height="' + (4 * c + 8) + '" rx="10" fill="#f3e3bb"/>' +
      '<path d="' + walls + '" stroke="#2c6629" stroke-width="10" stroke-linecap="round" transform="translate(0 2.5)"/>' +
      '<path d="' + walls + '" stroke="#4f9a45" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="' + walls + '" stroke="#76bf60" stroke-width="4" stroke-linecap="round" transform="translate(0 -1)"/>' +
      '<svg x="' + (ox + 1) + '" y="' + (oy - 2) + '" width="32" height="32" viewBox="0 0 100 100">' + CAST.shepherd + "</svg>" +
      '<svg x="' + (ox + 4 * c - 2) + '" y="' + (oy + 3 * c - 2) + '" width="36" height="36" viewBox="0 0 100 100">' + ZOO.sheep.svg + "</svg>";
    return PlayKit.svg("0 0 200 150", s, "pk-tile-svg");
  }

  PlayKit.register("maze", {
    id: "maze",
    title: "Mazes",
    background: "#7fbf63",
    blurbBig: "Help the shepherd find his lost sheep",
    blurbLittle: "Take the shepherd to the sheep",
    preview: preview,
    prepare: prepare,
    scene: scene,
  });
})();


/* ==== js/60-display.js ========================================================= */
/* ============================================================
   Display — the Surface on the kitchen wall.

   It is the ordinary app, in full, with every button and checkbox live:
   give a star, tick a chore, plan a dinner, edit a job. Nothing is hidden
   and nothing rotates — the family walks up to it and uses it.

   What /display adds over / is only what an always-on screen wants:

     * a thin bar across the top with the time, the date and the backyard
       temperature, so a glance from across the room is worth something;
     * light through the day, dark from 7pm, whatever the machine's own
       setting says;
     * slightly larger type, because it is read standing up;
     * a reload at 4am so a screen left running for months quietly picks up
       new builds.
   ============================================================ */

const Display = (function () {
  let started = false;
  let clockEl = null;
  let dateEl = null;
  let tempEl = null;

  function active() {
    try {
      if (location.pathname.indexOf("/display") === 0) return true;
      return new URLSearchParams(location.search).get("display") === "1";
    } catch (e) {
      return false;
    }
  }

  /* Light by day, dark in the evening — the hours the old wall used. */
  function applyWallTheme(now) {
    const h = (now || new Date()).getHours();
    document.documentElement.setAttribute("data-theme", h >= 19 || h < 7 ? "dark" : "light");
  }

  function buildBar() {
    clockEl = UI.h("div", { class: "wb-time nums" });
    dateEl = UI.h("div", { class: "wb-date" });
    tempEl = UI.h("div", { class: "wb-temp" });
    document.body.appendChild(
      UI.h(
        "div",
        { class: "wallbar" },
        UI.h("div", { class: "wb-left" }, clockEl, dateEl),
        UI.h("div", { class: "wb-mid" }),
        tempEl
      )
    );
  }

  function tick() {
    const now = new Date();
    if (clockEl) {
      let h = now.getHours();
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      const t = h + ":" + String(now.getMinutes()).padStart(2, "0") + " " + ampm;
      if (clockEl.textContent !== t) clockEl.textContent = t;
    }
    if (dateEl) {
      const d = Fmt.date(now, { weekday: "long", month: "long", day: "numeric" });
      if (dateEl.textContent !== d) dateEl.textContent = d;
    }
    if (tempEl) {
      let txt = "";
      try {
        const w = Weather.reading();
        if (w && w.temp !== null) {
          txt = w.emoji + "  " + w.temp + "°  " + (w.fromSensor ? "Backyard" : "Hudsonville");
        }
      } catch (e) {
        txt = "";
      }
      if (tempEl.textContent !== txt) tempEl.textContent = txt;
    }
    applyWallTheme(now);
  }

  function start() {
    if (started) return;
    started = true;
    buildBar();
    tick();
    Router.go("today");
    setInterval(tick, 1000);
    /* Nothing accumulates on a screen that runs for months, and it picks up
       whatever has shipped since. 4am, when nobody is looking at it. */
    setInterval(function () {
      if (new Date().getHours() === 4) location.reload();
    }, 60 * 60 * 1000);
  }

  return { active: active, start: start };
})();


/* ==== js/70-love.js ========================================================= */
/* ============================================================
   Love — the daily note for Kenzie.

   Carried over from the wall exactly as it behaved there: once a day,
   inside a morning window starting at LOVE.hour, one of Chad's messages
   fills the screen; tap anywhere to close. "Already shown today" is kept
   per device on purpose — it should greet her on her phone and on the
   wall independently, not once for the whole family.

   The words themselves live in data/love.js, generated byte-for-byte
   from public/config.js. Nothing here edits them.
   ============================================================ */

const Love = (function () {
  const SHOWN_KEY = "house-love-shown";
  const NOW_KEY = "house-love-now-seen";
  const GLYPHS = ["\u{1F49A}", "\u{1F5A4}", "\u{1F495}", "\u{1F334}", "\u{2728}", "\u{1F497}"];

  function conf() {
    return typeof LOVE !== "undefined" && LOVE ? LOVE : null;
  }

  function lsGet(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }
  function lsSet(k, v) {
    try {
      localStorage.setItem(k, v);
    } catch (e) {
      /* private window: she just sees it again next time, no harm */
    }
  }

  /* Same message for the whole day, a different one tomorrow, and — because
     it is the same arithmetic the wall uses — the same one on the wall and
     on her phone. */
  function messageFor(date) {
    const c = conf();
    if (!c || !c.messages || !c.messages.length) return null;
    const d = date || new Date();
    const day = Math.floor(d.getTime() / 86400000);
    return c.messages[((day % c.messages.length) + c.messages.length) % c.messages.length];
  }

  function due(date) {
    const c = conf();
    if (!c || !c.to || !c.messages || !c.messages.length) return false;
    const d = date || new Date();
    const hour = typeof c.hour === "number" ? c.hour : 7;
    const h = d.getHours();
    if (h < hour || h >= hour + 6) return false;
    return lsGet(SHOWN_KEY) !== Fmt.dayKey(d);
  }

  /* The one-time surprise note (LOVE.now), shown once per distinct text —
     the wall's showLoveNow behaviour. */
  function surpriseDue() {
    const c = conf();
    if (!c || !c.now) return false;
    return lsGet(NOW_KEY) !== c.now;
  }

  let open = null;

  function drift(host) {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    for (let i = 0; i < 14; i++) {
      const g = UI.h("span", {
        class: "love-glyph",
        text: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
        style: {
          left: Math.random() * 100 + "%",
          fontSize: 18 + Math.random() * 26 + "px",
          animationDelay: Math.random() * 2.2 + "s",
          animationDuration: 3.4 + Math.random() * 2.6 + "s",
        },
      });
      host.appendChild(g);
    }
  }

  function present(eyebrow, message, onClose) {
    if (open) open();
    const glyphs = UI.h("div", { class: "love-glyphs", "aria-hidden": "true" });
    drift(glyphs);

    const closeBtn = UI.h(
      "button",
      { class: "love-close", type: "button" },
      "xoxo  \u{1F48B}"
    );

    const card = UI.h(
      "div",
      { class: "love-card", role: "dialog", "aria-modal": "true", "aria-label": eyebrow },
      UI.h("div", { class: "love-eyebrow", text: eyebrow }),
      UI.h("p", { class: "love-msg", text: message }),
      closeBtn
    );

    const scrim = UI.h("div", { class: "love-scrim" }, glyphs, card);

    function close() {
      if (!open) return;
      open = null;
      scrim.classList.add("love-out");
      document.removeEventListener("keydown", onKey);
      setTimeout(function () {
        scrim.remove();
      }, 260);
      if (onClose) onClose();
    }
    function onKey(e) {
      if (e.key === "Escape") close();
    }

    scrim.addEventListener("click", close);
    closeBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      close();
    });
    document.addEventListener("keydown", onKey);

    open = close;
    document.body.appendChild(scrim);
    closeBtn.focus({ preventScroll: true });
  }

  function show(date) {
    const c = conf();
    const msg = messageFor(date);
    if (!c || !msg) return false;
    const d = date || new Date();
    lsSet(SHOWN_KEY, Fmt.dayKey(d));
    present("Good morning, " + c.to + " \u{1F49A}", msg);
    return true;
  }

  function showSurprise() {
    const c = conf();
    if (!c || !c.now) return false;
    lsSet(NOW_KEY, c.now);
    present("\u{1F48C} A surprise note for " + c.to, c.now);
    return true;
  }

  /* Boot calls this once; it checks every minute so the note lands at the
     hour, exactly as the wall does. */
  let ticking = false;
  function watch() {
    if (ticking) return;
    ticking = true;
    function tick() {
      try {
        /* Not over a child's game: the note stays due, and lands within a
           minute of the game being closed. */
        if (typeof Engine !== "undefined" && Engine.current()) return;
        if (surpriseDue()) showSurprise();
        else if (due()) show();
      } catch (e) {
        /* the love note must never take the app down */
      }
    }
    tick();
    setInterval(tick, 60 * 1000);
  }

  return {
    messageFor: messageFor,
    due: due,
    show: show,
    showSurprise: showSurprise,
    watch: watch,
  };
})();


/* ==== js/99-boot.js ========================================================= */
/* ============================================================
   Boot — tab bar, housekeeping, start.
   Runs last; every view module has registered itself by now.
   ============================================================ */

const TABS = [
  { route: "today", label: "Today", icon: "sun" },
  { route: "meals", label: "Meals", icon: "pot" },
  { route: "recipes", label: "Recipes", icon: "book" },
  { route: "house", label: "House", icon: "home" },
  { route: "rewards", label: "Stars", icon: "star" },
  { route: "bible", label: "Bible", icon: "cross" },
];

function buildTabBar() {
  const bar = document.getElementById("tabbar");
  bar.textContent = "";
  bar.appendChild(UI.h("div", { class: "brand", text: "The Solanyk House" }));
  TABS.forEach(function (t) {
    bar.appendChild(
      UI.h(
        "button",
        {
          type: "button",
          data: { route: t.route },
          on: {
            click: function () {
              Router.go(t.route);
            },
          },
        },
        UI.icon(t.icon),
        UI.h("span", { text: t.label })
      )
    );
  });
}

/* Date-keyed documents are fields, not documents, so they only grow. Trim
   them once per session to keep the store small and the app quick. */
function prune() {
  const today = Fmt.fromDayKey(Fmt.dayKey());

  function daysOld(key) {
    const d = Fmt.fromDayKey(key);
    if (isNaN(d)) return 1e6;
    return Math.round((today - d) / 86400000);
  }

  const checks = Store.get("checks");
  const keptChecks = {};
  let droppedChecks = 0;
  Object.keys(checks).forEach(function (k) {
    if (daysOld(k) <= 60) keptChecks[k] = checks[k];
    else droppedChecks++;
  });
  if (droppedChecks) Store.setDoc("checks", keptChecks);

  const daily = Store.get("daily");
  const keptDaily = {};
  let droppedDaily = 0;
  Object.keys(daily).forEach(function (k) {
    if (daysOld(k) <= 14) keptDaily[k] = daily[k];
    else droppedDaily++;
  });
  if (droppedDaily) Store.setDoc("daily", keptDaily);

  const plan = Store.get("plan");
  const weeks = Object.keys(plan).sort();
  if (weeks.length > 8) {
    const kept = {};
    weeks.slice(-8).forEach(function (w) {
      kept[w] = plan[w];
    });
    Store.setDoc("plan", kept);
  }
}

/* The app is left open on a phone overnight. When the date rolls over,
   Today has to become today. */
function watchMidnight() {
  let seen = Fmt.dayKey();
  setInterval(function () {
    const now = Fmt.dayKey();
    if (now !== seen) {
      seen = now;
      Router.refresh();
    }
  }, 30000);
}

async function boot() {
  buildTabBar();
  Router.mount(document.getElementById("main"));
  Store.on(Router.refresh);

  /* The wall opens /display and gets the always-on view; everything else
     gets the phone app. Same page, same data. */
  const wall = typeof Display !== "undefined" && Display.active();
  if (wall) {
    document.body.classList.add("display-mode");
    document.documentElement.classList.add("display-root");
    Display.start();
  } else {
    Router.go("today");
  }

  watchMidnight();

  /* Kenzie's morning note, on whichever screen she is looking at. */
  if (typeof Love !== "undefined") Love.watch();

  Ask.init().then(function () {
    Router.refresh();
  });

  await Store.connect();
  await Store.ready;
  /* On the hosted app a nightly cron does the pruning, so a phone opening
     the app never has to spend its first seconds on housekeeping. Offline
     and artifact copies still tidy after themselves. */
  if (Store.mode !== "server") prune();
  Router.refresh();

  /* The backyard sensor, once we know whether this copy of the page can
     reach it. Refreshed while the app is open, paused when it is not. */
  if (await Weather.refresh()) Router.refresh();
  /* The server caches the forecast for ten minutes anyway, and the backyard
     sensor only reports every five, so asking more often than this just
     spends requests. */
  setInterval(function () {
    if (document.hidden) return;
    Weather.refresh().then(function (ok) {
      if (ok && Router.current() === "today") Router.refresh();
    });
  }, 15 * 60 * 1000);
}

boot();

</script>
