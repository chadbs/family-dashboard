<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<!--
  The Solanyk House TV home screen (house.solanyk.tv, HomeActivity).

  Built for an OLED panel: pure black everywhere, thin light type, nothing
  big and bright, and the clock block drifts a few pixels every minute so
  nothing static burns in. After a few idle minutes the whole page dims.

  Native contract (HomeActivity / Bridge.java):
    Shield.apps() -> JSON [{pkg,label,banner,img,game}]   Shield.launch(pkg) -> bool
    Shield.settings()   Shield.screensaver()   Shield.flyovers()
    native calls window.onShown(), onHidden(), onHome(), onBack()
  In a desktop browser there is no Shield, so a mock bridge and the fixtures
  in tv/dev/ stand in (see tv/dev/serve.js).
-->
<style>
  :root {
    --fg: #e4e4e7;
    --fg2: #8b8b92;
    --fg3: #56565c;
    --line: #141416;
    --tile: #0b0b0d;
    --gold: #c9a35c;
    --sun: #d2b06a;
    --ease: cubic-bezier(.2, .75, .25, 1);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: var(--fg);
    overflow: hidden;
  }
  body {
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    cursor: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: absolute;
    inset: 0;
    padding: 5.5vh 5vw 4.5vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    transition: opacity 2.5s ease, transform 4s ease-in-out;
  }
  body.idle #stage { opacity: .3; }

  /* ── Clock + weather ─────────────────────────────────────────── */
  #top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    transition: transform 4s ease-in-out;
  }
  #greet {
    font-size: 2.7vh;
    color: var(--fg2);
    letter-spacing: .04em;
  }
  #clock {
    font-size: 17vh;
    font-weight: 100;
    line-height: .95;
    letter-spacing: -.01em;
    color: #d9d9dd;
    margin-top: .8vh;
    white-space: nowrap;
  }
  #ampm {
    font-size: 3.2vh;
    font-weight: 300;
    color: var(--fg3);
    letter-spacing: .12em;
    margin-left: 1.2vh;
  }
  #date {
    font-size: 3.3vh;
    color: var(--fg2);
    margin-top: 1.4vh;
  }

  #wx {
    text-align: right;
    min-width: 30vw;
    transition: opacity 1s;
  }
  #wx.stale { opacity: .45; }
  #wx-now {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1.6vh;
    margin-top: .6vh;
  }
  #wx-icon { width: 7vh; height: 7vh; color: var(--fg2); }
  #wx-icon.warm { color: var(--sun); }
  #wx-temp {
    font-size: 9.6vh;
    font-weight: 100;
    line-height: 1;
    color: #d9d9dd;
  }
  #wx-cond { font-size: 2.8vh; color: var(--fg2); margin-top: 1vh; }
  #wx-hilo { font-size: 2.6vh; color: var(--fg3); margin-top: .7vh; letter-spacing: .02em; }
  #wx-hilo b { font-weight: 300; color: var(--fg2); }
  #wx-days {
    display: flex;
    justify-content: flex-end;
    gap: 2.6vw;
    margin-top: 1.1vh;
    color: var(--fg3);
    font-size: 2.2vh;
  }
  .day { display: flex; align-items: center; gap: .8vh; }
  .day svg { width: 2.6vh; height: 2.6vh; }
  .day .n { letter-spacing: .08em; text-transform: uppercase; font-size: 1.9vh; }

  /* ── Family strip ────────────────────────────────────────────── */
  #family {
    display: flex;
    align-items: stretch;
    margin-top: 3.2vh;
    transition: transform 4s ease-in-out;
  }
  .fam {
    padding: 0 2.4vw;
    border-left: 1px solid var(--line);
    min-width: 0;
  }
  .fam:first-child { padding-left: 0; border-left: 0; }
  .fam.grow { flex: 1; }
  .k {
    font-size: 1.8vh;
    font-weight: 400;
    color: var(--fg3);
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 1vh;
  }
  .v {
    font-size: 3vh;
    color: #c6c6cb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 34vw;
  }
  .v .em { margin-right: .9vh; }
  .v.muted { color: var(--fg3); }
  .star { color: var(--gold); margin: 0 .5vh 0 .9vh; font-size: 2.6vh; }
  .kid + .kid { margin-left: 2.2vw; }
  #verse {
    font-size: 2.3vh;
    line-height: 1.45;
    color: var(--fg2);
    font-style: italic;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: none;
    white-space: normal;
  }
  #verse .ref { font-style: normal; color: var(--fg3); margin-left: .8vh; letter-spacing: .03em; }

  /* ── App row ─────────────────────────────────────────────────── */
  #apps-sec { margin-top: auto; }
  #apps-wrap {
    overflow: hidden;
    margin: 0 -5vw;
    padding: 2.6vh 5vw 1.2vh;
  }
  .track {
    position: relative;
    display: flex;
    gap: 1.8vw;
    transition: transform .38s var(--ease);
    will-change: transform;
  }
  .tile {
    flex: none;
    position: relative;
    width: 17vw;
    height: 9.5625vw; /* 16:9 */
    border-radius: 1.1vh;
    background: var(--tile);
    opacity: .5;
    transition: transform .26s var(--ease), opacity .26s, box-shadow .26s;
  }
  .tile img {
    display: block;
    -webkit-user-drag: none;
  }
  .tile.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .tile.icon {
    background: linear-gradient(160deg, #141417, #09090a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .tile.icon img { width: 4.6vw; height: 4.6vw; object-fit: contain; }
  .tile.icon .lbl {
    font-size: 2.1vh;
    color: var(--fg2);
    margin-top: 1.1vh;
    max-width: 88%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile.focus {
    opacity: 1;
    transform: scale(1.1);
    z-index: 2;
    box-shadow: 0 0 0 .3vh rgba(255, 255, 255, .78), 0 1.2vh 4.5vh rgba(130, 160, 255, .22);
  }
  .tile.focus.press { transform: scale(1.04); transition-duration: .1s; }
  .tile.bump-l { animation: bumpL .28s var(--ease); }
  .tile.bump-r { animation: bumpR .28s var(--ease); }
  .tile.bump-u { animation: bumpU .28s var(--ease); }
  .tile.bump-d { animation: bumpD .28s var(--ease); }
  @keyframes bumpL { 40% { transform: scale(1.1) translateX(-.6vw); } }
  @keyframes bumpR { 40% { transform: scale(1.1) translateX(.6vw); } }
  @keyframes bumpU { 40% { transform: scale(1.1) translateY(-.8vh); } }
  @keyframes bumpD { 40% { transform: scale(1.1) translateY(.8vh); } }
  body.idle .tile.focus { box-shadow: none; }

  #caption {
    height: 3vh;
    font-size: 2.5vh;
    color: var(--fg);
    white-space: nowrap;
    transition: transform .38s var(--ease), opacity .25s;
    margin-top: .6vh;
  }
  #caption.off { opacity: 0; }
  #empty { font-size: 2.6vh; color: var(--fg3); padding: 3vh 0; }

  /* ── Utility row ─────────────────────────────────────────────── */
  #util { margin-top: 1.6vh; gap: 1.2vw; }
  .pill {
    flex: none;
    display: flex;
    align-items: center;
    gap: 1.1vh;
    height: 6.2vh;
    padding: 0 2.1vw 0 1.7vw;
    border-radius: 3.1vh;
    background: var(--tile);
    color: var(--fg3);
    font-size: 2.4vh;
    transition: transform .26s var(--ease), background .26s, color .26s, box-shadow .26s;
  }
  .pill svg { width: 2.8vh; height: 2.8vh; }
  .pill.focus {
    background: #18181b;
    color: var(--fg);
    transform: scale(1.06);
    box-shadow: 0 0 0 .25vh rgba(255, 255, 255, .6);
  }
  .pill.focus.press { transform: scale(1.0); transition-duration: .1s; }
  .pill.bump-l { animation: pbumpL .28s var(--ease); }
  .pill.bump-r { animation: pbumpR .28s var(--ease); }
  .pill.bump-d { animation: pbumpD .28s var(--ease); }
  @keyframes pbumpL { 40% { transform: scale(1.06) translateX(-.5vw); } }
  @keyframes pbumpR { 40% { transform: scale(1.06) translateX(.5vw); } }
  @keyframes pbumpD { 40% { transform: scale(1.06) translateY(.6vh); } }

  /* ── Games row (only when there are games) ───────────────────── */
  #games-sec .k { margin: 1.4vh 0 0; }
  /* With a games row below, the focused-app caption would crowd it; the
     banners carry their own names. */
  body.has-games #caption { display: none; }
  #games-wrap {
    overflow: hidden;
    margin: 0 -5vw;
    padding: 1.3vh 5vw 1vh;
  }
  #games { gap: 1.4vw; }
  #games .tile { width: 11vw; height: 6.1875vw; border-radius: .9vh; }
  #games .tile.icon img { width: 2.8vw; height: 2.8vw; }
  #games .tile.icon .lbl { font-size: 1.6vh; margin-top: .5vh; }

  /* The "All apps" tile at the end of the app row. */
  .tile.more svg { width: 3.6vw; height: 3.6vw; color: var(--fg2); }

  /* ── All apps overlay ────────────────────────────────────────── */
  #all {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
  }
  #all.open { opacity: 1; visibility: visible; transition: opacity .3s ease; }
  body.idle #all.open { opacity: .3; transition: opacity 2.5s ease; }
  #all-head {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 17vh;
    box-sizing: border-box;
    padding: 5.5vh 5vw 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: linear-gradient(#000 78%, rgba(0, 0, 0, 0));
  }
  #all-title { font-size: 5.4vh; font-weight: 100; color: #d9d9dd; }
  #all-count { font-size: 2.2vh; color: var(--fg3); letter-spacing: .04em; }
  #all-view { position: absolute; left: 0; right: 0; top: 13vh; bottom: 0; overflow: hidden; }
  #all-body {
    position: relative;
    padding: 2.4vh 5vw 6vh;
    transition: transform .38s var(--ease);
    will-change: transform;
  }
  .sec-k { margin: 0 0 1.6vh; }
  .grid + .sec-k { margin-top: 2.4vh; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    column-gap: 1.8vw;
    row-gap: .4vh;
  }
  .grid .tile { width: auto; height: auto; aspect-ratio: 16 / 9; }
  .grid .tile.icon img { width: 4.4vw; height: 4.4vw; }
  .glabel {
    height: 3.6vh;
    line-height: 3.6vh;
    margin-top: 1.1vh;
    font-size: 2.2vh;
    color: var(--fg);
    opacity: 0;
    transition: opacity .2s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile.focus + .glabel { opacity: 1; }
  #all-empty { font-size: 2.6vh; color: var(--fg3); }

  /* ── Ambient glow behind the focused tile, tinted by its banner ──── */
  @property --glow { syntax: '<color>'; inherits: false; initial-value: rgba(0, 0, 0, 0); }
  #glow {
    position: absolute;
    left: 0;
    top: 0;
    width: 70vw;
    height: 60vh;
    margin: -30vh 0 0 -35vw;
    pointer-events: none;
    background: radial-gradient(closest-side, var(--glow), rgba(0, 0, 0, 0));
    transition: --glow .9s ease, transform .5s var(--ease), opacity 1.2s ease;
  }
  #glow.off, body.idle #glow { opacity: 0; }
  #top, #family, #apps-sec, #games-sec, #util { position: relative; z-index: 1; }

  /* ── Top-right: connection + Settings chip ───────────────────── */
  #chips {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1.6vw;
    height: 4.6vh;
  }
  #net { display: flex; align-items: center; gap: .8vh; color: var(--fg3); font-size: 2vh; }
  #net svg { width: 2.6vh; height: 2.6vh; }
  #net.offline { color: #a8854a; }
  .pill.chip { height: 4.6vh; padding: 0 1.3vh; border-radius: 2.3vh; gap: 0; font-size: 2.2vh; }
  .pill.chip svg { width: 2.5vh; height: 2.5vh; }
  .chip span {
    max-width: 0;
    overflow: hidden;
    white-space: nowrap;
    transition: max-width .3s var(--ease), margin .3s var(--ease);
  }
  .chip.focus span { max-width: 14vw; margin-left: 1vh; }
  .pill.bump-u { animation: pbumpU .28s var(--ease); }
  @keyframes pbumpU { 40% { transform: scale(1.06) translateY(-.6vh); } }

  /* ── Countdown, between the clock and the weather ────────────── */
  #cd { text-align: center; margin-top: 4.6vh; }
  #cd .k { margin-bottom: 1.1vh; }
  #cd-title { font-size: 2.9vh; color: #c6c6cb; white-space: nowrap; }
  #cd-title .em { margin-right: .9vh; }
  #cd-n {
    margin-top: .8vh;
    font-size: 8vh;
    font-weight: 100;
    line-height: 1;
    color: #d9d9dd;
    white-space: nowrap;
  }
  #cd-n small { font-size: 2.8vh; font-weight: 300; color: var(--fg2); margin-left: 1vh; letter-spacing: .04em; }
  #cd.today #cd-n { color: var(--gold); }

  /* ── Move mode (hold OK on an app) ───────────────────────────── */
  .tile { transition: transform .26s var(--ease), opacity .26s, box-shadow .26s, translate .24s var(--ease); }
  .tile.flip-now { transition: none !important; }
  .tile.moving {
    opacity: 1;
    z-index: 3;
    transform: scale(1.15);
    box-shadow: 0 0 0 .4vh rgba(255, 255, 255, .95), 0 1.4vh 5vh rgba(130, 160, 255, .3);
  }
  .tile.moving::before, .tile.moving::after {
    position: absolute;
    top: 50%;
    margin-top: -3vh;
    font-size: 4.4vh;
    line-height: 6vh;
    color: #fff;
    font-weight: 200;
  }
  .tile.moving::before { content: '\2039'; left: -2.6vh; }
  .tile.moving::after { content: '\203A'; right: -2.6vh; }
  body.moving #util, body.moving #chips { opacity: .15; transition: opacity .3s; }
  #movehint {
    position: absolute;
    left: 50%;
    bottom: 2.4vh;
    transform: translate(-50%, 1vh);
    padding: 1.2vh 2.4vw;
    border-radius: 3vh;
    background: #121214;
    color: var(--fg);
    font-size: 2.3vh;
    opacity: 0;
    transition: opacity .3s, transform .3s var(--ease);
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }
  #movehint b { font-weight: 400; color: #fff; }
  body.moving #movehint { opacity: 1; transform: translate(-50%, 0); }

  /* "Reset app order" at the end of All apps */
  .grid-foot { margin-top: 3vh; display: flex; }

  svg.i { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

  #toast {
    position: absolute;
    left: 50%;
    bottom: 6vh;
    transform: translate(-50%, 1vh);
    padding: 1.3vh 2.6vw;
    border-radius: 3vh;
    background: #121214;
    color: var(--fg2);
    font-size: 2.4vh;
    opacity: 0;
    transition: opacity .3s, transform .3s var(--ease);
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="stage">
  <div id="glow" class="off"></div>
  <header id="top">
    <div id="time">
      <div id="greet">&nbsp;</div>
      <div id="clock"><span id="hm">&nbsp;</span><span id="ampm"></span></div>
      <div id="date">&nbsp;</div>
    </div>
    <div id="cd" style="display:none">
      <div class="k">Countdown</div>
      <div id="cd-title"></div>
      <div id="cd-n"></div>
    </div>
    <div id="wx">
      <div id="chips"><span id="net"></span></div>
      <div id="wx-now"><svg id="wx-icon" class="i" viewBox="0 0 24 24"></svg><span id="wx-temp"></span></div>
      <div id="wx-cond"></div>
      <div id="wx-hilo"></div>
      <div id="wx-days"></div>
    </div>
  </header>

  <section id="family">
    <div class="fam"><div class="k" id="dinner-k">Tonight</div><div class="v muted" id="dinner">&mdash;</div></div>
    <div class="fam"><div class="k">Stars</div><div class="v muted" id="stars">&mdash;</div></div>
    <div class="fam grow"><div class="k">Today&rsquo;s verse</div><div class="v" id="verse"></div></div>
  </section>

  <section id="apps-sec">
    <div id="apps-wrap"><div class="track" id="apps"></div></div>
    <div id="caption" class="off"></div>
  </section>

  <section id="games-sec" style="display:none">
    <div class="k">Games</div>
    <div id="games-wrap"><div class="track" id="games"></div></div>
  </section>

  <div class="track" id="util"></div>
</div>

<div id="all">
  <div id="all-view"><div id="all-body"></div></div>
  <div id="all-head"><div id="all-title">All apps</div><div id="all-count"></div></div>
</div>
<div id="toast"></div>
<div id="movehint"><b>&lsaquo; &rsaquo;</b> to move &nbsp;&middot;&nbsp; <b>OK</b> to drop it here</div>

<script src="scripture.js"></script>
<script src="countdowns.js"></script>
<script>
(function () {
  'use strict';

  var API = 'https://solanyk-house.chadbs.deno.net/api/hub';
  var REFRESH_MS = 10 * 60 * 1000;
  var IDLE_MS = 4 * 60 * 1000;
  var KIDS = ['Addison', 'Sophie'];
  var DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];

  function $(id) { return document.getElementById(id); }

  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem('home.' + k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem('home.' + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  /* ── Bridge (real on the Shield, mock in a desktop browser) ───────── */
  var NATIVE = !!(window.Shield && typeof window.Shield.apps === 'function');
  var bridge = NATIVE ? window.Shield : mockBridge();

  function mockBridge() {
    function art(label, bg, fg, banner) {
      var w = banner ? 320 : 160, h = banner ? 180 : 160;
      var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "'>" +
        "<rect width='100%' height='100%' rx='" + (banner ? 0 : 36) + "' fill='" + bg + "'/>" +
        "<text x='50%' y='52%' font-family='sans-serif' font-weight='700' font-size='" + (banner ? 38 : 84) +
        "' fill='" + fg + "' text-anchor='middle' dominant-baseline='middle'>" +
        (banner ? label : label.charAt(0)) + "</text></svg>";
      return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    /* [pkg, label, background, ink, has banner, is a game] */
    var list = [
      ['com.google.android.youtube.tvunplugged', 'YouTube TV', '#0f0f0f', '#ff4e45', 1, 0],
      ['com.google.android.youtube.tv', 'YouTube', '#0f0f0f', '#f1f1f1', 1, 0],
      ['com.stremio.one', 'Stremio', '#19133a', '#8a6cf6', 1, 0],
      ['com.plexapp.android', 'Plex', '#1c1c1c', '#e5a00d', 1, 0],
      ['com.disney.disneyplus', 'Disney+', '#0a1b3d', '#f4f4f4', 1, 0],
      ['org.xbmc.kodi', 'Kodi', '#1a98c9', '#fff', 0, 0],
      ['com.amazon.amazonvideo.livingroom', 'Prime Video', '#00050d', '#1a98ff', 1, 0],
      ['com.spotify.tv.android', 'Spotify', '#121212', '#1ed760', 1, 0],
      ['com.android.vending', 'Google Play Store', '#202124', '#34a853', 0, 0],
      ['org.pbskids.video', 'PBS KIDS', '#1d5fbf', '#fff', 1, 0],
      ['com.android.chrome', 'Chrome', '#2b2b2b', '#8ab4f8', 0, 0],
      ['com.android.tv.settings', 'Settings', '#202124', '#9aa0a6', 0, 0],
      ['com.mojang.minecraftpe', 'Minecraft', '#2d2216', '#7cc242', 1, 1],
      ['com.yodo1.crossyroad', 'Crossy Road', '#235d9c', '#ffd400', 1, 1],
      ['com.gameloft.android.ANMP.GloftA9HM', 'Asphalt 9', '#0d0d0d', '#ff6a00', 1, 1],
      ['com.sega.sonic1px', 'Sonic', '#0b2a8a', '#fff', 0, 1]
    ].map(function (a) {
      return { pkg: a[0], label: a[1], banner: !!a[4], game: !!a[5], img: art(a[1], a[2], a[3], a[4]) };
    });
    return {
      apps: function () { return JSON.stringify(list); },
      launch: function (pkg) { toast('Would open ' + pkg); return true; },
      settings: function () { toast('Would open Settings'); },
      screensaver: function () { toast('Would start the screensaver'); },
      flyovers: function () { toast('Would start the flyovers'); }
    };

  /* WMO weather code -> [words, icon by day, icon by night] */
  function wmo(code) {
    var c = +code;
    if (c === 0) return ['Clear', 'sun', 'moon'];
    if (c === 1) return ['Mostly clear', 'sun', 'moon'];
    if (c === 2) return ['Partly cloudy', 'partSun', 'partMoon'];
    if (c === 3) return ['Cloudy', 'cloud', 'cloud'];
    if (c === 45 || c === 48) return ['Fog', 'fog', 'fog'];
    if (c >= 51 && c <= 55) return ['Drizzle', 'rain', 'rain'];
    if (c === 56 || c === 57) return ['Freezing drizzle', 'rain', 'rain'];
    if (c === 61) return ['Light rain', 'rain', 'rain'];
    if (c === 63) return ['Rain', 'rain', 'rain'];
    if (c === 65) return ['Heavy rain', 'rain', 'rain'];
    if (c === 66 || c === 67) return ['Freezing rain', 'rain', 'rain'];
    if (c === 71) return ['Light snow', 'snow', 'snow'];
    if (c === 73) return ['Snow', 'snow', 'snow'];
    if (c === 75) return ['Heavy snow', 'snow', 'snow'];
    if (c === 77) return ['Snow grains', 'snow', 'snow'];
    if (c >= 80 && c <= 82) return ['Showers', 'rain', 'rain'];
    if (c === 85 || c === 86) return ['Snow showers', 'snow', 'snow'];
    if (c === 95) return ['Thunderstorms', 'storm', 'storm'];
    if (c === 96 || c === 99) return ['Storms with hail', 'storm', 'storm'];
    return ['', 'cloud', 'cloud'];
  }

  function iconSvg(name, cls) {
    return '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24">' + (ICON[name] || '') + '</svg>';
  }

  /* ── Small helpers ─────────────────────────────────────────────────── */
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  /* ISO week key, e.g. "2026-W42" — same as the family app's Fmt.weekKey. */
  function weekKey(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = t.getUTCFullYear();
    var w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
    return y + '-W' + String(w).padStart(2, '0');
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  /* ── Clock ─────────────────────────────────────────────────────────── */
  function renderClock() {
    var now = new Date(), h = now.getHours(), m = now.getMinutes();
    $('hm').textContent = ((h % 12) || 12) + ':' + String(m).padStart(2, '0');
    $('ampm').textContent = h < 12 ? 'AM' : 'PM';
    $('date').textContent = DAY_NAMES[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate();
    $('greet').textContent = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' :
      h < 21 ? 'Good evening' : 'Good night';
    renderCountdown();
  }

  /* The family's next big day (countdowns.js, shared with the screensaver). */
  function renderCountdown() {
    var box = $('cd'), n = null;
    try { n = typeof Countdowns !== 'undefined' ? Countdowns.next(new Date()) : null; } catch (e) { n = null; }
    if (!n) { box.style.display = 'none'; return; }
    box.style.display = '';
    var t = $('cd-title');
    t.textContent = '';
    if (n.emoji) t.appendChild(el('span', 'em', n.emoji));
    t.appendChild(document.createTextNode(n.title));
    var ms = n.at - Date.now(), big, unit = '';
    if (n.today && ms <= 0) big = 'Today!';
    else if (ms > 0 && ms < 864e5) {
      var h = Math.round(ms / 36e5);
      if (ms < 36e5) { big = String(Math.max(1, Math.ceil(ms / 6e4))); unit = 'min'; }
      else { big = String(h); unit = h === 1 ? 'hour' : 'hours'; }
    }
    else if (n.sleeps === 1) big = 'Tomorrow';
    else { big = String(n.sleeps); unit = 'days'; }
    var nEl = $('cd-n');
    nEl.textContent = big;
    if (unit) nEl.appendChild(el('small', '', unit));
    box.classList.toggle('today', n.today && ms <= 0);
  }

  /* Burn-in care: everything wanders a few px along a slow Lissajous path,
     the clock block a little further. One step a minute, eased over 4s. */
  function drift() {
    var t = Date.now() / 60000;
    var sx = Math.round(3 * Math.sin(t / 7.3)), sy = Math.round(2 * Math.sin(t / 11.1));
    var hx = Math.round(5 * Math.sin(t / 5.1 + 1)), hy = Math.round(4 * Math.cos(t / 8.7));
    $('stage').style.transform = 'translate(' + sx + 'px,' + sy + 'px)';
    $('top').style.transform = 'translate(' + hx + 'px,' + hy + 'px)';
    $('family').style.transform = 'translate(' + Math.round(hx / 2) + 'px,' + Math.round(hy / 2) + 'px)';
  }

  /* ── Weather ───────────────────────────────────────────────────────── */
  function renderWeather() {
    var c = store.get('wx', null), w = c && c.data;
    var box = $('wx');
    if (!w || !w.current || !w.daily) {
      $('wx-temp').textContent = '';
      $('wx-cond').textContent = '';
      $('wx-hilo').textContent = '';
      $('wx-days').textContent = '';
      $('wx-icon').innerHTML = '';
      return;
    }
    var s = w.sensor, sensorT = s && typeof s.temperature_F === 'number' ? s.temperature_F : null;
    var temp = sensorT != null ? sensorT : w.current.temperature_2m;
    var day = w.current.is_day !== 0;
    var info = wmo(w.current.weather_code);
    var icon = day ? info[1] : info[2];
    var d = w.daily, i = d.time ? d.time.indexOf(ymd(new Date())) : 0;
    if (i < 0) i = 0;

    $('wx-temp').textContent = typeof temp === 'number' ? Math.round(temp) + '°' : '';
    var ic = $('wx-icon');
    ic.innerHTML = ICON[icon] || '';
    ic.setAttribute('class', 'i' + (icon === 'sun' || icon === 'partSun' ? ' warm' : ''));
    $('wx-cond').textContent = info[0] + (sensorT != null ? ' · Backyard' : '');

    var hi = d.temperature_2m_max && d.temperature_2m_max[i];
    var lo = d.temperature_2m_min && d.temperature_2m_min[i];
    var pop = d.precipitation_probability_max && d.precipitation_probability_max[i];
    var hl = $('wx-hilo');
    hl.innerHTML = '';
    if (typeof hi === 'number') {
      hl.appendChild(document.createTextNode('High '));
      hl.appendChild(el('b', '', Math.round(hi) + '°'));
      hl.appendChild(document.createTextNode('  ·  Low '));
      hl.appendChild(el('b', '', Math.round(lo) + '°'));
      if (typeof pop === 'number' && pop >= 30) hl.appendChild(document.createTextNode('  ·  ' + pop + '% rain'));
    }

    var days = $('wx-days');
    days.innerHTML = '';
    for (var j = i + 1; j <= i + 3 && d.time && j < d.time.length; j++) {
      var dt = new Date(d.time[j] + 'T12:00:00');
      var box2 = el('div', 'day');
      box2.appendChild(el('span', 'n', DAY_NAMES[dt.getDay()].slice(0, 3)));
      box2.insertAdjacentHTML('beforeend', iconSvg(wmo(d.weather_code[j])[1]));
      box2.appendChild(el('span', '', Math.round(d.temperature_2m_max[j]) + '°'));
      days.appendChild(box2);
    }
    box.classList.toggle('stale', Date.now() - c.at > 3 * 3600 * 1000);
  }

  /* ── Family strip ──────────────────────────────────────────────────── */
  function dinnerOn(h, date) {
    var wk = h.plan && h.plan[weekKey(date)];
    var e = wk && wk[DAYS[date.getDay()]];
    if (!e) return null;
    var title = (e.title || '').trim();
    if (e.kind === 'recipe') {
      var r = h.recipes && h.recipes[e.recipeId];
      if (r && r.name) return { text: r.name, emoji: r.emoji || '' };
      return title ? { text: title } : null;
    }
    if (e.kind === 'out') return { text: title ? 'Out · ' + title : 'Eating out' };
    if (e.kind === 'leftovers') return { text: 'Leftovers' };
    return title ? { text: title } : null;
  }

  function renderFamily() {
    var c = store.get('hub', null), h = c && c.data;
    var now = new Date();

    var dn = $('dinner'), label = 'Tonight', meal = null;
    if (h) {
      if (now.getHours() >= 20) {
        var tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        meal = dinnerOn(h, tm);
        if (meal) label = 'Tomorrow';
      }
      if (!meal) meal = dinnerOn(h, now);
    }
    $('dinner-k').textContent = label;
    dn.textContent = '';
    if (meal) {
      if (meal.emoji) dn.appendChild(el('span', 'em', meal.emoji));
      dn.appendChild(document.createTextNode(meal.text));
      dn.classList.remove('muted');
    } else {
      dn.textContent = h ? 'Nothing planned' : '—';
      dn.classList.add('muted');
    }

    var st = $('stars');
    st.textContent = '';
    var stars = h && h.stars;
    if (stars) {
      var names = KIDS.filter(function (k) { return k in stars; })
        .concat(Object.keys(stars).filter(function (k) { return KIDS.indexOf(k) < 0; }));
      names.forEach(function (k) {
        var s = el('span', 'kid');
        s.appendChild(document.createTextNode(k));
        s.appendChild(el('span', 'star', '★'));
        s.appendChild(document.createTextNode(String(stars[k] || 0)));
        st.appendChild(s);
      });
      st.classList.remove('muted');
    } else {
      st.textContent = '—';
      st.classList.add('muted');
    }

    var vs = $('verse');
    vs.textContent = '';
    var list = typeof SCRIPTURE !== 'undefined' && SCRIPTURE && SCRIPTURE.verses;
    if (list && list.length) {
      var dayNum = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5);
      var v = list[dayNum % list.length];
      vs.appendChild(document.createTextNode('“' + String(v.text).trim() + '”'));
      vs.appendChild(el('span', 'ref', v.ref));
    }
    vs.parentNode.style.display = vs.textContent ? '' : 'none';
  }

  /* ── Data ──────────────────────────────────────────────────────────── */
  function getJSON(url) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    return fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { clearTimeout(timer); return j; },
            function (e) { clearTimeout(timer); throw e; });
  }

  /* On the Shield the API answers directly. A desktop browser is blocked by
     CORS, so fall back to the fixtures in tv/dev/ for previewing. */
  function getData(path, fixture) {
    return getJSON(API + path).catch(function (e) {
      if (NATIVE) throw e;
      return getJSON('dev/' + fixture);
    });
  }

  /* The hub doc is big (recipes with photos and all); keep only what this
     page shows: this week's and next week's plan, the recipes they name,
     and the star counts. */
  function slimHub(j) {
    var docs = j.docs || {}, colls = j.colls || {};
    var plan = {}, recipes = {}, now = new Date();
    [now, new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7)].forEach(function (d) {
      var k = weekKey(d), wk = docs.plan && docs.plan[k];
      if (!wk) return;
      plan[k] = wk;
      Object.keys(wk).forEach(function (day) {
        var e = wk[day], r = e && e.recipeId && colls.recipes && colls.recipes[e.recipeId];
        if (r) recipes[e.recipeId] = { name: r.name, emoji: r.emoji };
      });
    });
    return { plan: plan, recipes: recipes, stars: docs.rewards && docs.rewards.stars };
  }

  var lastRefresh = 0;
  function refresh() {
    lastRefresh = Date.now();
    getData('/weather', 'weather.json').then(function (w) {
      if (w && w.current) { store.set('wx', { at: Date.now(), data: w }); renderWeather(); }
    }).catch(function () {});
    getData('', 'hub.json').then(function (j) {
      if (j && j.docs) { store.set('hub', { at: Date.now(), data: slimHub(j) }); renderFamily(); }
    }).catch(function () {});
  }

  /* ── Apps ──────────────────────────────────────────────────────────── */
  var apps = [], games = [], all = [], byPkg = {}, appsSig = '';

  /* The family's usual apps lead on a fresh install; each is worth less
     than one real launch, so actual use takes over within a day or two. */
  var FAVORITES = [
    'com.google.android.youtube.tvunplugged', 'com.google.android.youtube.tv', 'com.stremio.one',
    'com.amazon.amazonvideo.livingroom', 'com.spotify.tv.android', 'com.peacocktv.peacockandroid',
    'org.xbmc.kodi', 'com.sermon.tv'
  ];
  /* Clutter that sinks to the end of the row unless it actually gets used. */
  var TAIL = [
    'com.android.tv.settings', 'com.android.gallery3d', 'com.spocky.projengmenu', 'com.syncler.installer',
    'com.google.android.play.games', 'com.google.android.apps.tachyon', 'com.codingbuffalo.aerialdream'
  ];

  /* Most-used first: a launch count that halves every two weeks without use. */
  function usageScore(use, pkg, now) {
    var u = use[pkg];
    if (u) return u.n * Math.pow(0.5, (now - u.last) / (14 * 864e5));
    var f = FAVORITES.indexOf(pkg);
    if (f >= 0) return 0.5 - f * 0.01;
    return TAIL.indexOf(pkg) >= 0 ? -1 : 0;
  }

  function recordUse(pkg) {
    var use = store.get('usage', {}), now = Date.now();
    use[pkg] = { n: Math.max(0, usageScore(use, pkg, now)) + 1, last: now };
    store.set('usage', use);
  }

  /* Once the order has been arranged by hand (hold OK on a tile), that
     order wins; apps installed later follow it, most-used first. */
  function loadApps() {
    var list = [];
    try { list = JSON.parse(bridge.apps() || '[]') || []; } catch (e) { list = []; }
    var use = store.get('usage', {}), now = Date.now();
    var order = store.get('order', null), pos = {};
    if (order && order.forEach) order.forEach(function (p, i) { pos[p] = i; });
    list.forEach(function (a) {
      a.score = usageScore(use, a.pkg, now);
      a.pin = a.pkg in pos ? pos[a.pkg] : 1e9;
    });
    list.sort(function (a, b) {
      return (a.pin - b.pin) || (b.score - a.score) || String(a.label).localeCompare(String(b.label));
    });
    var sig = list.map(function (a) {
      return a.pkg + (a.game ? ':g:' : ':') + (a.img ? a.img.length : 0);
    }).join('|');
    if (sig === appsSig) return;
    appsSig = sig;
    var keepApp = rowPkg(0), keepGame = rowPkg(1);
    all = list;
    byPkg = {};
    list.forEach(function (a) { byPkg[a.pkg] = a; });
    apps = list.filter(function (a) { return !a.game; });
    games = list.filter(function (a) { return a.game; });
    fillRow(0, apps, keepApp, true);
    fillRow(1, games, keepGame, false);
    $('games-sec').style.display = games.length ? '' : 'none';
    document.body.classList.toggle('has-games', games.length > 0);
    if (!rows[rowI].items.length) rowI = firstRow();
    paint();
    if (grid.open) buildGrid();
  }

  /* Re-sort and redraw now, e.g. after the order was changed by hand. */
  function reloadApps() {
    appsSig = '';
    loadApps();
  }

  function makeTile(a) {
    var t = el('div', 'tile ' + (a.banner ? 'banner' : 'icon'));
    t.dataset.act = 'app';
    t.dataset.pkg = a.pkg;
    if (a.img) {
      var img = new Image();
      img.decoding = 'async';
      img.alt = '';
      img.src = a.img;
      t.appendChild(img);
    }
    if (!a.banner) t.appendChild(el('div', 'lbl', a.label));
    return t;
  }

  /* keep: the package to leave focused, wherever it lands in the new order.
     more: end the row with an "All apps" tile. */
  function fillRow(ri, list, keep, more) {
    var row = rows[ri], track = row.el;
    track.textContent = '';
    list.forEach(function (a) { track.appendChild(makeTile(a)); });
    if (more && all.length) {
      var m = el('div', 'tile icon more');
      m.dataset.act = 'all';
      m.insertAdjacentHTML('beforeend', iconSvg('grid'));
      m.appendChild(el('div', 'lbl', 'All apps'));
      track.appendChild(m);
    }
    if (ri === 0 && !all.length) track.appendChild(el('div', '', 'No apps found')).id = 'empty';
    row.items = Array.prototype.filter.call(track.children, function (n) {
      return n.classList.contains('tile');
    });
    var at = -1;
    row.items.forEach(function (t, i) { if (keep && t.dataset.pkg === keep) at = i; });
    row.idx = at >= 0 ? at : Math.min(row.idx, Math.max(0, row.items.length - 1));
  }

  function launch(pkg) {
    var a = byPkg[pkg], ok = false;
    try { ok = bridge.launch(pkg); } catch (e) { ok = false; }
    if (ok) recordUse(pkg);
    else toast('Couldn’t open ' + (a ? a.label : pkg));
    return ok;
  }

  /* ── Focus on the home screen ─────────────────────────────────────── */
  var rows = [
    { el: $('apps'), wrap: $('apps-wrap'), cap: $('caption'), items: [], idx: 0, x: 0 },
    { el: $('games'), wrap: $('games-wrap'), items: [], idx: 0, x: 0 },
    { el: $('util'), items: [], idx: 0 },
    { el: $('chips'), items: [], idx: 0 }
  ];
  /* Top to bottom: the Settings chip, apps, games, pills. */
  var ORDER = [3, 0, 1, 2];
  var rowI = 0;

  function firstRow() {
    for (var i = 0; i < rows.length; i++) if (rows[i].items.length) return i;
    return 0;
  }

  function current() {
    var r = rows[rowI];
    return r && r.items[r.idx];
  }

  function rowPkg(ri) {
    var t = rows[ri].items[rows[ri].idx];
    return (t && t.dataset.pkg) || null;
  }

  function paint() {
    rows.forEach(function (r, ri) {
      r.items.forEach(function (it, i) { it.classList.toggle('focus', ri === rowI && i === r.idx); });
    });
    scrollRow(rows[0]);
    scrollRow(rows[1]);
    updateGlow();
  }

  /* Keep the focused tile inside its row with half a tile of the neighbour
     peeking on either side, so you can see there is more. */
  function scrollRow(r) {
    var t = r.items[r.idx], cap = r.cap;
    if (!t) { if (cap) cap.classList.add('off'); return; }
    var cs = getComputedStyle(r.wrap);
    var view = r.wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var tw = t.offsetWidth, gap = parseFloat(getComputedStyle(r.el).columnGap) || 0;
    var peek = (tw + gap) * 0.5;
    var left = t.offsetLeft, right = left + tw;
    var total = r.el.scrollWidth, x = r.x;
    if (left - (r.idx ? peek : 0) < x) x = left - (r.idx ? peek : 0);
    if (right + (r.idx < r.items.length - 1 ? peek : 0) > x + view)
      x = right + (r.idx < r.items.length - 1 ? peek : 0) - view;
    x = Math.max(0, Math.min(x, Math.max(0, total - view)));
    r.x = x;
    r.el.style.transform = 'translate3d(' + (-x) + 'px,0,0)';
    if (!cap) return;
    var a = byPkg[t.dataset.pkg];
    cap.textContent = a ? a.label : 'All apps';
    cap.style.transform = 'translateX(' + (left - x) + 'px)';
    cap.classList.toggle('off', rows[rowI] !== r);
  }

  /* ── Ambient glow ─────────────────────────────────────────────────── */
  var NEUTRAL = [120, 140, 180], tints = {};

  /* The banner's dominant colour: saturated, lit pixels count most; near
     black is ignored. Scaled to full brightness — the glow's own alpha
     keeps it dim. null if the image can't be read. */
  function tintOf(img) {
    try {
      var c = document.createElement('canvas');
      c.width = 32;
      c.height = 18;
      var x = c.getContext('2d');
      x.drawImage(img, 0, 0, 32, 18);
      var d = x.getImageData(0, 0, 32, 18).data, r = 0, g = 0, b = 0, w = 0;
      for (var i = 0; i < d.length; i += 4) {
        var R = d[i], G = d[i + 1], B = d[i + 2], A = d[i + 3] / 255;
        var mx = Math.max(R, G, B), mn = Math.min(R, G, B);
        if (A < 0.5 || mx < 36) continue;
        var s = (mx - mn) / mx, wt = A * (0.08 + s * s) * (mx / 255);
        r += R * wt; g += G * wt; b += B * wt; w += wt;
      }
      if (!w) return null;
      r /= w; g /= w; b /= w;
      var k = 255 / Math.max(r, g, b, 1);
      return [Math.round(r * k), Math.round(g * k), Math.round(b * k)];
    } catch (e) {
      return null;
    }
  }

  function tintFor(t) {
    var pkg = t.dataset.pkg;
    if (!pkg) return NEUTRAL;
    if (tints[pkg]) return tints[pkg];
    var img = t.querySelector('img');
    if (!img) return NEUTRAL;
    if (!img.complete || !img.naturalWidth) {
      img.addEventListener('load', updateGlow, { once: true });
      return null;
    }
    return (tints[pkg] = tintOf(img) || NEUTRAL);
  }

  function updateGlow() {
    var g = $('glow'), r = rows[rowI], t = r && r.items[r.idx];
    if (!t || !r.wrap || grid.open) { g.classList.add('off'); return; }
    var c = tintFor(t);
    /* Where the tile will be once the row has scrolled, not where it is
       mid-animation. */
    var st = $('stage').getBoundingClientRect(), wr = r.wrap.getBoundingClientRect();
    var cs = getComputedStyle(r.wrap);
    var x = wr.left - st.left + parseFloat(cs.paddingLeft) + t.offsetLeft - r.x + t.offsetWidth / 2;
    var y = wr.top - st.top + parseFloat(cs.paddingTop) + t.offsetTop + t.offsetHeight / 2;
    g.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
    if (c) g.style.setProperty('--glow', 'rgba(' + c.join(',') + ',.17)');
    g.classList.remove('off');
  }

  function bumpEl(t, dir) {
    if (!t) return;
    var cls = 'bump-' + dir;
    t.classList.remove('bump-l', 'bump-r', 'bump-u', 'bump-d');
    void t.offsetWidth;
    t.classList.add(cls);
    setTimeout(function () { t.classList.remove(cls); }, 300);
  }

  function move(dx, dy) {
    var r = rows[rowI];
    if (dx) {
      var n = r.idx + dx;
      if (n < 0 || n >= r.items.length) return bumpEl(current(), dx < 0 ? 'l' : 'r');
      r.idx = n;
      return paint();
    }
    var pos = ORDER.indexOf(rowI) + dy;
    while (pos >= 0 && pos < ORDER.length && !rows[ORDER[pos]].items.length) pos += dy;
    if (pos < 0 || pos >= ORDER.length) return bumpEl(current(), dy < 0 ? 'u' : 'd');
    var to = ORDER[pos];
    if (to === 2) {
      /* Down into the pills: the one nearest under the focused tile. */
      var from = current(), fx = from ? from.getBoundingClientRect().left : 0, best = 0, bd = 1e9;
      rows[2].items.forEach(function (it, i) {
        var d = Math.abs(it.getBoundingClientRect().left - fx);
        if (d < bd) { bd = d; best = i; }
      });
      rows[2].idx = best;
    }
    rowI = to;
    paint();
  }

  function press(t) {
    t.classList.add('press');
    setTimeout(function () { t.classList.remove('press'); }, 160);
  }

  function activate() {
    var t = current();
    if (!t) return;
    press(t);
    var act = t.dataset.act;
    if (act === 'app') launch(t.dataset.pkg);
    else if (act === 'all') openAll();
    else if (act === 'flyovers') { try { bridge.flyovers(); } catch (e) {} }
    else if (act === 'saver') { try { bridge.screensaver(); } catch (e) {} }
    else if (act === 'settings') { try { bridge.settings(); } catch (e) {} }
  }

  function home() {
    wake();
    closeAll();
    rowI = firstRow();
    rows[rowI].idx = 0;
    paint();
  }

  function buildUtil() {
    var u = $('util');
    [['all', 'All apps', 'grid'], ['flyovers', 'Flyovers', 'peaks'], ['saver', 'Screensaver', 'screen'],
      ['settings', 'Settings', 'gear']].forEach(function (p) {
      var b = el('div', 'pill');
      b.dataset.act = p[0];
      b.insertAdjacentHTML('beforeend', iconSvg(p[2]));
      b.appendChild(el('span', '', p[1]));
      u.appendChild(b);
    });
    rows[2].items = Array.prototype.slice.call(u.children);

    /* Settings, one press up from the app row; its name opens out on focus. */
    var chip = el('div', 'pill chip');
    chip.dataset.act = 'settings';
    chip.insertAdjacentHTML('beforeend', iconSvg('gear'));
    chip.appendChild(el('span', '', 'Settings'));
    $('chips').appendChild(chip);
    rows[3].items = [chip];
  }

  function renderNet() {
    var on = navigator.onLine !== false, n = $('net');
    n.innerHTML = iconSvg(on ? 'wifi' : 'wifiOff');
    if (!on) n.appendChild(el('span', '', 'Offline'));
    n.classList.toggle('offline', !on);
  }

  /* ── Rearranging: hold OK on an app, slide it with Left/Right ─────── */
  var HOLD_MS = 600;
  var hold = null;    /* an OK press that may turn into a hold */
  var moving = null;  /* {ri, pkg, had: saved order} while a tile is lifted */

  function rowPkgs(ri) {
    return rows[ri].items.map(function (t) { return t.dataset.pkg; }).filter(Boolean);
  }

  function saveOrder() {
    store.set('order', rowPkgs(0).concat(rowPkgs(1)));
  }

  function startMove() {
    var t = current();
    if (!t || !t.dataset.pkg || (rowI !== 0 && rowI !== 1)) return;
    moving = { ri: rowI, pkg: t.dataset.pkg, had: store.get('order', null) };
    t.classList.add('moving');
    document.body.classList.add('moving');
    updateGlow();
  }

  function moveStep(dx) {
    var r = rows[moving.ri], i = r.idx, n = i + dx, t = r.items[i];
    var count = rowPkgs(moving.ri).length; /* the "All apps" tile stays last */
    if (n < 0 || n >= count) return bumpEl(t, dx < 0 ? 'l' : 'r');
    var o = r.items[n];
    /* FLIP: swap in the DOM, then slide both tiles from where they were. */
    var tl = t.offsetLeft, ol = o.offsetLeft;
    if (dx > 0) r.el.insertBefore(o, t); else r.el.insertBefore(t, o);
    r.items[i] = o;
    r.items[n] = t;
    r.idx = n;
    [[t, tl], [o, ol]].forEach(function (p) {
      p[0].classList.add('flip-now');
      p[0].style.translate = (p[1] - p[0].offsetLeft) + 'px 0';
    });
    void r.el.offsetWidth;
    [t, o].forEach(function (e) { e.classList.remove('flip-now'); e.style.translate = ''; });
    paint();
  }

  function endMove(keep) {
    if (!moving) return;
    var m = moving;
    moving = null;
    document.body.classList.remove('moving');
    rows[m.ri].items.forEach(function (t) { t.classList.remove('moving'); });
    /* Dropped: this order wins from now on. Cancelled: back as it was. */
    if (keep) saveOrder();
    else store.set('order', m.had);
    reloadApps();
  }

  /* In All apps (A to Z) a hold sends the app to the front of the home row. */
  function gridHold() {
    var it = grid.items[grid.idx], pkg = it && it.tile.dataset.pkg;
    if (!pkg) return;
    var a = byPkg[pkg], list = rowPkgs(0).concat(rowPkgs(1)).filter(function (p) { return p !== pkg; });
    list.splice(a && a.game ? rowPkgs(0).length : 0, 0, pkg);
    store.set('order', list);
    reloadApps();
    buildGrid();
    rows[a && a.game ? 1 : 0].idx = 0;
    paint();
    toast((a ? a.label : 'App') + ' moved to the front');
  }

  function resetOrder() {
    store.set('order', null);
    reloadApps();
    buildGrid();
    toast('App order reset to most-used');
  }

  /* ── All apps: a full-screen grid, Apps then Games, A to Z ────────── */
  var COLS = 5;
  var grid = { open: false, items: [], rows: [], idx: 0, y: 0 };

  function buildGrid() {
    var keep = grid.items[grid.idx] && grid.items[grid.idx].tile.dataset.pkg;
    var body = $('all-body');
    body.textContent = '';
    grid.items = [];
    grid.rows = [];
    function byName(a, b) {
      return String(a.label).localeCompare(String(b.label), undefined, { sensitivity: 'base' });
    }
    [['Apps', apps], ['Games', games]].forEach(function (sec) {
      if (!sec[1].length) return;
      var head = body.appendChild(el('div', 'k sec-k', sec[0]));
      var g = body.appendChild(el('div', 'grid'));
      var row = null;
      sec[1].slice().sort(byName).forEach(function (a, i) {
        if (i % COLS === 0) { row = []; grid.rows.push(row); }
        var cell = el('div', 'cell'), t = makeTile(a);
        cell.appendChild(t);
        cell.appendChild(el('div', 'glabel', a.label));
        g.appendChild(cell);
        row.push(grid.items.length);
        grid.items.push({ tile: t, cell: cell, head: i < COLS ? head : null, row: grid.rows.length - 1, col: i % COLS });
      });
    });
    if (!grid.items.length) body.appendChild(el('div', '', 'No apps found')).id = 'all-empty';
    var order = store.get('order', null);
    if (order && order.length) {
      var foot = body.appendChild(el('div', 'grid-foot'));
      var reset = el('div', 'pill');
      reset.dataset.act = 'reset';
      reset.insertAdjacentHTML('beforeend', iconSvg('grid'));
      reset.appendChild(el('span', '', 'Reset app order'));
      foot.appendChild(reset);
      grid.rows.push([grid.items.length]);
      grid.items.push({ tile: reset, cell: foot, head: null, row: grid.rows.length - 1, col: 0 });
    }
    $('all-count').textContent = apps.length + (apps.length === 1 ? ' app' : ' apps') +
      (games.length ? '  ·  ' + games.length + (games.length === 1 ? ' game' : ' games') : '') +
      '  ·  hold OK to move one to the front';
    var at = 0;
    grid.items.forEach(function (it, i) { if (keep && it.tile.dataset.pkg === keep) at = i; });
    grid.idx = Math.min(at, Math.max(0, grid.items.length - 1));
    paintGrid();
  }

  function paintGrid() {
    grid.items.forEach(function (it, i) { it.tile.classList.toggle('focus', i === grid.idx); });
    var it = grid.items[grid.idx];
    if (!it) return;
    /* Scroll so the focused row is in view; the first row of a section
       brings its heading along. */
    var view = $('all-view').clientHeight, pad = view * 0.06;
    var top = it.head ? it.head.offsetTop : it.cell.offsetTop;
    var bottom = it.cell.offsetTop + it.cell.offsetHeight;
    var y = grid.y;
    if (top - pad < y) y = top - pad;
    if (bottom + pad > y + view) y = bottom + pad - view;
    y = Math.max(0, Math.min(y, Math.max(0, $('all-body').offsetHeight - view)));
    grid.y = y;
    $('all-body').style.transform = 'translate3d(0,' + (-y) + 'px,0)';
  }

  function gridMove(dx, dy) {
    var it = grid.items[grid.idx];
    if (!it) return;
    if (dx) {
      /* Left/Right read like a page: off the end of a row onto the next. */
      var n = grid.idx + dx;
      if (n < 0 || n >= grid.items.length) return bumpEl(it.tile, dx < 0 ? 'l' : 'r');
      grid.idx = n;
    } else {
      var r = it.row + dy;
      if (r < 0 || r >= grid.rows.length) return bumpEl(it.tile, dy < 0 ? 'u' : 'd');
      var row = grid.rows[r];
      grid.idx = row[Math.min(it.col, row.length - 1)];
    }
    paintGrid();
  }

  function gridActivate() {
    var it = grid.items[grid.idx];
    if (!it) return;
    press(it.tile);
    if (it.tile.dataset.act === 'reset') return resetOrder();
    /* Coming back from the app lands on home, not back in the grid. */
    if (launch(it.tile.dataset.pkg)) setTimeout(closeAll, 350);
  }

  function openAll() {
    grid.items = [];
    grid.y = 0;
    var body = $('all-body');
    body.style.transition = 'none';
    buildGrid();
    void body.offsetHeight;
    body.style.transition = '';
    grid.open = true;
    $('all').classList.add('open');
    updateGlow();
  }

  function closeAll() {
    if (!grid.open) return false;
    grid.open = false;
    $('all').classList.remove('open');
    updateGlow();
    return true;
  }

  /* ── Idle dimming ──────────────────────────────────────────────────── */
  var lastInput = Date.now();
  function wake() {
    lastInput = Date.now();
    if (!document.body.classList.contains('idle')) return false;
    document.body.classList.remove('idle');
    return true;
  }

  /* ── Keys ─────────────────────────────────────────────────────────── */
  function isSelectKey(e) { return e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23; }

  /* OK on an app waits to see whether it is a tap (launch on release) or
     a hold (lift it to rearrange). The remote repeats keydown while OK is
     held, which is how a hold shows itself; if the release never arrives
     and nothing repeats, it counts as a tap. */
  function beginPress(onTap, onHold) {
    var h = { at: Date.now(), tap: onTap, hold: onHold, long: false, repeats: false };
    h.timer = setTimeout(function () {
      if (hold === h && !h.long && !h.repeats) { hold = null; h.tap(); }
    }, 1200);
    hold = h;
  }

  function selectDown(e) {
    if (e.repeat) {
      if (hold && !hold.long) {
        hold.repeats = true;
        if (Date.now() - hold.at >= HOLD_MS) { hold.long = true; clearTimeout(hold.timer); hold.hold(); }
      }
      return;
    }
    if (moving) { hold = null; return endMove(true); }
    if (grid.open) {
      var it = grid.items[grid.idx];
      if (it && it.tile.dataset.pkg) beginPress(gridActivate, gridHold);
      else gridActivate();
      return;
    }
    var t = current();
    if (t && t.dataset.pkg) beginPress(activate, startMove);
    else activate();
  }

  document.addEventListener('keydown', function (e) {
    var c = e.keyCode;
    var isSelect = isSelectKey(e);
    var isArrow = c >= 37 && c <= 40;
    var isBack = e.key === 'Escape' || e.key === 'Backspace';
    if (!isSelect && !isArrow && !isBack) return;
    e.preventDefault();
    /* The first press after the page dimmed only wakes it. */
    if (wake()) return;
    var dx = c === 37 ? -1 : c === 39 ? 1 : 0, dy = c === 38 ? -1 : c === 40 ? 1 : 0;
    if (isSelect) selectDown(e);
    else if (isArrow) {
      if (moving) { if (dx) moveStep(dx); }
      else (grid.open ? gridMove : move)(dx, dy);
    }
    else if (!NATIVE && !e.repeat) window.onBack(); /* Escape/Backspace stand in for Back on desktop */
  });

  document.addEventListener('keyup', function (e) {
    if (!isSelectKey(e)) return;
    e.preventDefault();
    var h = hold;
    hold = null;
    if (!h) return;
    clearTimeout(h.timer);
    if (!h.long) h.tap();
  });

  /* On the Shield the WebView never sees OK repeat while held, so
     HomeActivity reads the OK button itself and reports its three moments:
     "down", "hold" (still down after HOLD_MS) and "up". */
  window.nativeOk = function (phase) {
    if (phase === 'down') {
      if (wake()) return;
      selectDown({ repeat: false });
    } else if (phase === 'hold') {
      if (hold && !hold.long) { hold.long = true; clearTimeout(hold.timer); hold.hold(); }
    } else if (phase === 'up') {
      var h = hold;
      hold = null;
      if (!h) return;
      clearTimeout(h.timer);
      if (!h.long) h.tap();
    }
  };

  /* ── Native hooks ──────────────────────────────────────────────────── */
  window.onShown = function () {
    wake();
    loadApps();
    renderClock();
    renderWeather();
    renderFamily();
    renderNet();
    if (Date.now() - lastRefresh > 60 * 1000) refresh();
  };
  window.onHidden = function () {
    hold = null;
    endMove(true);
    closeAll();
  };
  window.onHome = function () {
    hold = null;
    endMove(false);
    home();
  };
  window.onBack = function () {
    wake();
    if (moving) return endMove(true);
    if (!closeAll()) home();
  };

  /* ── Start ─────────────────────────────────────────────────────────── */
  buildUtil();
  renderNet();
  renderClock();
  drift();
  renderWeather();
  renderFamily();
  loadApps();
  paint();
  refresh();

  var lastMin = new Date().getMinutes();
  setInterval(function () {
    var now = new Date();
    if (now.getMinutes() !== lastMin) {
      lastMin = now.getMinutes();
      renderClock();
      drift();
      renderFamily();
      renderWeather();
    }
    if (!moving && Date.now() - lastInput > IDLE_MS) document.body.classList.add('idle');
  }, 1000);
  setInterval(refresh, REFRESH_MS);
  window.addEventListener('online', renderNet);
  window.addEventListener('offline', renderNet);
  window.addEventListener('resize', function () {
    paint();
    if (grid.open) paintGrid();
  });
})();
</script>
</body>
</html>
